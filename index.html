eine Ringe geschnitten ca. 5 Minuten goldbraun und knusprig frittieren. Hitze nicht erhöhen, sonst verbrennen sie. Mit 1 pinch Salz salzen und auf Küchenpapier abtropfen lassen.\n\nNOTES\nDas Schalottenöl danach aufheben – super zum Braten oder als Aroma-Öl über die Ramen. Abkürzung: fertige Röstzwiebeln aus dem Asialaden."],["Furikake","Furikake (siehe Ramen - Tove Nilsson Seite 48)\nKnusprige Würzmischung aus Nori, Sesam und Schalotten – für Reis, Salate, Avocado-Brot oder Ramen.\n\nINGREDIENTS\n• 300 milliliters Speiseöl\n• 3 Schalotten, in feinen Ringen\n• 3 Blätter Nori\n• 2 grams Bonitoflocken / Katsuobushi (Alternative: 1 TL Dashi-Pulver oder weglassen – dann vegetarisch)\n• 70 grams geröstete weiße und schwarze Sesamsamen\n• 2 teaspoons Meersalzflocken\n\nSTEPS\n1. Schalotten frittieren: 300 milliliters Speiseöl auf 150 °C erhitzen, 3 Schalotten, in feinen Ringen ca. 5 Minuten goldbraun und knusprig frittieren (Hitze nicht erhöhen). Auf Küchenpapier abtropfen lassen.\n2. Mahlen: 3 Blätter Nori, 2 grams Bonitoflocken / Katsuobushi (Alternative: 1 TL Dashi-Pulver oder weglassen – dann vegetarisch), die Hälfte von 70 grams geröstete weiße und schwarze Sesamsamen und 2 teaspoons Meersalzflocken in der Küchenmaschine mahlen.\n3. Schalotten zufügen: Schalotten zufügen und nur kurz grob zerkleinern.\n4. Fertigstellen: Restlichen Sesam untermischen. Im Schraubglas aufbewahren.\n\nNOTES\nErgibt ca. 100 g. Ohne Bonitoflocken (oder mit Dashi-Pulver auf Kombu-Basis) ist es vegetarisch."],["Miso-Ramen","Miso Ramen (siehe Ramen - Tove Nilsson Seite XX)\nDer Klassiker: Schweine-Hühner-Brühe mit roter und weißer Misopaste, Chashu und Gemüse.\n\nINGREDIENTS\n• 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond, ggf. mit etwas Schweinefond gemischt)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige Ramen-Nudeln nach Packung)\n• 2 tablespoons rote Misopaste (Alternative: braunes Miso oder mehr weißes)\n• 2 tablespoons weiße Misopaste (Shiro)\n• 2 teaspoons frischer Ingwer, fein gerieben\n• 1 teaspoons Salz\n• 400 grams Chashu (S. 45)\n• 180 grams frische Bohnensprossen\n• 100 grams Zuckererbsen, in Streifen\n• 2 Baby-Pak-Choi, in Stücken\n• 3 Frühlingszwiebeln, in feinen Streifen\n• 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier, 6,5 Min.)\n\nSTEPS\n1. Vorbereiten: Backofen auf 200 °C vorheizen. 400 grams Chashu (S. 45) in dünne Scheiben schneiden, je 3 Scheiben als Portion aufs Blech legen. Gesalzenes Wasser in einem großen Topf aufkochen.\n2. Gemüse blanchieren: 180 grams frische Bohnensprossen, 100 grams Zuckererbsen, in Streifen und 2 Baby-Pak-Choi, in Stücken im Sieb max. 30 Sekunden im kochenden Wasser blanchieren, kalt abschrecken. Das Wasser für die Nudeln weiterverwenden.\n3. Brühe würzen: 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond, ggf. mit etwas Schweinefond gemischt) in einem separaten Topf aufkochen, Hitze reduzieren. 2 tablespoons rote Misopaste (Alternative: braunes Miso oder mehr weißes), 2 tablespoons weiße Misopaste (Shiro) und 2 teaspoons frischer Ingwer, fein gerieben einrühren, mit 1 teaspoons Salz abschmecken.\n4. Schalen & Fleisch: Vier Schalen mit heißem Wasser vorwärmen (kurz vor dem Anrichten ausgießen). Fleisch ca. 5 Minuten im Ofen erhitzen, nach Belieben abflämmen.\n5. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige Ramen-Nudeln nach Packung) portionsweise in sprudelnd kochendem Wasser ca. 45 Sekunden garen (gekaufte nach Packung), gut abtropfen und auf die Schalen verteilen.\n6. Anrichten: Brühe angießen, Gemüse und 3 Frühlingszwiebeln, in feinen Streifen darauf verteilen, mit Chashu und 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier, 6,5 Min.) anrichten.\n\nNOTES\nVeggie-Variante: Gemüse- oder Pilzbrühe mit etwas Dashi-Pulver (Kombu-basiert) statt Fleischbrühe, Chashu durch gebratenen Tofu oder Pilze ersetzen. Statt reinem Miso schmeckt auch die Miso-Sesam-Tare (S. 31)."],["Tantanmen-Ramen","Tantanmen-Ramen (siehe Ramen - Tove Nilsson Seite 54)\nSämige Sesam-Brühe mit Chiliöl und knusprigem Schweinehack mit Doubanjiang.\n\nINGREDIENTS\n• 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 10 tablespoons japanische Sesampaste / Neri Goma (Alternative: Tahin)\n• 4 tablespoons Chiliöl (S. 29)\n• 1 teaspoons Salz\n• 400 grams Schweinehackfleisch (veggie: Sojahack/Tofu zerbröselt)\n• 2 tablespoons Speiseöl\n• 2 Frühlingszwiebeln, in feinen Ringen (fürs Hack)\n• 1.5 tablespoons frischer Ingwer, fein gerieben\n• 1 Knoblauchzehe, fein gerieben\n• 2 tablespoons Doubanjiang (Alternative: Toban Djan oder Gochujang + etwas Miso)\n• 1 teaspoons Sesamöl\n• 2 tablespoons japanische Sojasoße\n• 2 kleine Pak Choi, in einzelnen Blättern\n• 180 grams frische Bohnensprossen\n• 4 Frühlingszwiebeln, in feinen Streifen (Topping)\n• 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier)\n• 4 tablespoons geröstete Sesamsamen, zerstoßen\n\nSTEPS\n1. Brühe & Wasser: 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond) aufkochen und auf kleiner Stufe köcheln lassen. Gesalzenes Wasser in einem Topf zum Kochen bringen.\n2. Blanchieren: 2 kleine Pak Choi, in einzelnen Blättern ca. 30 Sek. im Sieb blanchieren, 180 grams frische Bohnensprossen nur kurz eintauchen. Wasser für die Nudeln behalten. Gemüse kalt abschrecken – es soll Biss haben.\n3. Knuspriges Hack: 2 tablespoons Speiseöl in einer Pfanne erhitzen, 400 grams Schweinehackfleisch (veggie: Sojahack/Tofu zerbröselt), 2 Frühlingszwiebeln, in feinen Ringen (fürs Hack), 1.5 tablespoons frischer Ingwer, fein gerieben und 1 Knoblauchzehe, fein gerieben anbraten. 2 tablespoons Doubanjiang (Alternative: Toban Djan oder Gochujang + etwas Miso), 1 teaspoons Sesamöl und 2 tablespoons japanische Sojasoße unterrühren und weiterbraten, bis das Fleisch braun und knusprig ist.\n4. Schalen vorbereiten: Vier Schalen mit heißem Wasser vorwärmen, kurz vor dem Anrichten ausgießen. 10 tablespoons japanische Sesampaste / Neri Goma (Alternative: Tahin) (2–3 EL pro Schale, nach Geschmack) und 4 tablespoons Chiliöl (S. 29) in den Schalen glatt rühren, Brühe angießen und umrühren, mit 1 teaspoons Salz abschmecken.\n5. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden in sprudelndem Wasser garen (gekaufte nach Packung), abtropfen, in die Schalen geben.\n6. Anrichten: Mit Hack, Pak Choi, Sprossen, 4 Frühlingszwiebeln, in feinen Streifen (Topping) und 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier) anrichten, mit 4 tablespoons geröstete Sesamsamen, zerstoßen bestreuen.\n\nNOTES\nDas Buch gibt 8–12 EL Sesampaste an – mit 8 starten und nach Geschmack erhöhen. Veggie: Gemüsebrühe + Sojahack, schmeckt durch Sesam und Doubanjiang trotzdem sehr kräftig."],["Schafres Miso-Ramen","Scharfes Miso-Ramen (siehe Ramen - Tove Nilsson Seite XX)\nFeurige Miso-Ramen nach Hokkaido-Art mit angeröstetem Mais, Spinat und Chiliöl.\n\nINGREDIENTS\n• 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 3 tablespoons weiße Misopaste (Shiro)\n• 3 tablespoons rote Misopaste (Alternative: braunes Miso oder mehr weißes)\n• 4 tablespoons Chiliöl (S. 29 oder fertig gekauft)\n• 1.5 tablespoons Ingwer, fein gerieben\n• 1 teaspoons Salz\n• 12 dünne Scheiben Chashu (S. 45)\n• 200 grams Maiskörner (2 große frische Kolben oder TK)\n• 1 tablespoons Speiseöl\n• 180 grams frische Bohnensprossen\n• 120 grams frischer Spinat\n• 4 Frühlingszwiebeln, in Ringen\n• 4 marinierte Eier (Buch S. 42; Alternative: wachsweiche Eier)\n\nSTEPS\n1. Vorbereiten: Backofen auf 200 °C vorheizen. 12 dünne Scheiben Chashu (S. 45) in Portionen à 3 Scheiben aufs Blech legen. Gesalzenes Wasser in einem großen Topf aufkochen.\n2. Miso-Mischung: 3 tablespoons weiße Misopaste (Shiro), 3 tablespoons rote Misopaste (Alternative: braunes Miso oder mehr weißes), 4 tablespoons Chiliöl (S. 29 oder fertig gekauft) und 1.5 tablespoons Ingwer, fein gerieben in einer Schale verrühren.\n3. Mais rösten: Maiskörner ggf. vom Kolben schneiden. Pfanne gut vorheizen, 200 grams Maiskörner (2 große frische Kolben oder TK) in 1 tablespoons Speiseöl kräftig anbräunen und salzen.\n4. Blanchieren: 180 grams frische Bohnensprossen und 120 grams frischer Spinat im Sieb kurz im Nudelwasser blanchieren, kalt abschrecken.\n5. Schalen & Fleisch: Schalen mit heißem Wasser vorwärmen. Fleisch ca. 5 Minuten im Ofen erwärmen, nach Belieben abflämmen. 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond) erhitzen.\n6. Brühe in die Schalen: Miso-Mischung und Brühe auf die Schalen verteilen und verrühren, mit 1 teaspoons Salz abschmecken.\n7. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden garen (gekaufte nach Packung), abtropfen, verteilen.\n8. Anrichten: Mit Fleisch, Mais, Sprossen, 4 Frühlingszwiebeln, in Ringen, Spinat und 4 marinierte Eier (Buch S. 42; Alternative: wachsweiche Eier) anrichten. Extra Chiliöl dazu reichen.\n\nNOTES\nHokkaido-Style: ein Stück Butter obendrauf. Deftiger mit Miso-Sesam-Tare (S. 31) statt Miso. Veggie: Gemüsebrühe + Dashi-Pulver, Chashu durch gebratenen Tofu ersetzen. Seitenzahl im Foto abgeschnitten."],["Kimchi-Ramen","Kimchi-Ramen (siehe Ramen - Tove Nilsson Seite 58)\nGochujang-Brühe mit Kimchi und geschmortem, knusprig frittiertem Schweinebauch.\n\nINGREDIENTS\n• 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 6 tablespoons Gochujang / koreanische Chilipaste (Asialaden, inzwischen auch im Supermarkt)\n• 4 teaspoons frisch geriebener Ingwer (Brühe)\n• 4 tablespoons japanische Sojasoße (Brühe)\n• 600 grams Schweinebauch oder Rückenspeck, frisch\n• 300 milliliters helles Lagerbier\n• 200 milliliters Mirin\n• 2 tablespoons brauner Zucker\n• 100 milliliters japanische Sojasoße (Schmorflüssigkeit)\n• 2 tablespoons Gochugaru (Alternative: milde Chiliflocken oder Paprika + Cayenne)\n• 3 tablespoons Ingwer, fein gerieben (Schmorflüssigkeit)\n• 2 Frühlingszwiebeln (Schmorflüssigkeit)\n• 3 Knoblauchzehen, zerstoßen\n• 1.5 liters Frittieröl\n• 1 teaspoons Salz\n• 200 grams Kimchi\n• 4 Onsen-Eier (S. 46) oder pochierte Eier\n• 120 grams frische Bohnensprossen\n• 4 Frühlingszwiebeln, in feinen Ringen (Topping)\n• 1 tablespoons zerstoßene schwarze und weiße Sesamsamen\n\nSTEPS\n1. Schmorflüssigkeit: Backofen auf 150 °C vorheizen. 300 milliliters helles Lagerbier, 200 milliliters Mirin, 2 tablespoons brauner Zucker, 100 milliliters japanische Sojasoße (Schmorflüssigkeit), 2 tablespoons Gochugaru (Alternative: milde Chiliflocken oder Paprika + Cayenne), 3 tablespoons Ingwer, fein gerieben (Schmorflüssigkeit), 2 Frühlingszwiebeln (Schmorflüssigkeit) und 3 Knoblauchzehen, zerstoßen in einem Schmortopf oder einer hohen Auflaufform vermengen.\n2. Schmoren: 600 grams Schweinebauch oder Rückenspeck, frisch mit 1 teaspoons Salz salzen und mit der Schwarte nach unten hineinlegen. Abdecken, Ofen auf 125 °C reduzieren und 2,5 Stunden schmoren.\n3. Wenden & bräunen: Fleisch wenden und 1 weitere Stunde schmoren. Deckel ab, auf 175 °C erhöhen und ca. 20 Minuten weiterschmoren. Herausnehmen und abkühlen lassen.\n4. Frittieren: 1.5 liters Frittieröl auf 180 °C erhitzen. Fleisch würfeln und ca. 3 Minuten frittieren, bis die Schwarte knusprig ist. Auf Küchenpapier abtropfen.\n5. Brühe in die Schalen: 1.8 liters Schweine-Hühner-Brühe (Buch S. 22; Alternative: gekaufte Hühnerbrühe/-fond) erhitzen. 6 tablespoons Gochujang / koreanische Chilipaste (Asialaden, inzwischen auch im Supermarkt), 4 teaspoons frisch geriebener Ingwer (Brühe), 4 tablespoons japanische Sojasoße (Brühe) und Brühe auf die Schalen verteilen und verrühren.\n6. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden garen (gekaufte nach Packung), abtropfen, verteilen.\n7. Anrichten: Mit 200 grams Kimchi, Fleisch, 4 Onsen-Eier (S. 46) oder pochierte Eier, 120 grams frische Bohnensprossen und 4 Frühlingszwiebeln, in feinen Ringen (Topping) anrichten, mit 1 tablespoons zerstoßene schwarze und weiße Sesamsamen bestreuen.\n\nNOTES\nOhne Fritteuse: Fleischwürfel in der Pfanne mit wenig Öl rundum knusprig braten oder 10 Min. bei 220 °C Grill im Ofen. Veggie: Gemüsebrühe und statt Schweinebauch knusprig gebratener Tofu (in etwas Schmorflüssigkeit glasiert)."],["Tonkotsu-Ramen","Tonkotsu-Ramen (siehe Ramen - Tove Nilsson Seite 61)\nDie Königin der Ramen: cremige Schweineknochenbrühe mit Knoblauchpüree, Chashu und schwarzem Knoblauchöl.\n\nINGREDIENTS\n• 1.8 liters Tonkotsu-Brühe (Buch S. 25; Alternative: gekaufter Schweinefond oder fertige Tonkotsu-Basis aus dem Asialaden)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; hier sind laut Buch auch Instant-Nudeln erlaubt)\n• 4 tablespoons Knoblauchpüree (S. 30)\n• 1 teaspoons Salz\n• 400 grams Chashu (S. 45)\n• 4 marinierte Eier (Buch S. 42; Alternative: wachsweiche Eier)\n• 8 tablespoons Frühlingszwiebeln, in feinen Ringen\n• 4 tablespoons schwarzes Knoblauchöl / Mayu (S. 30)\n• 1 tablespoons geröstete, gemahlene Sesamsamen\n\nSTEPS\n1. Vorbereiten: Backofen auf 200 °C vorheizen. 400 grams Chashu (S. 45) dünn aufschneiden und in Portionen à 3 Scheiben aufs Blech legen. Gesalzenes Wasser in einem großen Topf aufkochen.\n2. Brühe: 1.8 liters Tonkotsu-Brühe (Buch S. 25; Alternative: gekaufter Schweinefond oder fertige Tonkotsu-Basis aus dem Asialaden) in einem separaten Topf erhitzen und mit 1 teaspoons Salz abschmecken. Fleisch ca. 5 Minuten im Ofen erwärmen.\n3. Schalen: Vier Schalen mit heißem Wasser vorwärmen, kurz vor dem Anrichten ausgießen. 4 tablespoons Knoblauchpüree (S. 30) auf die Schalen verteilen und mit Brühe verrühren.\n4. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; hier sind laut Buch auch Instant-Nudeln erlaubt) portionsweise ca. 45 Sekunden in sprudelndem Wasser garen (gekaufte nach Packung), abtropfen, verteilen.\n5. Anrichten: Mit Chashu, 4 marinierte Eier (Buch S. 42; Alternative: wachsweiche Eier), 8 tablespoons Frühlingszwiebeln, in feinen Ringen, 4 tablespoons schwarzes Knoblauchöl / Mayu (S. 30) und 1 tablespoons geröstete, gemahlene Sesamsamen anrichten.\n\nNOTES\nIm Buch steht beim Knoblauchöl „siehe Seite 38“ – gemeint ist das Mayu auf S. 30. Die echte Tonkotsu-Brühe kocht mindestens 10 Stunden. Für den Alltag geht gekaufter Schweinefond mit einem Schuss Sojamilch oder Hafersahne für die Cremigkeit."],["Shio-Ramen","Shio-Ramen (siehe Ramen - Tove Nilsson Seite 71)\nKlare, mit Meersalz gewürzte Hühnerbrühe mit Chashu, Pilzen und Sprossen.\n\nINGREDIENTS\n• 1.8 liters Hühnerbrühe (Buch S. 25; Alternative: gute gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 4 teaspoons Meersalz\n• 4 tablespoons Hühnerfett (S. 28, optional)\n• 400 grams Chashu (S. 45)\n• 6 grams getrocknete Mu-Err-Pilze, in Streifen (Asialaden; Alternative: getrocknete Shiitake)\n• 180 grams frische Bohnensprossen\n• 6 Frühlingszwiebeln, in feinen Ringen\n• 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier)\n\nSTEPS\n1. Brühe & Pilze: 1.8 liters Hühnerbrühe (Buch S. 25; Alternative: gute gekaufte Hühnerbrühe/-fond) erhitzen. 6 grams getrocknete Mu-Err-Pilze, in Streifen (Asialaden; Alternative: getrocknete Shiitake) ca. 15 Minuten in kochend heißem, gesalzenem Wasser einweichen, abgießen.\n2. Fleisch: Backofen auf 200 °C vorheizen. 400 grams Chashu (S. 45) dünn aufschneiden, in Portionen à 3 Scheiben aufs Blech legen und ca. 5 Minuten vor dem Servieren oben im Ofen aufwärmen (oder abflämmen).\n3. Wasser & Schalen: Gesalzenes Wasser in einem großen Topf aufkochen. Schalen mit heißem Wasser vorwärmen.\n4. Sprossen: 180 grams frische Bohnensprossen max. 30 Sekunden im Sieb im kochenden Wasser blanchieren.\n5. Brühe einfüllen: Schalen mit Brühe füllen, mit 4 teaspoons Meersalz salzen und nach Wunsch je 1 EL 4 tablespoons Hühnerfett (S. 28, optional) einrühren.\n6. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden garen (gekaufte nach Packung), abtropfen, verteilen.\n7. Anrichten: Mit Chashu, Pilzen, Sprossen, 6 Frühlingszwiebeln, in feinen Ringen und 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier) anrichten.\n\nNOTES\nJe besser die Brühe, desto besser das Shio – hier lohnt sich eine kräftige Brühe. Passt super mit gerösteten Tomaten (S. 47). Veggie: Gemüsebrühe + Kombu-Dashi, statt Chashu gebratener Tofu."],["Shoyu-Ramen","Shoyu-Ramen (siehe Ramen - Tove Nilsson Seite 72)\nMit Sojasoße gewürzte Hühnerbrühe, Chashu, marinierte Bambussprossen und Frühlingszwiebeln.\n\nINGREDIENTS\n• 1.8 liters Hühnerbrühe (Buch S. 25) oder Schweine-Hühner-Brühe (S. 22) (Alternative: gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 6 tablespoons japanische Sojasoße (Brühe; normale geht auch)\n• 4 tablespoons Hühnerfett (S. 28, optional)\n• 1 pinch Salz\n• 400 grams Chashu (S. 45)\n• 250 grams Bambussprossen in Scheiben, 1 Dose (Asialaden; kann weggelassen werden)\n• 2 tablespoons japanische Sojasoße (Bambus)\n• 1.5 tablespoons Reisessig\n• 180 grams frische Bohnensprossen\n• 6 Frühlingszwiebeln, in feinen Ringen\n• 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier)\n\nSTEPS\n1. Brühe & Fleisch: 1.8 liters Hühnerbrühe (Buch S. 25) oder Schweine-Hühner-Brühe (S. 22) (Alternative: gekaufte Hühnerbrühe/-fond) erhitzen. Backofen auf 200 °C vorheizen. 400 grams Chashu (S. 45) dünn aufschneiden, in Portionen à 3 Scheiben aufs Blech legen und ca. 5 Minuten vor dem Servieren oben im Ofen aufwärmen (oder abflämmen).\n2. Bambus marinieren: Gesalzenes Wasser aufkochen. 250 grams Bambussprossen in Scheiben, 1 Dose (Asialaden; kann weggelassen werden) längs halbieren und mit 2 tablespoons japanische Sojasoße (Bambus) und 1.5 tablespoons Reisessig verrühren.\n3. Sprossen: Schalen mit heißem Wasser vorwärmen. 180 grams frische Bohnensprossen max. 30 Sekunden im kochenden Wasser blanchieren.\n4. Brühe einfüllen: Schalen mit Brühe füllen, je 1,5 EL 6 tablespoons japanische Sojasoße (Brühe; normale geht auch) und nach Wunsch 4 tablespoons Hühnerfett (S. 28, optional) einrühren, ggf. mit 1 pinch Salz abschmecken.\n5. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden garen (gekaufte nach Packung), abtropfen, verteilen.\n6. Anrichten: Mit Chashu, Bambussprossen, Sprossen, 6 Frühlingszwiebeln, in feinen Ringen und 4 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier) krönen.\n\nNOTES\nTokyo-Variante: mit Schweine-Hühner-Brühe und einem Schuss Dashi (Dashi-Pulver in etwas heißem Wasser auflösen) für mehr Umami. Veggie: Gemüsebrühe + Dashi + Tofu oder Pilze."],["Chicken Katsu Ramen","Chicken-Katsu-Ramen (siehe Ramen - Tove Nilsson Seite 86)\nLeichte Soja-Hühnerbrühe mit knusprigem Panko-Hähnchenschnitzel und Brokkoli.\n\nINGREDIENTS\n• 1.6 liters Hühnerbrühe (Buch S. 25; Alternative: gekaufte Hühnerbrühe/-fond)\n• 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung)\n• 6 tablespoons japanische Sojasoße\n• 2 tablespoons Reisessig\n• 1 teaspoons Salz\n• 2 Hähnchenbrustfilets (veggie: Tofu in Scheiben, gut ausgedrückt)\n• 120 grams Mehl\n• 3 Eier, verquirlt\n• 200 grams Panko (Alternative: grobes Paniermehl)\n• 1.5 liters Frittieröl\n• 250 grams Kai-lan / chinesischer Brokkoli (Alternative: Bimi, Brokkoli oder Pak Choi)\n• 4 Frühlingszwiebeln, in feinen Ringen\n• 2 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier)\n\nSTEPS\n1. Vorbereiten: 2 Hähnchenbrustfilets (veggie: Tofu in Scheiben, gut ausgedrückt) horizontal halbieren und mit 1 teaspoons Salz salzen. 1.6 liters Hühnerbrühe (Buch S. 25; Alternative: gekaufte Hühnerbrühe/-fond) erhitzen. Gesalzenes Wasser in einem großen Topf aufkochen. Schalen mit heißem Wasser vorwärmen.\n2. Panieren: Fleisch erst in 120 grams Mehl, dann in 3 Eier, verquirlt und zum Schluss in 200 grams Panko (Alternative: grobes Paniermehl) wenden – gut bedeckt.\n3. Frittieren: 1.5 liters Frittieröl auf 180 °C erhitzen, Schnitzel 3–4 Minuten rundum goldbraun und knusprig frittieren. Auf Küchenpapier abtropfen.\n4. Gemüse: 250 grams Kai-lan / chinesischer Brokkoli (Alternative: Bimi, Brokkoli oder Pak Choi) kurz im Nudelwasser blanchieren (1–2 Min.).\n5. Brühe einfüllen: Brühe auf die Schalen verteilen, je 1–1,5 EL 6 tablespoons japanische Sojasoße und ½ EL 2 tablespoons Reisessig unterrühren.\n6. Nudeln: 4 Portionen Ramen-Nudeln (Buch S. 38; Alternative: fertige nach Packung) portionsweise ca. 45 Sekunden garen (gekaufte nach Packung), abtropfen, verteilen.\n7. Anrichten: Schnitzel in Streifen schneiden und mit Kai-lan, 4 Frühlingszwiebeln, in feinen Ringen und 2 marinierte Eier (Buch S. 42), halbiert (Alternative: wachsweiche Eier) anrichten.\n\nNOTES\nOhne Fritteuse: in der Pfanne mit ca. 1 cm Öl ausbacken, je Seite 2–3 Min. Das Blanchieren des Gemüses steht nicht explizit im Buch, macht Kai-lan/Brokkoli aber zarter. Schnitzel erst ganz zum Schluss auflegen, damit es knusprig bleibt."],["Udon Frühstück","Udon-Frühstück (siehe Ramen - Tove Nilsson Seite 113)\nFull English trifft Japan: Udon in Dashi mit Speck, Spiegelei, Rösttomate und Röstschalotten.\n\nINGREDIENTS\n• 1.2 liters Dashi (Buch S. 22; Alternative: Dashi-Pulver nach Packung in Wasser gelöst)\n• 800 grams Udon (Buch S. 39; Alternative: fertige Udon, ca. 4 Pck. à 200 g)\n• 1 teaspoons Salz\n• 140 grams Frühstücksspeck (veggie: weglassen oder Räuchertofu)\n• 4 Eier\n• 4 geröstete Tomatenhälften (S. 47)\n• 1 Portion frittierte Schalotten (S. 48; Alternative: Röstzwiebeln)\n• 1 tablespoons Speiseöl\n\nSTEPS\n1. Wasser aufsetzen: Gesalzenes Wasser in einem großen Topf aufkochen.\n2. Speck & Eier: 140 grams Frühstücksspeck (veggie: weglassen oder Räuchertofu) ohne Fett knusprig braten. 4 Eier in 1 tablespoons Speiseöl als Spiegeleier mit knuspriger Unterseite braten.\n3. Dashi: 1.2 liters Dashi (Buch S. 22; Alternative: Dashi-Pulver nach Packung in Wasser gelöst) erhitzen und mit 1 teaspoons Salz abschmecken.\n4. Nudeln: 800 grams Udon (Buch S. 39; Alternative: fertige Udon, ca. 4 Pck. à 200 g) ca. 2 Minuten im sprudelnden Wasser garen (gekaufte nach Packung), abgießen und in die Brühe geben.\n5. Anrichten: Erst Brühe, dann Nudeln auf die Schalen verteilen. Mit Speck, Spiegelei, 4 geröstete Tomatenhälften (S. 47) und 1 Portion frittierte Schalotten (S. 48; Alternative: Röstzwiebeln) anrichten und heiß servieren.\n\nNOTES\nIm Buch steht „1 Portion Udon“ – gemeint ist das Rezept von S. 39 für 4 Personen. Ohne geröstete Tomaten aus dem Vorrat: Tomaten halbieren und in der Speckpfanne scharf anbraten."],["Gyoza mit Schweinefleischfüllung","Gyoza mit Schweinefleischfüllung (siehe Ramen - Tove Nilsson Seite 135)\nKlassische Gyoza mit Hack-Weißkohl-Füllung, oben gedämpft, unten knusprig.\n\nINGREDIENTS\n• 20 Gyoza-Blätter (TK/Kühlregal Asialaden; Alternative: Wan-Tan- oder Dumpling-Blätter)\n• 100 grams Weißkohl, fein gehackt\n• 4 tablespoons Speiseöl\n• 4 Frühlingszwiebeln, in feinen Streifen\n• 1 Knoblauchzehe, gerieben\n• 125 milliliters Wasser (50 ml für den Kohl, 75 ml fürs Dämpfen)\n• 200 grams Schweinehackfleisch (veggie: zerbröselter Tofu + gehackte Shiitake)\n• 1.5 teaspoons Sesamöl\n• 1 tablespoons Ingwer, fein gerieben\n• 1 teaspoons Salz\n• 1 teaspoons Maisstärke\n\nSTEPS\n1. Auftauen: TK-20 Gyoza-Blätter (TK/Kühlregal Asialaden; Alternative: Wan-Tan- oder Dumpling-Blätter) über Nacht im Kühlschrank auftauen lassen.\n2. Kohl anbraten: 100 grams Weißkohl, fein gehackt auf kleiner Stufe in 2 EL 4 tablespoons Speiseöl leicht anbräunen. Die Hälfte von 4 Frühlingszwiebeln, in feinen Streifen zugeben und ein paar Minuten mitbraten.\n3. Ablöschen: 1 Knoblauchzehe, gerieben und 50 ml Wasser zufügen, verkochen lassen, Kohl in einer Schüssel abkühlen lassen.\n4. Füllung: Kohl mit 200 grams Schweinehackfleisch (veggie: zerbröselter Tofu + gehackte Shiitake), 1.5 teaspoons Sesamöl, 1 tablespoons Ingwer, fein gerieben und 1 teaspoons Salz vermengen.\n5. Füllen & falten: Je 1 EL Füllung mittig auf ein Blatt geben, Ränder mit kaltem Wasser befeuchten. Zum Halbmond falten, eine Seite in Falten legen, ohne Luft einzuschließen, gut andrücken.\n6. Anbraten: Restliche 2 EL Öl in einer Pfanne (ø 20 cm) erhitzen. Gyoza dicht nebeneinander hineinsetzen und bei mittlerer Hitze braten, bis die Unterseite braun ist.\n7. Dämpfen: 1 teaspoons Maisstärke mit 75 ml Wasser glattrühren, über die Gyoza gießen, abdecken und ca. 3 Minuten dämpfen. Deckel ab und Flüssigkeit verdampfen lassen, bis sich eine knusprige Stärkekruste bildet.\n8. Servieren: Pfanneninhalt auf einen Teller stürzen, mit restlichen Frühlingszwiebeln garnieren. Heiß mit Dip und evtl. Sriracha servieren.\n\nNOTES\nErgibt 20 Stück. Dips stehen im Buch auf S. 136 (nicht fotografiert). Schneller Dip: 3 EL Sojasoße, 1 EL Reisessig, ein paar Tropfen Chiliöl. Im Einleitungstext wird Sojasoße erwähnt, in der Zutatenliste aber nicht. 1 TL in die Füllung schadet nicht."],["Okonomiyaki Osaka Style","Okonomiyaki Osaka-Style (siehe Ramen - Tove Nilsson Seite 140)\nDicker japanischer Kohlpfannkuchen mit Speck, Okonomiyaki-Soße und Mayo.\n\nINGREDIENTS\n• 500 grams Weißkohl, gehackt\n• 4 Frühlingszwiebeln, in feinen Streifen\n• 2.5 tablespoons eingelegter Ingwer / Gari, fein gehackt (Sushi-Ingwer; Alternative: 1 EL frischer Ingwer + Spritzer Reisessig)\n• 2 teaspoons Salz\n• 250 milliliters Wasser\n• 240 grams Mehl\n• 4 Eier\n• 3 tablespoons Speiseöl\n• 140 grams Frühstücksspeck (veggie: gehackte Shiitake)\n• 6 tablespoons Okonomiyaki-Soße (Buch S. 139 oder fertig; Alternative: 3 EL Ketchup + 2 EL Worcestershire + 1 EL Soja + 1 TL Zucker)\n• 6 tablespoons Mayonnaise, möglichst Kewpie (Alternative: normale Mayo + Spritzer Reisessig + Prise Zucker)\n• 2 teaspoons getrocknete Nori, zerbröselt\n• 4 tablespoons Bonitoflocken / Katsuobushi (optional, kann weggelassen werden)\n\nSTEPS\n1. Kohlmischung: 500 grams Weißkohl, gehackt, 4 Frühlingszwiebeln, in feinen Streifen, 2.5 tablespoons eingelegter Ingwer / Gari, fein gehackt (Sushi-Ingwer; Alternative: 1 EL frischer Ingwer + Spritzer Reisessig) und 2 teaspoons Salz in einer Schüssel mischen.\n2. Teig: 250 milliliters Wasser, 240 grams Mehl und 4 Eier separat glatt rühren, dann mit der Kohlmischung vermengen.\n3. Erster Pfannkuchen: Die Hälfte von 3 tablespoons Speiseöl in einer Pfanne (ø 16–18 cm) stark erhitzen. Die Hälfte des Teigs hineingeben und flach drücken. Auf mittlere Hitze reduzieren, abdecken und ca. 10 Minuten garen.\n4. Speck auflegen: Nach 5 Minuten die Hälfte von 140 grams Frühstücksspeck (veggie: gehackte Shiitake) auf den Pfannkuchen legen, damit das Fett in den Kohl zieht.\n5. Wenden: Mit einem großen Pfannenwender (oder zweien) wenden, Speck bleibt an seinem Platz. Abgedeckt 5 Minuten weitergaren, bis er gebräunt und der Speck knusprig ist.\n6. Stürzen: Auf einen Teller stürzen, sodass der Speck oben liegt. Zweiten Pfannkuchen genauso backen, den ersten im Ofen warm halten.\n7. Garnieren: Mit 6 tablespoons Okonomiyaki-Soße (Buch S. 139 oder fertig; Alternative: 3 EL Ketchup + 2 EL Worcestershire + 1 EL Soja + 1 TL Zucker) und 6 tablespoons Mayonnaise, möglichst Kewpie (Alternative: normale Mayo + Spritzer Reisessig + Prise Zucker) beträufeln, mit 2 teaspoons getrocknete Nori, zerbröselt und 4 tablespoons Bonitoflocken / Katsuobushi (optional, kann weggelassen werden) bestreuen. Sofort heiß essen.\n\nNOTES\nVarianten aus dem Buch: Kimchi (halber Kohl durch Kimchi), Sauerkraut (halber Kohl durch Sauerkraut), mit Schweinehack (gebraten unter den Teig statt Speck), Vego (frisch gehackte Shiitake statt Speck), mit Chashu (gehackt unter den Teig), mit Hühnerfleisch (gekochtes aus der Hühnerbrühe), mit Ochsenschwanz (gekocht, aus der Rinderknochenbrühe S. 26)."],["Okonomiyaki Hiroshima Style","Okonomiyaki Hiroshima-Style (siehe Ramen - Tove Nilsson Seite 141)\nGeschichteter Doppeldecker aus Kohlpfannkuchen, gebratenen Nudeln und Ei.\n\nINGREDIENTS\n• 1 Portion Ramen-Nudeln (Buch S. 38; Alternative: fertige Ramen- oder Mie-Nudeln)\n• 120 grams Weizenmehl\n• 200 milliliters Wasser\n• 1 teaspoons Salz\n• 2 tablespoons Mirin\n• 3 tablespoons Speiseöl\n• 250 grams Weißkohl, gehackt\n• 3 Frühlingszwiebeln, in feinen Ringen\n• 140 grams Frühstücksspeck (veggie: gehackte Shiitake)\n• 3 tablespoons japanische Sojasoße\n• 2 teaspoons Sesamöl\n• 1 tablespoons Ingwer, fein gerieben\n• 3 Eier\n• 6 tablespoons Okonomiyaki-Soße (Buch S. 139 oder fertig; Alternative: Ketchup + Worcestershire + Soja + Zucker)\n• 6 tablespoons Mayonnaise, möglichst Kewpie (Alternative: Mayo + Reisessig + Zucker)\n• 2 teaspoons getrocknete Nori, zerbröselt\n• 4 tablespoons Bonitoflocken / Katsuobushi (optional, kann weggelassen werden)\n\nSTEPS\n1. Nudeln: 1 Portion Ramen-Nudeln (Buch S. 38; Alternative: fertige Ramen- oder Mie-Nudeln) ca. 45 Sekunden in sprudelndem Salzwasser garen (gekaufte nach Packung), sofort in Eiswasser abschrecken und abtropfen.\n2. Teig: 120 grams Weizenmehl, 200 milliliters Wasser, 1 teaspoons Salz und 2 tablespoons Mirin zu einem Teig verrühren.\n3. Kohlpfannkuchen: 2 EL 3 tablespoons Speiseöl in einer Pfanne (ø 20–24 cm) erhitzen, die Hälfte des Teigs hineingeben. Mit 250 grams Weißkohl, gehackt, 3 Frühlingszwiebeln, in feinen Ringen und 140 grams Frühstücksspeck (veggie: gehackte Shiitake) belegen und bei mittlerer Hitze ca. 5 Minuten braten.\n4. Wenden: Pfannkuchen auf einen Teller stürzen und zurück in die Pfanne gleiten lassen, damit die Oberseite und der Speck knusprig werden. Herausheben, mit einem Teller abdecken und beiseitestellen.\n5. Nudeln würzen: Nudeln mit 3 tablespoons japanische Sojasoße, 2 teaspoons Sesamöl und 1 tablespoons Ingwer, fein gerieben vermengen. 3 Eier kurz verquirlen.\n6. Schichten: 1 EL Öl erhitzen, Eier hineingeben. Mit den Nudeln belegen und den restlichen Teig darübergeben. Den Kohlpfannkuchen mit der Kohlseite nach unten daraufstürzen.\n7. Backen: Bei geringer Hitze ca. 10 Minuten backen, bis der Teig gestockt ist.\n8. Servieren: Aus der Pfanne stürzen, mit 6 tablespoons Okonomiyaki-Soße (Buch S. 139 oder fertig; Alternative: Ketchup + Worcestershire + Soja + Zucker) und 6 tablespoons Mayonnaise, möglichst Kewpie (Alternative: Mayo + Reisessig + Zucker) beträufeln, mit 2 teaspoons getrocknete Nori, zerbröselt und 4 tablespoons Bonitoflocken / Katsuobushi (optional, kann weggelassen werden) bestreuen und sofort servieren.\n\nNOTES\nFür 2–4 Portionen. Erinnert eher an ein mit Nudeln und Kohl gefülltes Omelett. Das Wenden geht am einfachsten mit zwei Pfannenwendern oder über einen Teller."]]}}</script>

  for (const [re, e] of CONFIG.emojis) if (re.test(n)) return e;
  return CONFIG.tabs[d.tab].emoji;
}

function buildModel(data){
  const recipes = [];
  const rrows = data.tabs[CONFIG.recipesTab] || [];
  rrows.forEach((r, i) => { if (i === 0) return; const name = (r[0] || '').trim(); if (name) recipes.push({ name, text: (r[1] || '').trim(), row: i + 1 }); });
  const recByRow = new Map(recipes.map(r => [r.row, r]));
  const recByNorm = new Map(); recipes.forEach(r => { const k = norm(r.name); if (!recByNorm.has(k)) recByNorm.set(k, r); });

  const dishes = []; const used = new Set();
  CONFIG.tabs.forEach((t, ti) => {
    const rows = data.tabs[t.name] || [];
    if (!rows.length) return;
    const h = rows[0].map(x => String(x).trim().toLowerCase());
    const col = p => h.findIndex(p);
    const iName = col(x => x === 'gericht');
    const iV = col(x => x === 'veggie'), iM = col(x => x === 'fleisch'), iF = col(x => x === 'fisch');
    const iDiet = col(x => x.includes('veggie') && x.includes('/'));
    const iK = col(x => x === 'küche' || x === 'kueche');
    const iTags = col(x => x === 'tags');
    const iSweet = col(x => x.includes('süß') || x.includes('herzhaft'));
    const iVar = col(x => x === 'variationen');
    const iHint = col(x => x === 'hinweise');
    const iRez = col(x => x === 'rezept');
    const iDur = col(x => x === 'dauer');
    const iImg = col(x => x === 'bild');
    const get = (r, i) => i >= 0 ? String(r[i] ?? '').trim() : '';
    for (let ri = 1; ri < rows.length; ri++){
      const r = rows[ri]; const name = get(r, iName); if (!name) continue;
      const diet = new Set();
      if (get(r, iV)) diet.add('Veggie'); if (get(r, iM)) diet.add('Fleisch'); if (get(r, iF)) diet.add('Fisch');
      if (iDiet >= 0) get(r, iDiet).toLowerCase().split(/[\/,]/).map(s => s.trim()).forEach(s => {
        if (s.startsWith('veg')) diet.add('Veggie'); else if (s.startsWith('fleisch')) diet.add('Fleisch'); else if (s.startsWith('fisch')) diet.add('Fisch'); });
      const kRaw = get(r, iK).toLowerCase();
      const tags = [];
      if (iSweet >= 0){ const s = get(r, iSweet).toLowerCase(); if (s.includes('beides') || (s.includes('süß') && s.includes('herz'))){ tags.push('Süß', 'Herzhaft'); } else if (s) tags.push(cap(s)); }
      get(r, iTags).split(/[,;]/).map(s => s.trim()).filter(Boolean).forEach(s => tags.push(cap(s)));
      let id = fileSlug(name) || ('g' + dishes.length); if (used.has(id)) id += '-' + (ti + 1); while (used.has(id)) id += 'x'; used.add(id);
      dishes.push({
        id, name, tab: ti, diet: [...diet], kitchenKey: kRaw, kitchen: kRaw ? (CONFIG.kitchenLabels[kRaw] || cap(kRaw)) : '',
        tags: [...new Set(tags)], variations: get(r, iVar), hint: get(r, iHint), rezept: classifyRezept(get(r, iRez)),
        dauer: get(r, iDur), bild: get(r, iImg), slug: fileSlug(name)
      });
    }
  });

  const sim = (a, b) => {
    const A = bigrams(a), B = bigrams(b); let inter = 0, sa = 0, sb = 0;
    A.forEach((v, k) => { sa += v; if (B.has(k)) inter += Math.min(v, B.get(k)); }); B.forEach(v => sb += v);
    const dice = sa + sb ? 2 * inter / (sa + sb) : 0;
    return Math.max(dice, tokenContain(a, b) ? .8 : 0);
  };
  function bigrams(s){ s = norm(s).replace(/ /g, ''); const m = new Map(); for (let i = 0; i < s.length - 1; i++){ const g = s.substr(i, 2); m.set(g, (m.get(g) || 0) + 1); } return m; }
  function tokenContain(a, b){
    const ta = norm(a).split(' ').filter(x => x.length > 1), tb = norm(b).split(' ').filter(x => x.length > 1);
    if (!ta.length || !tb.length) return false;
    const [s, l] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
    return s.every(t => l.some(u => u === t || (t.length >= 5 && u.startsWith(t)) || (u.length >= 5 && t.startsWith(u))));
  }
  const report = { byName: 0, byRow: 0, fuzzy: 0, weak: 0, unresolved: [], none: 0, ext: 0 };
  dishes.forEach(d => {
    d.rec = null; const rz = d.rezept;
    if (rz.type === 'url'){ report.ext++; return; }
    if (rz.type === 'text') return;
    const exact = recByNorm.get(norm(d.name));
    if (exact){ d.rec = exact; report.byName++; return; }
    if (rz.type === 'internal'){
      if (rz.row){
        let best = null, bs = 0;
        for (let off = 0; off <= 3; off++) for (const sg of (off ? [-1, 1] : [0])){ const r = recByRow.get(rz.row + sg * off); if (!r) continue; const s = sim(d.name, r.name); if (s > bs){ bs = s; best = r; } }
        if (best && bs >= .5){ d.rec = best; report.byRow++; return; }
      }
      let best = null, bs = 0; recipes.forEach(r => { const s = sim(d.name, r.name); if (s > bs){ bs = s; best = r; } });
      if (best && bs >= .7){ d.rec = best; report.fuzzy++; return; }
      const atRow = rz.row && recByRow.get(rz.row);
      if (atRow && sim(d.name, atRow.name) >= .3){ d.rec = atRow; report.weak++; return; }
      d.unresolved = true; report.unresolved.push(d.name + ' -> Zeile ' + rz.row);
    } else {
      let best = null, bs = 0; recipes.forEach(r => { const s = sim(d.name, r.name); if (s > bs){ bs = s; best = r; } });
      if (best && bs >= .85){ d.rec = best; report.fuzzy++; } else report.none++;
    }
  });
  dishes.forEach(d => {
    if (d.rec && !d.rec.parsed) d.rec.parsed = parseRecipe(d.rec.text);
    const ing = d.rec && d.rec.parsed.kind === 'structured' ? d.rec.parsed.ings.map(i => i.text).join(' ') : '';
    d.nameHay = norm(d.name); d.ingHay = norm(ing);
    d.hay = norm([d.name, d.kitchen, d.tags.join(' '), d.diet.join(' '), d.variations, d.hint, ing].join(' '));
    d.emoji = emojiFor(d);
  });
  return { dishes, recipes, report };
}

/* ============ Rezepttext lesen ============ */
const UNITS = { gram:'g', grams:'g', kilogram:'kg', kilograms:'kg', milliliter:'ml', milliliters:'ml', liter:'l', liters:'l',
  tablespoon:'EL', tablespoons:'EL', teaspoon:'TL', teaspoons:'TL', pinch:'Prise', pinches:'Prisen', cup:'Tasse', cups:'Tassen' };
function parseIng(line){
  const m = line.match(/^(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*(\d+(?:[.,]\d+)?))?\s+(.*)$/);
  if (!m) return { raw: line, text: line, amount: null };
  const a = parseFloat(m[1].replace(',', '.')), b = m[2] ? parseFloat(m[2].replace(',', '.')) : null;
  let rest = m[3], unit = null;
  const w = rest.split(/\s+/)[0]; const wl = w.toLowerCase().replace(/,$/, '');
  if (UNITS[wl]){ unit = wl; rest = rest.slice(w.length).trim(); }
  return { raw: line, text: rest, amount: a, amount2: b, unit };
}
function parseRecipe(text){
  const t = text.replace(/\r/g, '');
  const lines = t.split('\n');
  const iIng = lines.findIndex(l => l.trim() === 'INGREDIENTS');
  if (iIng < 0) return { kind: 'free', text: t };
  const head = lines.slice(0, iIng).filter(l => l.trim());
  const rec = { kind: 'structured', title: head[0] || '', intro: head.slice(1).join(' '), ings: [], steps: [], notes: '' };
  let st = 'ing';
  for (const l0 of lines.slice(iIng + 1)){
    const l = l0.trim();
    if (l === 'STEPS'){ st = 'steps'; continue; }
    if (l === 'NOTES'){ st = 'notes'; continue; }
    if (!l) continue;
    if (st === 'ing'){ rec.ings.push(parseIng(l.replace(/^[•*\-]\s*/, ''))); }
    else if (st === 'steps'){ const m = l.match(/^\d+\.\s*(.*)$/); if (m) rec.steps.push(m[1]); else if (rec.steps.length) rec.steps[rec.steps.length - 1] += ' ' + l; }
    else rec.notes += (rec.notes ? '\n' : '') + l;
  }
  return rec;
}

/* ============ Mengen umrechnen ============ */
const FR = { .25:'¼', .5:'½', .75:'¾' };
function fmtNum(x){
  if (x >= 20) return String(Math.round(x));
  const fl = Math.floor(x + 1e-9), frac = x - fl;
  for (const k of [0, .25, .5, .75, 1]) if (Math.abs(frac - k) < .02){
    const whole = fl + (k === 1 ? 1 : 0);
    if (k === 0 || k === 1) return String(whole);
    return (whole ? whole : '') + FR[k];
  }
  return String(Math.round(x * 100) / 100).replace('.', ',');
}
function scaled(ing, f){
  if (ing.amount == null) return { amount: '', unit: '', text: ing.text, full: ing.text };
  let a = ing.amount * f, b = ing.amount2 != null ? ing.amount2 * f : null, unit = ing.unit ? UNITS[ing.unit] : '';
  if (unit === 'g' && a >= 1000){ a /= 1000; if (b) b /= 1000; unit = 'kg'; }
  if (unit === 'ml' && a >= 1000){ a /= 1000; if (b) b /= 1000; unit = 'l'; }
  let n = fmtNum(a) + (b != null ? '–' + fmtNum(b) : '');
  if (unit === 'Prise' || unit === 'Prisen') unit = a > 1 ? 'Prisen' : 'Prise';
  const full = n + (unit ? ' ' + unit : '') + ' ' + ing.text;
  return { amount: n + (unit ? ' ' + unit : ''), unit, text: ing.text, full };
}
function scaleSteps(rec, f){
  const order = rec.ings.filter(i => i.amount != null).sort((a, b) => b.raw.length - a.raw.length);
  return rec.steps.map(s => {
    const tokens = [];
    order.forEach(i => { if (s.includes(i.raw)){ s = s.split(i.raw).join('\u0001' + tokens.length + '\u0002'); tokens.push(scaled(i, f).full); } });
    return esc(s).replace(/\u0001(\d+)\u0002/g, (_, n) => '<b>' + esc(tokens[+n]) + '</b>');
  });
}
const linkify = h => h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
function mdLite(t){
  const L = esc(t).split('\n'); let out = '', list = null;
  const close = () => { if (list){ out += '</' + list + '>'; list = null; } };
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const l of L){
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/))){ close(); out += '<h3>' + inl(m[1]) + '</h3>'; }
    else if ((m = l.match(/^\s*[*\-]\s+(.*)/))){ if (list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } out += '<li>' + inl(m[1]) + '</li>'; }
    else if ((m = l.match(/^\s*\d+\.\s+(.*)/))){ if (list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; } out += '<li>' + inl(m[1]) + '</li>'; }
    else if (/^-{3,}$/.test(l.trim())){ close(); out += '<hr>'; }
    else if (!l.trim()){ close(); }
    else { close(); out += '<p>' + inl(l) + '</p>'; }
  }
  close(); return out;
}

function baseName(t){ return t.split(/[,(]/)[0].replace(/\s+/g, ' ').trim(); }
function stemWord(w){
  if (w === 'eier') return 'ei';
  if (w.length > 5){ if (w.endsWith('en')) return w.slice(0, -2); if (/[nes]$/.test(w)) return w.slice(0, -1); }
  return w;
}
const CUT = /\s+(oder|zum|zur|zu|fur|für|nach|aus|und|bzw)\s.*$/i;
function ingKey(t){ return norm(baseName(t).replace(CUT, '')).split(' ').filter(w => w && !STOP.has(w)).map(stemWord).join(' '); }

function pickName(names){
  if (new Set(names).size === 1) return names[0];
  return names.map(n => { const c = n.replace(CUT, ''); return /-$/.test(c) ? n : c; }).sort((x, y) => x.length - y.length)[0];
}

function catRaw(text){
  const t = norm(text); if (!t) return 'sonst';
  const toks = t.split(' ');
  const sw = l => toks.some(x => l.some(w => x.startsWith(w)));
  const ew = l => toks.some(x => l.some(w => x === w || (x.length > w.length && x.endsWith(w))));
  const inc = l => toks.some(x => l.some(w => x.includes(w)));
  const eq = set => toks.some(x => set.has(x));
  if (ew(KW.packEnd) || eq(KW.packEq) || sw(KW.packStart)) return 'trocken';
  const oil = toks.some(x => (x === 'ol' || (x.length >= 4 && x.endsWith('ol'))) && !/^(alkohol|menthol)$/.test(x));
  const seeds = toks.some(x => (/(samen|saat)$/.test(x) && !x.startsWith('sesam')) || (/korner$/.test(x) && !x.startsWith('mais')));
  const driedHerb = toks.some(x => x.startsWith('getrocknet')) && toks.some(x => KW.herbs.includes(x));
  if (eq(KW.essEq) || ew(KW.essEnd) || sw(KW.essStart) || oil || seeds || driedHerb) return 'ess';
  if (toks.some(x => x.startsWith('getrocknet'))) return 'trocken';
  if (toks.some(x => KW.meatStart.some(w => x.startsWith(w)) || (/^rind/.test(x) && !/^rinden?$/.test(x))) || inc(KW.meatInc) || eq(KW.meatEq)) return 'fleisch';
  if (ew(KW.breadEnd) || eq(KW.breadEq)) return 'brot';
  if (inc(['kurbis'])) return 'obst';
  if (inc(KW.coolInc) || sw(KW.coolStart) || eq(KW.coolEq)) return 'kuehl';
  if (inc(KW.vegInc) || eq(KW.vegEq) || sw(KW.herbs)) return 'obst';
  if (inc(KW.dryInc)) return 'trocken';
  return 'sonst';
}
// Bereich nach dem Namen vor Komma/Klammer bestimmen; Hinweise in Klammern zählen nicht
function catOf(text){
  const raw = String(text);
  if (/\b(dose|dosen|konserve)\b|br[üu]he/i.test(raw)) return 'trocken';
  if (/gr[üu]ne\s+bohnen/i.test(raw)) return 'obst';
  const base = baseName(raw);
  for (const cand of [base.replace(CUT, ''), base, raw.replace(/\([^)]*\)/g, '').replace(CUT, '')]){
    const c = catRaw(cand); if (c !== 'sonst') return c;
  }
  return 'sonst';
}
window.__catOf = t => catOf(t);
function aggregate(){
  const lines = new Map(), nach = new Map(), noList = [];
  plan.entries.forEach(e => {
    const d = dishById(e.id); if (!d) return;
    const p = d.rec && d.rec.parsed;
    if (!p || p.kind !== 'structured'){ noList.push({ d, e }); return; }
    p.ings.forEach(i => {
      const key = ingKey(i.text); if (!key) return;
      if (i.amount == null){ if (!nach.has(key) && !lines.has(key)) nach.set(key, { key, name: i.text }); return; }
      let a = (i.amount2 != null ? i.amount2 : i.amount) * e.f, unit = i.unit ? UNITS[i.unit] : '';
      if (unit === 'kg'){ a *= 1000; unit = 'g'; } if (unit === 'l'){ a *= 1000; unit = 'ml'; }
      if (unit === 'Prisen') unit = 'Prise';
      let L = lines.get(key); if (!L){ L = { key, names: [], texts: [], units: new Map() }; lines.set(key, L); }
      L.names.push(cap(baseName(i.text))); L.texts.push(i.text);
      L.units.set(unit, (L.units.get(unit) || 0) + a);
      nach.delete(key);
    });
  });
  const fmtU = (u, a) => {
    if (u === 'g' && a >= 1000) return fmtNum(a / 1000) + ' kg';
    if (u === 'ml' && a >= 1000) return fmtNum(a / 1000) + ' l';
    if (u === 'Prise') return fmtNum(a) + (a > 1 ? ' Prisen' : ' Prise');
    return fmtNum(a) + (u ? ' ' + u : '');
  };
  const items = [...lines.values()].map(L => ({ kind: 'i', key: L.key, name: pickName(L.names), amount: [...L.units].map(([u, a]) => fmtU(u, a)).join(' + '), cat: plan.cats[L.key] || catOf(L.texts[0]) }));
  [...nach.values()].forEach(n => items.push({ kind: 'e', key: n.key, name: cap(n.name), amount: '', cat: plan.cats[n.key] || catOf(n.name) }));
  items.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  return { items, noList };
}

function dotsHTML(d){ return d.diet.map(x => `<i class="dot ${dotCls(x)}" title="${x}"></i>`).join(''); }
function matches(d, skip){
  const searching = !!S.q.trim();
  if (!(searching && S.all) && d.tab !== S.tab) return false;

  return true;
}

function renderList(){

function renderPlan(sub){
  const agg = aggregate();

  let html = `<h1>Wochenplan</h1><p class="lead">Gerichte auf Wochentage legen, Mengen anpassen und die Zutaten als Einkaufsliste sammeln. Der Plan wird auf diesem Gerät gespeichert.</p>`;

    html += DAYS.map((name, di) => {
      const es = plan.entries.filter(e => e.day === di);
      return `<section class="day"><h3>${name}</h3><div class="entries">${es.length ? es.map(entryHTML).join('') : '<div class="none">Noch nichts geplant</div>'}<button class="btn small addbtn" data-add="${di}" type="button">+ Gericht hinzufügen</button></div></section>`;
    }).join('');
  } else {
    const catSel = i => `<span class="catsel" title="Kategorie ändern"><span aria-hidden="true">⋮</span><select data-cat="${esc(i.key)}" aria-label="Kategorie für ${esc(i.name)} ändern">${CATS.map(c => `<option value="${c.id}"${c.id === i.cat ? ' selected' : ''}>${esc(c.id === 'ess' ? 'Kitchen essentials (zu Hause)' : c.label)}</option>`).join('')}</select></span>`;
    const row = i => { const ck = i.kind + ':' + i.key; return `<li><label><input type="checkbox" data-ck="${esc(ck)}"${plan.checked[ck] ? ' checked' : ''}><span>${i.amount ? `<b>${esc(i.amount)}</b> ` : ''}${esc(i.name)}</span></label>${catSel(i)}</li>`; };
    html += `<div class="shop">`;
    if (!plan.entries.length) html += `<p class="none" style="margin-top:18px">Der Plan ist leer. Sobald Gerichte eingetragen sind, erscheinen hier ihre Zutaten.</p>`;

    html += `<div class="toolbar"><button class="btn small" id="copyList" type="button">Liste kopieren</button><button class="btn small" id="uncheck" type="button">Haken zurücksetzen</button></div>`;
    CATS.filter(c => c.id !== 'ess').forEach(c => {
      const list = agg.items.filter(i => i.cat === c.id);
      if (list.length) html += `<h3>${esc(c.label)} <span class="n2">${list.length}</span></h3><ul>${list.map(row).join('')}</ul>`;
    });
    const ess = agg.items.filter(i => i.cat === 'ess');
    if (agg.noList.length){
      html += `<h3>Ohne Zutatenliste</h3><p class="hint">Für diese Gerichte liegt keine Zutatenliste vor. Bitte von Hand ergänzen.</p><ul class="nolist">${agg.noList.map(({ d, e }) => `<li><a href="#/g/${esc(d.id)}">${esc(d.name)}</a>&nbsp;<span class="none">(${DAYS_SHORT[e.day]})</span></li>`).join('')}</ul>`;
    }
    html += `<h3>Eigene Einträge</h3><ul id="manualList">${plan.manual.map((m, i) => `<li><label><input type="checkbox" data-mk="${i}"${m.done ? ' checked' : ''}><span>${esc(m.t)}</span></label><button class="xbtn" data-mrm="${i}" aria-label="Eintrag entfernen">×</button></li>`).join('')}</ul>
      <form class="addrow" id="manualForm"><input id="manualIn" type="text" placeholder="Zum Beispiel Zahnpasta" aria-label="Eigener Eintrag" autocomplete="off"><button class="btn small" type="submit">Hinzufügen</button></form>`;
    if (ess.length) html += `<details class="ess"><summary>Kitchen essentials, meist schon da <span class="n2">${ess.length}</span></summary><ul>${ess.map(row).join('')}</ul></details>`;
    html += `</div>`;
  }

function shoppingText(){
  const agg = aggregate(); const out = ['Einkaufsliste'];
  CATS.filter(c => c.id !== 'ess').forEach(c => {
    const list = agg.items.filter(i => i.cat === c.id && !plan.checked[i.kind + ':' + i.key]);

  const man = plan.manual.filter(m => !m.done);

async function copyText(t){

function route(){
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/g\/([^?]+)/))){
    const d = M.byId.get(decodeURIComponent(m[1]));
    if (d){
      if (view === 'list') listScroll = window.scrollY;
      view = 'detail'; showView('detail'); showDetail(d); window.scrollTo(0, 0); return;
    }
  }
  if ((m = h.match(/^#\/plan(\/einkauf)?(?:\?p=(.+))?$/))){
    if (view === 'list') listScroll = window.scrollY;
    if (m[2]){ try { const arr = JSON.parse(b64d(m[2])); incoming = arr.filter(a => Array.isArray(a) && a.length >= 3).map(a => ({ u: uid(), id: String(a[0]), day: Math.min(6, Math.max(0, +a[1] | 0)), f: +a[2] || 1 })); } catch(e){ incoming = null; } }
    view = 'plan'; showView('plan'); renderPlan(m[1] ? 'einkauf' : 'plan'); document.title = 'Wochenplan – Gerichte-Roster'; window.scrollTo(0, 0); return;
  }
  current = null; rolled = false;
  if (wake){ wake.release().catch(() => {}); wake = null; }
  const was = view; view = 'list'; showView('list');
  document.title = 'Gerichte-Roster';

}

  if (t.matches('select[data-u]')){ const en = plan.entries.find(x => x.u === t.dataset.u); if (en){ en.f = +t.value; savePlan(); } }
  else if (t.matches('select[data-cat]')){ plan.cats[t.dataset.cat] = t.value; savePlan(); renderPlan('einkauf'); }
  else if (t.matches('input[data-ck]')){ if (t.checked) plan.checked[t.dataset.ck] = true; else delete plan.checked[t.dataset.ck]; savePlan(); }
  else if (t.matches('input[data-mk]')){ plan.manual[+t.dataset.mk].done = t.checked; savePlan(); }
});
$('#planView').addEventListener('submit', e => {
  if (e.target.id !== 'manualForm') return; e.preventDefault();
  const v = $('#manualIn').value.trim(); if (!v) return; plan.manual.push({ t: v, done: false }); savePlan(); renderPlan('einkauf'); $('#manualIn').focus();
});
$('#pkQ').addEventListener('input', fillPicker);
$('#pkList').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  addEntry(b.dataset.pick, pickDay, 1); $('#picker').close(); renderPlan('plan');
});
document.addEventListener('click', e => { if (e.target.closest('a[href^="#/"]')) cameInApp = true; });
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && wake === null && $('#wake') && $('#wake').getAttribute('aria-pressed') === 'true'){ await toggleWake(); } });

/* ============ Start ============ */
function setStatus(kind, data){
  const el = $('#status');
  if (kind === 'live') el.textContent = 'Daten live aus der Tabelle geladen, ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr.';
  else {
    const day = new Date(data.built); const txt = isNaN(day) ? data.built : day.toLocaleDateString('de-DE');
    el.textContent = 'Zwischengespeicherter Stand vom ' + txt + '. Die Verbindung zur Tabelle ist gerade nicht möglich.';
  }
}
function applyData(data, kind){
  M = buildModel(data); M.byId = new Map(M.dishes.map(d => [d.id, d]));
  window.__roster = M; window.__plan = () => plan; setStatus(kind, data);
  if (!M.dishes.some(d => d.tab === S.tab)){ const first = CONFIG.tabs.findIndex((t, i) => M.dishes.some(d => d.tab === i)); S.tab = Math.max(0, first); }
  const keep = view === 'detail' && current ? { id: current.id, f: factor, y: window.scrollY } : null;
  renderAll(); updateBadge(); route();
  if (keep && current && current.id === keep.id){ factor = keep.f; fillScaled(); window.scrollTo(0, keep.y); }
}
(function init(){
  S.tab = Math.max(0, CONFIG.tabs.findIndex(t => t.name === CONFIG.defaultTab));
  const cache = readCache(); const start = cache || { built: '2026-10-29', tabs: SNAP.tabs };
  applyData(start, 'offline');
  fetchLive().then(live => { writeCache(live); applyData(live, 'live'); }).catch(err => { console.warn('Live-Daten nicht verfügbar:', err.message); });
})();
})();
</script>
