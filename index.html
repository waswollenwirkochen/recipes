r einfach mit den Röstzwiebeln toppen. Mit 2 tablespoons Schnittlauch, in Röllchen bestreuen und mit grünem Salat servieren.\n\nNOTES\nOhne Spätzlehobel: Den Teig auf ein nasses Holzbrett streichen und mit einem Messer dünne Streifen ins Wasser schaben. Statt selbst zu machen gehen auch frische Spätzle aus dem Kühlregal, kurz in Butter angebraten."],["Rösti","Rösti\nKnusprige Schweizer Kartoffelrösti aus geriebenen Pellkartoffeln, in Butter gebraten\n\nINGREDIENTS\n• 1 kilograms festkochende Kartoffeln (am Vortag als Pellkartoffeln gekocht)\n• 1 teaspoons Salz\n• 0.5 teaspoons schwarzer Pfeffer\n• 4 tablespoons Butterschmalz oder Butter + Öl\n\nSTEPS\n1. Vorkochen (Vortag): 1 kilograms festkochende Kartoffeln (am Vortag als Pellkartoffeln gekocht) mit Schale 15–18 Minuten kochen. Sie sollen innen noch fest sein. Über Nacht im Kühlschrank auskühlen lassen.\n2. Reiben: Die Kartoffeln pellen und grob reiben. Mit 1 teaspoons Salz und 0.5 teaspoons schwarzer Pfeffer locker vermischen, nicht drücken.\n3. Braten erste Seite: Die Hälfte von 4 tablespoons Butterschmalz oder Butter + Öl in einer beschichteten Pfanne (ca. 26 cm) erhitzen. Die Kartoffeln locker einfüllen und zu einem Fladen formen, nur leicht andrücken. Bei mittlerer Hitze 12–15 Minuten braten, bis die Unterseite goldbraun und knusprig ist.\n4. Wenden: Einen Teller auf die Pfanne legen, die Rösti daraufstürzen und das restliche Fett in die Pfanne geben. Die Rösti zurückgleiten lassen und die zweite Seite weitere 10–12 Minuten braten.\n5. Servieren: In Stücke schneiden und sofort servieren.\n\nNOTES\nAus rohen Kartoffeln: Grob reiben, in einem Tuch kräftig ausdrücken und dann genauso verfahren. Das wird etwas lockerer und braucht 2–3 Minuten länger pro Seite. Klassisch mit Spiegelei, Zürcher Geschnetzeltem oder einfach mit Kräuterquark und Salat."],["Königsberger Klopse","Königsberger Klopse\nIn Brühe gegarte Fleischklößchen in heller Kapern-Sahne-Sauce mit Salzkartoffeln (auch veggie)\n\nINGREDIENTS\n• 1 Brötchen vom Vortag\n• 600 grams gemischtes Hack (veggie: 120 g Sojagranulat, in Brühe eingeweicht und ausgedrückt)\n• 1 Zwiebel, sehr fein gewürfelt\n• 1 Ei\n• 2 Sardellenfilets, fein gehackt (veggie: weglassen, dafür 1 TL Senf)\n• 1 teaspoons Salz und Pfeffer\n• 1.2 liters Gemüse- oder Rinderbrühe\n• 1 Lorbeerblatt\n• 40 grams Butter\n• 40 grams Mehl\n• 150 milliliters Sahne\n• 3 tablespoons Kapern (+ 1 EL Kapernsud)\n• 0.5 Zitrone, Saft (halbe)\n• 1 Eigelb (optional, zum Legieren)\n• 1 pinch Zucker\n\nSTEPS\n1. Klopsmasse: 1 Brötchen vom Vortag in Wasser einweichen und gut ausdrücken. Mit 600 grams gemischtes Hack (veggie: 120 g Sojagranulat, in Brühe eingeweicht und ausgedrückt), 1 Zwiebel, sehr fein gewürfelt, 1 Ei, 2 Sardellenfilets, fein gehackt (veggie: weglassen, dafür 1 TL Senf) und 1 teaspoons Salz und Pfeffer gründlich verkneten. Mit nassen Händen 12–16 Klößchen formen.\n2. Garen: 1.2 liters Gemüse- oder Rinderbrühe mit 1 Lorbeerblatt aufkochen und die Hitze reduzieren. Die Klopse hineingeben und 12–15 Minuten gar ziehen lassen. Die Brühe soll nur sieden, nicht sprudeln. Herausnehmen und warm halten. 600 ml Brühe abnehmen.\n3. Mehlschwitze: 40 grams Butter schmelzen, 40 grams Mehl einrühren und hell anschwitzen. Die abgenommene Brühe nach und nach mit dem Schneebesen einrühren und 5 Minuten köcheln lassen.\n4. Sauce verfeinern: 150 milliliters Sahne, 3 tablespoons Kapern (+ 1 EL Kapernsud) und den Kapernsud einrühren. Mit 0.5 Zitrone, Saft (halbe), 1 pinch Zucker, Salz und Pfeffer säuerlich-frisch abschmecken. Wer mag, nimmt die Sauce vom Herd und rührt 1 Eigelb (optional, zum Legieren) mit etwas Sauce verquirlt ein. Danach nicht mehr kochen.\n5. Servieren: Die Klopse in der Sauce kurz erwärmen. Mit Salzkartoffeln und Rote-Bete-Salat servieren.\n\nNOTES\nDie Sardellen schmeckt man nicht heraus, sie geben aber die typische Würze. Bei der Veggie-Version 2 EL Paniermehl in die Masse geben, damit die Klopse beim Garen zusammenhalten."],["Easy Crumble","Easy Crumble (Apfel, Pfirsich oder Pflaume)\nSaftiges Ofenobst unter knusprigen Butter-Haferflocken-Streuseln – mit Äpfeln, Pfirsichen oder Pflaumen\n\nINGREDIENTS\n• 1 kilograms Äpfel, Pfirsiche oder Pflaumen (geputzt gewogen)\n• 2 tablespoons Zucker (Obst)\n• 1 teaspoons Zimt (Obst)\n• 1 tablespoons Speisestärke\n• 1 tablespoons Zitronensaft\n• 150 grams Mehl\n• 50 grams zarte Haferflocken\n• 100 grams brauner Zucker\n• 120 grams kalte Butter, in Würfeln\n• 1 pinch Salz\n\nSTEPS\n1. Obst vorbereiten: Den Ofen auf 190 °C Ober-/Unterhitze vorheizen. 1 kilograms Äpfel, Pfirsiche oder Pflaumen (geputzt gewogen) entkernen bzw. schälen und in Spalten oder Stücke schneiden. Mit 2 tablespoons Zucker (Obst), 1 teaspoons Zimt (Obst), 1 tablespoons Speisestärke und 1 tablespoons Zitronensaft mischen und in eine Auflaufform (ca. 20 × 30 cm) geben.\n2. Streusel: 150 grams Mehl, 50 grams zarte Haferflocken, 100 grams brauner Zucker und 1 pinch Salz mischen. 120 grams kalte Butter, in Würfeln mit den Fingerspitzen einarbeiten, bis grobe Streusel entstehen. Nicht zu lange kneten.\n3. Backen: Die Streusel gleichmäßig über dem Obst verteilen und 35–40 Minuten backen, bis die Oberfläche goldbraun ist und das Obst am Rand blubbert.\n4. Servieren: 10 Minuten abkühlen lassen. Lauwarm mit Vanillesauce, Vanilleeis oder Schlagsahne servieren.\n\nNOTES\nÄpfel: säuerliche Sorten wie Boskoop oder Elstar nehmen und mit Zimt würzen. Pfirsiche: ungeschält oder aus der Dose, gut abgetropft, statt Zimt Vanille und ein paar Himbeeren. Pflaumen: halbieren, Zucker auf 3 EL erhöhen und mit Zimt oder Kardamom würzen. Mit gehackten Mandeln oder Haselnüssen in den Streuseln wird es knuspriger."],["Kaiserschmarn","Kaiserschmarrn\nFluffiger, karamellisierter Kaiserschmarrn aus der Pfanne mit Puderzucker und Apfelmus\n\nINGREDIENTS\n• 4 Eier, getrennt\n• 125 grams Mehl\n• 250 milliliters Milch\n• 2 tablespoons Zucker (Teig)\n• 1 teaspoons Vanillezucker\n• 1 pinch Salz\n• 30 grams Rosinen, in Rum oder Wasser eingeweicht (optional)\n• 40 grams Butter\n• 1 tablespoons Zucker (zum Karamellisieren)\n• 2 tablespoons Puderzucker\n• 200 grams Apfelmus oder Zwetschgenröster\n\nSTEPS\n1. Teig: Die Eigelbe von 4 Eier, getrennt mit 125 grams Mehl, 250 milliliters Milch, 2 tablespoons Zucker (Teig) und 1 teaspoons Vanillezucker zu einem glatten Teig verrühren.\n2. Eischnee: Die Eiweiße mit 1 pinch Salz steif schlagen und vorsichtig unter den Teig heben.\n3. Anbacken: Die Hälfte von 40 grams Butter in einer großen, ofenfesten Pfanne bei mittlerer Hitze schmelzen. Den Teig hineingießen, 30 grams Rosinen, in Rum oder Wasser eingeweicht (optional) darauf streuen und 4–5 Minuten backen, bis die Unterseite goldbraun ist.\n4. Wenden: Den Teig vierteln und die Stücke wenden, oder die Pfanne 5–7 Minuten bei 200 °C in den Ofen stellen, bis die Oberseite gestockt ist.\n5. Zerreißen & karamellisieren: Mit zwei Pfannenwendern in mundgerechte Stücke reißen. Restliche Butter und 1 tablespoons Zucker (zum Karamellisieren) zugeben und unter Schwenken 1–2 Minuten karamellisieren lassen.\n6. Servieren: Mit 2 tablespoons Puderzucker bestäuben und mit 200 grams Apfelmus oder Zwetschgenröster servieren.\n\nNOTES\nAls Hauptgericht reicht diese Menge für 2 Personen, als Dessert für 4. Statt Apfelmus passen auch Preiselbeeren, Beerenkompott oder die Vanillesauce."],["","Carne Asada mit Chipotle-Cashew-Salsa\nRauchig-zitrusmariniertes Steak in Tacos mit nussig-scharfer Chipotle-Cashew-Salsa, Pico de Gallo und Crema\n\nINGREDIENTS\n• 500 grams Bavette, Flank Steak oder Hüftsteak\n• 6 Knoblauchzehen\n• 0.3 Zwiebel (Viertel)\n• 3 Frühlingszwiebeln\n• 2 Chipotles in Adobo (Marinade)\n• 1 tablespoons geräuchertes Paprikapulver oder Chipotlepulver\n• 1 Jalapeño\n• 0.5 Koriander (halber Bund)\n• 100 milliliters Bier\n• 1 Orange (Saft und Abrieb)\n• 2 Limetten (Saft und Abrieb)\n• 1 teaspoons Salz, Pfeffer, Zucker (je)\n• 2 tablespoons Öl\n• 100 grams gesalzene Cashewkerne\n• 2 tablespoons Chipotles in Adobo, gehackt, samt Sauce (Salsa)\n• 2 tablespoons Wasser (Salsa)\n• 0.5 Limette, Saft (halbe), für die Salsa\n• 16 Maistortillas\n• 4 tablespoons Pico de Gallo\n• 100 milliliters Crema oder saure Sahne\n• 2 Limetten (Spalten) und Koriander\n\nSTEPS\n1. Marinade: 6 Knoblauchzehen, 0.3 Zwiebel (Viertel), 3 Frühlingszwiebeln, 2 Chipotles in Adobo (Marinade), 1 tablespoons geräuchertes Paprikapulver oder Chipotlepulver, 1 Jalapeño, 0.5 Koriander (halber Bund), 100 milliliters Bier, 1 Orange (Saft und Abrieb), 2 Limetten (Saft und Abrieb), 1 teaspoons Salz, Pfeffer, Zucker (je) und 2 tablespoons Öl zu einer Paste pürieren.\n2. Marinieren: 500 grams Bavette, Flank Steak oder Hüftsteak rundum mit der Marinade einreiben und zugedeckt mindestens 1 Stunde, bis zu 2 Tage im Kühlschrank ziehen lassen.\n3. Cashew-Salsa: 100 grams gesalzene Cashewkerne in einer trockenen Pfanne 2 Minuten rösten, bis sie duften. Mit 2 tablespoons Chipotles in Adobo, gehackt, samt Sauce (Salsa), 2 tablespoons Wasser (Salsa) und 0.5 Limette, Saft (halbe), für die Salsa grob pürieren. Die Konsistenz soll an groben Senf erinnern.\n4. Grillen: Grill oder Pfanne 5 Minuten sehr stark erhitzen. Das Steak je Seite ca. 3 Minuten braten, bis es außen dunkel und innen medium rare ist. 5 Minuten ruhen lassen.\n5. Tacos: Das Steak quer zur Faser in 2 cm dicke Scheiben schneiden. Die Tortillas erwärmen und in einem Tuch warm halten. Je Tortilla ein paar Scheiben Steak mit Cashew-Salsa, 4 tablespoons Pico de Gallo, 100 milliliters Crema oder saure Sahne, Limettensaft und Koriander belegen.\n\nNOTES\nDie Cashew-Salsa hält sich in einem luftdichten Glas 2 Wochen im Kühlschrank und passt auch zu Grillgemüse oder als Dip. Übrige Marinade lässt sich einfrieren."],["","Yucatán-Hähnchen-Tacos mit Mango-Habanero-Salsa\nZitrus-Piment-mariniertes Hähnchen, knusprig gebraten und gezupft, mit fruchtig-scharfer Mango-Salsa\n\nINGREDIENTS\n• 5 Hähnchenoberschenkel ohne Knochen (mit Haut, wenn erhältlich)\n• 0.5 teaspoons Cayennepfeffer\n• 1 tablespoons geräuchertes Paprikapulver\n• 1 teaspoons mexikanischer Oregano\n• 1 teaspoons Salz\n• 1 teaspoons schwarzer Pfeffer\n• 4 tablespoons Ananassaft\n• 4 tablespoons Orangensaft\n• 2 tablespoons Limettensaft\n• 2 teaspoons gemahlener Piment\n• 1 Habanero (oder 2 Árbol)\n• 1 Jalapeño\n• 4 tablespoons Rapsöl (Marinade + Braten)\n• 1 Mango, in kleinen Würfeln\n• 2 Limetten, Saft (Salsa)\n• 0.5 Habanero, fein gehackt (Salsa, nach Geschmack)\n• 2 Koriander und Minze, gehackt (je eine Handvoll)\n• 12 Maistortillas\n• 4 tablespoons Crema oder saure Sahne\n• 2 tablespoons eingelegte Jalapeños oder Habaneros\n\nSTEPS\n1. Marinieren: 0.5 teaspoons Cayennepfeffer bis 1 Jalapeño mit 3 EL von 4 tablespoons Rapsöl (Marinade + Braten) glatt pürieren. 5 Hähnchenoberschenkel ohne Knochen (mit Haut, wenn erhältlich) einschneiden, mit der Marinade einreiben und mindestens 2 Stunden, gern über Nacht, zugedeckt im Kühlschrank ziehen lassen.\n2. Mango-Salsa: 1 Mango, in kleinen Würfeln, 2 Limetten, Saft (Salsa), 0.5 Habanero, fein gehackt (Salsa, nach Geschmack) und 2 Koriander und Minze, gehackt (je eine Handvoll) mit einer Prise Salz, einer Prise Zucker und 1 TL Olivenöl mischen. Kalt stellen.\n3. Anbraten: Den Ofen auf 200 °C vorheizen. Eine ofenfeste Pfanne mit dem restlichen Öl stark erhitzen. Das Hähnchen mit der Haut nach unten 6–7 Minuten braten und gelegentlich bewegen, damit nichts ansetzt.\n4. Im Ofen fertig garen: Wenden und die Pfanne für 20–25 Minuten in den Ofen schieben, bis das Hähnchen durchgegart ist. 10 Minuten ruhen lassen.\n5. Zupfen: Mit zwei Gabeln zerzupfen und mit dem Saft einer Limette beträufeln.\n6. Tacos: Die Tortillas erwärmen und mit Hähnchen, Mango-Salsa, Koriander, 4 tablespoons Crema oder saure Sahne und 2 tablespoons eingelegte Jalapeños oder Habaneros belegen. Mit Limettenspalten servieren.\n\nNOTES\nWenn du eine Grillpfanne hast, bekommt das Hähnchen dort schöne Röststreifen. Ohne Haut funktioniert es auch, es wird nur weniger knusprig. Statt Mango passt auch Ananas."],["","Thunfisch-Tostadas mit Chipotle-Mayo & Butter-Jalapeños\nKnusprige Maistostadas mit Avocado, Chipotle-Mayo und Thunfisch in Soja-Sake-Mirin-Glasur\n\nINGREDIENTS\n• 400 grams Thunfischsteak (Sushi-Qualität roh, oder TK-Steak kurz angebraten) oder Lachs\n• 2 Limetten, Saft\n• 3 tablespoons Sojasauce\n• 3 tablespoons Sake\n• 3 tablespoons Mirin\n• 1.5 tablespoons Zucker\n• 1 teaspoons Speisestärke, in 1 EL Wasser angeruehrt\n• 20 grams Butter\n• 3 Jalapeños, in dünnen Ringen\n• 4 tablespoons Mayonnaise\n• 1 Chipotles in Adobo\n• 1 tablespoons Adobo-Sauce aus der Dose\n• 8 Maistortillas (für Tostadas)\n• 2 tablespoons Öl zum Bestreichen\n• 1 Avocado, in Scheiben\n• 1 tablespoons heller Sesam\n\nSTEPS\n1. Tostadas backen: 8 Maistortillas (für Tostadas) dünn mit 2 tablespoons Öl zum Bestreichen bestreichen und auf einem Blech bei 200 °C 8–10 Minuten knusprig backen. Alternativ in heißem Öl frittieren.\n2. Soja-Glasur: 3 tablespoons Sojasauce, 3 tablespoons Sake, 3 tablespoons Mirin und 1.5 tablespoons Zucker in einem kleinen Topf 3 Minuten bei mittlerer Hitze köcheln lassen. 1 teaspoons Speisestärke, in 1 EL Wasser angeruehrt einrühren, bis die Glasur andickt. Abkühlen lassen.\n3. Butter-Jalapeños: 20 grams Butter in einer kleinen Pfanne schmelzen und 3 Jalapeños, in dünnen Ringen darin bei kleiner Hitze 5 Minuten weich dünsten.\n4. Chipotle-Mayo: 1 Chipotles in Adobo mit 1 tablespoons Adobo-Sauce aus der Dose und 1 TL Wasser glatt pürieren und unter 4 tablespoons Mayonnaise rühren.\n5. Thunfisch: Thunfisch in Sushi-Qualität quer zur Faser in dünne Scheiben schneiden. Ein normales TK-Steak vorher in einer sehr heißen Pfanne je Seite 30–60 Sekunden anbraten, dann aufschneiden. Die Scheiben kurz in 2 Limetten, Saft wenden.\n6. Anrichten: Je Tostada ½ TL Chipotle-Mayo verstreichen und mit 1 Avocado, in Scheiben belegen. Thunfischscheiben durch die Glasur ziehen und darauflegen. Mit Butter-Jalapeños und 1 tablespoons heller Sesam toppen und mit Limettensaft beträufeln.\n\nNOTES\nRohen Fisch nur in ausgewiesener Sushi- oder Sashimi-Qualität und am Tag des Kaufs verwenden. Übrige Glasur passt zu Lachs, Tofu oder Reisbowls."],["","Blumenkohl al Pastor mit Ananas & pinken Zwiebeln\nGerösteter Blumenkohl in Joghurt-Achiote-Marinade mit Chipotle-Crema, gerösteter Ananas und pinken Zwiebeln – vegetarisch\n\nINGREDIENTS\n• 1 Blumenkohl (Kopf)\n• 100 grams Naturjoghurt\n• 2 Knoblauchzehen\n• 2 tablespoons Achiote-Paste (oder 1 EL Paprika edelsüß + 1 TL geräuchert + Saft ½ Orange)\n• 1 Zwiebel, grob gehackt\n• 1 tablespoons Apfelessig\n• 1 teaspoons Kreuzkümmelsamen\n• 3 Pimentkörner (oder ½ TL gemahlen)\n• 2 teaspoons Salz\n• 1 teaspoons schwarzer Pfeffer, grob\n• 200 grams Crema oder saure Sahne\n• 2 Chipotles in Adobo\n• 1 getrocknete Habanero, 30 Min. eingeweicht (optional, sehr scharf)\n• 1 teaspoons mexikanischer Oregano\n• 1 rote Zwiebel, sehr dünn geschnitten\n• 2 Limetten, Saft (für die Zwiebeln)\n• 0.5 Ananas (halbe), in Stiften\n• 4 Radieschen, halbiert\n• 8 Maistortillas\n• 0.5 teaspoons Chiliöl (optional)\n\nSTEPS\n1. Marinade: 100 grams Naturjoghurt bis 1 teaspoons schwarzer Pfeffer, grob glatt pürieren.\n2. Blumenkohl marinieren: 1 Blumenkohl (Kopf) von oben nach unten in ca. 2 cm dicke Scheiben schneiden, dabei den Strunk dran lassen, damit sie zusammenhalten. Ränder und Röschen mitverwenden. Rundum mit der Marinade bestreichen und 30 Minuten bis 4 Stunden ziehen lassen.\n3. Pinke Zwiebeln: 1 rote Zwiebel, sehr dünn geschnitten 10 Minuten in Eiswasser legen, abtropfen lassen und mit 2 Limetten, Saft (für die Zwiebeln) und einer Prise Salz mischen. Mindestens 30 Minuten ziehen lassen, bis sie pink sind.\n4. Rösten: Den Blumenkohl auf einem Blech bei 220 °C 30–35 Minuten rösten, bis die Ränder dunkel und das Innere weich ist. Einmal wenden. Halbierte Köpfe wie im Original brauchen 60–90 Minuten.\n5. Crema & Ananas: 200 grams Crema oder saure Sahne, 2 Chipotles in Adobo, 1 getrocknete Habanero, 30 Min. eingeweicht (optional, sehr scharf), 1 teaspoons mexikanischer Oregano und eine Prise Salz glatt pürieren. 0.5 Ananas (halbe), in Stiften in einer trockenen Pfanne rundum schwarz-fleckig rösten.\n6. Tacos: Den Blumenkohl in 4 cm Stücke schneiden. Die Tortillas erwärmen und mit Blumenkohl, Crema, ein paar Tropfen 0.5 teaspoons Chiliöl (optional), pinken Zwiebeln, 4 Radieschen, halbiert und Ananas belegen.\n\nNOTES\nGute Veggie-Alternative zu den Tacos al Pastor. Für eine vegane Version den Joghurt durch Sojajoghurt und die Crema durch eine Cashewcreme ersetzen."],["","Tomatillo-Salsa\nFrische grüne Salsa aus Tomatillos, Jalapeño und Avocado – passt zu Steak-Tacos, Huevos Rancheros und allem Gegrillten\n\nINGREDIENTS\n• 500 grams Tomatillos (frisch geschält und halbiert, oder aus der Dose abgetropft)\n• 1 Jalapeño, grob gehackt\n• 1 Knoblauchzehe\n• 0.5 Schalotte (halbe)\n• 0.3 Avocado (Viertel)\n• 1 tablespoons Koriander, gehackt\n• 0.5 Limette, Saft (halbe)\n• 0.3 teaspoons Salz\n\nSTEPS\n1. Optional rösten: Für mehr Rauch 500 grams Tomatillos (frisch geschält und halbiert, oder aus der Dose abgetropft) in einer trockenen Pfanne schwarz-fleckig rösten.\n2. Mixen: 500 grams Tomatillos (frisch geschält und halbiert, oder aus der Dose abgetropft), 1 Jalapeño, grob gehackt, 1 Knoblauchzehe und 0.5 Schalotte (halbe) glatt pürieren.\n3. Avocado: 0.3 Avocado (Viertel) zugeben und kurz mitmixen. Ist die Salsa zu dick, einen Schluck Wasser zugeben.\n4. Abschmecken: 1 tablespoons Koriander, gehackt, 0.5 Limette, Saft (halbe) und 0.3 teaspoons Salz unterrühren.\n\nNOTES\nMit der Avocado bleibt die Salsa 1–2 Tage frisch. Für länger haltbare Salsa die Avocado weglassen und erst beim Servieren unterrühren."],["","Porter-Short-Rib-Tacos mit Frühlingszwiebel-Crema\nRinderrippe in süß-scharfer Bier-Soja-Glasur, gezupft in Tortillas mit gerösteter Frühlingszwiebel-Crema\n\nINGREDIENTS\n• 1.8 kilograms Short Ribs / Querrippe (oder 1,2 kg Rinderbacke/-schulter)\n• 1 tablespoons Salz\n• 2 tablespoons Öl\n• 1 Zwiebel, fein gewürfelt\n• 1 Lauch, grob geschnitten\n• 6 Knoblauchzehen, gehackt\n• 70 milliliters Sojasauce\n• 70 milliliters Ketchup\n• 80 grams brauner Zucker\n• 3 Sternanis\n• 3 Morita-Chilis (= Chipotle)\n• 2 Chiles de Árbol, zerbröselt (nach Schärfewunsch)\n• 5 grams getrocknete Steinpilze (optional)\n• 440 milliliters Porter oder anderes dunkles Bier\n• 2 Frühlingszwiebeln (Bund)\n• 200 grams saure Sahne oder Crema\n• 8 Maistortillas\n• 4 tablespoons Koriander, gehackt\n• 2 Limetten, geviertelt\n• 4 tablespoons Pico de Gallo (siehe unten)\n\nSTEPS\n1. Salzen: 1.8 kilograms Short Ribs / Querrippe (oder 1,2 kg Rinderbacke/-schulter) mit 1 tablespoons Salz einreiben und mindestens 30 Minuten, gern bis 2 Stunden, liegen lassen.\n2. Anbraten: Die Rippen in der Hälfte von 2 tablespoons Öl rundum kräftig dunkelbraun anbraten. Nicht abkürzen, hier entsteht der Geschmack. Herausnehmen.\n3. Sauce ansetzen: Im restlichen Öl 1 Zwiebel, fein gewürfelt und 1 Lauch, grob geschnitten 5 Minuten anschwitzen, 6 Knoblauchzehen, gehackt 2 Minuten mitbraten. 70 milliliters Sojasauce, 70 milliliters Ketchup, 80 grams brauner Zucker, 3 Sternanis, 3 Morita-Chilis (= Chipotle), 2 Chiles de Árbol, zerbröselt (nach Schärfewunsch), 5 grams getrocknete Steinpilze (optional) und 440 milliliters Porter oder anderes dunkles Bier zugeben und 15 Minuten offen köcheln lassen.\n4. Schmoren: Die Rippen in die Sauce legen und bei Bedarf Wasser zugießen, bis sie fast bedeckt sind. Zugedeckt bei 160 °C 3–3,5 Stunden im Ofen schmoren, bis sich das Fleisch mit einem Löffel vom Knochen lösen lässt. Im Schnellkochtopf: 50–60 Minuten hohe Stufe, natürlich abdampfen lassen.\n5. Glasur einkochen: Die Rippen herausnehmen. Die Sauce offen ca. 20 Minuten einkochen, bis sie einen Löffel dick überzieht. Sternanis entfernen.\n6. Frühlingszwiebel-Crema: 2 Frühlingszwiebeln (Bund) in einer sehr heißen, leicht geölten Pfanne rundum schwärzen lassen. Mit 200 grams saure Sahne oder Crema und einer Prise Salz pürieren.\n7. Glasieren: Die Rippen in einer Pfanne bei mittlerer Hitze mit der Glasur bepinseln und je Seite 3–5 Minuten karamellisieren lassen.\n8. Tacos: 8 Maistortillas in der trockenen Pfanne erwärmen, dünn mit Crema bestreichen und das gezupfte Fleisch darauf verteilen. Mit 4 tablespoons Koriander, gehackt bestreuen und mit 2 Limetten, geviertelt und 4 tablespoons Pico de Gallo (siehe unten) servieren.\n\nNOTES\nAm Vortag schmoren lohnt sich: Abgekühlt lässt sich das Fett abnehmen, und das Fleisch hält zum Glasieren besser zusammen. Die Steinpilze geben Umami, sind aber kein Muss."],["","Steak-Tacos mit Tomaten & gerösteten Frühlingszwiebeln\nIn Knoblauchbutter gebratenes Steak auf süßen Tomaten mit roter Zwiebel, grüner Salsa und gerösteten Frühlingszwiebeln\n\nINGREDIENTS\n• 2 Steaks (Entrecôte, Rib-Eye oder Rumpsteak, ca. 3 cm dick)\n• 3 tablespoons Butter\n• 4 Knoblauchzehen, angedrückt\n• 1 Thymianzweig\n• 1 teaspoons grobes Salz und Pfeffer\n• 100 milliliters Rotwein (optional)\n• 4 große, süße Tomaten\n• 2 tablespoons Olivenöl\n• 1 rote Zwiebel, in Ringen (in kaltem Wasser eingelegt)\n• 1 Frühlingszwiebeln (Bund)\n• 5 tablespoons grüne Salsa (Tomatillo-Salsa, siehe unten)\n• 1 tablespoons Chiliöl oder Olivenöl mit Chiliflocken\n• 3 tablespoons Koriander, gehackt\n• 1 teaspoons Chilipulver\n• 10 Maistortillas\n\nSTEPS\n1. Vorbereiten: 2 Steaks (Entrecôte, Rib-Eye oder Rumpsteak, ca. 3 cm dick) 1 Stunde vorher aus dem Kühlschrank nehmen und vor dem Braten gut trocken tupfen.\n2. Scharf anbraten: Eine schwere Pfanne mindestens 5 Minuten sehr stark erhitzen. Die Steaks 3–4 Minuten braten, dabei etwas bewegen, dann wenden.\n3. Arrosieren: 1 EL von 3 tablespoons Butter, 4 Knoblauchzehen, angedrückt und 1 Thymianzweig zugeben und die Steaks mit der schäumenden Butter übergießen. Mit 1 teaspoons grobes Salz und Pfeffer würzen und 3–4 Minuten weiterbraten, für medium rare. Auf einen warmen Teller legen, mit der restlichen Butter belegen und 5 Minuten ruhen lassen.\n4. Pfannensauce & Zwiebeln: Optional 100 milliliters Rotwein (optional) in die Pfanne gießen und 3 Minuten einkochen. Danach 1 Frühlingszwiebeln (Bund) im Bratfett rundum schwärzen lassen.\n5. Anrichten: 4 große, süße Tomaten in 1-cm-Scheiben auf einer Platte auslegen, mit 2 tablespoons Olivenöl, Salz und Pfeffer beträufeln und mit der abgetropften 1 rote Zwiebel, in Ringen (in kaltem Wasser eingelegt) belegen. Das Steak schräg quer zur Faser aufschneiden und darauflegen. Mit 1 tablespoons Chiliöl oder Olivenöl mit Chiliflocken, 2 EL von 5 tablespoons grüne Salsa (Tomatillo-Salsa, siehe unten), 3 tablespoons Koriander, gehackt, 1 teaspoons Chilipulver und etwas Pfannensauce toppen. Frühlingszwiebeln danebenlegen.\n6. Servieren: 10 Maistortillas erwärmen. Jeder belegt sich selbst mit Steak, Tomate und Zwiebeln und nimmt sich von der restlichen Salsa.\n\nNOTES\nTeurer ist hier nicht besser: Ein Rumpsteak vom Metzger funktioniert genauso. Für mehr Schärfe passt eine Habanero-Sauce oder die Breddos Hot Sauce (siehe unten) dazu."],["","Buttermilch-Fried-Chicken-Tacos mit Pico & scharfer Aioli\nKnusprig frittiertes Hähnchen in Buttermilch-Panko-Panade mit Pico de Gallo und scharfer Knoblauch-Mayo\n\nINGREDIENTS\n• 250 milliliters Buttermilch\n• 1 tablespoons Salz (Buttermilch)\n• 8 Hähnchenoberschenkel ohne Knochen, längs halbiert\n• 200 grams Mehl\n• 200 grams Panko\n• 1 tablespoons geräuchertes Paprikapulver\n• 1 teaspoons Cayennepfeffer\n• 1 teaspoons gemahlener Piment\n• 1 teaspoons Knoblauch- und Zwiebelpulver (je)\n• 1 teaspoons Senfpulver (oder 1 TL Senf in die Buttermilch)\n• 1 teaspoons Backpulver\n• 750 milliliters Rapsöl zum Frittieren\n• 6 tablespoons Mayonnaise\n• 1 Knoblauchzehe, gerieben\n• 0.5 frische Habanero (fein) oder 1–2 EL Sriracha\n• 16 Maistortillas\n• 6 tablespoons Pico de Gallo\n\nSTEPS\n1. Einlegen: 250 milliliters Buttermilch mit 1 tablespoons Salz (Buttermilch) verrühren, 8 Hähnchenoberschenkel ohne Knochen, längs halbiert hineinlegen und mindestens 2 Stunden, gern bis 24 Stunden, im Kühlschrank ziehen lassen.\n2. Würzmehl: 200 grams Mehl, 200 grams Panko, 1 tablespoons geräuchertes Paprikapulver, 1 teaspoons Cayennepfeffer, 1 teaspoons gemahlener Piment, 1 teaspoons Knoblauch- und Zwiebelpulver (je), 1 teaspoons Senfpulver (oder 1 TL Senf in die Buttermilch) und 1 teaspoons Backpulver in einer großen Schüssel mischen.\n3. Panieren: Das Hähnchen aus der Buttermilch nehmen, kurz abtropfen lassen und kräftig in die Mehlmischung drücken, damit viel daran haftet. 10 Minuten auf einem Gitter ruhen lassen.\n4. Scharfe Aioli: 6 tablespoons Mayonnaise, 1 Knoblauchzehe, gerieben und 0.5 frische Habanero (fein) oder 1–2 EL Sriracha verrühren. Mit etwas Limettensaft und Salz abschmecken.\n5. Frittieren: 750 milliliters Rapsöl zum Frittieren in einem tiefen Topf auf 180 °C erhitzen. Das Hähnchen portionsweise 4–5 Minuten goldbraun frittieren, bis es innen 75 °C erreicht. Auf einem Gitter abtropfen lassen.\n6. Tacos: Die Tortillas erwärmen, mit Aioli bestreichen, Hähnchen daraufsetzen und mit 6 tablespoons Pico de Gallo und noch etwas Aioli toppen.\n\nNOTES\nOhne Frittieren: Die panierten Stücke mit Öl besprühen und im Airfryer bei 200 °C ca. 15 Minuten garen, oder im Ofen bei 220 °C 25 Minuten auf einem Gitter, einmal wenden. Das Original hat dreimal so viel Cayenne."],["","Smoky Steak Marinade\nRauchig-scharfe Zitrus-Bier-Marinade mit Chipotles für Steak (Carne Asada) – ergibt ca. 300 ml\n\nINGREDIENTS\n• 1 Knoblauchknolle, Zehen geschält\n• 0.3 Zwiebel (Viertel)\n• 4 Frühlingszwiebeln, grob gehackt\n• 2 tablespoons Chipotlepulver oder geräuchertes Paprikapulver\n• 3 Chipotles in Adobo\n• 2 Jalapeños\n• 0.5 Koriander (halber Bund)\n• 180 milliliters Bier\n• 1 Orange (Saft und Abrieb)\n• 1 Grapefruit (Saft und Abrieb, optional)\n• 3 Limetten (Saft und Abrieb)\n• 1 tablespoons Meersalz\n• 1 tablespoons schwarzer Pfeffer, frisch gemahlen\n• 1 tablespoons Zucker\n• 2 tablespoons Raps- oder Erdnussöl\n\nSTEPS\n1. Pürieren: Alle Zutaten im Mixer zu einer Paste pürieren.\n2. Verwenden: Reicht für ca. 1 kg Steak. Fleisch rundum einreiben und mindestens 1 Stunde bis 2 Tage im Kühlschrank marinieren.\n\nNOTES\nDie Menge reicht großzügig. Für 500 g Steak genügt die Hälfte, der Rest lässt sich einfrieren. Funktioniert auch mit Hähnchen oder Pilzen, dort reichen 30 Minuten."],["","Chipotle-Cashew-Salsa\nGrobe, rauchig-scharfe Nuss-Salsa mit gerösteten Cashews und Chipotles in Adobo – ergibt ca. 300 g\n\nINGREDIENTS\n• 200 grams gesalzene Cashewkerne\n• 4 tablespoons Chipotles in Adobo, samt Sauce\n• 4 tablespoons Wasser\n• 1 Limette, Saft\n\nSTEPS\n1. Rösten: 200 grams gesalzene Cashewkerne in einer trockenen Pfanne ca. 2 Minuten rösten, bis sie duften.\n2. Mixen: Alle Zutaten im Mixer kurz pulsieren, bis eine grobe Salsa mit der Konsistenz von körnigem Senf entsteht. Nicht zu fein pürieren.\n\nNOTES\nHält sich in einem luftdichten Glas bis zu 2 Wochen im Kühlschrank. Passt zu Steak, Grillgemüse, auf Brot oder als Dip."],["","Mango-Limetten-Habanero-Salsa\nFruchtig-scharfe Salsa mit Mango, Habanero, Koriander und Minze – ergibt ca. 200 g\n\nINGREDIENTS\n• 1 Mango, in kleinen Würfeln\n• 2 Limetten, Saft\n• 1 Habanero, fein gehackt (nach Geschmack)\n• 1 Koriander, gehackt (Handvoll)\n• 1 Minze, gehackt (Handvoll)\n• 1 pinch Meersalz\n• 1 pinch Zucker\n• 1 teaspoons Olivenöl\n\nSTEPS\n1. Mischen: Alle Zutaten vermengen und bis zum Servieren kalt stellen.\n\nNOTES\nMit einer halben, entkernten Habanero bleibt die Salsa angenehm. Passt zu Hähnchen, Fisch und Schwein."],["","X ni Pek (pinke Zitrus-Zwiebeln)\nMaya-Salsa aus roten Zwiebeln, die in Zitrussaft knallpink „garen“ – ergibt ca. 400 g\n\nINGREDIENTS\n• 3 rote Zwiebeln, hauchdünn geschnitten\n• 5 tablespoons frisch gepresster Orangensaft\n• 1 tablespoons Grapefruitsaft (optional)\n• 4 Limetten, Saft\n• 0.5 Habanero, entkernt und sehr fein gehackt (halbe)\n\nSTEPS\n1. Wässern: 3 rote Zwiebeln, hauchdünn geschnitten 10 Minuten in eiskaltem Wasser einweichen, dann gut abtropfen lassen.\n2. Marinieren: Die Zwiebeln mit 5 tablespoons frisch gepresster Orangensaft, 1 tablespoons Grapefruitsaft (optional), 4 Limetten, Saft und 0.5 Habanero, entkernt und sehr fein gehackt (halbe) mischen und ca. 1 Stunde ziehen lassen, bis sie leuchtend pink sind.\n\nNOTES\nDiese Zwiebeln sind auch der Ersatz für die pinken eingelegten Zwiebeln im Blumenkohl-Rezept. Sie schneiden durch fettiges Fleisch wie Cochinita Pibil oder Birria. Eine Prise Salz schadet nicht."],["","Crema (selbstgemacht)\nMexikanische Sauerrahm-Crème-fraîche-Mischung aus Sahne und Buttermilch – ergibt 250 ml\n\nINGREDIENTS\n• 200 milliliters Sahne (Bio, ohne Zusätze)\n• 1.5 tablespoons Buttermilch (Bio)\n\nSTEPS\n1. Erwärmen: 200 milliliters Sahne (Bio, ohne Zusätze) in einem Topf auf ca. 35 °C erwärmen, also lauwarm, und in ein Glas füllen.\n2. Ansetzen: 1.5 tablespoons Buttermilch (Bio) einrühren, den Deckel nur locker auflegen und das Glas 24 Stunden an einem warmen Ort stehen lassen.\n3. Kühlen: Den Deckel fest verschließen und die Crema im Kühlschrank aufbewahren. Sie dickt dort noch nach.\n\nNOTES\nAbkürzung für den Alltag: Crème fraîche mit einem Schuss Milch, etwas Limettensaft und einer Prise Salz glatt rühren. Hält sich etwa eine Woche."],["","Geröstete Frühlingszwiebel-Crema\nRauchige Crema aus schwarz gerösteten Frühlingszwiebeln – passt zu Short Ribs und Pilz-Tacos, ergibt 250 ml\n\nINGREDIENTS\n• 2 Frühlingszwiebeln (Bund)\n• 200 milliliters Crema oder saure Sahne\n• 1 teaspoons Rapsöl\n• 1 pinch Salz\n\nSTEPS\n1. Putzen: 2 Frühlingszwiebeln (Bund) waschen, Wurzeln und Spitzen abschneiden.\n2. Schwärzen: Eine Grillpfanne oder den Grill stark erhitzen und dünn mit 1 teaspoons Rapsöl einreiben. Die Frühlingszwiebeln bei mittlerer bis hoher Hitze liegen lassen, bis sie schön schwarz sind, dabei ab und zu wenden.\n3. Mixen: Die Zwiebeln mit 200 milliliters Crema oder saure Sahne und 1 pinch Salz pürieren.\n\nNOTES\nGanze geröstete Frühlingszwiebeln (ohne Crema) sind die „burnt spring onions“ als Beilage zu den Steak-Tacos."],["","Aioli\nKlassische Knoblauch-Aioli aus Eigelb und Öl – Basis für Habanero-Aioli und Chipotle-Mayo, ergibt ca. 250 g\n\nINGREDIENTS\n• 2 kleine Knoblauchzehen\n• 0.5 teaspoons Meersalz und schwarzer Pfeffer\n• 2 große Eigelb (Freiland)\n• 0.5 teaspoons Dijon-Senf\n• 1 teaspoons Weißweinessig (oder Limettensaft für Limetten-Aioli)\n• 250 milliliters Sonnenblumen- oder Rapsöl\n\nSTEPS\n1. Basis: 2 kleine Knoblauchzehen mit einer Prise Salz zu einer Paste zerdrücken. In einer Schüssel gründlich mit 2 große Eigelb (Freiland), 0.5 teaspoons Dijon-Senf, 1 teaspoons Weißweinessig (oder Limettensaft für Limetten-Aioli) und etwas Pfeffer verrühren.\n2. Aufschlagen: 250 milliliters Sonnenblumen- oder Rapsöl in einem langsamen, dünnen Strahl unter ständigem Schlagen einlaufen lassen, bis eine dicke, glänzende Aioli entsteht, die ihre Form hält.\n3. Abschmecken: Mit Salz, Pfeffer, Senf und Essig oder Limette abschmecken. Ist sie zu dick, 1–2 EL warmes Wasser einrühren.\n\nNOTES\nMit dem Stabmixer im hohen Becher geht es schneller und gelingt sicherer. Abkürzung: 250 g gekaufte Mayonnaise mit 1 geriebenen Knoblauchzehe. Mit rohem Eigelb im Kühlschrank aufbewahren und in 2–3 Tagen verbrauchen."],["","Habanero-Aioli\nSehr scharfe Aioli mit getrockneten Habaneros und mexikanischem Oregano – ergibt ca. 400 g\n\nINGREDIENTS\n• 5 getrocknete Habaneros, in heißem Wasser eingeweicht (Alltag: 1–2)\n• 1 teaspoons mexikanischer Oregano\n• 250 grams Aioli (Rezept oben) oder Mayonnaise\n\nSTEPS\n1. Paste: Die eingeweichten 5 getrocknete Habaneros, in heißem Wasser eingeweicht (Alltag: 1–2) mit 1 teaspoons mexikanischer Oregano im Mixer zu einer glatten Paste pürieren.\n2. Vereinen: 250 grams Aioli (Rezept oben) oder Mayonnaise zugeben und kurz mitmixen, bis alles verbunden ist.\n\nNOTES\nMit 5 Habaneros wie im Original wird sie extrem scharf. Für den Alltag reichen 1–2, oder 2–3 eingeweichte Árbol. Ohne getrocknete Habaneros geht auch eine halbe frische."],["","Chipotle-Mayonnaise\nRauchig-scharfe Mayo mit Chipotles in Adobo – für Tostadas, Fischtacos und Burger, ergibt ca. 275 g\n\nINGREDIENTS\n• 2 Chipotles in Adobo\n• 2 tablespoons Adobo-Sauce aus der Dose\n• 1 tablespoons Wasser\n• 250 grams Aioli ohne Knoblauch (Rezept oben) oder Mayonnaise\n\nSTEPS\n1. Paste: 2 Chipotles in Adobo mit 2 tablespoons Adobo-Sauce aus der Dose und 1 tablespoons Wasser glatt pürieren.\n2. Vereinen: 250 grams Aioli ohne Knoblauch (Rezept oben) oder Mayonnaise zugeben und auf hoher Stufe kurz durchmixen, bis alles verbunden ist.\n\nNOTES\nMit gekaufter Mayo in 2 Minuten fertig. Hält sich mit fertiger Mayo etwa eine Woche im Kühlschrank."],["","Avocado-Mojo\nCremige, knoblauchige Avocadosauce auf Guacamole-Basis mit Jalapeño, Oregano und Limette – ergibt ca. 300 ml\n\nINGREDIENTS\n• 400 grams Guacamole (Rezept oben)\n• 3 Knoblauchzehen, fein gehackt\n• 1 tablespoons Knoblauchöl oder Olivenöl\n• 1 Jalapeño\n• 1 teaspoons mexikanischer Oregano\n• 1 Limette, Saft\n• 1 Koriander (Handvoll)\n• 1 teaspoons Chiliflocken\n• 0.5 teaspoons Salz und Pfeffer\n\nSTEPS\n1. Pürieren: Alle Zutaten in den Mixer geben und pulsieren. Zwischendurch die Seiten abstreifen.\n2. Konsistenz: Ist die Mojo zu dick, schluckweise Wasser zugeben, bis sie sich träufeln lässt.\n\nNOTES\nDas Knoblauchöl aus dem Buch (S. 119) war nicht dabei. Normales Olivenöl funktioniert genauso. Passt zu Fisch, Hähnchen, Bowls und als Dip."],["","Eingelegte Habaneros\nScharf-süßsaure Habanero-Ringe mit Senfsaat in Apfelessig – ergibt ca. 100 g\n\nINGREDIENTS\n• 200 milliliters Apfelessig\n• 2 tablespoons Zucker\n• 1.5 teaspoons Flockensalz\n• 100 grams Habaneros (oder Jalapeños)\n• 1 tablespoons Senfsaat\n\nSTEPS\n1. Sud: 200 milliliters Apfelessig aufkochen und 2 tablespoons Zucker und 1.5 teaspoons Flockensalz darin auflösen.\n2. Chilis: Inzwischen 100 grams Habaneros (oder Jalapeños) in Ringe schneiden, dabei Handschuhe tragen. Wer will, entfernt die Kerne, sie bleiben trotzdem sehr scharf.\n3. Einlegen: Chilis und 1 tablespoons Senfsaat in ein sauberes Glas geben, den heißen Sud darübergießen und verschließen. Vor dem Essen ein paar Tage ziehen lassen.\n\nNOTES\nMit Jalapeños wird daraus eine alltagstaugliche Version. Hält sich im Kühlschrank mehrere Wochen."],["","Fermentierte Chilipaste\nSalzige, leicht fermentierte Paste aus frischen roten Chilis und Knoblauch – ergibt ca. 100 g\n\nINGREDIENTS\n• 15 lange rote Chilis\n• 5 Bird's-Eye-Chilis\n• 2 tablespoons Meersalz\n• 5 Knoblauchzehen\n• 1 tablespoons Apfelessig\n\nSTEPS\n1. Mixen: Alle Zutaten im Mixer pulsieren, bis eine grobe Paste entsteht.\n2. Fermentieren: In ein sterilisiertes Glas füllen, verschließen und eine Woche bei Raumtemperatur stehen lassen. Täglich einmal umrühren. Danach ist sie leicht fermentiert und fertig.\n\nNOTES\nDanach im Kühlschrank aufbewahren. Zum Würzen von Saucen, Marinaden, Eiern oder Nudeln. Wenn sich Schimmel bildet, wegwerfen."],["","Cascabel-Chilisalz\nNussig-rauchiges Würzsalz aus gerösteten Cascabel-Chilis – ergibt ca. 50 g\n\nINGREDIENTS\n• 6 getrocknete Cascabel-Chilis\n• 3 tablespoons Meersalz\n• 1 teaspoons geräuchertes Paprikapulver\n\nSTEPS\n1. Rösten: 6 getrocknete Cascabel-Chilis in einer Pfanne bei mittlerer Hitze ein paar Minuten rösten. Nicht verbrennen lassen.\n2. Mahlen: Abkühlen lassen, Stiele entfernen und in der Gewürzmühle oder im Mörser fein mahlen. Mit 3 tablespoons Meersalz und 1 teaspoons geräuchertes Paprikapulver mischen.\n\nNOTES\nToll auf Esquites, Eiern, Avocado, Pommes und Wassermelone. Hält sich trocken gelagert monatelang."],["","Pumpkin Spice Sirup\nWürziger Kürbissirup mit Zimt, Ingwer, Muskat und Nelke – für Latte, Chai, Porridge oder Pancakes, ergibt ca. 350 ml\n\nINGREDIENTS\n• 250 milliliters Wasser\n• 200 grams brauner Zucker (oder halb weiß, halb braun)\n• 100 grams Kürbispüree (Hokkaido gegart und püriert, oder aus der Dose)\n• 2 Zimtstangen\n• 1 teaspoons gemahlener Ingwer\n• 0.3 teaspoons Muskatnuss, frisch gerieben\n• 3 Gewürznelken\n• 0.3 teaspoons Piment, gemahlen\n• 1 teaspoons Vanilleextrakt\n• 1 pinch Salz\n\nSTEPS\n1. Aufkochen: 250 milliliters Wasser und 200 grams brauner Zucker (oder halb weiß, halb braun) in einem kleinen Topf erhitzen und rühren, bis sich der Zucker gelöst hat.\n2. Kürbis & Gewürze: 100 grams Kürbispüree (Hokkaido gegart und püriert, oder aus der Dose), 2 Zimtstangen, 1 teaspoons gemahlener Ingwer, 0.3 teaspoons Muskatnuss, frisch gerieben, 3 Gewürznelken, 0.3 teaspoons Piment, gemahlen und 1 pinch Salz einrühren.\n3. Köcheln: Bei kleiner Hitze 10–15 Minuten sanft köcheln lassen, gelegentlich umrühren, bis der Sirup leicht eindickt. Nicht stark kochen, sonst wird er zu dick.\n4. Ziehen lassen: Vom Herd nehmen, 1 teaspoons Vanilleextrakt einrühren und 15 Minuten ziehen lassen.\n5. Absieben: Zimtstangen und Nelken entfernen und den Sirup durch ein feines Sieb oder ein Tuch in eine saubere Flasche gießen. Er dickt beim Abkühlen nach.\n\nNOTES\nFür einen Pumpkin Spice Latte 2–3 EL Sirup in einen Espresso geben und mit aufgeschäumter Milch auffüllen. Wegen des Kürbispürees im Kühlschrank aufbewahren und innerhalb von 10–14 Tagen verbrauchen. Ohne Kürbis wird daraus ein reiner Spice-Sirup, der mehrere Wochen hält."],["","Süßkartoffelpuffer mit Kimchimayonnaise (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nKleine Puffer aus gebackener Süßkartoffel, Mais und grüner Chili mit säuerlich-cremiger Kimchi-Mayo\n\nINGREDIENTS\n• 400 grams Süßkartoffeln (2 mittelgroße)\n• 1 grüne Chilischote, entkernt und sehr fein gehackt\n• 100 grams Maiskörner (TK oder Dose), abgetropft\n• 1 Koriandergrün, gehackt (Handvoll), plus mehr zum Servieren\n• 0.5 teaspoons Salz\n• 1 große Knoblauchzehe, zerdrückt\n• 3 Frühlingszwiebeln, in dünnen Ringen\n• 2 tablespoons Rapsöl zum Braten\n• 50 grams Kimchi (Alternative: Sauerkraut + 1 TL Gochujang oder Sriracha; für vegan ohne Fischsauce/Garnelen)\n• 100 grams Mayonnaise (oder vegane Mayo)\n\nSTEPS\n1. Süßkartoffeln backen: Ofen auf 200 °C vorheizen. 400 grams Süßkartoffeln (2 mittelgroße) schälen, in 3-cm-Würfel schneiden und auf einem Blech mit Backpapier 25–30 Minuten backen, bis sie ganz weich sind. Abkühlen lassen und mit der Gabel fein zerdrücken.\n2. Kimchi-Mayo: 50 grams Kimchi (Alternative: Sauerkraut + 1 TL Gochujang oder Sriracha; für vegan ohne Fischsauce/Garnelen) mit 100 grams Mayonnaise (oder vegane Mayo) im Mixer oder mit dem Stabmixer pürieren und beiseitestellen.\n3. Masse: 1 grüne Chilischote, entkernt und sehr fein gehackt, 100 grams Maiskörner (TK oder Dose), abgetropft, 1 Koriandergrün, gehackt (Handvoll), plus mehr zum Servieren, 0.5 teaspoons Salz, 1 große Knoblauchzehe, zerdrückt und 3 Frühlingszwiebeln, in dünnen Ringen mit den Händen unter die Süßkartoffel mischen. In 8 gleiche Stücke teilen und zu ca. 1 cm dicken Küchlein flach drücken.\n4. Braten: 1 TL 2 tablespoons Rapsöl zum Braten in einer beschichteten Pfanne erhitzen. Die Puffer portionsweise insgesamt 5 Minuten braten, nach der Hälfte wenden, bis sie beidseitig goldbraun sind. Bei Bedarf Öl nachgeben. Fertige Puffer bei 100 °C im Ofen warm halten.\n5. Servieren: Mit Koriander bestreuen und mit der Kimchi-Mayo servieren.\n\nNOTES\nKimchi gibt es inzwischen in vielen Supermärkten im Kühlregal. Die Puffer sind weich, also beim Wenden vorsichtig sein."],["","Onigiri gefüllt mit Walnussmiso (siehe Asien Vegetarisch - Meera Sodha Seite 25)\nJapanische Reisbällchen mit stückiger, süß-salziger Füllung aus gerösteten Walnüssen und Miso – ergibt 8 Stück\n\nINGREDIENTS\n• 400 grams Sushireis (Alternative: Milchreis oder Risottoreis)\n• 440 milliliters kaltes Wasser (zum Kochen)\n• 2 Noriblätter (kann man weglassen)\n• 120 grams Walnusskerne\n• 1 tablespoons braunes Reismiso\n• 1 tablespoons weißes Miso (Alternative: 1 EL mehr braunes Miso)\n• 2.5 tablespoons brauner Reissirup (Alternative: Honig oder Ahornsirup)\n• 1 teaspoons Reisessig (Alternative: Weißweinessig + Prise Zucker)\n\nSTEPS\n1. Reis waschen: Ofen auf 200 °C vorheizen. 400 grams Sushireis (Alternative: Milchreis oder Risottoreis) in lauwarmem Wasser mit den Händen durchbewegen, abgießen und wiederholen, bis das Wasser klar bleibt. Dann 5 Minuten in warmem Wasser stehen lassen und abtropfen.\n2. Reis kochen: Reis mit 440 milliliters kaltes Wasser (zum Kochen) in einen Topf geben, zugedeckt bei starker Hitze aufkochen, dann sofort auf kleinste Stufe und 10 Minuten garen. Vom Herd nehmen und geschlossen weitere 10 Minuten dämpfen lassen.\n3. Walnussmiso: 120 grams Walnusskerne auf einem Blech 6 Minuten im Ofen rösten und abkühlen lassen. 1 tablespoons braunes Reismiso, 1 tablespoons weißes Miso (Alternative: 1 EL mehr braunes Miso), 2.5 tablespoons brauner Reissirup (Alternative: Honig oder Ahornsirup) und 1 teaspoons Reisessig (Alternative: Weißweinessig + Prise Zucker) im Mixer kurz verrühren, dann die Walnüsse zugeben und zu einer stückigen Paste mixen.\n4. Formen: 2 Noriblätter (kann man weglassen) jeweils längs in 4 Streifen schneiden. Mit nassen Händen ca. 100 g Reis zur Kugel formen, mit dem Daumen eine Mulde drücken, ½ EL Füllung hineingeben, verschließen und fest andrücken. Mit einem Noristreifen wie mit einem Gürtel umwickeln.\n\nNOTES\nDer Reis lässt sich am besten verarbeiten, solange er noch warm ist. Eine Schüssel Wasser für die Hände bereitstellen."],["Mamas Rote-Bete-Suppe mit Ingwer ","Mamas Rote-Bete-Suppe mit Ingwer (siehe Asien Vegetarisch - Meera Sodha Seite 31)\nWärmende, pürierte Rote-Bete-Suppe mit Ingwer, Knoblauch und grüner Chili, dazu Joghurt und Sauerteigbrot\n\nINGREDIENTS\n• 3 tablespoons Rapsöl\n• 1 große Zwiebel, gehackt\n• 1 Stück Ingwer (2 cm), gerieben – an kalten Tagen gern mehr\n• 3 Knoblauchzehen, zerdrückt\n• 1 grüne Chilischote, entkernt und fein gehackt\n• 500 grams Rote Beten, abgebürstet und roh gerieben\n• 100 grams kleine Kartoffel, geschält und gerieben\n• 750 milliliters Gemüsebrühe\n• 0.3 teaspoons Salz\n• 4 tablespoons leicht gesalzener Joghurt (oder pflanzlich), zum Servieren\n• 1 teaspoons Schwarzkümmelsamen (kann man weglassen oder durch Sesam ersetzen)\n• 4 geröstetes Sauerteigbrot, zum Servieren\n\nSTEPS\n1. Zwiebel: 3 tablespoons Rapsöl in einem großen Topf erhitzen und 1 große Zwiebel, gehackt bei mittlerer Hitze 10 Minuten unter gelegentlichem Rühren anbraten.\n2. Aromaten: 1 Stück Ingwer (2 cm), gerieben – an kalten Tagen gern mehr, 3 Knoblauchzehen, zerdrückt und 1 grüne Chilischote, entkernt und fein gehackt zugeben und 3 Minuten mitbraten.\n3. Kochen: 500 grams Rote Beten, abgebürstet und roh gerieben und 100 grams kleine Kartoffel, geschält und gerieben unterrühren, 750 milliliters Gemüsebrühe angießen und aufkochen. Dann 30 Minuten köcheln lassen.\n4. Pürieren: Etwas abkühlen lassen, pürieren und mit bis zu 0.3 teaspoons Salz abschmecken.\n5. Servieren: Mit einem Klecks 4 tablespoons leicht gesalzener Joghurt (oder pflanzlich), zum Servieren und 1 teaspoons Schwarzkümmelsamen (kann man weglassen oder durch Sesam ersetzen) garnieren und sofort mit 4 geröstetes Sauerteigbrot, zum Servieren servieren.\n\nNOTES\nBeim Reiben der Roten Bete Handschuhe tragen. Mit veganer Brühe und Pflanzenjoghurt ist die Suppe vegan."],["Spinat-Tomaten-Salat mit Panir","Spinat-Tomaten-Salat mit Panir (siehe Asien Vegetarisch - Meera Sodha Seite 53)\nWarmer Ofensalat aus gerösteten Tomaten, roten Zwiebeln, Panir und knusprigem Naan mit gewürztem Knoblauchdressing\n\nINGREDIENTS\n• 1 kilograms Rispentomaten, große halbiert oder geviertelt\n• 5 Knoblauchzehen, ungeschält\n• 4 tablespoons Rapsöl\n• 2 teaspoons Salz\n• 2 rote Zwiebeln, in 2-cm-Spalten\n• 225 grams Panir, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu)\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne)\n• 1 teaspoons Garam Masala\n• 1 tablespoons Zitronensaft\n• 1 Naan, in Spalten (Alternative: Fladenbrot oder Pita)\n• 100 grams junger Blattspinat\n\nSTEPS\n1. Ab in den Ofen: Ofen auf 220 °C vorheizen. 1 kilograms Rispentomaten, große halbiert oder geviertelt und 5 Knoblauchzehen, ungeschält in eine ofenfeste Form geben, mit 1 EL Öl und ½ TL Salz würzen. 2 rote Zwiebeln, in 2-cm-Spalten und 225 grams Panir, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu) in eine zweite Form geben, ebenfalls mit 1 EL Öl und ½ TL Salz. Beide Formen 25 Minuten rösten.\n2. Dressing: 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne) und 1 teaspoons Garam Masala mit 1 tablespoons Zitronensaft, 2 EL Öl und 1 TL Salz verrühren.\n3. Naan rösten: Die Zwiebel-Panir-Form herausnehmen, 1 Naan, in Spalten (Alternative: Fladenbrot oder Pita) darin im Öl wenden und alles weitere 8 Minuten rösten, bis das Brot knusprig ist und die Tomaten dunkle Flecken haben.\n4. Knoblauch ins Dressing: Die Knoblauchzehen herausnehmen, kurz abkühlen lassen und das weiche Innere ins Dressing drücken und verrühren.\n5. Mischen: Die Tomaten ohne den Großteil der Garflüssigkeit zu Zwiebeln, Panir und Naan geben. 100 grams junger Blattspinat und Dressing zugeben, nach Wunsch etwas Tomatensaft dazu, vermengen und abschmecken.\n\nNOTES\nPaneer bekommst du im Asialaden und inzwischen auch in größeren Supermärkten. Als Hauptgericht für 4 gedacht."],["Nudeln \"Ben Ben\"","Nudeln „Ben Ben“ (siehe Asien Vegetarisch - Meera Sodha Seite 77)\nVegetarische Dan-Dan-Variante mit knusprig gebratenen Shiitake, Sichuanpfeffer und scharf-cremiger Tahin-Chili-Sauce\n\nINGREDIENTS\n• 250 grams frische Shiitakepilze (Alternative: braune Champignons)\n• 1 teaspoons Sichuanpfefferkörner (Alternative: schwarzer Pfeffer + etwas Zitronenabrieb, oder weglassen)\n• 1 tablespoons Rapsöl\n• 40 grams Gewürzgurken, fein gehackt\n• 2 Frühlingszwiebeln, schräg in Ringen\n• 1 tablespoons Shaoxing-Reiswein (Alternative: Sake oder trockener Sherry)\n• 2 teaspoons helle Sojasauce (Pilze)\n• 200 grams Vollkornnudeln (Spaghetti oder asiatische Weizennudeln)\n• 200 grams Choi Sum oder junger Pak Choi, geviertelt (Alternative: Brokkoli)\n• 3 tablespoons Tahin\n• 3 tablespoons helle Sojasauce (Sauce)\n• 1 tablespoons Chiliöl\n• 1 tablespoons Chinkiang-Essig (Alternative: Balsamico oder Weißweinessig)\n\nSTEPS\n1. Vorbereiten: 250 grams frische Shiitakepilze (Alternative: braune Champignons) im Mixer zu erbsengroßen Stücken pulsieren, nicht zu Brei. 1 teaspoons Sichuanpfefferkörner (Alternative: schwarzer Pfeffer + etwas Zitronenabrieb, oder weglassen) in der trockenen Pfanne bei kleiner Hitze ca. 4 Minuten rösten, bis sie duften, und im Mörser zerstoßen.\n2. Pilze knusprig braten: 1 tablespoons Rapsöl in derselben Pfanne erhitzen. Die Pilze bei starker Hitze 8–10 Minuten braten und immer wieder mit dem Löffelrücken flach drücken, bis sie stark gebräunt und leicht knusprig sind.\n3. Ablöschen: 40 grams Gewürzgurken, fein gehackt, 2 Frühlingszwiebeln, schräg in Ringen und den Sichuanpfeffer 2 Minuten mitbraten. 1 tablespoons Shaoxing-Reiswein (Alternative: Sake oder trockener Sherry) und 2 teaspoons helle Sojasauce (Pilze) angießen und 2 Minuten weiterbraten, bis alles verdampft ist.\n4. Sauce: 3 tablespoons Tahin, 3 tablespoons helle Sojasauce (Sauce), 1 tablespoons Chiliöl und 1 tablespoons Chinkiang-Essig (Alternative: Balsamico oder Weißweinessig) gut verrühren. Sie verbindet sich anfangs schlecht, einfach weiterrühren.\n5. Nudeln: 200 grams Vollkornnudeln (Spaghetti oder asiatische Weizennudeln) nach Packungsangabe kochen, 200 grams Choi Sum oder junger Pak Choi, geviertelt (Alternative: Brokkoli) in den letzten 2 Minuten mitgaren. Vor dem Abgießen eine Tasse Nudelwasser abnehmen.\n6. Anrichten: Nudeln mit der Sauce mischen und löffelweise Nudelwasser zugeben, bis sie cremig sind (ca. 6 EL). Auf zwei Teller verteilen, Pilze daraufgeben und den Choi Sum dazulegen.\n\nNOTES\nLaut Buch sehr scharf. Mit weniger Chiliöl wird es milder. Ähnlich zu deinen Dan Dan Noodles, aber komplett vegetarisch."],["Weißes Miso-Ramen mit Tofu & Spargel","Weißes Miso-Ramen mit Tofu & Spargel (siehe Asien Vegetarisch - Meera Sodha Seite 83)\nSeidige Ramenbrühe aus Sojadrink und weißem Miso mit gebratenem Tofu, grünem Spargel und Edamame\n\nINGREDIENTS\n• 4 tablespoons getrocknete Shiitakepilze (Alternative: getrocknete Steinpilze)\n• 200 milliliters kochendes Wasser\n• 1 Zwiebel, gehackt\n• 4 Knoblauchzehen, grob gehackt (Brühe)\n• 1 Stück Ingwer (2 cm), grob gehackt\n• 150 grams weißes Miso (6 EL)\n• 1 tablespoons Tahin\n• 2 tablespoons Rapsöl (Brühe)\n• 3 tablespoons Sojasauce\n• 1 liters Sojadrink (gute Qualität, ungesüßt)\n• 250 grams Ramen-Nudeln (Alternative: Mie-Nudeln)\n• 2 tablespoons Rapsöl (Topping)\n• 250 grams grüner Spargel (außerhalb der Saison: Brokkoli oder Zuckerschoten)\n• 100 grams Edamame, TK, aufgetaut (Alternative: TK-Erbsen)\n• 2 Knoblauchzehen, fein gehackt (Topping)\n• 0.5 teaspoons Chiliflocken\n• 0.3 teaspoons Salz\n• 0.5 tablespoons Zitronensaft\n• 280 grams fester Tofu, abgetropft, in 2-cm-Würfeln\n• 1 tablespoons helle Sojasauce (Tofu)\n\nSTEPS\n1. Pilze einweichen: 4 tablespoons getrocknete Shiitakepilze (Alternative: getrocknete Steinpilze) mit 200 milliliters kochendes Wasser übergießen und 5 Minuten einweichen.\n2. Paste: Pilze samt Wasser mit 1 Zwiebel, gehackt, 4 Knoblauchzehen, grob gehackt (Brühe), 1 Stück Ingwer (2 cm), grob gehackt, 150 grams weißes Miso (6 EL), 1 tablespoons Tahin, 2 tablespoons Rapsöl (Brühe) und 3 tablespoons Sojasauce im Mixer pürieren.\n3. Brühe: Die Paste in einer beschichteten Pfanne oder einem Topf bei mittlerer Hitze unter häufigem Rühren 10 Minuten erhitzen. 1 liters Sojadrink (gute Qualität, ungesüßt) nach und nach unterrühren. Nicht kochen, nur leicht köcheln. Bei Bedarf salzen und vom Herd nehmen.\n4. Nudeln: 250 grams Ramen-Nudeln (Alternative: Mie-Nudeln) nach Packungsangabe kochen, kalt abschrecken und abtropfen lassen.\n5. Gemüse: 1 EL 2 tablespoons Rapsöl (Topping) rauchend heiß werden lassen. 250 grams grüner Spargel (außerhalb der Saison: Brokkoli oder Zuckerschoten) und 100 grams Edamame, TK, aufgetaut (Alternative: TK-Erbsen) je Seite 1 Minute anbraten, dann 2 Knoblauchzehen, fein gehackt (Topping), 0.5 teaspoons Chiliflocken, 0.3 teaspoons Salz und 0.5 tablespoons Zitronensaft zugeben, 1 Minute weiterbraten und in eine Schüssel geben.\n6. Tofu: Restliches Öl in derselben Pfanne erhitzen und 280 grams fester Tofu, abgetropft, in 2-cm-Würfeln je Seite ca. 1 Minute goldbraun braten. Mit 1 tablespoons helle Sojasauce (Tofu) ablöschen, wenden und zum Gemüse geben.\n7. Anrichten: Nudeln auf vier Schalen verteilen, mit der heißen Misobrühe übergießen und Spargel, Edamame und Tofu darauf verteilen.\n\nNOTES\nDie Brühe darf nicht kochen, sonst flockt der Sojadrink aus. Weißes Miso habt ihr im Vorrat."],["Shiitake-Pho mit knusprigem Lauch","Shiitake-Pho mit knusprigem Lauch (siehe Asien Vegetarisch - Meera Sodha Seite 87)\nWürzige Pilzbrühe mit Zimt, Sternanis und Nelke über Reisnudeln, getoppt mit frittiertem Lauch und Koriander\n\nINGREDIENTS\n• 4 tablespoons Rapsöl, plus mehr zum Frittieren\n• 4 Schalotten, in dünnen Ringen\n• 1 Stück Ingwer (5 cm), gerieben\n• 1 Sternanis\n• 3 Gewürznelken\n• 1 Zimtstange\n• 2 Lauchstangen (1 in feinen Ringen, 1 in langen Streifen)\n• 2 Bird's-Eye-Chilis, entkernt, sehr fein gehackt (Alternative: jede scharfe frische Chili)\n• 375 grams frische Shiitakepilze, in dünnen Scheiben (Alternative: braune Champignons + 1 Handvoll getrocknete Shiitake)\n• 1 tablespoons helle Sojasauce\n• 6 Frühlingszwiebeln, in dünnen Ringen\n• 2 liters Gemüsebrühe\n• 0.5 teaspoons Salz\n• 200 grams breite Reisnudeln\n• 1 Koriandergrün (große Handvoll), in Streifen\n• 1 Limette, in Spalten\n\nSTEPS\n1. Basis: 4 tablespoons Rapsöl, plus mehr zum Frittieren in einem großen Topf (mind. 3 l) erhitzen und 4 Schalotten, in dünnen Ringen bei mittlerer Hitze 5 Minuten anbraten. 1 Stück Ingwer (5 cm), gerieben, 1 Sternanis, 3 Gewürznelken und 1 Zimtstange zugeben und 5 Minuten mitbraten, bis die Mischung dunkel und klebrig wird.\n2. Gemüse: Die Lauchringe, 2 Bird's-Eye-Chilis, entkernt, sehr fein gehackt (Alternative: jede scharfe frische Chili) und 375 grams frische Shiitakepilze, in dünnen Scheiben (Alternative: braune Champignons + 1 Handvoll getrocknete Shiitake) zugeben und unter Rühren 8–10 Minuten braten, bis alles weich ist.\n3. Brühe: 1 tablespoons helle Sojasauce, die Hälfte von 6 Frühlingszwiebeln, in dünnen Ringen und 2 liters Gemüsebrühe zugeben, aufkochen und dann nur noch leise köcheln lassen. Mit 0.5 teaspoons Salz abschmecken.\n4. Knusprigen Lauch frittieren: In einer Pfanne den Boden ca. 1 cm hoch mit Öl bedecken und erhitzen. Die Lauchstreifen portionsweise goldbraun und knusprig frittieren und auf Küchenpapier abtropfen lassen.\n5. Nudeln: 200 grams breite Reisnudeln nach Packungsangabe kochen und abgießen.\n6. Anrichten: Nudeln auf vier Schalen verteilen, mit Brühe übergießen und das Gemüse darauf verteilen. Mit dem knusprigen Lauch, 1 Koriandergrün (große Handvoll), in Streifen und den restlichen Frühlingszwiebeln bestreuen und mit 1 Limette, in Spalten servieren.\n\nNOTES\nAlles vorher schneiden, dann geht es beim Kochen deutlich entspannter. Statt frittiertem Lauch gehen auch fertige Röstzwiebeln."],["Auberginen Katsu-Curry mit Radieschen-Pickle","Auberginen-Katsu-Curry mit Radieschen-Pickle (siehe Asien Vegetarisch - Meera Sodha Seite 105)\nIm Ofen knusprig gebackene Panko-Auberginen mit seidiger japanischer Currysauce aus Karotte und Süßkartoffel\n\nINGREDIENTS\n• 100 grams Radieschen, in dünnen Scheiben\n• 0.5 teaspoons Salz (Pickle)\n• 3 tablespoons Mirin\n• 3 tablespoons Weißweinessig\n• 5 tablespoons Rapsöl\n• 1 Zwiebel, gehackt\n• 200 grams Karotten, fein gewürfelt\n• 200 grams Süßkartoffel, fein gewürfelt\n• 4 Knoblauchzehen, in dünnen Scheiben\n• 1 Stück Ingwer (1,5 cm), gerieben\n• 10 tablespoons Mehl (2 EL Curry + 8 EL Teig)\n• 2 tablespoons Currypulver (mild; japanisches Currypulver ideal, normales geht auch)\n• 500 milliliters Gemüsebrühe\n• 2 tablespoons helle Sojasauce\n• 2 tablespoons Tomatenketchup\n• 1 teaspoons Salz (Curry + Teig)\n• 600 grams Auberginen, längs in 0,5-cm-Scheiben\n• 180 milliliters Wasser (Teig)\n• 200 grams Panko (Alternative: grobes Paniermehl)\n• 1 tablespoons schwarzer Sesam, zum Bestreuen (optional)\n\nSTEPS\n1. Pickle: Ofen auf 200 °C vorheizen. 100 grams Radieschen, in dünnen Scheiben in eine hitzefeste Schüssel geben, mit einem Schuss kochendem Wasser übergießen, 0.5 teaspoons Salz (Pickle), 3 tablespoons Mirin und 3 tablespoons Weißweinessig zugeben, umrühren und abkühlen lassen.\n2. Curry-Gemüse: 3 EL 5 tablespoons Rapsöl in einer Pfanne mit Deckel erhitzen. 1 Zwiebel, gehackt, 200 grams Karotten, fein gewürfelt und 200 grams Süßkartoffel, fein gewürfelt 10 Minuten braten, dann 4 Knoblauchzehen, in dünnen Scheiben und 1 Stück Ingwer (1,5 cm), gerieben 2 Minuten mitbraten.\n3. Sauce: 2 tablespoons Currypulver (mild; japanisches Currypulver ideal, normales geht auch) unterrühren und alles mit 2 EL Mehl bestäuben. 500 milliliters Gemüsebrühe nach und nach zugießen und aufkochen. 2 tablespoons helle Sojasauce, 2 tablespoons Tomatenketchup und ½ TL Salz einrühren, vom Herd nehmen und im Mixer glatt pürieren. Zurück in die Pfanne geben.\n4. Panieren: Ein Blech mit Backpapier auslegen. 8 EL Mehl mit 180 milliliters Wasser (Teig) und ½ TL Salz zu einem dünnen Teig verrühren, 200 grams Panko (Alternative: grobes Paniermehl) auf einen Teller geben. 600 grams Auberginen, längs in 0,5-cm-Scheiben durch den Teig ziehen, abtropfen lassen und in Panko wälzen.\n5. Backen: Die Scheiben aufs Blech legen, beidseitig mit restlichem Öl beträufeln und 15 Minuten backen. Den Ofen auf 240 °C hochschalten und weitere 10 Minuten backen, bis sie knusprig sind.\n6. Servieren: Die Currysauce 5 Minuten vorsichtig erhitzen, bei Bedarf mit Wasser verdünnen und nachsalzen. Auberginen auf Teller legen, Sauce danebengießen und mit Reis, Radieschen-Pickle und 1 tablespoons schwarzer Sesam, zum Bestreuen (optional) servieren.\n\nNOTES\nDie Sauce lässt sich gut einfrieren, also gern die doppelte Menge machen. Passt auch zu Tofu- oder Hähnchen-Katsu."],["Panir Kofta mit Tomaten-Cashew-Sauce","Panir Kofta mit Tomaten-Cashew-Sauce (siehe Asien Vegetarisch - Meera Sodha Seite 115)\nKnusprige Kartoffel-Panir-Küchlein (Malai Kofta) in cremiger, mild gewürzter Tomaten-Cashew-Sauce\n\nINGREDIENTS\n• 50 grams Cashewkerne\n• 3 tablespoons Rapsöl (Sauce)\n• 1 große Zwiebel, gehackt\n• 4 Knoblauchzehen, zerdrückt\n• 800 grams gehackte Tomaten (2 Dosen à 400 g)\n• 1.5 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne)\n• 1 teaspoons Garam Masala\n• 0.5 teaspoons gemahlener Zimt\n• 1 teaspoons Salz (Sauce)\n• 1 teaspoons Kasuri Methi / getr. Bockshornkleeblätter (Asialaden; kann man weglassen)\n• 400 grams mehligkochende Kartoffeln, geschält, gekocht und abgekühlt\n• 225 grams Panir, gerieben (Alternative: Halloumi oder fester Feta)\n• 1 grüne Chilischote, entkernt und fein gehackt\n• 1 Stück Ingwer (1,5 cm), gerieben\n• 1 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 1 teaspoons Salz (Kofta; bei Halloumi/Feta weniger)\n• 4 tablespoons Rapsöl (Braten)\n\nSTEPS\n1. Cashewpaste: 50 grams Cashewkerne 10 Minuten in kochendem Wasser einweichen, abgießen und mit 5 EL Wasser zu einer cremigen Paste mixen.\n2. Sauce ansetzen: 3 tablespoons Rapsöl (Sauce) erhitzen und 1 große Zwiebel, gehackt 10 Minuten weich braten. 4 Knoblauchzehen, zerdrückt 2 Minuten mitbraten, dann 800 grams gehackte Tomaten (2 Dosen à 400 g) zugeben und 10 Minuten köcheln lassen, bis die Tomaten zerfallen.\n3. Sauce vollenden: 1.5 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne), 1 teaspoons Garam Masala, 0.5 teaspoons gemahlener Zimt, 1 teaspoons Salz (Sauce), die Cashewpaste und 1 teaspoons Kasuri Methi / getr. Bockshornkleeblätter (Asialaden; kann man weglassen) einrühren und 5 Minuten köcheln. Ist sie zu dick, etwas Wasser zugeben. Vom Herd nehmen.\n4. Koftas formen: 400 grams mehligkochende Kartoffeln, geschält, gekocht und abgekühlt reiben und mit 225 grams Panir, gerieben (Alternative: Halloumi oder fester Feta), 1 grüne Chilischote, entkernt und fein gehackt, 1 Stück Ingwer (1,5 cm), gerieben, 1 teaspoons schwarzer Pfeffer, frisch gemahlen und 1 teaspoons Salz (Kofta; bei Halloumi/Feta weniger) mit den Händen vermengen. 12 kleine Küchlein formen (ca. 2 cm dick, 5 cm breit).\n5. Braten: 2 EL 4 tablespoons Rapsöl (Braten) in einer Pfanne erhitzen und die Küchlein portionsweise je Seite 2 Minuten goldbraun und knusprig braten, bei Bedarf Öl nachgeben.\n6. Servieren: Die Sauce erhitzen, die Koftas darin erwärmen, nach Wunsch mit etwas Kasuri Methi bestreuen und mit Naan servieren.\n\nNOTES\nDie Kartoffeln sollten gut abgekühlt und trocken sein, sonst zerfallen die Koftas. Dein Naan-Rezept passt perfekt dazu."],["Grünkohl-Saag mit Panir & Tomaten","Grünkohl-Saag mit Panir & Tomaten (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nCremiges Grünkohl-Curry mit Tomate, Kokosmilch und gebratenen Panirwürfeln\n\nINGREDIENTS\n• 500 grams Grünkohl, Blätter von den Stängeln gestreift, grob gehackt (Alternative: Blattspinat oder Wirsing)\n• 4 tablespoons Rapsöl\n• 450 grams Panir, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu)\n• 2 Zwiebeln, fein gehackt\n• 1 Stück Ingwer (2 cm), gerieben\n• 4 Knoblauchzehen, zerdrückt\n• 2 grüne Chilischoten, entkernt und fein gehackt\n• 400 milliliters gehackte Tomaten (Dose)\n• 1.5 teaspoons gemahlener Koriander\n• 1.5 teaspoons gemahlener Kreuzkümmel\n• 0.5 teaspoons gemahlene Kurkuma\n• 1.5 teaspoons Salz\n• 1 teaspoons brauner Reissirup (Alternative: Honig oder brauner Zucker)\n• 400 milliliters Kokosmilch (Dose)\n\nSTEPS\n1. Grünkohl hacken: 500 grams Grünkohl, Blätter von den Stängeln gestreift, grob gehackt (Alternative: Blattspinat oder Wirsing) im Mixer portionsweise grob zerkleinern und in eine große Schüssel geben.\n2. Panir braten: 2 EL 4 tablespoons Rapsöl in einer großen beschichteten Pfanne erhitzen und 450 grams Panir, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu) bei mittlerer Hitze rundum anbraten, bis er gebräunt ist. Herausnehmen.\n3. Masala: Restliches Öl in die Pfanne geben, 2 Zwiebeln, fein gehackt 10 Minuten weich und süß braten. 1 Stück Ingwer (2 cm), gerieben, 4 Knoblauchzehen, zerdrückt und 2 grüne Chilischoten, entkernt und fein gehackt 5 Minuten mitbraten, dann 400 milliliters gehackte Tomaten (Dose) zugeben und 8 Minuten zu einer Paste einkochen.\n4. Würzen: 1.5 teaspoons gemahlener Koriander, 1.5 teaspoons gemahlener Kreuzkümmel, 0.5 teaspoons gemahlene Kurkuma, 1.5 teaspoons Salz und 1 teaspoons brauner Reissirup (Alternative: Honig oder brauner Zucker) unterrühren.\n5. Grünkohl: Den Grünkohl portionsweise unterrühren, er fällt schnell zusammen. 400 milliliters Kokosmilch (Dose) zugießen und zugedeckt 15 Minuten köcheln lassen.\n6. Panir dazu: Den Panir zugeben und weitere 10 Minuten mitgaren, bei Bedarf löffelweise Wasser zugeben. Abschmecken, prüfen ob der Grünkohl gar ist, und mit Chapati oder Naan servieren.\n\nNOTES\nPasst gut zum Grünkohl-Saisonstart im Herbst. Mit Tofu und Ahornsirup wird das Gericht vegan."],["Kokosreis mit Auberginen & Gurken-Pickle","Kokosreis mit Auberginen & Gurken-Pickle (siehe Asien Vegetarisch - Meera Sodha Seite 135)\nNasi-Lemak-inspirierter Kokos-Jasminreis mit süß-sauren Tamarinden-Auberginen, frischem Gurken-Pickle und Erdnüssen\n\nINGREDIENTS\n• 0.5 Gurke (halbe)\n• 2 tablespoons Zitronensaft\n• 0.8 teaspoons Zucker (Pickle)\n• 0.5 Bird's-Eye-Chili, entkernt, sehr fein gehackt (Pickle; Alternative: jede scharfe Chili)\n• 350 grams Jasminreis\n• 400 milliliters Kokosmilch (1 Dose à 400 ml, aufgeteilt: 300 Reis + 100 Auberginen)\n• 250 milliliters Wasser (Reis)\n• 0.8 teaspoons Salz (insgesamt, aufgeteilt)\n• 3 tablespoons Rapsöl\n• 1 rote Zwiebel, halbiert, in dünnen Streifen\n• 3 Knoblauchzehen, zerdrückt\n• 1.5 Bird's-Eye-Chilis, entkernt, sehr fein gehackt (Auberginen)\n• 1 kilograms Auberginen, in 1,5 cm dicken Streifen\n• 1 tablespoons Tamarindenpaste (Alternative: 1 EL Limettensaft + ½ TL brauner Zucker)\n• 1 tablespoons helle Sojasauce\n• 0.5 teaspoons Zucker (Auberginen)\n• 1 gesalzene Erdnüsse, zerstoßen (Handvoll)\n\nSTEPS\n1. Gurken-Pickle: 0.5 Gurke (halbe) längs halbieren, Kerne herauskratzen und fein würfeln. Mit 2 tablespoons Zitronensaft, ¼ TL Salz, 0.8 teaspoons Zucker (Pickle) und 0.5 Bird's-Eye-Chili, entkernt, sehr fein gehackt (Pickle; Alternative: jede scharfe Chili) vermischen.\n2. Kokosreis: 350 grams Jasminreis abspülen, bis das Wasser klar bleibt. Mit 300 ml Kokosmilch, 250 milliliters Wasser (Reis) und ¼ TL Salz aufkochen, zudecken und bei kleiner Hitze 15 Minuten garen. Vom Herd nehmen und geschlossen stehen lassen.\n3. Zwiebeln: 3 tablespoons Rapsöl in einer Pfanne mit Deckel stark erhitzen und 1 rote Zwiebel, halbiert, in dünnen Streifen unter Rühren 8 Minuten goldgelb braten. 3 Knoblauchzehen, zerdrückt und 1.5 Bird's-Eye-Chilis, entkernt, sehr fein gehackt (Auberginen) ein paar Minuten mitbraten.\n4. Auberginen schmoren: 1 kilograms Auberginen, in 1,5 cm dicken Streifen und 3 EL Wasser unterheben, zudecken und gelegentlich rühren, bei Bedarf löffelweise Wasser zugeben. Nach ca. 15 Minuten, wenn sie bräunen und zusammenfallen, weiter.\n5. Würzen: Die restlichen 100 ml Kokosmilch, 1 tablespoons Tamarindenpaste (Alternative: 1 EL Limettensaft + ½ TL brauner Zucker), 1 tablespoons helle Sojasauce, ¼ TL Salz und 0.5 teaspoons Zucker (Auberginen) unterrühren und köcheln lassen, bis die Flüssigkeit verdampft ist.\n6. Servieren: Die Auberginen auf dem Reis anrichten, etwas Gurken-Pickle dazugeben und mit 1 gesalzene Erdnüsse, zerstoßen (Handvoll) bestreuen.\n\nNOTES\nTamarindenpaste bekommst du im Asialaden. Für das Gericht reicht genau eine Dose Kokosmilch."],["Sommerpilaw mit Tomaten, Cashewkernen & Kokosmilch","Sommerpilaw mit Tomaten, Cashewkernen & Kokosmilch (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nOne-Pan-Basmatireis mit Kirschtomaten, gerösteten Cashews, Zwiebeln und Kokosmilch\n\nINGREDIENTS\n• 350 grams Basmatireis\n• 2 tablespoons Rapsöl\n• 12 frische Curryblätter (Asialaden; kann man weglassen)\n• 1 Zimtstange (4 cm)\n• 1 große Zwiebel, in dünnen Ringen\n• 4 Knoblauchzehen, zerdrückt\n• 1 grüne Chilischote, entkernt, in dünnen Ringen\n• 50 grams Cashewkerne\n• 400 grams Kirschtomaten, halbiert\n• 400 milliliters Kokosmilch (Dose)\n• 200 milliliters Wasser\n• 1.8 teaspoons Salz\n\nSTEPS\n1. Reis vorbereiten: 350 grams Basmatireis mehrmals waschen, bis das Wasser klar bleibt, dann in kaltem Wasser einweichen.\n2. Gewürze & Zwiebel: 2 tablespoons Rapsöl in einer großen Pfanne mit Deckel erhitzen, 12 frische Curryblätter (Asialaden; kann man weglassen) und 1 Zimtstange (4 cm) 1 Minute rösten. 1 große Zwiebel, in dünnen Ringen zugeben und 10–12 Minuten braten, bis sie goldbraun und weich sind.\n3. Cashews & Tomaten: 4 Knoblauchzehen, zerdrückt, 1 grüne Chilischote, entkernt, in dünnen Ringen und 50 grams Cashewkerne einige Minuten mitbraten. 400 grams Kirschtomaten, halbiert zugeben, zudecken und 8 Minuten köcheln lassen, bis die Tomaten weich sind.\n4. Reis garen: Reis abgießen und vorsichtig unterrühren. 400 milliliters Kokosmilch (Dose), 200 milliliters Wasser und 1.8 teaspoons Salz zugeben, umrühren und aufkochen. Zudecken, Hitze auf niedrig und 15 Minuten garen. Den Deckel nicht anheben.\n5. Ruhen: Vom Herd nehmen und geschlossen 10 Minuten ruhen lassen. Nach Wunsch mit grünem Salat servieren.\n\nNOTES\nBraucht nur eine große Pfanne mit gut schließendem Deckel. Die Curryblätter geben ein zitroniges, leicht rauchiges Aroma, ohne sie schmeckt es trotzdem gut."],["Herbstpilaw mit Kürbis, Palmkohl & geräuchertem Knoblauch","Herbstpilaw mit Kürbis, Palmkohl & geräuchertem Knoblauch (siehe Asien Vegetarisch - Meera Sodha Seite 143)\nWürziger Basmati-Pilaw mit Ofenkürbis, Palmkohl und rauchigem Knoblauch, serviert mit Koriander und Zitrone\n\nINGREDIENTS\n• 300 grams Basmatireis\n• 1 kilograms Kürbis (z. B. Hokkaido), entkernt, in 1-cm-Spalten\n• 5 tablespoons Rapsöl\n• 1.8 teaspoons Salz (Pilaw) plus 1 Prise für den Kürbis\n• 1 pinch schwarzer Pfeffer, frisch gemahlen\n• 3 braune Zwiebeln, in dünnen Ringen\n• 4 geräucherte Knoblauchzehen, in Scheiben (Alternative: normaler Knoblauch + ½ TL geräuchertes Paprikapulver)\n• 1.5 teaspoons gemahlener Kreuzkümmel\n• 1.5 teaspoons Garam Masala\n• 0.5 teaspoons gemahlene Kurkuma\n• 2 grüne Chilischoten, fein gehackt\n• 20 grams Koriandergrün, Blätter abgezupft, Stängel fein gehackt\n• 200 grams Palmkohl / Cavolo nero, Blätter abgestreift, grob gehackt (Alternative: Grünkohl oder Wirsing)\n• 600 milliliters warmes Wasser\n• 1 Zitrone, geviertelt\n\nSTEPS\n1. Vorbereiten: Ofen auf 220 °C vorheizen, ein Blech mit Backpapier auslegen. 300 grams Basmatireis waschen, bis das Wasser klar bleibt, und bis zur Verwendung in kaltem Wasser einweichen.\n2. Kürbis rösten: 1 kilograms Kürbis (z. B. Hokkaido), entkernt, in 1-cm-Spalten nebeneinander aufs Blech legen, mit 3 EL 5 tablespoons Rapsöl beträufeln, mit einer Prise Salz und 1 pinch schwarzer Pfeffer, frisch gemahlen würzen und 30 Minuten backen, bis er weich ist.\n3. Zwiebeln & Gewürze: Restliche 2 EL Öl in einer großen Pfanne mit Deckel erhitzen. 3 braune Zwiebeln, in dünnen Ringen und 4 geräucherte Knoblauchzehen, in Scheiben (Alternative: normaler Knoblauch + ½ TL geräuchertes Paprikapulver) 8 Minuten braten. 1.5 teaspoons gemahlener Kreuzkümmel, 1.5 teaspoons Garam Masala, 0.5 teaspoons gemahlene Kurkuma, 2 grüne Chilischoten, fein gehackt, die Korianderstängel und 1¾ TL Salz unterrühren und 4 Minuten braten, bis die Zwiebeln bräunen. 200 grams Palmkohl / Cavolo nero, Blätter abgestreift, grob gehackt (Alternative: Grünkohl oder Wirsing) zugeben.\n4. Reis garen: Reis abgießen, vorsichtig unterrühren und 600 milliliters warmes Wasser zugießen. Aufkochen, zudecken und bei kleiner Hitze 20 Minuten garen. Vom Herd nehmen und geschlossen 10 Minuten ruhen lassen.\n5. Anrichten: Reis und Kürbis vorsichtig vermischen, auf einer Platte anrichten, mit Korianderblättern bestreuen und mit 1 Zitrone, geviertelt servieren.\n\nNOTES\nEin schönes Herbstgericht für jetzt. Geräucherten Knoblauch gibt es teilweise im Supermarkt oder beim Gemüsehändler."],["Tofu-Akuri","Tofu-Akuri (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nIndisches Rührei-Pendant aus Seidentofu mit Kreuzkümmel, Ingwer, Knoblauch, Chili und Koriander auf Röstbrot\n\nINGREDIENTS\n• 500 grams Seidentofu (Alternative: fester Tofu, zerbröselt)\n• 0.5 teaspoons Kreuzkümmelsamen (oder ½ TL gemahlen)\n• 2 tablespoons Rapsöl, plus etwas zum Servieren\n• 1 große rote Zwiebel, sehr fein gehackt\n• 1 grüne Chilischote, entkernt, sehr fein gehackt\n• 1 Knoblauchzehe, zerdrückt\n• 1 Stück Ingwer (1 cm), gerieben\n• 1 mittelgroße Strauchtomate, gewürfelt (ca. 70 g)\n• 2 tablespoons Koriandergrün, fein gehackt\n• 0.5 teaspoons gemahlene Kurkuma\n• 0.5 teaspoons Salz\n• 4 Scheiben Brot, geröstet\n\nSTEPS\n1. Abtropfen: Ein Sieb mit Küchenpapier oder einem Tuch auslegen und 500 grams Seidentofu (Alternative: fester Tofu, zerbröselt) darin mindestens 10 Minuten abtropfen lassen. 0.5 teaspoons Kreuzkümmelsamen (oder ½ TL gemahlen) im Mörser fein zerstoßen.\n2. Zwiebeln: 2 tablespoons Rapsöl, plus etwas zum Servieren in einer beschichteten Pfanne erhitzen und den Kreuzkümmel 1 Minute rösten. 1 große rote Zwiebel, sehr fein gehackt zugeben und 8 Minuten weich, süß und leicht gebräunt braten.\n3. Aromaten: 1 grüne Chilischote, entkernt, sehr fein gehackt, 1 Knoblauchzehe, zerdrückt und 1 Stück Ingwer (1 cm), gerieben 2 Minuten mitbraten. Dann 1 mittelgroße Strauchtomate, gewürfelt (ca. 70 g), 2 tablespoons Koriandergrün, fein gehackt, 0.5 teaspoons gemahlene Kurkuma und 0.5 teaspoons Salz zugeben.\n4. Tofu: Den Tofu mit den Fingern in die Pfanne bröseln oder darin mit dem Kartoffelstampfer zerdrücken. Ein paar Minuten braten, bis er heiß und gut vermischt ist.\n5. Servieren: Auf 4 Scheiben Brot, geröstet verteilen, nach Wunsch mit etwas Öl beträufeln und sofort servieren, gern mit Chai oder Ketchup.\n\nNOTES\nMit Eiern statt Tofu ist es das klassische parsische Akuri. Passt in deinen Frühstücks-Tab."],["Tempeh mit Pak Choi & Tomaten Sambal","Tempeh mit Pak Choi & Tomaten-Sambal (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nKnusprig gebratenes Tempeh in würzigem Tomaten-Sambal mit Zitronengras und süßer Sojasauce, dazu Pak Choi\n\nINGREDIENTS\n• 4 tablespoons Rapsöl\n• 400 grams Tempeh, Scheiben diagonal in Dreiecke geschnitten (Bioladen; Alternative: Räuchertofu oder fester Tofu)\n• 4 Schalotten, sehr fein gehackt\n• 5 große Knoblauchzehen, zerdrückt\n• 1 Zitronengras, äußere Blätter entfernt, Inneres sehr fein gehackt (Alternative: Abrieb ½ Limette oder 1 TL Zitronengraspaste)\n• 2 Bird's-Eye-Chilis, entkernt (Alternative: jede scharfe Chili)\n• 250 grams Strauchtomaten, gehackt\n• 0.8 teaspoons Salz\n• 1 tablespoons Ketjap manis (Alternative: 1 EL Sojasauce + 1 TL brauner Zucker, kurz einkochen)\n• 250 grams Pak Choi, längs in Streifen\n\nSTEPS\n1. Tempeh braten: 4 tablespoons Rapsöl in einer beschichteten Pfanne mit Deckel erhitzen. 400 grams Tempeh, Scheiben diagonal in Dreiecke geschnitten (Bioladen; Alternative: Räuchertofu oder fester Tofu) je Seite 2 Minuten goldbraun und knusprig braten, herausnehmen und auf Küchenpapier abtropfen lassen. Das Öl in der Pfanne lassen.\n2. Sambal-Basis: 4 Schalotten, sehr fein gehackt im Öl bei mittlerer Hitze 8 Minuten goldbraun braten. 5 große Knoblauchzehen, zerdrückt, 1 Zitronengras, äußere Blätter entfernt, Inneres sehr fein gehackt (Alternative: Abrieb ½ Limette oder 1 TL Zitronengraspaste) und 2 Bird's-Eye-Chilis, entkernt (Alternative: jede scharfe Chili) zugeben und 3–4 Minuten braten, bis die Schalotten knusprig sind.\n3. Tomaten: 250 grams Strauchtomaten, gehackt zugeben und 8 Minuten zu einer dicklichen Masse köcheln lassen, bei Bedarf löffelweise Wasser zugeben.\n4. Fertigstellen: Hitze reduzieren, 0.8 teaspoons Salz und 1 tablespoons Ketjap manis (Alternative: 1 EL Sojasauce + 1 TL brauner Zucker, kurz einkochen) einrühren und das Tempeh zurück in die Pfanne geben, mit Sauce überlöffeln. 250 grams Pak Choi, längs in Streifen darauf verteilen, Hitze erhöhen, Deckel drauf und 2 Minuten garen.\n5. Servieren: Mit frisch gekochtem Reis servieren.\n\nNOTES\nVakuumverpacktes Tempeh ist meist besser als welches aus dem Glas. Ketjap manis gibt es in gut sortierten Supermärkten."],["Mapo-Tofu mit Pilzen","Mapo-Tofu mit Pilzen (siehe Asien Vegetarisch - Meera Sodha Seite 171)\nSichuan-Klassiker in vegetarisch: Tofu in scharfer Chili-Bohnen-Sauce mit Shiitake, Lauch und Sichuanpfeffer\n\nINGREDIENTS\n• 1.5 teaspoons Sichuanpfefferkörner (Alternative: schwarzer Pfeffer + Zitronenabrieb, oder weglassen)\n• 2 tablespoons Rapsöl\n• 3 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (1,5 cm), gerieben\n• 200 grams frische Shiitakepilze, fein gehackt (Alternative: braune Champignons)\n• 400 grams große Lauchstange, in dünnen Ringen\n• 2 tablespoons geröstetes Sesamöl\n• 2 tablespoons Toban Djan / Chili-Bohnen-Sauce (Alternative: 1 EL Gochujang + 1 EL braunes Miso)\n• 1 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker)\n• 2 teaspoons fermentierte schwarze Bohnen, abgespült, gehackt (kann man weglassen, dann kräftiger abschmecken)\n• 400 grams fester Tofu, abgetropft, in 1,5-cm-Würfeln\n• 500 milliliters Gemüsebrühe\n• 1.5 tablespoons Speisestärke, mit 1½ EL Wasser verrührt\n• 1 Frühlingszwiebel, in dünnen langen Streifen\n\nSTEPS\n1. Pfeffer: 1.5 teaspoons Sichuanpfefferkörner (Alternative: schwarzer Pfeffer + Zitronenabrieb, oder weglassen) im Mörser fein zerstoßen.\n2. Gemüse: 2 tablespoons Rapsöl in einer großen Pfanne erhitzen. 3 Knoblauchzehen, zerdrückt und 1 Stück Ingwer (1,5 cm), gerieben bei mittlerer Hitze 2 Minuten braten, dann 200 grams frische Shiitakepilze, fein gehackt (Alternative: braune Champignons) 6 Minuten mitbraten. 400 grams große Lauchstange, in dünnen Ringen zugeben und 2 Minuten weiterbraten, bis der Lauch zusammenfällt. Gemüse in eine Schüssel geben.\n3. Sauce: 2 tablespoons geröstetes Sesamöl, den Sichuanpfeffer, 2 tablespoons Toban Djan / Chili-Bohnen-Sauce (Alternative: 1 EL Gochujang + 1 EL braunes Miso), 1 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker) und 2 teaspoons fermentierte schwarze Bohnen, abgespült, gehackt (kann man weglassen, dann kräftiger abschmecken) in die heiße Pfanne geben und einige Minuten erhitzen, bis sich das Öl absetzt.\n4. Tofu: 400 grams fester Tofu, abgetropft, in 1,5-cm-Würfeln zugeben und vorsichtig in der Sauce wenden. Das Gemüse zurück in die Pfanne geben, mit 500 milliliters Gemüsebrühe aufgießen und aufkochen.\n5. Binden: 1.5 tablespoons Speisestärke, mit 1½ EL Wasser verrührt einrühren und köcheln lassen, bis die Sauce eindickt. In eine Schüssel füllen, mit 1 Frühlingszwiebel, in dünnen langen Streifen garnieren und mit Reis servieren.\n\nNOTES\nToban Djan gibt es in vielen Supermärkten und im Asialaden. Fermentierte schwarze Bohnen sind schwerer zu finden und können weggelassen werden."],["Geschmorter Tofu mit Honig, Ingwer & Sojasauce","Geschmorter Tofu mit Honig, Ingwer & Sojasauce (siehe Asien Vegetarisch - Meera Sodha Seite 175)\nGoldbraun gebratener Tofu in glänzender, süß-scharfer Soja-Honig-Birnen-Sauce mit Gochujang (nach Dubu Jorim)\n\nINGREDIENTS\n• 280 grams fester Tofu\n• 2 tablespoons helle Sojasauce\n• 1.5 tablespoons Honig (vegan: brauner Reissirup oder Ahornsirup)\n• 3 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (1,5 cm), gerieben\n• 1 Birne, gerieben (am besten Conference, jede reife Birne geht)\n• 4 Frühlingszwiebeln, Weißes und Grünes getrennt in Ringen\n• 2 tablespoons geröstetes Sesamöl\n• 1.5 teaspoons Gochujang (Alternative: 1 TL Sriracha + ½ TL Miso)\n• 2 tablespoons Rapsöl\n• 1 tablespoons schwarzer und weißer Sesam, zum Bestreuen\n\nSTEPS\n1. Tofu entwässern: 280 grams fester Tofu über der Spüle vorsichtig zwischen den Händen zusammendrücken, um möglichst viel Wasser zu entfernen, und in Küchenpapier wickeln.\n2. Sauce: 2 tablespoons helle Sojasauce, 1.5 tablespoons Honig (vegan: brauner Reissirup oder Ahornsirup), 3 Knoblauchzehen, zerdrückt, 1 Stück Ingwer (1,5 cm), gerieben, 1 Birne, gerieben (am besten Conference, jede reife Birne geht), das Weiße von 4 Frühlingszwiebeln, Weißes und Grünes getrennt in Ringen, 2 tablespoons geröstetes Sesamöl, 1.5 teaspoons Gochujang (Alternative: 1 TL Sriracha + ½ TL Miso) und 1 EL Wasser verrühren. Den Tofu in 1 cm dicke Scheiben schneiden.\n3. Braten: 2 tablespoons Rapsöl in einer beschichteten Pfanne rauchend heiß werden lassen. Die Tofuscheiben insgesamt 8 Minuten braten, bis sie beidseitig goldbraun sind, und auf Küchenpapier abtropfen lassen.\n4. Schmoren: Öl bis auf 1 EL abgießen. Die Sauce in die Pfanne geben und 1 Minute rühren, dann den Tofu zurückgeben und 5 Minuten köcheln lassen, bis die Sauce eindickt und glänzt.\n5. Servieren: Tofu auf einer Platte anrichten, mit der Sauce übergießen und mit dem Grün der Frühlingszwiebeln und 1 tablespoons schwarzer und weißer Sesam, zum Bestreuen bestreuen. Dazu Reis und gedämpften Brokkoli.\n\nNOTES\nFür 4 Personen oder mehr Sauce einfach alles verdoppeln. Gochujang gibt es im Asialaden und in vielen Supermärkten."],["Chili-Tofu","Chili-Tofu (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nIndo-chinesischer Klassiker: knusprig gebratene Tofuwürfel in würziger Sauce mit Knoblauch, Ingwer, grüner Chili und Paprika\n\nINGREDIENTS\n• 800 grams fester Tofu, abgetropft, in 3-cm-Würfeln\n• 4 tablespoons Speisestärke zum Bestäuben\n• 150 milliliters Rapsöl zum Braten (ca. 5 mm hoch in der Pfanne)\n• 2 teaspoons Kreuzkümmelsamen, grob gemahlen\n• 1 braune Zwiebel, gehackt\n• 6 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (3 cm), gerieben\n• 4 grüne Chilischoten, entkernt (2 sehr fein gehackt, 2 längs aufgeschlitzt)\n• 0.3 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 2 tablespoons Tomatenmark\n• 2 tablespoons helle Sojasauce\n• 2 teaspoons Zucker\n• 0.8 teaspoons Salz\n• 2 Paprikaschoten (am besten 1 rote, 1 grüne), in 1 cm breiten Streifen\n\nSTEPS\n1. Tofu bestäuben: 800 grams fester Tofu, abgetropft, in 3-cm-Würfeln auf einem Brett verteilen und rundum mit 4 tablespoons Speisestärke zum Bestäuben bestäuben. 150 milliliters Rapsöl zum Braten (ca. 5 mm hoch in der Pfanne) in einer hohen Pfanne mit Deckel erhitzen, einen Teller mit Küchenpapier bereitstellen.\n2. Tofu braten: Überschüssige Stärke abklopfen und die Hälfte des Tofus bei mittlerer Hitze ca. 3 Minuten rundum goldbraun braten. Abtropfen lassen und die zweite Hälfte ebenso braten.\n3. Zwiebeln: Öl bis auf 2 EL abgießen. 2 teaspoons Kreuzkümmelsamen, grob gemahlen und 1 braune Zwiebel, gehackt 10–12 Minuten braten, bis die Zwiebel weich und süß ist. 6 Knoblauchzehen, zerdrückt, 1 Stück Ingwer (3 cm), gerieben und 4 grüne Chilischoten, entkernt (2 sehr fein gehackt, 2 längs aufgeschlitzt) 5 Minuten mitbraten.\n4. Sauce: 0.3 teaspoons schwarzer Pfeffer, frisch gemahlen, 2 tablespoons Tomatenmark, 2 tablespoons helle Sojasauce, 2 teaspoons Zucker und 0.8 teaspoons Salz unterrühren und 5 Minuten erhitzen. 100 ml Wasser und 2 Paprikaschoten (am besten 1 rote, 1 grüne), in 1 cm breiten Streifen zugeben, zudecken und 8 Minuten köcheln lassen, bei Bedarf Wasser nachgießen, sodass der Tofu später bedeckt sein wird.\n5. Fertigstellen: Wenn die Paprika weich ist, den Tofu zurückgeben, Hitze erhöhen und 5 Minuten unter Rühren in der Sauce garen. Mit Chapati oder grünem Salat servieren.\n\nNOTES\nMit Paneer statt Tofu ist es das Original Chilli Paneer. Passt auch gut zu Reis."],["Bun Cha mit Tofu & Frühlingszwiebeln","Bun Cha mit Tofu & Frühlingszwiebeln (siehe Asien Vegetarisch - Meera Sodha Seite 181)\nVietnamesischer Reisnudelsalat mit knusprigem Tofu, eingelegtem R
