otkohl, Erbsen, Brunnenkresse, Kräutern und Erdnüssen\n\nINGREDIENTS\n• 200 grams Rotkohl (ca. ¼ Kopf), in feinen Streifen\n• 6 tablespoons Rapsöl (aufgeteilt)\n• 4 Knoblauchzehen, hauchdünn geschnitten\n• 3 Bird's-Eye-Chilis, entkernt, in dünnen Ringen (Alternative: jede scharfe Chili)\n• 100 milliliters Sojasauce\n• 3 tablespoons Limettensaft (ca. 2 Limetten)\n• 2 tablespoons Zucker\n• 400 grams fester Tofu, in Würfeln\n• 0.8 teaspoons Salz\n• 0.3 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 10 Frühlingszwiebeln, in dünnen Ringen\n• 250 grams Erbsen (oder gemischt mit Dicken Bohnen), TK\n• 200 grams Brunnenkresse, Blätter abgezupft (Alternative: Babyspinat oder Rucola)\n• 250 grams Reis-Vermicelli (dünne Reisnudeln)\n• 1 gesalzene Erdnüsse, zerstoßen (große Handvoll)\n• 2 Koriandergrün und Minze, Blätter abgezupft (je eine Handvoll)\n\nSTEPS\n1. Dressing & Rotkohl: 200 grams Rotkohl (ca. ¼ Kopf), in feinen Streifen in eine hitzefeste Schüssel geben. 2 EL 6 tablespoons Rapsöl (aufgeteilt) in einer kleinen Pfanne erhitzen und 4 Knoblauchzehen, hauchdünn geschnitten und 3 Bird's-Eye-Chilis, entkernt, in dünnen Ringen (Alternative: jede scharfe Chili) bei schwacher Hitze 2 Minuten braten, bis der Knoblauch duftet. 100 milliliters Sojasauce, 3 tablespoons Limettensaft (ca. 2 Limetten), 2 tablespoons Zucker und 8 EL Wasser zugeben, aufkochen und über den Rotkohl gießen.\n2. Tofu: 400 grams fester Tofu, in Würfeln gut ausdrücken und trocken tupfen. 2 EL Öl in einer beschichteten Pfanne erhitzen und den Tofu bei mittlerer Hitze erst 4 Minuten ohne Wenden braten, bis sich eine Kruste bildet, dann rundum goldbraun braten. Mit Salz und 0.3 teaspoons schwarzer Pfeffer, frisch gemahlen würzen und abtropfen lassen.\n3. Gemüse: Restliche 2 EL Öl in derselben Pfanne erhitzen und 10 Frühlingszwiebeln, in dünnen Ringen bei starker Hitze 6 Minuten weich braten. 250 grams Erbsen (oder gemischt mit Dicken Bohnen), TK und ½ TL Salz 2 Minuten mitbraten, dann 200 grams Brunnenkresse, Blätter abgezupft (Alternative: Babyspinat oder Rucola) unterheben, bis sie zusammenfällt.\n4. Nudeln: 250 grams Reis-Vermicelli (dünne Reisnudeln) nach Packungsangabe in heißem Wasser ziehen lassen und abgießen.\n5. Anrichten: Nudeln, Tofu und Gemüse auf vier Schalen verteilen, etwas Rotkohl dazugeben und mit der Marinierflüssigkeit beträufeln. Mit 1 gesalzene Erdnüsse, zerstoßen (große Handvoll) und 2 Koriandergrün und Minze, Blätter abgezupft (je eine Handvoll) garnieren.\n\nNOTES\nDas süßsaure Dressing und die Kräuter-Erdnuss-Garnitur machen das Gericht aus, also nicht weglassen. Schmeckt warm oder lauwarm."],["Kartoffel-Paratha mit schnellem Zitronen-Pickle","Kartoffel-Paratha mit schnellem Zitronen-Pickle (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nVereinfachtes Aloo Paratha aus Kartoffel-Mehl-Teig mit Ingwer, Chili und Koriander, dazu ein würziges Zitronen-Pickle – ergibt 8 Stück\n\nINGREDIENTS\n• 2 Bio-Zitronen\n• 2 tablespoons Rapsöl (Pickle)\n• 0.5 teaspoons schwarze Senfsamen (Alternative: gelbe Senfsaat, oder weglassen)\n• 1 Knoblauchzehe, in dünnen Scheiben\n• 1 rote Chilischote, entkernt und fein gehackt\n• 0.5 teaspoons Salz (Pickle)\n• 500 grams mehligkochende Kartoffeln, geschält, in 3-cm-Würfeln\n• 4 tablespoons Rapsöl (Teig + Braten)\n• 1 teaspoons Salz (Teig)\n• 1 Stück Ingwer (4 cm), gerieben\n• 1.5 grüne Chilischoten, entkernt, sehr fein gehackt\n• 3 tablespoons Koriandergrün, fein gehackt\n• 1 rote Zwiebel, fein gehackt\n• 0.5 teaspoons Kreuzkümmelsamen\n• 200 grams Mehl, plus etwas zum Bestäuben\n• 150 grams Joghurt (oder vegane Alternative), zum Servieren\n\nSTEPS\n1. Zitronen schneiden: Eine 2 Bio-Zitronen vierteln und mit einem sehr scharfen Messer in feinste Scheiben schneiden, Enden und Kerne entfernen. In einer Schüssel mit dem Saft der zweiten Zitrone übergießen.\n2. Pickle kochen: 2 tablespoons Rapsöl (Pickle) in einer Pfanne mit Deckel erhitzen und 0.5 teaspoons schwarze Senfsamen (Alternative: gelbe Senfsaat, oder weglassen) mit 1 Knoblauchzehe, in dünnen Scheiben bei schwacher Hitze braten, bis der Knoblauch hellgolden ist. 1 rote Chilischote, entkernt und fein gehackt, Zitronen samt Saft und 0.5 teaspoons Salz (Pickle) zugeben, zugedeckt 5 Minuten köcheln, dann ohne Deckel 2–3 Minuten, bis sich das Öl absetzt. Abkühlen lassen.\n3. Kartoffeln: 500 grams mehligkochende Kartoffeln, geschält, in 3-cm-Würfeln 12 Minuten in sprudelnd kochendem Wasser garen, abgießen, zurück in den Topf geben, 2 EL Öl zugeben und zerstampfen.\n4. Teig: 1 teaspoons Salz (Teig), 1 Stück Ingwer (4 cm), gerieben, 1.5 grüne Chilischoten, entkernt, sehr fein gehackt, 3 tablespoons Koriandergrün, fein gehackt, 1 rote Zwiebel, fein gehackt und 0.5 teaspoons Kreuzkümmelsamen untermischen, dann 200 grams Mehl, plus etwas zum Bestäuben mit den Händen unterkneten und zu einer Kugel formen.\n5. Ausrollen: Den Teig in 8 gleich große Stücke teilen, auf bemehlter Fläche zu ca. 14 cm großen Fladen ausrollen und auf Backpapier legen.\n6. Braten: 1 TL Öl in einer beschichteten Pfanne erhitzen und jedes Paratha je Seite ca. 1½ Minuten braten, bis es gebräunt und durchgegart ist. Da die Pfanne mit der Zeit heißer wird, Hitze oder Zeit anpassen.\n7. Servieren: Mit dem Zitronen-Pickle und einem Klecks 150 grams Joghurt (oder vegane Alternative), zum Servieren servieren.\n\nNOTES\nBei dieser Version wird die Kartoffel direkt in den Teig geknetet statt eingefüllt, das geht deutlich schneller als das klassische Aloo Paratha. Das Pickle hält sich ein paar Tage im Kühlschrank."],["Kimchi-Pfannkuchen mit Spinatsalat","Kimchi-Pfannkuchen mit Spinatsalat (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nKnusprige koreanische Kimchi-Jeon mit Tofu und Sprossen, dazu Spinatsalat mit Soja-Sesam-Dip als Dressing\n\nINGREDIENTS\n• 250 grams veganes Kimchi (ohne Fischsauce/Garnelen; normales geht auch)\n• 80 grams Reismehl (Alternative: Speisestärke)\n• 80 grams Weizenmehl\n• 1 teaspoons Salz\n• 200 grams fester Tofu, abgetropft, in dünnen Streifen\n• 80 grams Bohnensprossen (Alternative: fein geschnittener Chinakohl, oder weglassen)\n• 5 Frühlingszwiebeln, fein gehackt\n• 120 grams junger Blattspinat\n• 2 teaspoons Rapsöl zum Braten\n• 3 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker)\n• 2 tablespoons geröstetes Sesamöl\n• 1.5 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker)\n• 2 teaspoons Chiliflocken\n• 1 teaspoons geröstete Sesamsamen, plus mehr zum Garnieren\n\nSTEPS\n1. Kimchi auspressen: 250 grams veganes Kimchi (ohne Fischsauce/Garnelen; normales geht auch) in einem Sieb über einem Messbecher kräftig ausdrücken. Die Flüssigkeit bei Bedarf mit Wasser auf 200 ml auffüllen. Das Kimchi hacken.\n2. Teig: 80 grams Reismehl (Alternative: Speisestärke), 80 grams Weizenmehl und 1 teaspoons Salz mit einer Gabel mischen. Kimchi-Flüssigkeit einrühren, dann Kimchi, 200 grams fester Tofu, abgetropft, in dünnen Streifen, 80 grams Bohnensprossen (Alternative: fein geschnittener Chinakohl, oder weglassen) und die Frühlingszwiebeln zugeben, bis auf eine Handvoll für den Dip. Der Teig soll feucht, aber löffelbar sein. 10 Minuten ruhen lassen.\n3. Dip & Salat: 3 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker), 2 tablespoons geröstetes Sesamöl, 1.5 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker), 2 teaspoons Chiliflocken, die restlichen Frühlingszwiebeln und 1 teaspoons geröstete Sesamsamen, plus mehr zum Garnieren verrühren. 120 grams junger Blattspinat in Streifen schneiden und mit 2 EL Dip vermengen.\n4. Braten: ½ TL Öl in einer mittelgroßen beschichteten Pfanne verteilen. Ein Viertel des Teigs hineingeben und zu einem ca. 15 cm großen Pfannkuchen verstreichen. 3–5 Minuten braten, wenden und die zweite Seite goldbraun und knusprig braten. Unter Alufolie warm halten, die übrigen ebenso braten.\n5. Servieren: Spinatsalat auf die Pfannkuchen geben, mit Sesam bestreuen und den Dip separat dazu reichen.\n\nNOTES\nFür 2 als Hauptgericht oder 4 als Beilage. Je länger die Pfannkuchen in der Pfanne bleiben, desto knuspriger werden sie."],["Bombay-Schnecken","Bombay-Schnecken (siehe Asien Vegetarisch - Meera Sodha Seite 203)\nBlätterteigschnecken mit scharfem Koriander-Minz-Chutney, Cheddar und roten Zwiebeln – nach dem Bombay-Sandwich, ergibt 8 Stück\n\nINGREDIENTS\n• 60 grams Koriandergrün, grob gehackt\n• 20 grams frische Minze, Blätter abgezupft, grob gehackt\n• 2 grüne Chilischoten, entkernt, grob gehackt\n• 2 teaspoons Zitronensaft\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1.3 teaspoons Salz\n• 2 tablespoons Rapsöl\n• 500 grams Blätterteig im Block (Alternative: 2 Rollen fertig ausgerollter Blätterteig)\n• 1 tablespoons Mehl zum Bestäuben\n• 100 grams gereifter Cheddar, gerieben (Alternative: Bergkäse oder alter Gouda)\n• 0.5 kleine rote Zwiebel (halbe), in dünnen Ringen\n• 1 Ei, mit 1 Prise Salz verquirlt\n\nSTEPS\n1. Vorbereiten: Ofen auf 220 °C vorheizen und ein Backblech (oder eine Form, ca. 22 × 30 cm) mit Backpapier auslegen.\n2. Chutney: 60 grams Koriandergrün, grob gehackt, 20 grams frische Minze, Blätter abgezupft, grob gehackt, 2 grüne Chilischoten, entkernt, grob gehackt, 2 teaspoons Zitronensaft, 1 teaspoons gemahlener Kreuzkümmel, 1.3 teaspoons Salz und 2 tablespoons Rapsöl im Mixer pürieren. Das Chutney soll dick und streichfähig sein und scharf, würzig, salzig und sauer schmecken. Bei Bedarf nachwürzen.\n3. Belegen: 500 grams Blätterteig im Block (Alternative: 2 Rollen fertig ausgerollter Blätterteig) auf leicht bemehlter Fläche zu einem ca. 30 cm großen Quadrat ausrollen. Mit dem Chutney bestreichen, dabei am oberen Rand einen 2,5 cm breiten Streifen frei lassen. 100 grams gereifter Cheddar, gerieben (Alternative: Bergkäse oder alter Gouda) und 0.5 kleine rote Zwiebel (halbe), in dünnen Ringen darauf verteilen und den freien Rand mit 1 Ei, mit 1 Prise Salz verquirlt bestreichen.\n4. Rollen & schneiden: Den Teig von unten fest aufrollen, die Rolle in 4 cm dicke Scheiben schneiden und mit ca. 5 cm Abstand aufs Blech setzen. Die Schnittflächen mit Ei bestreichen.\n5. Backen: 30 Minuten backen, bis die Schnecken goldbraun sind. Vor dem Servieren kurz abkühlen lassen.\n\nNOTES\nMit fertigem Blätterteig von der Rolle zwei Rollen nebeneinanderlegen oder zwei kleinere Rollen machen. Das Chutney schmeckt auch als Dip oder auf Sandwiches."],["Schnelles Kokos-Dal mit Tomaten Sambol","Schnelles Kokos-Dal mit Tomaten-Sambol (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nMildes rotes Linsendal mit Kokosmilch, Zitronengras und Curryblättern, dazu ein frisches Tomaten-Kokos-Sambol\n\nINGREDIENTS\n• 2 tablespoons Rapsöl\n• 1 rote Zwiebel, fein gehackt\n• 10 frische Curryblätter, plus einige zum Garnieren (Asialaden; kann man weglassen)\n• 2 Knoblauchzehen, zerdrückt\n• 1 grüne Chilischote, entkernt, sehr fein gehackt\n• 1 Zitronengras, längs halbiert (Alternative: Abrieb ½ Limette, oder weglassen)\n• 1 Zimtstange, in der Mitte gebrochen\n• 150 grams rote Linsen\n• 0.3 teaspoons gemahlene Kurkuma\n• 400 milliliters Kokosmilch (Dose)\n• 400 milliliters Wasser\n• 1.3 teaspoons Salz (Dal)\n• 0.5 tablespoons Limettensaft (Dal, ½ Limette)\n• 40 grams Kokosraspel\n• 1 rote Chilischote, entkernt, sehr fein gehackt\n• 100 grams Kirschtomaten, gehackt\n• 1 tablespoons Limettensaft (Sambol)\n• 0.5 teaspoons Salz (Sambol)\n\nSTEPS\n1. Anbraten: 1 EL Öl in einem Topf erhitzen. Drei Viertel von 1 rote Zwiebel, fein gehackt (Rest fürs Sambol), 10 frische Curryblätter, plus einige zum Garnieren (Asialaden; kann man weglassen), 2 Knoblauchzehen, zerdrückt, 1 grüne Chilischote, entkernt, sehr fein gehackt, 1 Zitronengras, längs halbiert (Alternative: Abrieb ½ Limette, oder weglassen) und 1 Zimtstange, in der Mitte gebrochen bei mittlerer Hitze 5 Minuten anbraten.\n2. Dal kochen: 150 grams rote Linsen und 0.3 teaspoons gemahlene Kurkuma unterrühren, 400 milliliters Kokosmilch (Dose) und 400 milliliters Wasser zugießen (die leere Dose zum Abmessen nehmen). Aufkochen und 20–25 Minuten köcheln lassen, bis die Linsen weich, aber noch leicht bissfest sind. Bei Bedarf Wasser nachgießen. Mit 1.3 teaspoons Salz (Dal) und 0.5 tablespoons Limettensaft (Dal, ½ Limette) abschmecken.\n3. Sambol: Währenddessen 40 grams Kokosraspel mit 3 EL kochendem Wasser verrühren. Die restliche Zwiebel, 1 rote Chilischote, entkernt, sehr fein gehackt, 100 grams Kirschtomaten, gehackt, 1 tablespoons Limettensaft (Sambol) und 0.5 teaspoons Salz (Sambol) zugeben und gut vermischen.\n4. Curryblätter: Zimt und Zitronengras aus dem Dal entfernen. 1 EL Öl in einer kleinen Pfanne stark erhitzen und die restlichen Curryblätter knusprig braten.\n5. Servieren: Das Dal in Schüsseln füllen, die Curryblätter darübergeben und das Sambol obendrauf oder separat reichen. Mit Reis oder Paratha servieren.\n\nNOTES\nIn 5 Minuten ist alles im Topf, der Rest kocht von allein. Die Kartoffel-Parathas passen gut dazu."],["Misobrownies mit Meersalz","Misobrownies mit Meersalz (siehe Asien Vegetarisch - Meera Sodha Seite XX)\nVegane, fest-cremige Schokobrownies mit Salzkaramell-Note durch weißes Miso und Meersalz – ergibt 16 Stück\n\nINGREDIENTS\n• 5 tablespoons gemahlene Chiasamen (ganze Samen selbst mahlen; Alternative: 3 Eier statt Chia + Wasser)\n• 270 milliliters Wasser\n• 150 grams neutrales (desodoriertes) Kokosöl (Alternative: Butter)\n• 250 grams Bitterschokolade 70 %, in kleinen Stücken (für vegan: vegane Bitterschokolade)\n• 350 grams heller Muscovadozucker (Alternative: brauner Zucker)\n• 120 grams Mehl\n• 3 tablespoons weißes Miso\n• 0.8 teaspoons Meersalzflocken\n\nSTEPS\n1. Vorbereiten: Ofen auf 200 °C vorheizen und eine Form (20 × 20 cm) mit Backpapier auslegen. 5 tablespoons gemahlene Chiasamen (ganze Samen selbst mahlen; Alternative: 3 Eier statt Chia + Wasser) mit 270 milliliters Wasser verrühren und quellen lassen.\n2. Schmelzen: 150 grams neutrales (desodoriertes) Kokosöl (Alternative: Butter) und 250 grams Bitterschokolade 70 %, in kleinen Stücken (für vegan: vegane Bitterschokolade) in einem Topf bei schwacher Hitze unter gelegentlichem Rühren schmelzen und vom Herd nehmen.\n3. Teig: 350 grams heller Muscovadozucker (Alternative: brauner Zucker), 120 grams Mehl, 3 tablespoons weißes Miso und 0.8 teaspoons Meersalzflocken unterrühren, dann die gequollenen Chiasamen zugeben und alles gut vermischen. In die Form gießen und durch Schwenken gleichmäßig verteilen.\n4. Backen: Auf mittlerer Schiene 45 Minuten backen. In der Mitte dürfen sie noch etwas weich sein, beim Abkühlen werden sie cremig.\n5. Abkühlen: Vollständig abkühlen lassen und in 16 Quadrate schneiden.\n\nNOTES\nWeißes Miso habt ihr im Vorrat. Gekühlt lassen sich die Brownies sauberer schneiden."],["Pad Krakow mit Auberginen, Bohnen & Tofu","Pad Krawow mit Auberginen, Bohnen & Tofu (siehe Happy - Meera Sodha Seite 23)\nThailändische Gemüsepfanne mit Heiligem Basilikum: geröstete Auberginen und Bohnen, knuspriger Tofu, süß-salzige Sauce\n\nINGREDIENTS\n• 650 grams große Auberginen, in 2,5-cm-Würfeln\n• 8 tablespoons Rapsöl (4 EL Auberginen + 2 EL Tofu + 2 EL Pfanne)\n• 1 teaspoons Salz\n• 300 grams dünne grüne Bohnen, geputzt\n• 280 grams extrafester Tofu, abgetropft, in 1,5-cm-Würfeln\n• 250 grams Bananenschalotten, in feinen Ringen (Alternative: normale Schalotten oder 2 Zwiebeln)\n• 1 Stück Ingwer (2 × 2 cm), gerieben\n• 7 Knoblauchzehen, zerdrückt\n• 3 Vogelaugenchilis, fein gehackt (Alternative: jede scharfe frische Chili)\n• 1.5 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker)\n• 3 tablespoons Ketjap manis (Alternative: 2 EL Sojasauce + 1 EL brauner Zucker)\n• 3 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker)\n• 1.5 tablespoons geröstetes Sesamöl\n• 25 grams Heiliges Basilikum oder Thai-Basilikum, Blätter gezupft (Alternative: normales Basilikum + ein paar Minzblätter)\n• 1 Limette, halbiert\n• 1 Vogelaugenchili in Ringen zum Servieren (optional)\n\nSTEPS\n1. Gemüse rösten: Ofen auf 220 °C Umluft vorheizen. 650 grams große Auberginen, in 2,5-cm-Würfeln mit viel Abstand auf ein oder zwei Bleche mit Backpapier verteilen, mit 4 EL Öl beträufeln, mit 1 teaspoons Salz bestreuen, mischen und 30 Minuten rösten. 300 grams dünne grüne Bohnen, geputzt dazugeben, im Öl wenden und weitere 10 Minuten rösten, bis alles weich ist.\n2. Tofu braten: 280 grams extrafester Tofu, abgetropft, in 1,5-cm-Würfeln trocken tupfen. 2 EL Öl in einer großen beschichteten Pfanne erhitzen und den Tofu rundum knusprig braun braten. Auf einen Teller geben.\n3. Sauce: Weitere 2 EL Öl in der Pfanne erhitzen. 250 grams Bananenschalotten, in feinen Ringen (Alternative: normale Schalotten oder 2 Zwiebeln), 1 Stück Ingwer (2 × 2 cm), gerieben, 7 Knoblauchzehen, zerdrückt und 3 Vogelaugenchilis, fein gehackt (Alternative: jede scharfe frische Chili) unter Rühren 10 Minuten braten, bis die Schalotten weich sind. 1.5 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker), 3 tablespoons Ketjap manis (Alternative: 2 EL Sojasauce + 1 EL brauner Zucker), 3 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker) und 1.5 tablespoons geröstetes Sesamöl einrühren und 2 Minuten köcheln lassen.\n4. Vereinen: Vom Herd nehmen. Geröstetes Gemüse, Tofu und die Hälfte von 25 grams Heiliges Basilikum oder Thai-Basilikum, Blätter gezupft (Alternative: normales Basilikum + ein paar Minzblätter) unterrühren.\n5. Servieren: Mit dem Saft von 1 Limette, halbiert beträufeln, mit dem restlichen Basilikum und nach Wunsch 1 Vogelaugenchili in Ringen zum Servieren (optional) bestreuen. Mit Jasminreis servieren.\n\nNOTES\nHeiliges Basilikum gibt es im Asialaden, Thai-Basilikum ist dort meist leichter zu finden. Das Basilikum erst ganz am Ende unterheben, sonst verliert es sein Aroma."],["Auberginen-Donburi","Auberginen-Donburi (siehe Happy - Meera Sodha Seite 35)\nJapanische Reisschale mit gebratenen Auberginen in glänzender Sake-Soja-Mirin-Sauce und karamellisiertem Ingwer-Frühlingszwiebel-Topping\n\nINGREDIENTS\n• 350 grams Kurzkornreis (Sushireis; Alternative: Milchreis)\n• 400 milliliters kaltes Wasser (Reis)\n• 4 tablespoons Kochsake\n• 4 tablespoons helle Sojasauce\n• 2.5 tablespoons Mirin\n• 2 Knoblauchzehen, zerdrückt\n• 900 grams Auberginen, längs in 1 cm dicken Scheiben\n• 6 tablespoons Rapsöl (Topping, plus mehr zum Braten)\n• 1 Stück Ingwer (6 × 6 cm), in feinen Stiften\n• 6 Frühlingszwiebeln, fein gehackt\n• 0.5 teaspoons Salz\n• 2 teaspoons Weißweinessig\n\nSTEPS\n1. Reis: 350 grams Kurzkornreis (Sushireis; Alternative: Milchreis) waschen, bis das Wasser klar ist. In einem Topf mit Deckel mit warmem Wasser bedeckt 5 Minuten einweichen, abgießen, mit 400 milliliters kaltes Wasser (Reis) zugedeckt aufkochen. Auf kleinster Stufe 12 Minuten garen, dann vom Herd nehmen und geschlossen stehen lassen.\n2. Donburi-Sauce: 4 tablespoons Kochsake, 4 tablespoons helle Sojasauce, 2.5 tablespoons Mirin, 2 Knoblauchzehen, zerdrückt und eine Prise der Ingwerstifte vermischen.\n3. Topping: Ein Blech mit Küchenpapier auslegen. 6 tablespoons Rapsöl (Topping, plus mehr zum Braten) in einer weiten Pfanne bei mittlerer Hitze erhitzen und den restlichen Ingwer mit 6 Frühlingszwiebeln, fein gehackt ca. 8 Minuten braten, bis sie weich sind und karamellisieren. In eine Schüssel geben und 0.5 teaspoons Salz und 2 teaspoons Weißweinessig unterrühren.\n4. Auberginen braten: Bei Bedarf Öl nachgeben und 900 grams Auberginen, längs in 1 cm dicken Scheiben portionsweise je Seite 3 Minuten braten, bis sie weich sind. Auf dem Küchenpapier abtropfen lassen.\n5. Glasieren: Alle Auberginen zurück in die Pfanne schichten, schwache Hitze einstellen, die Sauce darübergießen und 2 Minuten köcheln lassen, bis sie eindickt und glänzt. Droht sie zu verschwinden, etwas Wasser zugeben.\n6. Servieren: Den Reis auf vier Schalen verteilen und zu Kuppeln formen. Auberginen darauflegen, mit Sauce beträufeln und das Topping darauf verteilen.\n\nNOTES\nWenn es schnell gehen muss, statt des gebratenen Toppings einfach frische Ingwerstifte und Frühlingszwiebelringe darüberstreuen. Sake und Mirin habt ihr im Vorrat."],["Geschmorter Kimchi mit Tofu & Brokkolini","Geschmorter Kimchi mit Tofu & Brokkolini (siehe Happy - Meera Sodha Seite 59)\nHerzhafter koreanischer Kimchi-Eintopf (Kimchi-Jjigae) mit Austernpilzen, Tofu und Brokkolini\n\nINGREDIENTS\n• 3 tablespoons Rapsöl\n• 1 Zwiebel, fein gewürfelt\n• 2 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (1,5 × 1,5 cm), fein gerieben\n• 300 grams Kimchi (für vegan ohne Fischsauce)\n• 1 tablespoons Gochujang (Alternative: 2 TL Sriracha + 1 TL Miso)\n• 1 tablespoons Honig oder Agavensirup\n• 200 grams Austernpilze, in Streifen gezupft (Alternative: Kräuterseitlinge oder Champignons)\n• 1 liters Gemüsebrühe\n• 400 grams extrafester Tofu, abgetropft, in 5 mm dicken Scheiben\n• 250 grams Brokkolini, längs halbiert (Alternative: Brokkoli in schmalen Röschen oder Pak Choi)\n• 0.5 teaspoons Salz (nach Bedarf)\n• 2 Frühlingszwiebeln, längs in feinen Streifen\n\nSTEPS\n1. Zwiebel: 3 tablespoons Rapsöl in einer Schmorpfanne bei mittlerer Hitze erhitzen und 1 Zwiebel, fein gewürfelt 8 Minuten weich braten.\n2. Kimchi: 2 Knoblauchzehen, zerdrückt, 1 Stück Ingwer (1,5 × 1,5 cm), fein gerieben und 300 grams Kimchi (für vegan ohne Fischsauce) unterrühren und ca. 10 Minuten braten, bis der Kimchi zu karamellisieren beginnt. 1 tablespoons Gochujang (Alternative: 2 TL Sriracha + 1 TL Miso) und 1 tablespoons Honig oder Agavensirup einrühren, dann 200 grams Austernpilze, in Streifen gezupft (Alternative: Kräuterseitlinge oder Champignons) 3 Minuten mitbraten.\n3. Schmoren: 1 liters Gemüsebrühe angießen, aufkochen und bei sehr schwacher Hitze 10 Minuten köcheln lassen.\n4. Tofu & Brokkolini: 400 grams extrafester Tofu, abgetropft, in 5 mm dicken Scheiben fächerförmig auf eine Seite der Pfanne legen, 250 grams Brokkolini, längs halbiert (Alternative: Brokkoli in schmalen Röschen oder Pak Choi) auf die andere. Etwas anstupsen, damit sie teilweise in der Brühe liegen. 6–8 Minuten köcheln lassen, bis die Brokkolini weich sind. Mit 0.5 teaspoons Salz (nach Bedarf) abschmecken.\n5. Servieren: In der Pfanne auf den Tisch stellen, mit 2 Frühlingszwiebeln, längs in feinen Streifen bestreuen und mit Jasminreis servieren.\n\nNOTES\nJe älter und saurer der Kimchi, desto besser für diesen Eintopf. Gochujang und Kimchi gibt es inzwischen auch in größeren Supermärkten."],["Tandoori-Blumenkohl mit Koriander-Cashew-Sauce","Tandoori-Blumenkohl mit Koriander-Cashew-Sauce (siehe Happy - Meera Sodha Seite 60)\nBlumenkohlsteaks in würziger Joghurt-Tandoori-Marinade, im Ofen gebräunt, auf grüner Koriander-Cashew-Sauce mit gepickelten Zwiebeln\n\nINGREDIENTS\n• 0.5 rote Zwiebel (halbe), in sehr feinen Streifen\n• 4 tablespoons Zitronensaft (Zwiebeln + Sauce, aus 2 Zitronen)\n• 1 teaspoons Salz (Zwiebeln + Sauce)\n• 100 grams Cashewkerne\n• 100 grams Koriandergrün, grob gehackt\n• 0.8 teaspoons Zucker\n• 3 kleine scharfe grüne Chilis, gehackt\n• 2 tablespoons Rapsöl (Sauce)\n• 450 grams griechischer Joghurt\n• 2 tablespoons Zitronensaft (Marinade, aus 1 Zitrone)\n• 5 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (2 × 2 cm), gerieben\n• 0.8 teaspoons gemahlene Kurkuma\n• 2 teaspoons Kashmiri-Chilipulver (Alternative: 1½ TL Paprika edelsüß + ½ TL Cayenne)\n• 2 teaspoons Salz (Marinade)\n• 1.5 teaspoons Garam Masala\n• 4 tablespoons Rapsöl (Marinade)\n• 2 teaspoons Colman's English Mustard (Alternative: scharfer Senf / Dijon)\n• 2 große Köpfe Blumenkohl, geputzt (ca. 1,6 kg)\n• 4 warmes gebuttertes Naan, zum Servieren\n\nSTEPS\n1. Gepickelte Zwiebeln: 0.5 rote Zwiebel (halbe), in sehr feinen Streifen mit 2 EL Zitronensaft und ½ TL Salz von Hand verkneten, damit sie mürbe werden. Beiseitestellen.\n2. Koriander-Cashew-Sauce: 100 grams Cashewkerne mit 125 ml kochendem Wasser 5 Minuten einweichen. Samt Wasser mit 100 grams Koriandergrün, grob gehackt, 0.8 teaspoons Zucker, 3 kleine scharfe grüne Chilis, gehackt, ½ TL Salz, 2 tablespoons Rapsöl (Sauce) und 2 EL Zitronensaft glatt pürieren und abschmecken.\n3. Vorbereiten: Zwei Bleche mit Backpapier auslegen und dünn einfetten. Ofen auf 220 °C Umluft vorheizen.\n4. Marinade & Steaks: 450 grams griechischer Joghurt bis 2 teaspoons Colman's English Mustard (Alternative: scharfer Senf / Dijon) verrühren. Jeden 2 große Köpfe Blumenkohl, geputzt (ca. 1,6 kg) aufrecht halbieren und von der Schnittfläche aus längs in 1,5 cm dicke Steaks schneiden. Die Steaks in die Marinade tauchen, abtropfen lassen und auf ein Blech legen. Die restlichen Röschen in der Marinade wenden und mit 2 cm Abstand aufs zweite Blech legen.\n5. Rösten: Röschen 20 Minuten, Steaks 25 Minuten im oberen Ofenbereich rösten, bis sie weich und stellenweise geschwärzt sind. Nach 10 Minuten die Bleche tauschen.\n6. Servieren: Je ein Viertel der Sauce auf einen Teller streichen, Blumenkohlsteaks und Röschen darauf anrichten und die gepickelten Zwiebeln dazugeben. Mit warmem 4 warmes gebuttertes Naan, zum Servieren essen.\n\nNOTES\nKashmiri-Chilipulver gibt die rote Farbe bei mäßiger Schärfe. Mit deinem Naan-Rezept besonders gut."],["Tofu-Kokos-Curry mit grünen Bohnen","Tofu-Kokos-Curry mit grünen Bohnen (siehe Happy - Meera Sodha Seite 75)\nScharfes, frisches Thai-inspiriertes Curry mit knusprigem Tofu, blasig gebratenen Bohnen, Ingwer, Kurkuma und Thai-Basilikum\n\nINGREDIENTS\n• 450 grams extrafester Tofu, abgetropft, in 2,5-cm-Würfeln\n• 4 tablespoons Rapsöl (3 EL Tofu + 1 EL Zwiebel)\n• 300 grams grüne Bohnen, geputzt\n• 1 Zwiebel, in feinen Ringen\n• 1 Stück Ingwer (5 × 4 cm, ca. 40 g), gerieben\n• 2 Vogelaugenchilis, in feinen Ringen (Alternative: jede scharfe frische Chili)\n• 1.5 teaspoons Zucker\n• 0.5 teaspoons gemahlene Kurkuma\n• 1.5 teaspoons Salz\n• 400 milliliters Kokosmilch (Dose)\n• 1.5 tablespoons Limettensaft (aus 1 Limette)\n• 25 grams Thai-Basilikum-Blätter (Alternative: normales Basilikum + ein paar Minzblätter)\n\nSTEPS\n1. Tofu braten: 450 grams extrafester Tofu, abgetropft, in 2,5-cm-Würfeln trocken tupfen. Einen Teller bereitstellen. 3 EL Öl in einer großen Pfanne sehr heiß werden lassen und den Tofu 6–8 Minuten braten, alle 1–2 Minuten wenden, bis er rundum goldbraun ist. Auf den Teller geben.\n2. Bohnen: 300 grams grüne Bohnen, geputzt in einer Schicht in die heiße Pfanne geben, 2 Minuten braten, bis sie Blasen werfen, wenden und wiederholen. Sobald alle braune Flecken haben, zum Tofu legen.\n3. Zwiebeln & Aromaten: 1 EL Öl richtig heiß werden lassen und 1 Zwiebel, in feinen Ringen unter Rühren 6 Minuten braten, bis sie glasig sind und an den Rändern bräunen. 1 Stück Ingwer (5 × 4 cm, ca. 40 g), gerieben und 2 Vogelaugenchilis, in feinen Ringen (Alternative: jede scharfe frische Chili) 2 Minuten mitbraten, dann 1.5 teaspoons Zucker, 0.5 teaspoons gemahlene Kurkuma und 1.5 teaspoons Salz unterrühren.\n4. Köcheln: 400 milliliters Kokosmilch (Dose), Tofu, Bohnen und 1.5 tablespoons Limettensaft (aus 1 Limette) zugeben, aufkochen und 5 Minuten ungestört köcheln lassen.\n5. Basilikum: 25 grams Thai-Basilikum-Blätter (Alternative: normales Basilikum + ein paar Minzblätter) unterrühren und 1 Minute zusammenfallen lassen. Mit Limettensaft und Salz abschmecken und mit Jasminreis servieren.\n\nNOTES\nEin schnelles Feierabend-Curry. Thai-Basilikum gibt es im Asialaden, normales Basilikum funktioniert zur Not auch."],["Matar Paneer","Matar Paneer (siehe Happy - Meera Sodha Seite 81)\nNordindisches Paneer-Erbsen-Curry, cremig durch Cashewpaste, mit gebratenen Zuckerschoten und Kirschtomaten\n\nINGREDIENTS\n• 40 grams Cashewkerne\n• 3 tablespoons Rapsöl (1 TL + 1 TL + 2 EL)\n• 100 grams Zuckerschoten\n• 150 grams reife Kirschtomaten\n• 1 große Zwiebel, fein gehackt\n• 3 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (2 × 2 cm), gerieben\n• 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative laut Buch: fester Tofu; sonst Halloumi)\n• 400 grams gehackte Tomaten (Dose)\n• 1.5 teaspoons Salz\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1.5 teaspoons gemahlener Koriander\n• 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne)\n• 0.5 teaspoons gemahlene Kurkuma\n• 150 grams TK-Erbsen\n• 4 Chapatis und griechischer Joghurt, zum Servieren\n\nSTEPS\n1. Cashewpaste: 40 grams Cashewkerne mit 100 ml kochendem Wasser 5 Minuten einweichen, dann samt Wasser glatt pürieren.\n2. Gemüse anbraten: 1 TL Öl in einer großen beschichteten Pfanne sehr heiß werden lassen. 100 grams Zuckerschoten 1 Minute kräftig braten, wenden, auch die andere Seite blasig werden lassen und auf einen Teller geben. 1 TL Öl zugeben und 150 grams reife Kirschtomaten ca. 5 Minuten braten, bis sie stellenweise sehr dunkel sind. Zu den Zuckerschoten geben.\n3. Zwiebel: 2 EL Öl bei mittlerer Hitze erhitzen und 1 große Zwiebel, fein gehackt 8 Minuten weich braten. 3 Knoblauchzehen, zerdrückt und 1 Stück Ingwer (2 × 2 cm), gerieben 2 Minuten mitbraten.\n4. Paneer & Tomaten: 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative laut Buch: fester Tofu; sonst Halloumi), 400 grams gehackte Tomaten (Dose), 1.5 teaspoons Salz und 200 ml Wasser zugeben und 10 Minuten köcheln lassen. Spritzt es, die Hitze etwas reduzieren.\n5. Gewürze & Cashew: 1 teaspoons gemahlener Kreuzkümmel, 1.5 teaspoons gemahlener Koriander, 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne) und 0.5 teaspoons gemahlene Kurkuma unterrühren und 2 Minuten köcheln lassen. Cashewpaste und 100 ml Wasser einrühren, Tomaten und Zuckerschoten zurückgeben, 150 grams TK-Erbsen unterrühren und noch 5 Minuten köcheln lassen.\n6. Servieren: In der Pfanne servieren, dazu 4 Chapatis und griechischer Joghurt, zum Servieren.\n\nNOTES\nZum Pürieren der Cashews wird ein Mixer oder Stabmixer gebraucht. Mit Tofu und Pflanzenjoghurt wird das Gericht vegan."],["Gebackener Butter-Paneer","Gebackener Butter-Paneer (siehe Happy - Meera Sodha Seite 99)\nPaneer Butter Masala aus dem Ofen: knusprig gebackener, marinierter Paneer in würziger Tomaten-Sahne-Sauce\n\nINGREDIENTS\n• 4 tablespoons Rapsöl (zum Einfetten + 3 EL)\n• 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative: Halloumi oder fester Tofu)\n• 6 Knoblauchzehen, zerdrückt (aufgeteilt)\n• 1 Stück Ingwer (2 × 2 cm), fein gerieben (aufgeteilt)\n• 1 teaspoons Kashmiri-Chilipulver (Marinade; Alternative: Paprika edelsüß + Prise Cayenne)\n• 0.5 tablespoons Zitronensaft (aus ½ Zitrone)\n• 0.8 teaspoons Salz (Marinade)\n• 0.5 teaspoons gemahlene Kurkuma\n• 5 tablespoons griechischer Joghurt\n• 1 teaspoons Kashmiri-Chilipulver (Sauce)\n• 1 teaspoons Garam Masala\n• 1 teaspoons gemahlener Kreuzkümmel\n• 0.5 teaspoons gemahlener Kardamom\n• 0.8 teaspoons Salz (Sauce)\n• 2 tablespoons flüssiger Honig\n• 800 grams gehackte Tomaten (2 Dosen à 400 g)\n• 150 grams Sahne\n• 1.5 tablespoons Kasoori Methi / getr. Bockshornkleeblätter (Asialaden; kann man weglassen)\n• 20 grams Butter (optional, zum Schluss)\n\nSTEPS\n1. Vorbereiten: Ofen auf 220 °C Umluft vorheizen. Eine ofenfeste Form (ca. 20 × 30 cm) mit Backpapier auslegen und das Papier mit etwas Öl bestreichen.\n2. Paneer marinieren & backen: 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative: Halloumi oder fester Tofu) mit der Hälfte von 6 Knoblauchzehen, zerdrückt (aufgeteilt) und 1 Stück Ingwer (2 × 2 cm), fein gerieben (aufgeteilt), 1 teaspoons Kashmiri-Chilipulver (Marinade; Alternative: Paprika edelsüß + Prise Cayenne), 0.5 tablespoons Zitronensaft (aus ½ Zitrone), 0.8 teaspoons Salz (Marinade), 0.5 teaspoons gemahlene Kurkuma und 5 tablespoons griechischer Joghurt gründlich mischen. In die Form geben und 25 Minuten backen, bis der Paneer knusprig ist und an den Kanten leicht schwarz wird.\n3. Sauce in der Form: Die Form herausnehmen und das Backpapier vorsichtig entfernen, der Paneer bleibt in der Form. 3 EL Öl mit dem restlichen Knoblauch und Ingwer zugeben und verrühren. 1 teaspoons Kashmiri-Chilipulver (Sauce), 1 teaspoons Garam Masala, 1 teaspoons gemahlener Kreuzkümmel, 0.5 teaspoons gemahlener Kardamom, 0.8 teaspoons Salz (Sauce) und 2 tablespoons flüssiger Honig unterrühren, dann 800 grams gehackte Tomaten (2 Dosen à 400 g) zugeben. Der Paneer muss vollständig bedeckt sein.\n4. Weiterbacken: Die Form für 30 Minuten zurück in den Ofen stellen.\n5. Sahne & Methi: 150 grams Sahne einrühren, 1.5 tablespoons Kasoori Methi / getr. Bockshornkleeblätter (Asialaden; kann man weglassen) darüberkrümeln und weitere 10 Minuten backen.\n6. Servieren: Nach Belieben 20 grams Butter (optional, zum Schluss) unterrühren und sofort in der Form mit heißem Naan servieren.\n\nNOTES\nFast alles passiert im Ofen, kaum Arbeit am Herd. Dein Naan-Rezept passt perfekt dazu."],["Eier mit buttriger Sojasauce & Nori ","Eier mit buttriger Sojasauce & Nori (siehe Happy - Meera Sodha Seite 102)\nKoreanisch inspiriertes Gyeran Bap: Spiegeleier auf Reis, übergossen mit Soja-Mirin-Butter und Nori-Stücken\n\nINGREDIENTS\n• 200 grams Kurzkorn- oder Sushireis (Alternative: Milchreis)\n• 300 milliliters Wasser (Reis)\n• 2.5 tablespoons helle Sojasauce\n• 2 tablespoons Mirin\n• 2 tablespoons geröstetes Sesamöl\n• 1 Noriblatt, in ungleichmäßige Stücke gezupft (kann man weglassen, dann Frühlingszwiebeln darüber)\n• 40 grams Butter, gewürfelt\n• 1 tablespoons Rapsöl\n• 4 Eier (2–4, je nach Appetit)\n\nSTEPS\n1. Reis waschen: 200 grams Kurzkorn- oder Sushireis (Alternative: Milchreis) in einem Topf mit fest schließendem Deckel mit lauwarmem Wasser bedecken, mit der Hand rühren und abgießen. Wiederholen, bis das Wasser klar ist. Dann mit warmem Wasser bedeckt 5 Minuten einweichen und abtropfen lassen.\n2. Reis kochen: Reis mit 300 milliliters Wasser (Reis) zugedeckt bei mittlerer Hitze aufkochen, sofort die Hitze herunterschalten und 10 Minuten köcheln. Vom Herd nehmen und geschlossen 10 Minuten stehen lassen.\n3. Sauce: Währenddessen 2.5 tablespoons helle Sojasauce, 2 tablespoons Mirin und 2 tablespoons geröstetes Sesamöl in eine kleine Schüssel gießen und 1 Noriblatt, in ungleichmäßige Stücke gezupft (kann man weglassen, dann Frühlingszwiebeln darüber) darauflegen.\n4. Eier braten: 40 grams Butter, gewürfelt und 1 tablespoons Rapsöl in einer großen beschichteten Pfanne bei mittlerer Hitze erhitzen. Wenn das Fett schäumt, 4 Eier (2–4, je nach Appetit) hineinschlagen und mit der Butter übergießen. 3–3½ Minuten braten für flüssiges Eigelb und auf einen Teller heben.\n5. Butter-Soja: Die Sojasaucenmischung mit den Noristücken in die heiße Pfanne gießen und mit der Butter vermischen.\n6. Servieren: Reis auf zwei Schalen verteilen, Eier daraufsetzen und mit der buttrigen Soja-Nori-Mischung begießen. Sofort essen.\n\nNOTES\nNori gibt es als Sushi-Nori im gut sortierten Supermarkt. Passt in den Frühstücks-Tab oder als schnelles Abendessen."],["Chili-Paneer auf koreanische Art","Chili-Paneer auf koreanische Art (siehe Happy - Meera Sodha Seite 115)\nGebratener Paneer mit Blattgemüse in glänzender süß-scharfer Gochujang-Sesam-Sauce\n\nINGREDIENTS\n• 2 tablespoons Gochujang (Alternative: 1 EL Sriracha + 1 EL Miso)\n• 1.5 tablespoons Reissirup oder flüssiger Honig\n• 2 tablespoons helle Sojasauce\n• 2 tablespoons geröstetes Sesamöl\n• 1.5 teaspoons Weißweinessig\n• 3 tablespoons Rapsöl\n• 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative: Halloumi oder fester Tofu)\n• 4 Knoblauchzehen, zerdrückt\n• 4 Frühlingszwiebeln, in feinen Ringen\n• 1 Stück Ingwer (2 × 2 cm), in dünnen Stiften\n• 300 grams zartes Blattgemüse (z. B. Spinat, Mangold, Pak Choi), in 1,5 cm breiten Streifen\n\nSTEPS\n1. Sauce: Den Reis für die Beilage zuerst aufsetzen. 2 tablespoons Gochujang (Alternative: 1 EL Sriracha + 1 EL Miso) und 1.5 tablespoons Reissirup oder flüssiger Honig mischen, dann 2 tablespoons helle Sojasauce, 2 tablespoons geröstetes Sesamöl, 1.5 teaspoons Weißweinessig und 3 EL Wasser glatt einrühren.\n2. Paneer braten: 2 EL 3 tablespoons Rapsöl in einer großen beschichteten Pfanne bei mittlerer Hitze erhitzen. 500 grams fester Paneer, in 2,5-cm-Würfeln (Alternative: Halloumi oder fester Tofu) 6 Minuten braten und etwa jede Minute wenden, bis er hell- bis mittelbraun ist. In eine Schüssel geben, das Öl in der Pfanne lassen.\n3. Aromaten: Bei Bedarf noch 1 EL Öl zugeben. 4 Knoblauchzehen, zerdrückt, 4 Frühlingszwiebeln, in feinen Ringen und 1 Stück Ingwer (2 × 2 cm), in dünnen Stiften 1 Minute pfannenrühren, dann Paneer und Sauce zugeben und 2 Minuten blubbern lassen.\n4. Gemüse: 300 grams zartes Blattgemüse (z. B. Spinat, Mangold, Pak Choi), in 1,5 cm breiten Streifen nach und nach zugeben und alles 6–8 Minuten braten, bis das Gemüse dunkel und ölig ist und eine glasurartige Sauce alles überzieht.\n5. Servieren: Paneer und Kurzkornreis getrennt in Schüsseln auf den Tisch stellen, jeder bedient sich selbst.\n\nNOTES\nSchnelles Alltagsgericht. Gochujang gibt es im Asialaden und in vielen Supermärkten."],["Tofu mit Zwiebeln & schwarzen Bohnen","Tofu mit Zwiebeln & schwarzen Bohnen (siehe Happy - Meera Sodha Seite 133)\nChina-Imbiss-Klassiker zu Hause: knuspriger Tofu mit Paprika und Zwiebeln in Schwarze-Bohnen-Sauce\n\nINGREDIENTS\n• 4 tablespoons Speisestärke (1 EL Sauce + 3 EL Tofu)\n• 560 grams extrafester Tofu, abgetropft, in 2-cm-Würfeln (2 Packungen à 280 g)\n• 4 tablespoons Rapsöl (2 EL Tofu + 2 EL Gemüse)\n• 2 Zwiebeln, in 2 × 2 cm großen Stücken, Schichten getrennt\n• 2 rote Paprikaschoten, in 2-cm-Würfeln\n• 1 teaspoons Salz\n• 1 Stück Ingwer (4 × 2 cm), fein gehackt\n• 4 Knoblauchzehen, in hauchdünnen Scheiben\n• 4 tablespoons gesalzene fermentierte schwarze Bohnen, gründlich abgespült, gehackt (Asialaden; Alternative: 3 EL fertige Schwarze-Bohnen-Sauce, dann die Sojasauce halbieren)\n• 2 rote Chilis, in Ringen\n• 3 tablespoons Weißweinessig\n• 3 tablespoons helle Sojasauce\n\nSTEPS\n1. Stärke anrühren: 1 EL 4 tablespoons Speisestärke (1 EL Sauce + 3 EL Tofu) mit 100 ml Wasser verrühren. Die restlichen 3 EL Stärke in einen tiefen Teller geben.\n2. Tofu bestäuben: 560 grams extrafester Tofu, abgetropft, in 2-cm-Würfeln (2 Packungen à 280 g) trocken tupfen und in der Stärke wenden, bis er rundum umhüllt ist.\n3. Tofu braten: 2 EL Öl in einer großen hohen beschichteten Pfanne bei mittlerer Hitze erhitzen und den Tofu je Seite 4–6 Minuten goldbraun braten, bei Bedarf in zwei Durchgängen. Beiseitestellen.\n4. Gemüse: 2 EL Öl bei mittlerer bis hoher Hitze erhitzen. 2 Zwiebeln, in 2 × 2 cm großen Stücken, Schichten getrennt, 2 rote Paprikaschoten, in 2-cm-Würfeln und 1 teaspoons Salz ca. 6 Minuten braten, bis sie an den Rändern schwarz werden, dabei jede Minute schwenken. 1 Stück Ingwer (4 × 2 cm), fein gehackt und 4 Knoblauchzehen, in hauchdünnen Scheiben 2 Minuten mitbraten, dann 4 tablespoons gesalzene fermentierte schwarze Bohnen, gründlich abgespült, gehackt (Asialaden; Alternative: 3 EL fertige Schwarze-Bohnen-Sauce, dann die Sojasauce halbieren) und 2 rote Chilis, in Ringen unterrühren.\n5. Sauce: Tofu, angerührte Stärke, 3 tablespoons Weißweinessig und 3 tablespoons helle Sojasauce zugeben, aufkochen und schwenken, bis der Tofu von der angedickten Sauce überzogen ist. Mit Jasminreis servieren.\n\nNOTES\nFermentierte schwarze Bohnen (z. B. Marke Zheng Feng) halten ewig, eine Packung reicht für viele Gerichte, auch für den Mapo-Tofu aus dem anderen Buch."],["Congee mit Staudensellerie & Shiitakepilzen","Congee mit Staudensellerie & Shiitakepilzen (siehe Happy - Meera Sodha Seite 137)\nTröstlicher Reisbrei mit Miso, Ingwer und Sellerie, getoppt mit glasierten Shiitake und schnell eingelegtem Sellerie\n\nINGREDIENTS\n• 500 grams Staudensellerie (1 Staude)\n• 2 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker)\n• 6 tablespoons Mirin (2 EL Pickle + 2 EL Congee + 2 EL Pilze)\n• 25 grams getrocknete Shiitakepilze (Alternative: getrocknete Steinpilze oder Mischpilze)\n• 3 tablespoons Rapsöl\n• 1 Zwiebel, fein gewürfelt\n• 2 Frühlingszwiebeln, Weißes und Grünes getrennt in feinen Ringen\n• 5 Knoblauchzehen, zerdrückt\n• 1.5 teaspoons Salz\n• 1 Stück Ingwer (2 × 2 cm), gerieben\n• 150 grams Jasminreis\n• 2 tablespoons Shiro-Miso (süßes weißes Miso)\n• 2 tablespoons helle Sojasauce\n• 0.5 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker)\n• 4 tablespoons Röstzwiebeln (Fertigprodukt, optional)\n\nSTEPS\n1. Sellerie vorbereiten: Vom 500 grams Staudensellerie (1 Staude) den Wurzelansatz abschneiden. Ein Drittel der Stangen in feine Scheiben schneiden und mit 2 tablespoons Reisessig (Alternative: Weißweinessig + Prise Zucker) und 2 EL Mirin in einer kleinen Schüssel ziehen lassen. Die restlichen Stangen in 5-mm-Würfel schneiden.\n2. Pilze einweichen: 25 grams getrocknete Shiitakepilze (Alternative: getrocknete Steinpilze oder Mischpilze) in einem hitzefesten Messbecher mit 750 ml kochendem Wasser übergießen. Sobald sie anfassbar sind, über dem Becher ausdrücken. Pilze und Einweichwasser aufheben.\n3. Anschwitzen: 3 tablespoons Rapsöl in einem großen Topf mit Deckel bei mittlerer Hitze erhitzen. 1 Zwiebel, fein gewürfelt, das Weiße von 2 Frühlingszwiebeln, Weißes und Grünes getrennt in feinen Ringen, 5 Knoblauchzehen, zerdrückt und 1.5 teaspoons Salz 4 Minuten anschwitzen, ohne dass sie Farbe nehmen. Selleriewürfel und 1 Stück Ingwer (2 × 2 cm), gerieben 5 Minuten mitgaren und rühren.\n4. Congee kochen: 150 grams Jasminreis, 2 tablespoons Shiro-Miso (süßes weißes Miso), 2 EL Mirin, 600 ml Wasser und das Pilzwasser zugeben (bis auf den letzten Esslöffel mit Bodensatz). Aufkochen, abschäumen, Deckel schräg auflegen und 30 Minuten köcheln lassen.\n5. Pilze glasieren: Währenddessen die Pilze in Scheiben schneiden (kleine ganz lassen) und mit 2 tablespoons helle Sojasauce, 0.5 tablespoons dunkle Sojasauce (Alternative: helle Sojasauce + Prise Zucker) und 2 EL Mirin in einem kleinen Topf bei schwacher Hitze aufkochen. 10 Minuten auf kleinster Stufe köcheln lassen, bis keine Flüssigkeit mehr da ist.\n6. Servieren: Congee in Schalen schöpfen und je ein Viertel der Pilze, etwas eingelegten Sellerie, das Grün der Frühlingszwiebeln und nach Wunsch 4 tablespoons Röstzwiebeln (Fertigprodukt, optional) daraufgeben. Heiß servieren.\n\nNOTES\nShiro-Miso habt ihr im Vorrat. Damit das Congee cremeweiß bleibt, kein dunkles Miso nehmen."],["Irakischer Weiße-Bohnen-Eintopf","Irakischer Weiße-Bohnen-Eintopf (siehe Happy - Meera Sodha Seite 148)\nFasoulia: weiße Bohnen in würziger Tomatensauce mit Zimt, Piment und Kreuzkümmel, dazu Zitronen-Koriander-Öl\n\nINGREDIENTS\n• 7 tablespoons Rapsöl (3 EL Eintopf + 4 EL Zitronenöl)\n• 2 Zwiebeln, fein gehackt\n• 1 teaspoons Salz (Eintopf)\n• 0.5 teaspoons gemahlener schwarzer Pfeffer\n• 0.5 teaspoons gemahlener Zimt\n• 1 teaspoons gemahlener Piment\n• 0.5 teaspoons gemahlener Kreuzkümmel\n• 50 grams Koriandergrün, Stiele und Blätter getrennt fein gehackt\n• 400 grams gehackte Tomaten (Dose)\n• 480 grams Cannellini-Bohnen, abgetropft (2 Dosen à 400 g)\n• 1 Bio-Zitrone, Schale abgerieben und 3 EL Saft\n• 0.3 teaspoons Salz (Zitronenöl)\n\nSTEPS\n1. Zwiebeln & Gewürze: Den Basmatireis für die Beilage zuerst aufsetzen. 3 EL 7 tablespoons Rapsöl (3 EL Eintopf + 4 EL Zitronenöl) in einem großen Topf mit schwerem Boden bei mittlerer Hitze erhitzen. 2 Zwiebeln, fein gehackt mit 1 teaspoons Salz (Eintopf), 0.5 teaspoons gemahlener schwarzer Pfeffer, 0.5 teaspoons gemahlener Zimt, 1 teaspoons gemahlener Piment, 0.5 teaspoons gemahlener Kreuzkümmel und den Korianderstielen unter gelegentlichem Rühren 20 Minuten garen, bis sie weich und dunkel sind. Nicht ansetzen lassen.\n2. Köcheln: 400 grams gehackte Tomaten (Dose), 480 grams Cannellini-Bohnen, abgetropft (2 Dosen à 400 g) und 200 ml Wasser zugeben, aufkochen und 10 Minuten köcheln lassen.\n3. Zitronen-Koriander-Öl: 4 EL Öl mit den Korianderblättern, Schale und Saft von 1 Bio-Zitrone, Schale abgerieben und 3 EL Saft und 0.3 teaspoons Salz (Zitronenöl) verrühren.\n4. Servieren: Den Eintopf in eine Serviersschüssel füllen, das Zitronen-Koriander-Öl darübergeben und mit einer Schüssel Basmatireis servieren.\n\nNOTES\nStatt der Einzelgewürze geht auch 2 TL Baharat-Gewürzmischung. Lässt sich leicht verdoppeln, ideal für viele Gäste. Passt auch in die Herbst-Eintopf-Sammlung."],["Aloo Palak auf pakistanische Art","Aloo Palak auf pakistanische Art (siehe Happy - Meera Sodha Seite 187)\nSaftige Kartoffeln in öligem, würzigem Spinat-Tomaten-Curry mit Senf, Kreuzkümmel und Zitrone\n\nINGREDIENTS\n• 120 milliliters Rapsöl\n• 1 teaspoons schwarze Senfkörner (Alternative: gelbe Senfsaat, oder weglassen)\n• 1 teaspoons Kreuzkümmelsamen\n• 2 Zwiebeln, fein gehackt\n• 6 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (3 × 2 cm), gerieben\n• 2 kleine scharfe grüne Chilis (1–2), fein gehackt\n• 200 grams Tomaten, gehackt\n• 1.5 teaspoons gemahlener Kreuzkümmel\n• 2 teaspoons gemahlener Koriander\n• 0.5 teaspoons gemahlene Kurkuma\n• 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne)\n• 2 teaspoons Salz\n• 450 grams mehligkochende Kartoffeln, geschält, halbiert und in 1,5 cm dicken Scheiben\n• 1 kilograms TK-Blattspinat, aufgetaut\n• 2 teaspoons Zitronensaft (2–3 TL, aus 1 Zitrone)\n\nSTEPS\n1. Gewürze rösten: 120 milliliters Rapsöl in einer großen hohen Pfanne bei mittlerer Temperatur sehr heiß werden lassen. 1 teaspoons schwarze Senfkörner (Alternative: gelbe Senfsaat, oder weglassen) und 1 teaspoons Kreuzkümmelsamen vorsichtig hineingeben und bis zu 1 Minute knistern lassen.\n2. Zwiebeln: 2 Zwiebeln, fein gehackt 8 Minuten weich und goldgelb braten. 6 Knoblauchzehen, zerdrückt, 1 Stück Ingwer (3 × 2 cm), gerieben und 2 kleine scharfe grüne Chilis (1–2), fein gehackt unter Rühren ca. 3 Minuten mitbraten, bis der rohe Knoblauchgeruch verschwindet.\n3. Tomaten & Gewürze: 200 grams Tomaten, gehackt mit 1.5 teaspoons gemahlener Kreuzkümmel, 2 teaspoons gemahlener Koriander, 0.5 teaspoons gemahlene Kurkuma, 1 teaspoons Kashmiri-Chilipulver (Alternative: Paprika edelsüß + Prise Cayenne) und 2 teaspoons Salz unterrühren und ca. 5 Minuten köcheln lassen, bis sich das Öl absetzt.\n4. Zugedeckt köcheln: 450 grams mehligkochende Kartoffeln, geschält, halbiert und in 1,5 cm dicken Scheiben, 1 kilograms TK-Blattspinat, aufgetaut und 200 ml kochend heißes Wasser zugeben. Deckel auflegen und ca. 15 Minuten köcheln, dabei etwa alle 5 Minuten umrühren.\n5. Offen einkochen: Deckel abnehmen und noch 15–20 Minuten köcheln lassen, bis die Flüssigkeit verdampft ist und die Kartoffeln ganz weich sind.\n6. Abschmecken: Zunächst 2 teaspoons Zitronensaft (2–3 TL, aus 1 Zitrone) unterrühren, probieren und bei Bedarf mehr Zitrone zugeben. Heiß mit Basmatireis servieren.\n\nNOTES\nTK-Spinat über Nacht auftauen lassen oder im Beutel unter warmes Wasser halten. Günstig, einfach und gut zum Vorkochen."],["Kürbiscurry mit Cashews & Tamarinde","Kürbiscurry mit Cashews & Tamarinde (siehe Happy - Meera Sodha Seite 205)\nScharf-saures Thai-Curry (nach Gaeng Som) mit Ofenkürbis, Mangold und einer Currypaste aus Cashews, Schalotten und Kurkuma\n\nINGREDIENTS\n• 100 grams Cashewkerne\n• 1 kilograms Butternusskürbis (Alternative: Hokkaido)\n• 9 tablespoons Rapsöl (2 EL Kürbis + 3 EL Paste + 4 EL Pfanne)\n• 2 teaspoons Salz (Kürbis + 1½ TL Paste)\n• 175 grams Bananenschalotten, grob gehackt (Alternative: normale Schalotten oder 2 Zwiebeln)\n• 8 Knoblauchzehen, gehackt\n• 4 Vogelaugenchilis, gehackt (Alternative: 2–3 andere scharfe Chilis)\n• 1 Stück Ingwer (4 × 4 cm), gehackt\n• 1.5 teaspoons gemahlene Kurkuma\n• 3 Limetten (2 für 2 EL Saft, 1 in Spalten)\n• 1 tablespoons Zucker\n• 4 tablespoons Tamarindenpaste (Alternative: 2 EL Limettensaft + 1 EL brauner Zucker)\n• 3 tablespoons vegane Fischsauce (Alternative: normale Fischsauce, oder 2 EL helle Sojasauce + Spritzer Limette)\n• 200 grams bunter Mangold, Stiele in 2-cm-Stücken, Blätter in Streifen (Alternative: Spinat oder Pak Choi)\n\nSTEPS\n1. Vorbereiten: Ofen auf 200 °C Umluft vorheizen, Blech mit Backpapier auslegen. 100 grams Cashewkerne mit kochendem Wasser bedecken und einweichen.\n2. Kürbis rösten: Vom 1 kilograms Butternusskürbis (Alternative: Hokkaido) die Enden abschneiden, quer halbieren, längs halbieren, Kerne herausschaben und die Viertel in 4 cm breite Spalten schneiden. Mit 2 EL Öl einreiben, salzen und aufs Blech legen. 15 Minuten rösten, wenden und weitere 15 Minuten rösten.\n3. Currypaste: Die Cashews abtropfen lassen und mit 175 grams Bananenschalotten, grob gehackt (Alternative: normale Schalotten oder 2 Zwiebeln), 8 Knoblauchzehen, gehackt, 4 Vogelaugenchilis, gehackt (Alternative: 2–3 andere scharfe Chilis), 1 Stück Ingwer (4 × 4 cm), gehackt, 1.5 teaspoons gemahlene Kurkuma, 2 EL Limettensaft, 6 EL Wasser, 3 EL Öl und 1½ TL Salz zu einer Paste mixen.\n4. Paste anbraten: 4 EL Öl in einer großen Pfanne bei mittlerer Hitze erhitzen und die Paste unter häufigem Rühren 5 Minuten köcheln lassen.\n5. Curry köcheln: 1 tablespoons Zucker, 4 tablespoons Tamarindenpaste (Alternative: 2 EL Limettensaft + 1 EL brauner Zucker), 3 tablespoons vegane Fischsauce (Alternative: normale Fischsauce, oder 2 EL helle Sojasauce + Spritzer Limette) und 1 l Wasser einrühren. 200 grams bunter Mangold, Stiele in 2-cm-Stücken, Blätter in Streifen (Alternative: Spinat oder Pak Choi) und den gerösteten Kürbis zugeben, aufkochen und ca. 8 Minuten köcheln lassen, bis die Mangoldstiele weich sind. Mit Fischsauce und Limette abschmecken.\n6. Servieren: Jasminreis auf Schalen verteilen, das Curry darüberschöpfen und mit den Limettenspalten servieren.\n\nNOTES\nEin suppiges Curry, perfekt für die Kürbissaison. Mit Hokkaido musst du nicht schälen. Für die Currypaste braucht man einen Mixer."],["Bun Cha mit Soja-Hackbällchen","Bun Cha mit Soja-„Hackbällchen“ (siehe Happy - Meera Sodha Seite 222)\nVietnamesischer Reisnudelsalat mit gebratenen Zitronengras-Soja-Frikadellen, Gemüsestreifen, Minze und süß-saurem Dressing\n\nINGREDIENTS\n• 2 tablespoons Limettensaft (aus 2 Limetten)\n• 2 Knoblauchzehen, zerdrückt (Dressing)\n• 1 Vogelaugenchili, fein gehackt (Alternative: jede scharfe Chili)\n• 3 tablespoons vegane Fischsauce (Dressing; Alternative: normale Fischsauce oder helle Sojasauce + Spritzer Limette)\n• 1.5 tablespoons heller Rohrzucker\n• 100 grams Reis-Vermicelli\n• 150 grams Karotten, geschält\n• 150 grams Daikon-Rettich (¼) oder Zucchini (½)\n• 150 grams Eisbergsalat (½), in Streifen\n• 40 grams Minze, Blätter abgezupft\n• 4 tablespoons Röstzwiebeln (Fertigprodukt)\n• 100 grams Soja-Granulat\n• 1 tablespoons vegane Fischsauce (Bällchen)\n• 1 Zitronengras, Außenblätter und oberes Drittel entfernt, fein gehackt (Alternative: 1 TL Zitronengraspaste oder Abrieb ½ Limette)\n• 2 tablespoons vegetarische Würzsauce mit Pilzen, z. B. Lee Kum Kee (Alternative: 1 EL Hoisin + 1 EL dunkle Sojasauce)\n• 25 grams Speisestärke\n• 25 grams Semmelbrösel\n• 2 Frühlingszwiebeln, in sehr feinen Ringen\n• 2 Knoblauchzehen, zerdrückt (Bällchen)\n• 3 tablespoons Rapsöl zum Braten\n\nSTEPS\n1. Dressing: 2 tablespoons Limettensaft (aus 2 Limetten), 2 Knoblauchzehen, zerdrückt (Dressing), 1 Vogelaugenchili, fein gehackt (Alternative: jede scharfe Chili), 3 tablespoons vegane Fischsauce (Dressing; Alternative: normale Fischsauce oder helle Sojasauce + Spritzer Limette) und 1.5 tablespoons heller Rohrzucker mit 2 EL Wasser verrühren.\n2. Salat: 100 grams Reis-Vermicelli nach Packungsangabe kochen, kalt abspülen und beiseitestellen. 150 grams Karotten, geschält und 150 grams Daikon-Rettich (¼) oder Zucchini (½) mit Sparschäler oder Julienneschneider in lange Streifen schneiden und mit 150 grams Eisbergsalat (½), in Streifen und der Hälfte von 40 grams Minze, Blätter abgezupft mischen.\n3. Bällchenmasse: 100 grams Soja-Granulat mit 150 ml kochendem Wasser begießen, 2 Minuten stehen lassen, umrühren. 1 tablespoons vegane Fischsauce (Bällchen) bis 2 Knoblauchzehen, zerdrückt (Bällchen) zugeben und sehr gründlich mischen. Lässt sich die Masse nicht formen, im Mixer pulsieren, bis sie bindet.\n4. Formen: Die Masse in 16 Portionen teilen, jede zu einer Kugel rollen und zu ca. 1 cm dicken Frikadellen flach drücken.\n5. Braten: 3 tablespoons Rapsöl zum Braten in einer Pfanne erhitzen und die Frikadellen portionsweise 8 Minuten braten, alle 2 Minuten wenden, damit sie nicht zu dunkel werden.\n6. Anrichten: Die Hälfte der Nudeln auf eine Platte geben, dann die Hälfte von Gemüse und 4 tablespoons Röstzwiebeln (Fertigprodukt), darauf restliche Nudeln und Gemüse schichten. Frikadellen darauflegen, mit restlicher Minze und Röstzwiebeln bestreuen und mit dem Dressing beträufeln.\n\nNOTES\nVegane Fischsauce und Pilz-Würzsauce gibt es im Asialaden. Viele Zutaten, aber das meiste wird nur gemischt oder geschichtet."],["Wodka-Gochujang-Pasta","Wodka-Gochujang-Pasta (siehe Happy - Meera Sodha Seite 228)\nPenne-alla-Vodka-Variante mit koreanischer Gochujang: cremige, leicht scharfe Tomaten-Sahne-Sauce zu Rigatoni\n\nINGREDIENTS\n• 2 tablespoons Rapsöl\n• 1 rote Zwiebel, halbiert, in dünnen Streifen\n• 1 teaspoons Salz\n• 2 Knoblauchzehen, zerdrückt\n• 400 grams Passata oder fein gehackte Dosentomaten\n• 1 tablespoons Gochujang (Alternative: 2 TL Sriracha + 1 TL Miso)\n• 1 tablespoons Tomatenmark\n• 100 milliliters Wodka (kann man weglassen, dann einen Schuss Nudelwasser + Spritzer Zitrone)\n• 175 grams Sahne (oder Hafer-Cuisine)\n• 400 grams Rigatoni\n• 0.5 teaspoons schwarzer Pfeffer\n\nSTEPS\n1. Zwiebel: 2 tablespoons Rapsöl in einer großen Pfanne bei mittlerer Hitze erhitzen und 1 rote Zwiebel, halbiert, in dünnen Streifen mit 1 teaspoons Salz unter Rühren 8 Minuten anschwitzen, bis sie sich mit dem Kochlöffel zerteilen lässt.\n2. Sauce: 2 Knoblauchzehen, zerdrückt 2 Minuten mitbraten. 400 grams Passata oder fein gehackte Dosentomaten, 1 tablespoons Gochujang (Alternative: 2 TL Sriracha + 1 TL Miso), 1 tablespoons Tomatenmark und die Hälfte von 100 milliliters Wodka (kann man weglassen, dann einen Schuss Nudelwasser + Spritzer Zitrone) zugeben und 10 Minuten köcheln lassen, bis die Mischung fast pastenartig eingekocht ist.\n3. Sahne: 175 grams Sahne (oder Hafer-Cuisine) und den restlichen Wodka unterrühren, 2 Minuten köcheln lassen und vom Herd nehmen.\n4. Pasta: 400 grams Rigatoni 1 Minute kürzer als angegeben kochen. Etwa 250 ml Kochwasser abnehmen, dann die Pasta abgießen.\n5. Vereinen: Die Sauce wieder erhitzen, Pasta und das ganze Kochwasser zugeben und 2 Minuten köcheln, bis die Sauce eindickt und an den Nudeln haftet. Mit Salz und 0.5 teaspoons schwarzer Pfeffer bestreuen.\n\nNOTES\nDie Sahne nimmt der Gochujang viel Schärfe, das Gericht ist eher mild. Der Alkohol verkocht größtenteils."],["Sesamnudeln mit scharfem gebratenem Sojahack","Sesamnudeln mit scharfem gebratenem Sojahack (siehe Happy - Meera Sodha Seite 231)\nRamen-Nudeln mit cremiger Tahin-Chili-Sesamsauce, Spinat und knusprig-würzigem Sojahack mit Hoisin\n\nINGREDIENTS\n• 0.3 Gemüsebrühwürfel (⅓)\n• 150 grams Tahin\n• 4.5 tablespoons Crispy Chilli in Oil, z. B. Lao Gan Ma (3½ EL Sauce + 1 EL Hack; Alternative: knuspriges Chiliöl)\n• 4 tablespoons helle Sojasauce (2½ EL Sauce + 1½ EL Hack)\n• 4 teaspoons Reisessig (Alternative: Weißweinessig + Prise Zucker)\n• 2.8 tablespoons Chinkiang-Reisessig (4 TL Sauce + 1½ EL Hack; Alternative: Balsamico)\n• 0.3 teaspoons Sichuanpfefferkörner, im Mörser zerstoßen (Alternative: schwarzer Pfeffer, oder weglassen)\n• 4 tablespoons Rapsöl\n• 4 Knoblauchzehen, zerdrückt\n• 1 Stück Ingwer (2 × 2 cm), gerieben\n• 100 grams Sojagranulat (nicht einweichen)\n• 2.5 tablespoons Hoisin-Sauce\n• 340 grams Ramen-Nudeln (Alternative: Mie-Nudeln)\n• 250 grams Babyspinat\n• 2 Frühlingszwiebeln, in feinen Ringen\n\nSTEPS\n1. Sesamsauce: 0.3 Gemüsebrühwürfel (⅓) in einen kleinen Topf krümeln und mit 150 ml kochendem Wasser auflösen. 150 grams Tahin, 3½ EL Crispy Chilli, 2½ EL Sojasauce, 4 teaspoons Reisessig (Alternative: Weißweinessig + Prise Zucker), 4 TL Chinkiang-Essig und 0.3 teaspoons Sichuanpfefferkörner, im Mörser zerstoßen (Alternative: schwarzer Pfeffer, oder weglassen) einrühren und beiseitestellen.\n2. Sojahack braten: 4 tablespoons Rapsöl in einer großen beschichteten Pfanne bei mittlerer Hitze erhitzen. 4 Knoblauchzehen, zerdrückt und 1 Stück Ingwer (2 × 2 cm), gerieben 1 Minute braten, dann 100 grams Sojagranulat (nicht einweichen) zugeben und 4 Minuten unter häufigem Rühren braten, bis es die Farbe von gerösteten Mandeln hat.\n3. Hack würzen: 200 ml Wasser, 1½ EL Sojasauce, 2.5 tablespoons Hoisin-Sauce, 1½ EL Chinkiang-Essig und 1 EL Crispy Chilli zugeben und 5 Minuten köcheln, bis das Wasser verdampft und das Hack trocken ist. Vom Herd nehmen und zudecken.\n4. Nudeln & Spinat: 340 grams Ramen-Nudeln (Alternative: Mie-Nudeln) in reichlich kochendem Wasser nach Packungsangabe garen und mit der Zange in ein Sieb heben. 250 grams Babyspinat ins kochende Wasser geben, zusammenfallen lassen und zu den Nudeln abgießen.\n5. Sauce erhitzen: Die Sesamsauce bei mittlerer Hitze kurz aufkochen und vom Herd nehmen.\n6. Servieren: Nudeln auf vier Schalen verteilen. Auf jede Portion ein Viertel Spinat und Sauce sowie einige Löffel Hack geben und mit 2 Frühlingszwiebeln, in feinen Ringen garnieren.\n\nNOTES\nAlles bis auf die Nudeln lässt sich vorbereiten, gut für Gäste. Crispy Chilli in Oil (Lao Gan Ma) und Chinkiang-Essig gibt es im Asialaden."],["Marmite-Risotto mit Tomaten-Chili-Butter","Marmite-Risotto mit Tomaten-Chili-Butter (siehe Happy - Meera Sodha Seite 251)\nMildes, cremiges Risotto mit Hefeextrakt-Brühe, getoppt mit gerösteten Kirschtomaten in Chili-Butter\n\nINGREDIENTS\n• 550 grams Kirschtomaten, halbiert\n• 4 tablespoons natives Olivenöl extra (2 EL Tomaten + 2 EL Risotto)\n• 0.5 teaspoons Salz (Tomaten)\n• 100 grams Butter oder vegane Alternative (50 g Chilibutter + 50 g Risotto)\n• 2 tablespoons Bodensatz vom Crispy Chilli Oil (Alternative: anderes knuspriges Chiliöl oder Chiliflocken in Öl)\n• 1 große Zwiebel, fein gehackt\n• 1 teaspoons Salz (Risotto)\n• 3 Knoblauchzehen, zerdrückt\n• 350 grams Arborioreis\n• 175 milliliters trockener Weißwein\n• 35 grams Marmite, in 1 l kochendem Wasser aufgelöst (Alternative: Vegemite, Cenovis oder Hefeextrakt aus dem Reformhaus)\n\nSTEPS\n1. Tomaten rösten: Ofen auf 180 °C Umluft vorheizen. 550 grams Kirschtomaten, halbiert auf ein Blech mit Backpapier legen, mit 2 EL Olivenöl beträufeln und mit 0.5 teaspoons Salz (Tomaten) bestreuen. 35 Minuten rösten, nach der Hälfte wenden, bis sie klebrig sind und bräunen. Abkühlen lassen.\n2. Risotto ansetzen: 25 g Butter mit 2 EL Olivenöl in einer Pfanne bei mittlerer Hitze erhitzen. 1 große Zwiebel, fein gehackt mit 1 teaspoons Salz (Risotto) unter Rühren 8 Minuten weich und goldgelb braten. 3 Knoblauchzehen, zerdrückt 2 Minuten mitbraten, dann 350 grams Arborioreis unterrühren.\n3. Garen: 175 milliliters trockener Weißwein angießen und verkochen lassen. Dann kellenweise die Marmite-Brühe (35 grams Marmite, in 1 l kochendem Wasser aufgelöst (Alternative: Vegemite, Cenovis oder Hefeextrakt aus dem Reformhaus)) zugeben und behutsam rühren, bis der Reis sie aufgenommen hat. Wiederholen, bis der Reis zart und das Risotto sehr cremig ist, bis zu 30 Minuten. Reicht die Brühe nicht, heißes Wasser nehmen.\n4. Butter unterrühren: Vom Herd ziehen und 25 g Butter unterrühren.\n5. Chilibutter: 50 g Butter mit 2 tablespoons Bodensatz vom Crispy Chilli Oil (Alternative: anderes knuspriges Chiliöl oder Chiliflocken in Öl) in einem kleinen Topf zerlassen, die Tomaten untermischen und vom Herd ziehen.\n6. Servieren: Risotto in tiefe Teller geben und auf jede Portion mittig zwei Löffel Tomaten-Chili-Butter geben.\n\nNOTES\nDas Marmite schmeckt man kaum heraus, es ersetzt nur die Gemüsebrühe. Marmite gibt es in britischen Läden, online und in manchen Supermärkten."],["Mousse au Chocolat (mit Seidentofu)","Eine große Schüssel Mousse au Chocolat (siehe Happy - Meera Sodha Seite 291)\nSamtige Mousse ohne Eier: Seidentofu und Olivenöl aufgeschlagen, mit Schokoladensirup und Schlagsahne, mit Meersalz serviert\n\nINGREDIENTS\n• 290 grams Seidentofu, abgetropft\n• 3 tablespoons natives Olivenöl extra, plus mehr zum Servieren\n• 1 tablespoons Vanillepaste (Alternative: 1 TL Vanilleextrakt oder Mark einer Schote)\n• 300 grams Schlagsahne\n• 70 grams Zucker\n• 200 grams Bitterschokolade (70 %), fein gehackt\n• 0.3 teaspoons Salz\n• 1 teaspoons Meersalzflocken, zum Servieren\n\nSTEPS\n1. Tofu aufschlagen: 290 grams Seidentofu, abgetropft, 3 tablespoons natives Olivenöl extra, plus mehr zum Servieren und 1 tablespoons Vanillepaste (Alternative: 1 TL Vanilleextrakt oder Mark einer Schote) mit dem Handrührer schlagen, bis die Masse dick, cremig und klümpchenfrei ist. Zwischendurch die Schüsselwand abschaben.\n2. Sahne: In einer sauberen Schüssel 300 grams Schlagsahne 3–4 Minuten zu weichen Spitzen schlagen.\n3. Schokoladensirup: 80 ml Wasser mit 70 grams Zucker in einem kleinen Topf bei schwacher Hitze rühren, bis der Zucker gelöst ist. Vom Herd nehmen, 200 grams Bitterschokolade (70 %), fein gehackt und 0.3 teaspoons Salz unterrühren, bis alles geschmolzen ist und glänzt.\n4. Vereinen: Die Schokolade mit dem Teigschaber gründlich unter die Tofumischung rühren. Dann die Sahne vorsichtig unterheben, bis die Masse gleichmäßig schokoladenbraun und luftig ist.\n5. Kühlen: Mindestens 1 Stunde kalt stellen.\n6. Servieren: Kurz vor dem Servieren sparsam mit 1 teaspoons Meersalzflocken, zum Servieren bestreuen. Ein Kännchen Olivenöl und ein Schälchen Meersalz dazustellen, damit sich jeder selbst bedienen kann.\n\nNOTES\nFür 6–8 Personen. Durch die Sahne nicht vegan, mit veganer Sahne wird sie laut Buch nicht so samtig. Man braucht einen elektrischen Handrührer."],["Thai Mango Sticky Rice","Thai Mango Sticky Rice (siehe Happy - Meera Sodha Seite 300)\nGedämpfter Klebreis mit süß-salziger Kokoscreme, frischen Mangoscheiben und Limette\n\nINGREDIENTS\n• 200 grams Klebreis (Asialaden; kein Ersatz durch Sushireis, der klebt nicht genug)\n• 400 milliliters Kokosmilch mit mind. 65 % Kokosanteil (Dose)\n• 2 tablespoons Zucker\n• 0.3 teaspoons Salz\n• 4 reife Mangos (Alphonso, Honig- oder Kesar-Mango; sonst jede sehr reife, faserarme Mango)\n• 1 Limette, geviertelt\n\nSTEPS\n1. Reis waschen & einweichen: 200 grams Klebreis (Asialaden; kein Ersatz durch Sushireis, der klebt nicht genug) in einer großen Schüssel mit Wasser bedecken, mit der Hand rühren und abgießen. Wiederholen, bis das Wasser klar ist. Dann mit handwarmem Wasser bedeckt 30 Minuten einweichen. Die Dose 400 milliliters Kokosmilch mit mind. 65 % Kokosanteil (Dose) solange ins Tiefkühlfach stellen.\n2. Dämpfkorb vorbereiten: Den Reis abgießen. Einen Bambus-Dämpfkorb mit einem dünnen, sauberen Geschirr- oder Passiertuch auslegen, den Reis gleichmäßig darin verteilen, die Tuchränder darüberschlagen und den Korb schließen.\n3. Dämpfen: Eine Pfanne, in die der Korb passt, 3 cm hoch mit Wasser füllen und aufkochen, dann auf schwache Hitze stellen und den Korb hineinsetzen. Den Reis 20–25 Minuten dämpfen, bis er weich ist. Bei Bedarf Wasser nachfüllen.\n4. Kokoscreme: Die Dose aus dem Eisfach nehmen, nicht schütteln, und 200 ml der dicken Kokossahne oben ablöffeln, bei Bedarf mit Kokoswasser auffüllen. Mit 2 tablespoons Zucker und 0.3 teaspoons Salz in einem kleinen Topf aufkochen und vom Herd nehmen.\n5. Mangos: 4 reife Mangos (Alphonso, Honig- oder Kesar-Mango; sonst jede sehr reife, faserarme Mango) schälen, das Fruchtfleisch rechts und links vom Stein abschneiden und in dünne Scheiben schneiden.\n6. Reis tränken: Den Reis vorsichtig aus dem Tuch wickeln (heißer Dampf!), in eine Schüssel geben und mit dem Großteil der Kokoscreme begießen. 4 EL zum Servieren zurückbehalten. Mit einer Gabel mischen, zudecken und ziehen lassen.\n7. Servieren: Den Reis auf vier Schalen verteilen und zu Kuppeln formen. Mangoscheiben dazulegen, mit etwas Saft von 1 Limette, geviertelt beträufeln und je 1 EL Kokoscreme darübergeben.\n\nNOTES\nOhne Bambuskorb: Ein Metall-Dämpfeinsatz oder ein Sieb über einem Topf mit Deckel funktioniert auch, Hauptsache der Reis liegt im Tuch über dem Dampf. Die restliche dünne Kokosmilch passt in Smoothies oder ins Curry. Am besten in der Mangosaison im Frühsommer."],["Hühner- oder Schweinefett (Tare)","Hühner- oder Schweinefett (siehe Ramen - Tove Nilsson Seite 28)\nAusgelassenes Hühner- oder Schweinefett als Tare zum Verfeinern von Ramen-Brühen – ergibt 200–300 ml\n\nINGREDIENTS\n• 6 Hähnchenschenkel (für Hühnerfett) ODER 200 g fetter Speck (für Schweinefett)\n• 400 milliliters Wasser\n\nSTEPS\n1. Vorbereiten: Für Hühnerfett die 6 Hähnchenschenkel (für Hühnerfett) ODER 200 g fetter Speck (für Schweinefett) enthäuten und das Fleisch von sämtlichem Fett befreien. Für Schweinefett den Speck klein schneiden.\n2. Bedecken: Hühnerhaut und -fett bzw. Speck in einem Topf mit 400 milliliters Wasser bedecken.\n3. Auslassen: Aufkochen und etwa 3 Stunden abgedeckt köcheln lassen. Fett und Haut müssen stets von Wasser bedeckt sein, bei Bedarf nachgießen.\n4. Kühlen: Abseihen, abkühlen lassen und über Nacht in den Kühlschrank stellen.\n5. Abheben & abfüllen: Am nächsten Tag das fest gewordene Fett abheben, in einem Topf schmelzen und in einen dicht schließenden Behälter füllen.\n\nNOTES\nHält sich im Kühlschrank 1 Woche, tiefgekühlt 2 Monate. Das entfettete Hähnchenfleisch kann man braten oder grillen und als Topping verwenden. Optional: Für Shio- und Shoyu-Ramen je 1 EL pro Schale."],["Szechuan-Chilipaste","Szechuan-Chilipaste (siehe Ramen - Tove Nilsson Seite 29)\nPrickelnd-scharfe Würzpaste zum Einrühren in Brühe oder als Tare.\n\nINGREDIENTS\n• 2 kleine Zwiebeln, grob gehackt\n• 4 Knoblauchzehen, grob gehackt\n• 60 grams Ingwer, geschält, in Scheiben (ca. 15 cm Stück)\n• 3 tablespoons gemahlener Szechuan-Pfeffer (Alternative: schwarzer Pfeffer + etwas Zitronenabrieb – ohne das typische Kribbeln)\n• 2 Sternanis, gemahlen\n• 2.5 tablespoons getrocknete kleine rote Chilischoten, zerstoßen (z. B. Árbol)\n• 4 tablespoons Doubanjiang / fermentierte Chili-Bohnen-Paste (Alternative: Toban Djan, oder Gochujang + 1 TL Miso)\n• 2 tablespoons Sojasoße (japanisch, normale geht auch)\n• 100 milliliters Speiseöl\n\nSTEPS\n1. Anbraten: Alle Zutaten (2 kleine Zwiebeln, grob gehackt, 4 Knoblauchzehen, grob gehackt, 60 grams Ingwer, geschält, in Scheiben (ca. 15 cm Stück), 3 tablespoons gemahlener Szechuan-Pfeffer (Alternative: schwarzer Pfeffer + etwas Zitronenabrieb – ohne das typische Kribbeln), 2 Sternanis, gemahlen, 2.5 tablespoons getrocknete kleine rote Chilischoten, zerstoßen (z. B. Árbol), 4 tablespoons Doubanjiang / fermentierte Chili-Bohnen-Paste (Alternative: Toban Djan, oder Gochujang + 1 TL Miso), 2 tablespoons Sojasoße (japanisch, normale geht auch), 100 milliliters Speiseöl) in einer Pfanne ca. 5 Minuten braten, bis die Zwiebeln weich sind.\n2. Pürieren: Zu einer glatten Paste pürieren.\n3. Aufbewahren: In einem dicht schließenden Behälter aufbewahren und mit einer Schicht Öl bedecken. Im Kühlschrank ca. 1 Woche haltbar.\n\nNOTES\nErgibt ca. 180 g. Der Szechuan-Pfeffer gibt das typische Kribbeln auf der Zunge – gibt's im Asialaden oder Gewürzhandel."],["Chiliöl","Chiliöl (siehe Ramen - Tove Nilsson Seite 29)\nSchnelles Chiliöl zum Beträufeln von Ramen – auch auf Pizza super.\n\nINGREDIENTS\n• 200 milliliters neutrales Öl\n• 2 tablespoons Sesamöl\n• 60 grams Gochugaru / koreanisches Chilipulver (Alternative: milde Chiliflocken oder Paprikapulver + etwas Cayenne)\n• 1.5 tablespoons getrocknete kleine rote Chilischoten, zerstoßen (z. B. Árbol)\n• 2 Knoblauchzehen, leicht angedrückt\n\nSTEPS\n1. Erhitzen: 200 milliliters neutrales Öl, 2 tablespoons Sesamöl, 60 grams Gochugaru / koreanisches Chilipulver (Alternative: milde Chiliflocken oder Paprikapulver + etwas Cayenne), 1.5 tablespoons getrocknete kleine rote Chilischoten, zerstoßen (z. B. Árbol) und 2 Knoblauchzehen, leicht angedrückt langsam in einem Topf erhitzen.\n2. Ziehen lassen: Vom Herd nehmen, abkühlen und 1 Stunde ziehen lassen.\n3. Mixen: Eine Knoblauchzehe entfernen und das Öl fein mixen.\n4. Abfüllen: In eine saubere Flasche oder ein Schraubglas füllen. Im Kühlschrank bis zu 6 Monate haltbar.\n\nNOTES\nErgibt ca. 250 ml. Gochugaru gibt es im Asialaden – es ist fruchtig und eher mild, daher bei Chiliflocken-Ersatz die Menge etwas reduzieren."],["Mayu","Mayu – schwarzes Knoblauchöl (siehe Ramen - Tove Nilsson Seite 30)\nBewusst schwarz gebratener Knoblauch, mit Sesamöl gemixt – perfekt zu Tonkotsu.\n\nINGREDIENTS\n• 8 Knoblauchzehen, fein gerieben\n• 150 milliliters Speiseöl\n• 100 milliliters Sesamöl\n\nSTEPS\n1. Bräunen: 8 Knoblauchzehen, fein gerieben in 150 milliliters Speiseöl langsam ca. 15 Minuten braun werden lassen. Zwischendurch umrühren – die Stärke bildet einen klebrigen Klumpen, der sich nur durch Rühren löst.\n2. Schwärzen: Weiterbraten, bis der Knoblauch schwarz ist.\n3. Mixen & abfüllen: Vom Herd nehmen und mit 100 milliliters Sesamöl glatt mixen. In einer Flasche oder einem Glas im Kühlschrank aufbewahren – bis zu 1 Monat haltbar.\n\nNOTES\nErgibt ca. 250 ml. Pur schmeckt es bitter – das gehört so. Erst in der Brühe (v. a. Tonkotsu) entfaltet es seinen Geschmack. Gut lüften beim Braten!"],["Knoblauchpüree","Knoblauchpüree (siehe Ramen - Tove Nilsson Seite 30)\nVorgekochter, milder Knoblauch zum Selbstdosieren in die Ramen-Schale.\n\nINGREDIENTS\n• 3 Knoblauchknollen\n• 3 tablespoons Öl\n\nSTEPS\n1. Kochen: Zehen aus 3 Knoblauchknollen lösen, schälen und in Wasser ca. 10 Minuten weich kochen.\n2. Pürieren: Die Knoblauchzehen glatt pürieren.\n3. Abfüllen: In ein Schraubglas füllen und mit 3 tablespoons Öl bedecken, damit nichts oxidiert. Im Kühlschrank bis zu 1 Woche haltbar.\n\nNOTES\nErgibt ca. 200 ml. Durch das Vorkochen wird der Knoblauch milder und leicht süßlich."],["Bonito-Salz","Bonito-Salz (siehe Ramen - Tove Nilsson Seite 31)\nRauchig-umamiges Würzsalz für Ramen, Eier, Tempura oder Dressings.\n\nINGREDIENTS\n• 8 grams Bonitoflocken / Katsuobushi (Asialaden; Alternative: 1–2 TL Dashi-Pulver)\n• 40 grams Salz\n\nSTEPS\n1. Mahlen: 8 grams Bonitoflocken / Katsuobushi (Asialaden; Alternative: 1–2 TL Dashi-Pulver) und 40 grams Salz im Mörser zerstoßen oder im Mixer fein mahlen. In einem dicht verschlossenen Glas lange haltbar.\n\nNOTES\nErgibt ca. 50 g. Mit Dashi-Pulver statt Bonitoflocken wird es etwas weniger rauchig, funktioniert aber gut."],["Miso-Sesam-Tare","Miso-Sesam-Tare (siehe Ramen - Tove Nilsson Seite 31)\nSämige, herzhafte Würzbasis für Miso- und scharfe Miso-Ramen.\n\nINGREDIENTS\n• 60 grams weißes Miso (Shiro)\n• 60 grams rotes Miso (Aka; Alternative: braunes Miso oder einfach mehr weißes Miso)\n• 60 grams japanische Sesampaste / Neri Goma (Alternative: Tahin)\n\nSTEPS\n1. Verrühren: 60 grams weißes Miso (Shiro) und 60 grams rotes Miso (Aka; Alternative: braunes Miso oder einfach mehr weißes Miso) in einer Schüssel verrühren. 60 grams japanische Sesampaste / Neri Goma (Alternative: Tahin) untermengen und in ein dicht verschließbares Glas füllen. Im Kühlschrank ein paar Wochen haltbar.\n\nNOTES\nErgibt ca. 180 g. Nur mit weißem Miso wird es milder und süßlicher."],["Five-Spice-Chilipaste","Fünf-Gewürze-Chilipaste (siehe Ramen - Tove Nilsson Seite 31)\nAromatische Paste als Tare oder als Rub für Fleisch.\n\nINGREDIENTS\n• 2 kleine Zwiebeln, grob gehackt\n• 4 Knoblauchzehen, grob gehackt\n• 40 grams Ingwer, geschält, grob gehackt (ca. 10 cm)\n• 2 tablespoons Fünf-Gewürze-Pulver\n• 1 tablespoons getrocknete Chilischoten, zerstoßen (z. B. Árbol)\n• 4 tablespoons Rapsöl\n• 3 tablespoons chinesische Sojasoße (helle Sojasoße)\n• 3 tablespoons Reisessig\n• 2 teaspoons Salz\n\nSTEPS\n1. Anbraten: 2 kleine Zwiebeln, grob gehackt, 4 Knoblauchzehen, grob gehackt, 40 grams Ingwer, geschält, grob gehackt (ca. 10 cm), 2 tablespoons Fünf-Gewürze-Pulver und 1 tablespoons getrocknete Chilischoten, zerstoßen (z. B. Árbol) in 4 tablespoons Rapsöl braten, bis die Zwiebeln weich sind.\n2. Reduzieren: 3 tablespoons chinesische Sojasoße (helle Sojasoße), 3 tablespoons Reisessig und 2 teaspoons Salz zufügen und die Flüssigkeit um die Hälfte reduzieren.\n3. Pürieren: Glatt pürieren und in ein dicht verschließbares Glas füllen. Im Kühlschrank ein paar Wochen haltbar."],["Chashu","Chashu (siehe Ramen - Tove Nilsson Seite 45)\nLangsam in Sojasoße, Mirin und Ingwer geschmorter Schweinebauch oder -nacken – der Klassiker auf Ramen.\n\nINGREDIENTS\n• 1.2 kilograms Schweinebauch oder Schweinenacken\n• 200 milliliters Wasser\n• 250 milliliters japanische Sojasoße (normale geht auch)\n• 200 milliliters Mirin\n• 3 Frühlingszwiebeln, grob geschnitten\n• 40 grams Ingwer in Scheiben (ca. 10 cm)\n• 3 Knoblauchzehen, leicht angedrückt\n• 2 teaspoons Salz\n\nSTEPS\n1. Ofen vorheizen: Backofen auf 150 °C vorheizen.\n2. Marinade: 200 milliliters Wasser, 250 milliliters japanische Sojasoße (normale geht auch) und 200 milliliters Mirin in einem Bräter oder einer hohen Auflaufform verquirlen. 3 Frühlingszwiebeln, grob geschnitten, 40 grams Ingwer in Scheiben (ca. 10 cm), 3 Knoblauchzehen, leicht angedrückt und 2 teaspoons Salz zufügen.\n3. Fleisch vorbereiten: Am Stück: 1.2 kilograms Schweinebauch oder Schweinenacken mit der Schwarte nach unten in die Marinade legen (ca. halb bedeckt), ggf. Borsten vorher abflämmen. Aufgerollter Bauch: Schwarte abschneiden, an einem Ende ein Viertel dranlassen, so aufrollen, dass die Schwarte außen liegt, mit Küchengarn binden. Aufgerollter Nacken: horizontal fast ganz durchschneiden, aufklappen, aufrollen, binden. In die Marinade legen.\n4. Schmoren: Mit Deckel oder Alufolie abgedeckt auf die untere Schiene schieben, Temperatur auf 125 °C reduzieren. Am Stück: 3 Std. schmoren, wenden (Schwarte oben), 1 weitere Std. backen. Aufgerollter Bauch: 4 Std., dabei dreimal wenden. Aufgerollter Nacken: 4 Std., nach der Hälfte wenden.\n5. Ruhen lassen: In der Marinade abkühlen lassen, dann in Frischhaltefolie gewickelt über Nacht in den Kühlschrank legen.\n6. Servieren: In dünne Scheiben schneiden und max. 5 Minuten im 200 °C heißen Ofen aufwärmen. Mit dem Flambierbrenner angeflämmt wird es noch besser.\n\nNOTES\nFür 4–6 Portionen. Die Schmorflüssigkeit nicht wegkippen – sie eignet sich als Marinade für Ramen-Eier oder als Würze (Shoyu-Tare). Gekocht kann man den Bauch auch wie Pulled Pork zerzupfen und in Soja, Mirin und Sesam anbraten."],["BBQ Schweinefleisch","BBQ-Schweinefleisch (siehe Ramen - Tove Nilsson Seite 46)\nSchweinenacken mit Soja-Tomaten-Glasur, langsam mit Bier im Ofen gegart.\n\nINGREDIENTS\n• 800 grams Schweinenacken\n• 2 teaspoons Salz\n• 2 grams Bonitoflocken / Katsuobushi (Alternative: 1 TL Dashi-Pulver oder weglassen)\n• 2 tablespoons Tomatenmark\n• 2 tablespoons japanische Sojasoße\n• 2 tablespoons Reisessig\n• 1 tablespoons Zucker\n• 1 Knoblauchzehe, geschält\n• 2 tablespoons Ingwer, fein gehackt\n• 200 milliliters helles Lagerbier\n\nSTEPS\n1. Vorbereiten: Backofen auf 125 °C vorheizen. 800 grams Schweinenacken rundum mit 2 teaspoons Salz einreiben.\n2. Glasur: 2 grams Bonitoflocken / Katsuobushi (Alternative: 1 TL Dashi-Pulver oder weglassen), 2 tablespoons Tomatenmark, 2 tablespoons japanische Sojasoße, 2 tablespoons Reisessig, 1 tablespoons Zucker, 1 Knoblauchzehe, geschält und 2 tablespoons Ingwer, fein gehackt in einem Topf ca. 5 Minuten einköcheln, dann glatt pürieren und das Fleisch damit einreiben.\n3. Schmoren: Fleisch auf ein tiefes Blech legen, 200 milliliters helles Lagerbier angießen, mit Alufolie abgedeckt ca. 4 Stunden garen.\n4. Bräunen: Folie entfernen, auf 175 °C erhöhen und weitere 30 Minuten schmoren.\n5. Grillen (optional): Für echten Grillgeschmack das Fleisch anschließend kurz rundum auf dem Grill anbräunen.\n\nNOTES\nFür 4–6 Portionen. In Scheiben als Ramen-Topping, schmeckt aber auch im Bao oder auf Reis."],["Onsen Ei","Onsen-Ei – Onsen Tamago (siehe Ramen - Tove Nilsson Seite 46)\nBei 63 °C gegartes Ei: zartes, leicht transparentes Eiweiß, wachsweiches Eigelb.\n\nINGREDIENTS\n• 4 Eier, möglichst frisch\n\nSTEPS\n1. Wasserbad einstellen: Sous-vide-Garer oder Dampfbackofen auf 63,5 °C stellen (immer 0,5 °C über der Zieltemperatur). Ohne Gerät: Topf mit Wasser und Thermometer auf kleinster Flamme – die Temperatur muss die ganze Zeit konstant bleiben.\n2. Garen: 4 Eier, möglichst frisch 50 Minuten im temperierten Wasser garen, danach kalt abschrecken.\n3. Aufwärmen: Vor dem Servieren ca. 2 Minuten in ca. 80 °C heißes Wasser legen.\n4. Servieren: Mittig mit einem kleinen Messer aufschlagen und in die Schale gleiten lassen. Den weichen, äußeren Eiweißteil kann man entfernen.\n\nNOTES\nOhne Sous-vide-Gerät ist es Fummelarbeit. Einfache Alternative: wachsweiche Eier mit 6,5 Minuten Kochzeit. Traditionell isst man es auch solo mit etwas Dashi oder Soja, Mirin und Frühlingszwiebeln."],["Marinierte Eigelbe","Marinierte Eigelbe (siehe Ramen - Tove Nilsson Seite 47)\nIn Soja und Mirin marinierte rohe Eigelbe – cremig wie Mayonnaise.\n\nINGREDIENTS\n• 4 rohe Eigelbe (sehr frische Eier)\n• 50 milliliters japanische Sojasoße\n• 50 milliliters Mirin\n\nSTEPS\n1. Marinade: 50 milliliters japanische Sojasoße und 50 milliliters Mirin in einer kleinen Schale verquirlen.\n2. Eigelbe einlegen: 4 rohe Eigelbe (sehr frische Eier) vorsichtig hineingleiten lassen und mit Marinade übergießen.\n3. Marinieren: Abgedeckt 8 Stunden im Kühlschrank marinieren.\n\nNOTES\n8 Stunden sind ideal. Bis zu 3 Tage gehen auch, dann wird das Eigelb fest und lässt sich über die Ramen bröseln. Passt auch auf Reis, Bibimbap oder belegtes Brot. Die Eiweiße kann man für etwas anderes verwenden."],["Geröstete Tomaten","Geröstete Tomaten (siehe Ramen - Tove Nilsson Seite 47)\nLangsam im Ofen getrocknete Tomaten als süß-saures Ramen-Topping.\n\nINGREDIENTS\n• 6 Tomaten, halbiert\n• 1 teaspoons Salz\n\nSTEPS\n1. Vorbereiten: Backofen auf 100 °C vorheizen. 6 Tomaten, halbiert mit der Schnittseite nach oben auf ein Blech mit Backpapier legen und mit 1 teaspoons Salz salzen.\n2. Rösten: Ca. 4 Stunden backen, bis die Außenseite getrocknet ist. Zwischendurch ein paar Mal die Ofentür öffnen, damit der Dampf entweicht.\n3. Verwenden: Als Topping für Ramen oder Udon verwenden. Im Kühlschrank bis zu 4 Tage haltbar.\n\nNOTES\nErgibt 12 Hälften. Passt besonders gut zu Shio-Ramen und Udon in Dashi. Wer mag, bestäubt sie mit etwas geräuchertem Paprikapulver."],["Shichimi Togarashi (Gewürz)","Shichimi Togarashi – japanische Gewürzmischung (siehe Ramen - Tove Nilsson Seite 48)\nJapanische Sieben-Gewürze-Mischung zum Bestreuen von Ramen und Udon.\n\nINGREDIENTS\n• 2 tablespoons Szechuan-Pfeffer (Alternative: schwarzer Pfeffer + Zitronenabrieb)\n• 2 tablespoons Gochugaru / koreanisches Chilipulver (Alternative: milde Chiliflocken)\n• 1 tablespoons getrocknete kleine rote Chilischoten (z. B. Árbol)\n• 1 Stück getrocknete Pomeranzenschale, fein gerieben (Alternative: getrocknete Orangenschale oder Abrieb von 1 Bio-Orange)\n• 1 teaspoons Ingwerpulver\n• 1 Blatt Nori\n• 1 teaspoons schwarze Mohnsaat\n• 1 tablespoons geröstete weiße und schwarze Sesamsamen\n\nSTEPS\n1. Mahlen: 2 tablespoons Szechuan-Pfeffer (Alternative: schwarzer Pfeffer + Zitronenabrieb), 2 tablespoons Gochugaru / koreanisches Chilipulver (Alternative: milde Chiliflocken), 1 tablespoons getrocknete kleine rote Chilischoten (z. B. Árbol), 1 Stück getrocknete Pomeranzenschale, fein gerieben (Alternative: getrocknete Orangenschale oder Abrieb von 1 Bio-Orange), 1 teaspoons Ingwerpulver, 1 Blatt Nori und 1 teaspoons schwarze Mohnsaat fein mahlen oder im Mörser zerstoßen.\n2. Sesam zufügen: 1 tablespoons geröstete weiße und schwarze Sesamsamen zufügen und grob zerstoßen – es sollen noch ganze Körner zu sehen sein.\n\nNOTES\nErgibt ca. 60 g. Gibt es auch fertig im Asialaden. Bei frischer Orangenschale die Mischung vor dem Abfüllen ein paar Stunden offen trocknen lassen."],["Frittierte Schalotten","Frittierte Schalotten (siehe Ramen - Tove Nilsson Seite 48)\nKnuspriges Topping für Ramen.\n\nINGREDIENTS\n• 300 milliliters Speiseöl\n• 4 Schalotten, in feine Ringe geschnitten\n• 1 pinch Salz\n\nSTEPS\n1. Öl erhitzen: 300 milliliters Speiseöl auf 150 °C erhitzen.\n2. Frittieren: 4 Schalotten, in f
