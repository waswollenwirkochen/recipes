<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerichte-Roster</title>
<meta name="description" content="Alle Lieblingsgerichte auf einen Blick: suchen, filtern, würfeln, Woche planen.">
<meta name="theme-color" content="#14231F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#14231F; --muted:#56675F; --line:#D5DED9;
  --accent:#FFC01E; --accent-ink:#1B1500; --focus:#0E6B52;
  --veg:#2F9A4B; --meat:#C9503A; --fish:#2F7FC1;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#101715; --surface:#18211E; --ink:#E9F0EC; --muted:#9DB0A8; --line:#2A3631; --focus:#5FD3AE; color-scheme:dark; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kopfleiste */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 1.1rem var(--display);padding:6px 8px 6px 0}
.home svg{width:22px;height:22px}
.planlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:5px 14px}
.planlink[aria-current=page]{background:var(--ink);color:var(--bg)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.8rem;padding:0 6px}

/* Kopf der Startseite */
.hero{padding-top:26px;padding-bottom:16px}
h1{font:800 clamp(2.1rem,7vw,3.9rem)/1 var(--display);letter-spacing:-.025em;margin:0 0 18px;max-width:12ch}
.hero-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.roll{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px 22px;font:700 1.05rem var(--display);cursor:pointer;min-height:52px}
.roll:hover{filter:brightness(.96)}
.roll svg{width:26px;height:26px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.roll.spin svg{transform:rotate(360deg) scale(1.1)}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;height:100%;min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 16px 0 46px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}

/* Reiter */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;padding:12px 14px;font:700 .98rem var(--display);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab .n2{font-weight:500;opacity:.6}

/* Filter */
.bar{display:flex;align-items:center;gap:12px;padding:14px 0 6px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.fbtn[aria-expanded=true]{border-color:var(--ink)}
.fbtn .n{background:var(--ink);color:var(--bg);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.8rem;padding:0 6px}
.count{color:var(--muted);margin-left:auto}
.scope{display:inline-flex;border:2px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.scope button{background:none;border:0;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.scope button[aria-pressed=true]{background:var(--accent);color:#14231F}
.grp{grid-column:1/-1;margin:18px 0 -4px;font-size:1.05rem;font-weight:700;display:flex;align-items:baseline;gap:8px}
.grp:first-child{margin-top:4px}
.grp small{color:var(--muted);font-weight:500;font-size:.85rem}
.reset{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 14px;margin:6px 0 8px}
.group{margin-top:12px}
.group h3{font:700 .9rem var(--body);color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.93rem}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.v{background:var(--veg)}.dot.m{background:var(--meat)}.dot.f{background:var(--fish)}

/* Raster */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:14px 0 40px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 18px}}
.tile{text-decoration:none;display:block;min-width:0}
.thumb{position:relative;aspect-ratio:1/1;border-radius:var(--r);overflow:hidden;background:var(--bg-c,#5E6B66);color:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.emo{position:absolute;inset:0;display:grid;place-items:center;font-size:4.2rem;line-height:1;user-select:none;pointer-events:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tile .thumb{transition:transform .18s ease}
.tile:hover .thumb{transform:translateY(-3px)}
.cap{padding:9px 2px 0}
.nm{display:block;font:700 1.02rem/1.2 var(--display);overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.86rem;margin-top:4px;min-height:1.2em}
.meta .dots{display:inline-flex;gap:3px}
.empty{padding:50px 0 80px;text-align:center;color:var(--muted)}
.empty strong{display:block;font:700 1.4rem var(--display);color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px}

/* Detail */
.detail{padding:14px 0 70px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-weight:600;padding:8px 6px 8px 0;margin-bottom:8px}
.back svg{width:20px;height:20px}
.dhead{display:grid;gap:18px}
@media (min-width:820px){.dhead{grid-template-columns:minmax(0,420px) 1fr;gap:34px;align-items:end}}
.dimg{aspect-ratio:4/3;border-radius:var(--r)}
.dimg .emo{font-size:7rem}
.dtitle h2{font:800 clamp(1.9rem,5.5vw,3.2rem)/1.04 var(--display);letter-spacing:-.02em;margin:0 0 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.92rem;background:var(--surface)}
.note{margin:18px 0 0;padding:12px 16px;background:var(--surface);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0}
.note b{display:block;font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:transparent;border-radius:var(--r);padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 12px;font-size:.92rem;border-width:1.5px}
.btn svg{width:20px;height:20px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.daypick{margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.daypick p{margin:0 0 8px;color:var(--muted);font-size:.9rem}
.chip.day{min-width:48px;justify-content:center;font-weight:700}
.recipe{display:grid;gap:28px;margin-top:34px}
@media (min-width:820px){.recipe.two{grid-template-columns:minmax(280px,380px) 1fr;gap:48px;align-items:start}.ings{position:sticky;top:72px}}
.recipe h3{font:800 1.5rem var(--display);margin:0 0 12px}
.intro{color:var(--muted);margin:-4px 0 14px;max-width:62ch}
.scale{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.scale button{min-width:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer}
.scale button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{border-bottom:1px solid var(--line)}
.ing-list label{display:flex;gap:12px;padding:9px 2px;cursor:pointer;align-items:baseline}
.ing-list input{accent-color:var(--focus);width:18px;height:18px;flex:none;transform:translateY(3px)}
.ing-list b{font-weight:700;white-space:nowrap}
.ing-list input:checked ~ span{opacity:.45;text-decoration:line-through}
.steps{margin:0;padding:0;list-style:none;max-width:68ch;counter-reset:step}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:0 0 18px}
.steps li::before{counter-increment:step;content:counter(step);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 .9rem var(--display);margin-top:1px}
.steps b{font-family:var(--display)}
.rtext{white-space:pre-wrap;max-width:68ch}
.md{max-width:68ch}
.md h3,.md h4{font-family:var(--display);margin:18px 0 6px}
.md ul,.md ol{padding-left:22px}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.notes{margin-top:8px;max-width:68ch;color:var(--muted)}

/* Wochenplan */
.planpage{padding:22px 0 70px}
.planpage h1{font-size:clamp(1.9rem,6vw,3rem);margin-bottom:6px;max-width:none}
.lead{color:var(--muted);margin:0 0 6px;max-width:60ch}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:12px 16px;margin:14px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.day{display:grid;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.day{grid-template-columns:130px 1fr;gap:20px}}
.day h3{font:800 1.25rem var(--display);margin:0;padding-top:6px}
.entries{display:grid;gap:8px;min-width:0}
.entry{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px 6px 6px}
.entry .mini{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none}
.entry .thumb{width:52px;flex:none;border-radius:10px}
.entry .emo{font-size:1.7rem}
.entry .nm{font-size:1rem}
.entry select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-weight:600}
.xbtn{border:0;background:none;cursor:pointer;width:38px;height:38px;border-radius:50%;font-size:1.4rem;line-height:1;color:var(--muted)}
.xbtn:hover{background:var(--bg);color:var(--ink)}
.none{color:var(--muted);font-size:.95rem;padding:4px 0}
.addbtn{justify-self:start}
.shop h3{font:800 1.3rem var(--display);margin:26px 0 8px}
.shop .hint{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.shop ul{list-style:none;margin:0;padding:0;max-width:640px}
.shop li{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.shop li label{display:flex;gap:12px;padding:10px 2px;cursor:pointer;align-items:baseline;flex:1;min-width:0}
.shop input[type=checkbox]{accent-color:var(--focus);width:18px;height:18px;flex:none;transform:translateY(3px)}
.shop input:checked ~ span{opacity:.45;text-decoration:line-through}
.shop b{white-space:nowrap}
details.ess{margin-top:26px;max-width:640px;border-top:1px solid var(--line);padding-top:8px}
details.ess summary{cursor:pointer;font:800 1.15rem var(--display);padding:8px 0;color:var(--muted)}
details.ess ul{margin-top:4px;opacity:.85}
.shop h3 .n2{font:500 .95rem var(--body);opacity:.6}
.catsel{position:relative;width:36px;height:36px;flex:none;border-radius:50%;color:var(--muted)}
.catsel span{display:grid;place-items:center;width:100%;height:100%;font-size:1.3rem;font-weight:800}
.catsel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.catsel:focus-within{outline:3px solid var(--focus)}
.catsel:hover{background:var(--bg);color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:12px;max-width:640px}
.addrow input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px}
.nolist li{padding:8px 2px}
.nolist a{font-weight:600}

/* Auswahlfenster */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:82vh}
dialog::backdrop{background:rgba(10,20,16,.55)}
dialog[open]{display:flex;flex-direction:column}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.pk-head h3{font:800 1.25rem var(--display);margin:0}
.pk-q{margin:6px 16px 8px;border:2px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 14px}
#pkList{list-style:none;margin:0;padding:0 8px 12px;overflow:auto}
#pkList button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 8px;cursor:pointer;display:flex;gap:12px;align-items:center}
#pkList button:hover{background:var(--bg)}
#pkList .k{color:var(--muted);font-size:.88rem;margin-left:auto;white-space:nowrap}

.foot{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:.88rem}
.foot p{margin:0 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <a class="home" id="homeLink" href="#/" aria-label="Zur Startseite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
      Home
    </a>
    <a class="planlink" id="planLink" href="#/plan">Wochenplan <span class="badge" id="pbadge" hidden>0</span></a>
  </div>
</div>

<header class="wrap hero" id="hero">
  <h1>Was kochen wir heute?</h1>
  <div class="hero-row">
    <button class="roll" id="roll" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="8" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="8" cy="16" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/></svg>
      Gericht würfeln
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Gericht, Zutat oder Küche suchen" autocomplete="off" aria-label="Suche">
    </label>
  </div>
</header>

<main class="wrap">
  <section id="listView">
    <div class="tabs" id="tabs" role="tablist" aria-label="Kategorien"></div>
    <div class="bar">
      <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="panel">Filter <span class="n" id="fn" hidden>0</span></button>
      <button class="reset" id="reset" type="button" hidden>Filter zurücksetzen</button>
      <span class="scope" id="scope" role="group" aria-label="Suchbereich" hidden><button type="button" data-s="tab" aria-pressed="true">Dieser Reiter</button><button type="button" data-s="all" aria-pressed="false">Alle Reiter</button></span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="panel" id="panel" hidden></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <strong>Keine Treffer</strong>
      Lockere die Filter oder leere die Suche.
      <div><button class="btn" id="reset2" type="button">Alles zurücksetzen</button></div>
    </div>
  </section>

  <section class="detail" id="detailView" hidden></section>
  <section class="planpage" id="planView" hidden></section>
</main>

<dialog id="picker" aria-labelledby="pkTitle">
  <form method="dialog" class="pk-head"><h3 id="pkTitle">Gericht hinzufügen</h3><button class="xbtn" value="close" aria-label="Schließen">×</button></form>
  <input class="pk-q" id="pkQ" type="search" placeholder="Gericht suchen" autocomplete="off" aria-label="Gericht suchen">
  <ul id="pkList"></ul>
</dialog>

<footer class="wrap foot">
  <p id="status"></p>
</footer>

d=1840541940&range=B72"],["Furikake","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B170"],["Frittierte Schalotten","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B169"],["Shimchimi Togarashi","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B168"],["Geröstete Tomaten","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B167"],["Marinierte Eigelbe","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B166"],["Onsen Ei","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B165"],["Five-Spice-Chilipaste","herzhaft","Tare","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B162"],["Miso-Sesam-Tare","herzhaft","Tare","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B161"],["Bonito-Salz","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B160"],["Knoblauchpüree","herzhaft","Tare","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B159"],["Mayu (schwarzes Knoblauchöl)","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B158"],["Chiliöl","herzhaft","Topping","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B157"],["Szechuan-Chilipaste","herzhaft","Tare","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B156"],["Hühner- oder Schweinefett (Tare)","herzhaft","Tare","https://docs.google.com/spreadsheets/d/15l-JhmsniWkD1ngXnCeOTXcI4LwuaZ-xsvg_b8Rqlj0/edit?gid=1840541940#gid=1840541940&range=B155"]],"Rezepte":[["Gericht","Rezept"],["BBQ Chicken mit Frischkäse Füllung","**Gefüllte BBQ-Hähnchenbrust mit Schwarzem Knoblauch**\n\nDieses Rezept hält das Hähnchenbrustfilet durch das kurze Anbraten und die cremig-herzhafte Füllung im Ofen extrem saftig. Der schwarze Knoblauch verleiht dem Fleisch eine tiefe, umami-süßliche Note.\n\n---\n\n### Zutaten (für 2 Personen)\n\n**Hauptzutaten & Marinade:**\n\n* 2 Hähnchenbrustfilets (je ca. 200–250 g)\n* 1–2 EL Neutrales Öl (zum Anbraten)\n* 1–2 TL Geräuchertes Paprikapulver (Pimentón de la Vera)\n* 1 TL Brauner Zucker\n* Salz & frisch gemahlener schwarzer Pfeffer\n\n**Schwarze-Knoblauch-Füllung:**\n\n* 4–5 Zehen schwarzer Knoblauch\n* 100 g Doppelrahm-Frischkäse (alternativ: Feta oder weicher Ziegenkäse)\n* 1 handvoll Reibekäse (z. B. Gouda, Cheddar oder Mozzarella)\n* Optional: 1 TL frischer Thymian oder Schnittlauch\n\n**BBQ-Glaze:**\n\n* 4–5 EL BBQ-Soße eurer Wahl\n* 1 TL Ahornsirup oder Honig\n* Optional: 1 Spritzer Zitronensaft\n\n---\n\n### Zubereitung\n\n**1. Füllung vorbereiten**\n\n1. Die Zehen des schwarzen Knoblauchs auf einem Schneidebrett mit der flachen Seite eines Kochmessers zu einer feinen Paste zerdrücken.\n2. Den Knoblauch gründlich mit dem Frischkäse, dem geriebenen Käse und den Kräutern verrühren. Mit einer kleinen Prise Salz und Pfeffer abschmecken.\n\n**2. Hähnchen vorbereiten & füllen**\n\n1. Die Hähnchenbrustfilets trocken tupfen. Mit einem scharfen Messer seitlich waagerecht eine Tasche einscheiden (darauf achten, das Fleisch nicht komplett durchzuschneiden).\n2. Die Schwarze-Knoblauch-Creme gleichmäßig in die Taschen füllen. Die Öffnung eventuell mit 1–2 Zahnstochern fixieren, damit beim Braten nichts ausläuft.\n3. Die Außenseite der Filets mit geräuchertem Paprikapulver, braunem Zucker, Salz und Pfeffer einreiben.\n\n**3. Anbraten & Ofen-Finish**\n\n1. Den Backofen auf **180 °C Ober-/Unterhitze** vorheizen.\n2. Öl in einer ofenfesten Pfanne (oder einer normalen Pfanne) auf hoher Stufe erhitzen. Die Filets von beiden Seiten jeweils **ca. 2 Minuten scharf anbraten**, bis sie eine schöne Bräunung haben.\n3. Die BBQ-Soße mit dem Ahornsirup/Honig verrühren.\n4. Das Fleisch auf der Oberseite großzügig mit der BBQ-Glaze bestreichen.\n5. Die Pfanne (oder die Filets in einer Auflaufform) für **12–15 Minuten** in den vorgeheizten Ofen geben, bis das Hähnchen durchgegart, aber noch saftig ist.\n\n---\n\n### Servieren\n\nVor dem Anschneiden das Hähnchen etwa **3–5 Minuten ruhen lassen**, damit sich der Fleischsaft verteilt und die Käsefüllung etwas anzieht. Zahnstocher entfernen, leicht schräg aufschneiden und direkt neben dem Mashed Potato und Coleslaw anrichten. Den ausgetretenen Schmorsaft aus der Form über das Fleisch träufeln."],["Hummus","Cremiger Hummus aus getrockneten Kichererbsen (Schnellkochtopf)\nKichererbsen extra weich garen, dann mit Tahin, Zitrone und Knoblauch cremig pürieren.\n\nINGREDIENTS\n• 250 grams getrocknete Kichererbsen\n• 0.5 teaspoons Natron (für das Garen)\n• 1.5 liters Wasser zum Garen\n• 100 grams Tahin (Sesampaste)\n• 4 tablespoons Zitronensaft\n• 2 Knoblauchzehen\n• 1 teaspoons Salz\n• 0.5 teaspoons gemahlener Kreuzkümmel\n• 80 milliliters Eiswasser oder Kochwasser\n• 2 tablespoons Olivenöl zum Servieren\n\nSTEPS\n1. Einweichen: 250 grams getrocknete Kichererbsen über Nacht in reichlich Wasser einweichen (sie verdoppeln ihr Volumen). Danach abgießen und abspülen.\n2. Druckgaren: Kichererbsen mit 1.5 liters Wasser zum Garen und 0.5 teaspoons Natron (für das Garen) in den Schnellkochtopf geben (max. halb voll, wegen Schaum). Auf hoher Stufe garen – länger als für Salat, damit sie richtig weich werden.\n3. Druck abbauen lassen: Topf vom Herd nehmen und den Druck von selbst abbauen lassen, nicht abdampfen. Die Kichererbsen sollten sich zwischen den Fingern mühelos zerdrücken lassen – sonst noch 5 Minuten nachgaren.\n4. Abgießen: Abgießen, dabei etwas Kochwasser auffangen. Wer es extra glatt mag: Schalen grob abreiben (durch das Natron lösen sie sich leicht).\n5. Tahin-Basis: 100 grams Tahin (Sesampaste), 4 tablespoons Zitronensaft, 2 Knoblauchzehen und 1 teaspoons Salz im Mixer etwa 1 Minute aufschlagen, bis es hell und dick wird.\n6. Pürieren: Warme Kichererbsen und 0.5 teaspoons gemahlener Kreuzkümmel dazugeben und 2–3 Minuten pürieren. Nach und nach 80 milliliters Eiswasser oder Kochwasser zugeben, bis es richtig cremig ist. Mit Salz und Zitrone abschmecken.\n7. Servieren: In eine Schale streichen, eine Mulde formen und mit 2 tablespoons Olivenöl zum Servieren beträufeln, gern noch Paprikapulver drüber.\n\nNOTES\nOhne Einweichen: 35–40 Min. auf hoher Stufe garen. Aus 250 g getrockneten werden ca. 600 g gegarte Kichererbsen. Übrige Kichererbsen lassen sich gut einfrieren."],["LaoGanMa","Lao Gan Ma – Chiliöl mit schwarzen Bohnen und MSG (300ml)\nVegetarische Version des berühmten chinesischen Chiliöls, reichlich mit fermentierten schwarzen Bohnen (Douchi) und MSG für extra Umami\n\nINGREDIENTS\n• 300 milliliters Neutrales Pflanzenöl (z.B. Raps- oder Sonnenblumenöl)\n• 90 grams Fermentierte schwarze Bohnen (Douchi), grob gehackt\n• 36 grams Getrocknete Chiliflocken (koreanisch/chinesisch, grob)\n• 2.5 Schalotten, fein gewürfelt\n• 5 Knoblauchzehen, fein gehackt\n• 0.6 tablespoons Ingwer, fein gehackt\n• 0.6 tablespoons Sichuan-Pfefferkörner\n• 1 Sternanis\n• 0.6 Zimtstange\n• 1 Lorbeerblätter\n• 0.6 tablespoons Zucker\n• 1 teaspoons Salz\n• 1.2 tablespoons Helle Sojasauce \n• 1.2 tablespoons Geröstete Sesamsamen\n• 1 teaspoons MSG (Mononatriumglutamat)\n\nSTEPS\n1. Aromaöl ansetzen: 300 milliliters Neutrales Pflanzenöl (z.B. Raps- oder Sonnenblumenöl) zusammen mit 0.6 tablespoons Sichuan-Pfefferkörner, 1 Sternanis, 0.6 Zimtstange und 1 Lorbeerblätter in einen kalten Wok oder Topf geben. Langsam auf mittlerer Hitze erhitzen, bis das Öl auf ca. 130–140°C ist (kleine Bläschen um die Gewürze).\n2. Gewürze ziehen lassen: Hitze reduzieren und die Gewürze bei niedriger Temperatur 10–15 Minuten im Öl ziehen lassen, damit sie ihr Aroma abgeben. Nicht bräunen lassen, nur sanft köcheln.\n3. Gewürze entfernen: Sternanis, Zimtstange und Lorbeerblätter mit einem Sieb oder einer Schaumkelle herausfischen und entsorgen. Die Sichuan-Pfefferkörner können drin bleiben oder ebenfalls entfernt werden.\n4. Schalotten und Knoblauch anbraten: 2.5 Schalotten, fein gewürfelt, 5 Knoblauchzehen, fein gehackt und 0.6 tablespoons Ingwer, fein gehackt ins heiße Aromaöl geben. Bei mittlerer Hitze 5–7 Minuten goldbraun und knusprig braten, dabei ständig rühren, damit nichts anbrennt.\n5. Schwarze Bohnen zugeben: 48 grams Fermentierte schwarze Bohnen (Douchi), grob gehackt hinzufügen und 3–4 Minuten mitbraten, bis sie duften und leicht knusprig werden.\n6. Chiliflocken einrühren: Hitze auf niedrig stellen (wichtig, sonst verbrennen die Chiliflocken und werden bitter). 36 grams Getrocknete Chiliflocken (koreanisch/chinesisch, grob) einrühren und alles gut vermischen. Öl sollte die Chiliflocken bedecken.\n7. Würzen: 0.6 tablespoons Zucker, 1 teaspoons Salz, 1.2 tablespoons Helle Sojasauce und 1 teaspoons MSG (Mononatriumglutamat) einrühren. Alles gut vermengen und nochmal 2–3 Minuten bei niedrigster Hitze ziehen lassen.\n8. Erdnüsse und Sesam unterheben: Vom Herd nehmen, 30 grams Geröstete Erdnüsse, grob gehackt und 1.2 tablespoons Geröstete Sesamsamen unterrühren. Etwas abkühlen lassen.\n9. Abfüllen und reifen lassen: In saubere, sterilisierte Gläser füllen, sodass die festen Bestandteile komplett mit Öl bedeckt sind. Mindestens 24 Stunden ziehen lassen, bevor es verwendet wird – schmeckt nach ein paar Tagen noch besser.\n\nNOTES\nIm Kühlschrank hält es sich mehrere Wochen (die Bohnen und Chilis müssen immer mit Öl bedeckt sein). Douchi (fermentierte schwarze Bohnen) gibt's im Asia-Laden – nicht mit schwarzen Bohnen aus der Dose verwechseln! MSG gibt's ebenfalls im Asia-Laden (oft als \"Aji-no-moto\" oder \"Ve-Tsin\"); wer darauf verzichten will, kann stattdessen etwas mehr Salz und Sojasauce nehmen. Für mehr Schärfe zusätzlich etwas Chilipulver oder frische Chilis mitrösten."],["Refried Beans","Refried Beans aus dem Schnellkochtopf (ohne Einweichen)\nCremige, vegetarische Refried Beans aus getrockneten Pinto-Bohnen – direkt ohne Einweichen gegart\n\nINGREDIENTS\n• 500 grams getrocknete Pinto-Bohnen\n• 1.5 liters Wasser oder Gemüsebrühe\n• 1 Zwiebel, grob gewürfelt\n• 4 Knoblauchzehen, angedrückt\n• 1 Jalapeño, entkernt und gehackt (optional)\n• 2 Lorbeerblätter\n• 2 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons getrockneter Oregano (am besten mexikanischer)\n• 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver\n• 3 tablespoons Olivenöl oder Butter\n• 2 teaspoons Salz\n• 1 Limette, Saft\n\nSTEPS\n1. Bohnen vorbereiten: 500 grams getrocknete Pinto-Bohnen verlesen (kleine Steinchen und kaputte Bohnen aussortieren) und in einem Sieb gründlich kalt abspülen.\n2. Anbraten: Im Schnellkochtopf (bzw. Sauté-Funktion) 3 tablespoons Olivenöl oder Butter erhitzen. 1 Zwiebel, grob gewürfelt darin 4–5 Minuten glasig anschwitzen, dann 4 Knoblauchzehen, angedrückt und 1 Jalapeño, entkernt und gehackt (optional) 1 Minute mitbraten. 2 teaspoons gemahlener Kreuzkümmel, 1 teaspoons getrockneter Oregano (am besten mexikanischer) und 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver kurz mitrösten, bis es duftet.\n3. Alles in den Topf: Bohnen, 1.5 liters Wasser oder Gemüsebrühe und 2 Lorbeerblätter dazugeben und umrühren. Noch nicht salzen. Die Bohnen sollten gut bedeckt sein; die Max-Markierung des Topfes (meist 2/3, bei Hülsenfrüchten ½) nicht überschreiten.\n4. Unter Druck garen: Deckel schließen und auf hoher Druckstufe 45 Minuten garen (bei sehr alten Bohnen 50–55 Minuten).\n5. Natürlich abdampfen: Druck mindestens 20 Minuten von selbst abbauen lassen, erst dann den Restdruck ablassen. Schnelles Ablassen lässt stärkehaltigen Schaum aus dem Ventil spritzen und macht die Bohnen ungleichmäßig.\n6. Garprobe & Flüssigkeit abnehmen: Prüfen, ob sich die Bohnen mühelos zerdrücken lassen – sonst weitere 5–10 Minuten unter Druck garen. Lorbeerblätter entfernen. Etwa 250–400 ml Kochflüssigkeit abschöpfen und beiseitestellen (nicht wegschütten!).\n7. Pürieren: Bohnen mit einem Stampfer oder Pürierstab zur gewünschten Konsistenz verarbeiten – grob und rustikal oder ganz glatt. Mit 2 teaspoons Salz und 1 Limette, Saft abschmecken. Ist es zu fest, schluckweise Kochflüssigkeit unterrühren.\n8. Einkochen lassen: Für die klassische Refried-Konsistenz die Masse auf Sauté-Stufe oder in einer Pfanne unter Rühren 5–10 Minuten einkochen, bis sie dicklich und cremig ist. Beim Abkühlen dickt sie noch nach.\n\nNOTES\nSalz erst nach dem Garen zugeben – so werden ungeweichte Bohnen zuverlässiger weich. Für mehr Aroma zum Schluss einen Löffel Butter unterziehen oder mit Käse überbacken. Hält sich im Kühlschrank ca. 5 Tage und lässt sich gut portionsweise einfrieren; beim Aufwärmen etwas Wasser oder Brühe zugeben."],["Chili Con Carne","Chili con Carne mit Trockenchilis\nGeschmortes Rindfleisch in tiefroter Sauce aus gerösteten Trockenchilis\n\nINGREDIENTS\n• 5 Guajillo-Chilis\n• 2 Cascabel-Chilis\n• 2 Morita-Chilis\n• 3 Chiles de Árbol (nach Schärfewunsch)\n• 1 kilograms Rinderschulter oder -nacken, in 2-cm-Würfeln\n• 3 tablespoons Pflanzenöl\n• 2 Zwiebeln, gewürfelt\n• 5 Knoblauchzehen, gehackt\n• 2 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons getrockneter Oregano\n• 2 tablespoons Tomatenmark\n• 400 grams stückige Tomaten (Dose)\n• 500 milliliters Rinderbrühe\n• 330 milliliters dunkles Bier (oder mehr Brühe)\n• 1 tablespoons Backkakao oder dunkle Schokolade\n• 480 grams Kidney- oder Pinto-Bohnen, abgetropft (optional)\n• 2 tablespoons Masa Harina oder feiner Maisgrieß\n• 2 teaspoons Salz\n• 1 tablespoons Apfelessig oder Limettensaft\n\nSTEPS\n1. Chilis rösten & einweichen: Von 5 Guajillo-Chilis, 2 Cascabel-Chilis, 2 Morita-Chilis und 3 Chiles de Árbol (nach Schärfewunsch) Stiele und Kerne entfernen. Trocken je Seite 20–30 Sekunden rösten und anschließend 20 Minuten in kochendem Wasser einweichen.\n2. Chilipaste mixen: Die Chilis abtropfen lassen und mit einem Teil der 500 milliliters Rinderbrühe glatt pürieren. Bei Bedarf durch ein Sieb streichen.\n3. Fleisch anbraten: 1 kilograms Rinderschulter oder -nacken, in 2-cm-Würfeln trocken tupfen und salzen. In 3 tablespoons Pflanzenöl im schweren Topf portionsweise rundum kräftig braun anbraten, nicht überfüllen. Herausnehmen.\n4. Aromaten: Im Bratfett 2 Zwiebeln, gewürfelt 5 Minuten anschwitzen. 5 Knoblauchzehen, gehackt, 2 teaspoons gemahlener Kreuzkümmel, 1 teaspoons getrockneter Oregano und 2 tablespoons Tomatenmark 2 Minuten mitrösten.\n5. Ablöschen: Chilipaste 2 Minuten mitbraten. Mit 330 milliliters dunkles Bier (oder mehr Brühe) ablöschen und den Bratensatz vom Boden lösen. Fleisch samt Saft, 400 grams stückige Tomaten (Dose), restliche Brühe und 1 tablespoons Backkakao oder dunkle Schokolade zugeben.\n6. Schmoren: Zugedeckt bei kleiner Hitze 2–2,5 Stunden schmoren, bis das Fleisch zart ist. Gelegentlich umrühren und bei Bedarf Flüssigkeit nachgießen. Im Schnellkochtopf: 35 Minuten hohe Stufe, natürlich abdampfen lassen.\n7. Abschluss: 480 grams Kidney- oder Pinto-Bohnen, abgetropft (optional) zugeben, falls gewünscht. 2 tablespoons Masa Harina oder feiner Maisgrieß mit etwas Wasser anrühren, einrühren und 10 Minuten köcheln lassen. Mit 2 teaspoons Salz und 1 tablespoons Apfelessig oder Limettensaft abschmecken.\n\nNOTES\nMit Hackfleisch: 800 g Rinderhack krümelig anbraten, dann alles nur 45 Minuten köcheln lassen. Dazu passen saure Sahne, eingelegte rote Zwiebeln, Koriander und Cornbread oder Tortillas."],["Chili Sin Carne","Chili sin Carne mit Trockenchilis\nRauchig-fruchtiges vegetarisches Chili mit selbstgemachter Chilipaste\n\nINGREDIENTS\n• 4 Guajillo-Chilis\n• 2 Cascabel-Chilis\n• 2 Morita-Chilis\n• 2 Chiles de Árbol (nach Schärfewunsch)\n• 150 grams Sojagranulat (oder Alternative, siehe oben)\n• 750 milliliters heiße Gemüsebrühe\n• 2 tablespoons Sojasauce\n• 4 tablespoons Pflanzenöl\n• 2 Zwiebeln, gewürfelt\n• 4 Knoblauchzehen, gehackt\n• 1 Paprikaschote, gewürfelt\n• 2 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons getrockneter Oregano\n• 0.3 teaspoons Zimt\n• 2 tablespoons Tomatenmark\n• 800 grams stückige Tomaten (Dose)\n• 480 grams Kidney- oder Pinto-Bohnen, abgetropft\n• 1 tablespoons Backkakao oder dunkle Schokolade\n• 2 tablespoons Masa Harina oder feiner Maisgrieß (optional)\n• 1.5 teaspoons Salz\n• 1 Limette, Saft\n\nSTEPS\n1. Chilis rösten: Von 4 Guajillo-Chilis, 2 Cascabel-Chilis, 2 Morita-Chilis und 2 Chiles de Árbol (nach Schärfewunsch) Stiele und Kerne entfernen. In einer trockenen Pfanne je Seite 20–30 Sekunden rösten, bis sie duften und weich werden. Nicht schwarz werden lassen, sonst wird es bitter.\n2. Chilis einweichen: Die gerösteten Chilis mit kochendem Wasser übergießen, beschweren und 20 Minuten einweichen.\n3. Sojahack einweichen: Währenddessen 150 grams Sojagranulat (oder Alternative, siehe oben) mit 750 milliliters heiße Gemüsebrühe und 2 tablespoons Sojasauce übergießen und 10 Minuten quellen lassen. Danach gut ausdrücken und die Brühe auffangen.\n4. Chilipaste mixen: Die Chilis abtropfen lassen und mit ca. 200 ml frischem Wasser oder der aufgefangenen Brühe glatt pürieren. Für eine besonders feine Sauce durch ein Sieb streichen.\n5. Fleischersatz anbraten: Die Hälfte von 4 tablespoons Pflanzenöl in einem großen Topf stark erhitzen. Das ausgedrückte Sojagranulat darin portionsweise 6–8 Minuten kräftig braun anbraten, dann herausnehmen.\n6. Gemüse & Gewürze: Restliches Öl in den Topf geben. 2 Zwiebeln, gewürfelt und 1 Paprikaschote, gewürfelt 5 Minuten anschwitzen, dann 4 Knoblauchzehen, gehackt, 2 teaspoons gemahlener Kreuzkümmel, 1 teaspoons getrockneter Oregano, 0.3 teaspoons Zimt und 2 tablespoons Tomatenmark 2 Minuten mitrösten.\n7. Köcheln: Chilipaste dazugeben und 2 Minuten unter Rühren anbraten. Dann 800 grams stückige Tomaten (Dose), die aufgefangene Brühe, den Fleischersatz und 1 tablespoons Backkakao oder dunkle Schokolade zugeben. Halb zugedeckt 30 Minuten sanft köcheln lassen.\n8. Bohnen & Abschluss: 480 grams Kidney- oder Pinto-Bohnen, abgetropft unterrühren und 10 Minuten weiterköcheln. Zum Andicken 2 tablespoons Masa Harina oder feiner Maisgrieß (optional) mit etwas Wasser anrühren und einrühren. Mit 1.5 teaspoons Salz und 1 Limette, Saft abschmecken.\n\nNOTES\nDazu passen saure Sahne, Koriander, Frühlingszwiebeln, Avocado und Tortillas oder Reis. Am nächsten Tag schmeckt es noch besser. Statt Dosenbohnen kannst du die Bohnen aus dem Schnellkochtopf verwenden.\n\nSojahack / Sojagranulat (ca. 150 g trocken): Es kommt der Hackfleisch-Textur am nächsten. Weiche es in heißer Brühe mit einem Schuss Sojasauce ein und brate es danach scharf an, bis es Röstaromen hat.\nRäuchertofu (400 g): Zerbrösel ihn grob mit den Händen und brate ihn in Öl richtig knusprig. Er passt durch seinen Rauch sehr gut zu den Moritas.\nSeitan (400 g): Fein gehackt oder in kleinen Würfeln wird er eher „steakig“. Er erinnert an Texas-Chili mit Fleischwürfeln.\nLinsen (200 g trocken, braun oder Beluga): Gib sie einfach roh mit etwas mehr Flüssigkeit dazu. Das ist die günstigste und unkomplizierteste Variante.\nPilz-Walnuss-Hack (300 g Champignons + 100 g Walnüsse, beides grob gehackt): Brate es lange an, bis die Flüssigkeit verdampft ist. Das gibt viel Umami und Biss.\nJackfruit (Dose, junge Jackfruit in Lake): Abspülen, anbraten und zerzupfen. Sie wird faserig, eher wie Pulled Meat."],["Flammenkuchen","Flammkuchen – Teig & Aufstrich\nHauchdünner, knuspriger Grundteig ohne Hefe mit klassischem Schmand-Crème-fraîche-Aufstrich\n\nINGREDIENTS\n• 400 grams Weizenmehl (Type 550 oder 405)\n• 220 milliliters lauwarmes Wasser\n• 3 tablespoons Oliven- oder Rapsöl\n• 1 teaspoons Salz (Teig)\n• 200 grams Schmand\n• 200 grams Crème fraîche\n• 0.5 teaspoons Salz (Aufstrich)\n• 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 1 pinch Muskatnuss, frisch gerieben\n\nSTEPS\n1. Teig kneten: 400 grams Weizenmehl (Type 550 oder 405), 220 milliliters lauwarmes Wasser, 3 tablespoons Oliven- oder Rapsöl und 1 teaspoons Salz (Teig) 5–8 Minuten zu einem glatten, geschmeidigen Teig kneten. Ist er zu klebrig, etwas Mehl zugeben, ist er zu trocken, etwas Wasser.\n2. Ruhen lassen: Den Teig abgedeckt mindestens 30 Minuten bei Raumtemperatur ruhen lassen. Dadurch lässt er sich später viel leichter dünn ausrollen.\n3. Ofen vorheizen: Den Backofen mit Backblech oder Pizzastein auf die höchste Stufe (250–300 °C Ober-/Unterhitze) mindestens 20 Minuten vorheizen.\n4. Aufstrich anrühren: 200 grams Schmand und 200 grams Crème fraîche mit 0.5 teaspoons Salz (Aufstrich), 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen und 1 pinch Muskatnuss, frisch gerieben glatt verrühren.\n5. Ausrollen: Den Teig in 4 Portionen teilen und jede auf Backpapier hauchdünn ausrollen, etwa 1–2 mm. Die Form darf ruhig rustikal sein.\n6. Bestreichen & belegen: Den Aufstrich dünn bis knapp an den Rand verstreichen, etwa 3–4 EL pro Fladen. Dann nach Wunsch belegen.\n7. Backen: Mit dem Backpapier auf das heiße Blech ziehen und 8–12 Minuten backen, bis die Ränder gebräunt und knusprig sind.\n\nNOTES\nWenn du nur eins von beidem hast, kannst du auch nur Schmand oder nur Crème fraîche nehmen. Mit Schmand wird der Aufstrich etwas säuerlicher, mit Crème fraîche cremiger. Der Teig lässt sich gut einen Tag vorher machen und im Kühlschrank lagern. Hol ihn 30 Minuten vor dem Ausrollen heraus."],["Rote Beete & Kichererbsen Salat","Rote Beete + Kichererbsen + Rote Zwiebeln + Feta + Olivenöl + Balsamico "],["Greek Salat","Griechischer Salat (Horiatiki)\nKlassischer Bauernsalat mit Feta, Oliven und Oregano – ohne Blattsalat\n\nINGREDIENTS\n• 4 reife Tomaten\n• 1 Salatgurke\n• 1 grüne Paprikaschote\n• 1 rote Zwiebel\n• 100 grams Kalamata-Oliven\n• 200 grams Feta (am Stück)\n• 5 tablespoons gutes Olivenöl\n• 1.5 tablespoons Rotweinessig\n• 1 teaspoons getrockneter Oregano\n• 0.5 teaspoons Salz\n• 1 tablespoons Kapern (optional)\n\nSTEPS\n1. Gemüse schneiden: 4 reife Tomaten in grobe Spalten schneiden. 1 Salatgurke längs halbieren und in dicke Halbmonde schneiden. 1 grüne Paprikaschote in Ringe und 1 rote Zwiebel in dünne Ringe schneiden.\n2. Würzen: Das Gemüse in einer Schüssel mit 0.5 teaspoons Salz bestreuen und 5 Minuten ziehen lassen, damit die Tomaten etwas Saft abgeben.\n3. Anmachen: 100 grams Kalamata-Oliven und 1 tablespoons Kapern (optional) zugeben und mit 1.5 tablespoons Rotweinessig und der Hälfte von 5 tablespoons gutes Olivenöl vorsichtig mischen.\n4. Feta obenauf: 200 grams Feta (am Stück) als ganze Scheibe obenauf legen, mit 1 teaspoons getrockneter Oregano bestreuen und das restliche Öl darüberziehen. Mit Brot servieren, um den Saft aufzutunken.\n\nNOTES\nSchmeckt am besten mit sonnenreifen Tomaten bei Zimmertemperatur. Nicht im Kühlschrank lagern."],["Ceasar Salat","Caesar Salad\nKnackiger Romana mit cremigem Sardellen-Parmesan-Dressing und Knoblauch-Croûtons\n\nINGREDIENTS\n• 3 Romanasalatherzen\n• 150 grams Ciabatta oder Baguette vom Vortag\n• 3 tablespoons Olivenöl (Croûtons)\n• 2 Knoblauchzehen\n• 4 Sardellenfilets\n• 1 Eigelb (sehr frisch)\n• 1 teaspoons Dijon-Senf\n• 2 tablespoons Zitronensaft\n• 1 teaspoons Worcestershiresauce\n• 100 milliliters neutrales Öl (Dressing)\n• 60 grams Parmesan, fein gerieben\n• 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 1 pinch Salz\n\nSTEPS\n1. Croûtons rösten: 150 grams Ciabatta oder Baguette vom Vortag in 2-cm-Würfel schneiden. In 3 tablespoons Olivenöl (Croûtons) mit einer angedrückten Zehe von 2 Knoblauchzehen bei mittlerer Hitze rundum goldbraun rösten. Leicht salzen.\n2. Dressing-Basis: Die zweite Knoblauchzehe und 4 Sardellenfilets fein hacken und mit der Messerklinge zu einer Paste zerdrücken. Mit 1 Eigelb (sehr frisch), 1 teaspoons Dijon-Senf, 2 tablespoons Zitronensaft und 1 teaspoons Worcestershiresauce in einer Schüssel verrühren.\n3. Aufschlagen: 100 milliliters neutrales Öl (Dressing) zuerst tropfenweise, dann in dünnem Strahl unter ständigem Rühren einlaufen lassen, bis eine cremige Emulsion entsteht. Alternativ mit dem Pürierstab arbeiten.\n4. Abschmecken: Zwei Drittel von 60 grams Parmesan, fein gerieben unterrühren. Mit 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen und 1 pinch Salz abschmecken. Ist das Dressing zu dick, einen Schuss Wasser zugeben.\n5. Anrichten: 3 Romanasalatherzen in mundgerechte Stücke zupfen, waschen und gut trocknen. Mit dem Dressing vermengen, die Croûtons zugeben und mit dem restlichen Parmesan bestreuen.\n\nNOTES\nOhne rohes Ei: Ersetze Eigelb und Öl durch 4 EL Mayonnaise. Vegetarisch: Lass die Sardellen weg, nimm stattdessen 1 TL gehackte Kapern und eine vegetarische Worcestershiresauce. Klassischer Parmesan wird mit tierischem Lab hergestellt, es gibt aber Hartkäse mit mikrobiellem Lab. Wer möchte, kann gebratenes Hähnchen oder Halloumi als Topping dazugeben."],["Thunfisch Salat","Thunfischsalat\nSättigender Salat mit Thunfisch, Ei, Mais und weißen Bohnen in Senf-Vinaigrette\n\nINGREDIENTS\n• 2 Thunfisch in eigenem Saft oder Öl (Dosen, à ca. 150 g abgetropft)\n• 4 Eier\n• 1 Blattsalat (z. B. Eisberg oder Romana), Kopf\n• 250 grams Kirschtomaten\n• 140 grams Mais (Dose), abgetropft\n• 240 grams weiße Bohnen (Dose), abgetropft\n• 1 rote Zwiebel\n• 5 tablespoons Olivenöl\n• 2 tablespoons Weißweinessig\n• 1 teaspoons mittelscharfer Senf\n• 1 teaspoons Honig\n• 0.5 teaspoons Salz\n• 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen\n• 2 tablespoons Petersilie oder Schnittlauch, gehackt\n\nSTEPS\n1. Eier kochen: 4 Eier 9 Minuten hart kochen, kalt abschrecken, pellen und vierteln.\n2. Vinaigrette: 2 tablespoons Weißweinessig, 1 teaspoons mittelscharfer Senf, 1 teaspoons Honig, 0.5 teaspoons Salz und 0.5 teaspoons schwarzer Pfeffer, frisch gemahlen verrühren, dann 5 tablespoons Olivenöl unterschlagen.\n3. Gemüse vorbereiten: 1 Blattsalat (z. B. Eisberg oder Romana), Kopf in mundgerechte Stücke zupfen, 250 grams Kirschtomaten halbieren und 1 rote Zwiebel in feine Ringe schneiden.\n4. Zusammenstellen: 2 Thunfisch in eigenem Saft oder Öl (Dosen, à ca. 150 g abgetropft) gut abtropfen lassen und grob zerpflücken. Salat, Tomaten, Zwiebel, 140 grams Mais (Dose), abgetropft und 240 grams weiße Bohnen (Dose), abgetropft mit der Vinaigrette mischen. Thunfisch und Eier obenauf verteilen und mit 2 tablespoons Petersilie oder Schnittlauch, gehackt bestreuen.\n\nNOTES\nFür die Brotaufstrich-Variante: Thunfisch mit 3 EL Mayo, 1 EL Joghurt, fein gewürfelter Zwiebel, Gewürzgurke, etwas Zitronensaft, Salz und Pfeffer zerdrücken."],["Steak Sandwich","Kasten-Weißbrot, Steak, Bacon, Ananas, Ei, Zwiebeln, Salat, Tomate, Mayo & BBQ Sauce"],["Croque Monsieur / Madame","Croque Monsieur / Croque Madame\nÜberbackenes Schinken-Käse-Sandwich mit Béchamel – mit Spiegelei wird's zur Madame\n\nINGREDIENTS\n• 30 grams Butter\n• 2 tablespoons Mehl\n• 300 milliliters Milch\n• 1 pinch Muskatnuss\n• 0.5 teaspoons Salz\n• 200 grams Gruyère oder Emmentaler, gerieben\n• 8 Scheiben Sandwich- oder Bauernbrot\n• 2 tablespoons Dijon-Senf\n• 8 Scheiben Kochschinken\n• 30 grams weiche Butter zum Bestreichen\n• 4 Eier (nur für Madame)\n\nSTEPS\n1. Béchamel: 30 grams Butter schmelzen, 2 tablespoons Mehl einrühren und 1 Minute anschwitzen. 300 milliliters Milch nach und nach unterrühren und 3–4 Minuten zu einer dicken Sauce köcheln. Mit 1 pinch Muskatnuss und 0.5 teaspoons Salz würzen und ein Drittel von 200 grams Gruyère oder Emmentaler, gerieben einrühren.\n2. Ofen vorheizen: Den Ofen auf 220 °C Oberhitze bzw. Grillfunktion vorheizen.\n3. Sandwiches bauen: 4 Scheiben von 8 Scheiben Sandwich- oder Bauernbrot mit 2 tablespoons Dijon-Senf bestreichen. Mit 8 Scheiben Kochschinken, etwas Béchamel und der Hälfte des restlichen Käses belegen und mit den übrigen Brotscheiben zudecken.\n4. Anrösten: Die Sandwiches außen mit 30 grams weiche Butter zum Bestreichen bestreichen und in der Pfanne je Seite 2–3 Minuten goldbraun rösten.\n5. Überbacken: Auf ein Blech legen, oben dick mit restlicher Béchamel bestreichen, mit dem restlichen Käse bestreuen und 5–7 Minuten überbacken, bis alles blubbert und bräunt.\n6. Madame-Variante: Für Croque Madame währenddessen 4 Eier (nur für Madame) als Spiegeleier mit flüssigem Eigelb braten und je eins obenauf setzen.\n\nNOTES\nVegetarisch: Ersetze den Schinken durch Spinat oder gebratene Champignons."],["Arrancini","Arancini\nFrittierte sizilianische Reisbällchen mit Safran-Risotto und Mozzarella-Kern\n\nINGREDIENTS\n• 300 grams Risottoreis (Arborio oder Carnaroli)\n• 1 Zwiebel, fein gewürfelt\n• 30 grams Butter\n• 100 milliliters Weißwein\n• 900 milliliters heiße Gemüsebrühe\n• 1 pinch Safran (optional)\n• 60 grams Parmesan, gerieben\n• 125 grams Mozzarella, in 1-cm-Würfeln\n• 80 grams Mehl\n• 2 Eier\n• 150 grams Paniermehl\n• 1 liters Frittieröl\n• 1 teaspoons Salz\n\nSTEPS\n1. Risotto kochen: 1 Zwiebel, fein gewürfelt in 30 grams Butter glasig anschwitzen, 300 grams Risottoreis (Arborio oder Carnaroli) 1 Minute mitrösten. Mit 100 milliliters Weißwein ablöschen. 1 pinch Safran (optional) in die Brühe geben. 900 milliliters heiße Gemüsebrühe kellenweise unter Rühren zugeben, bis der Reis nach ca. 18 Minuten gar und eher fest-klebrig ist.\n2. Abschmecken & abkühlen: 60 grams Parmesan, gerieben und 1 teaspoons Salz unterrühren. Das Risotto auf einem Blech ausstreichen und vollständig auskühlen lassen, am besten über Nacht im Kühlschrank.\n3. Formen: Mit feuchten Händen je 2 EL Reis flach drücken, einen Würfel 125 grams Mozzarella, in 1-cm-Würfeln in die Mitte legen und zu einer festen Kugel schließen. Ergibt ca. 16 Stück.\n4. Panieren: Die Kugeln nacheinander in 80 grams Mehl, verquirlten 2 Eier und 150 grams Paniermehl wälzen. Für extra Knusprigkeit Ei und Paniermehl wiederholen.\n5. Frittieren: 1 liters Frittieröl auf 175 °C erhitzen. Die Arancini portionsweise 4–5 Minuten goldbraun frittieren und auf Küchenpapier abtropfen lassen.\n\nNOTES\nOhne Fritteuse: Mit Öl besprühen und bei 200 °C ca. 20 Minuten im Ofen backen. Sie werden dann weniger knusprig. Dazu passt eine Tomatensauce zum Dippen. Klassische Füllungen sind auch Ragù mit Erbsen oder Spinat mit Ricotta."],["Bahn Mi","Bánh mì\nVietnamesisches Baguette mit Zitronengras-Schwein oder -Tofu, Pickles und Koriander\n\nINGREDIENTS\n• 2 Möhren, in feinen Stiften\n• 150 grams Rettich oder Daikon, in feinen Stiften\n• 100 milliliters Reis- oder Weißweinessig\n• 3 tablespoons Zucker\n• 1 teaspoons Salz\n• 500 grams Schweinenacken (dünn geschnitten) oder fester Tofu\n• 2 Zitronengrasstangen, fein gehackt\n• 3 Knoblauchzehen, gehackt\n• 2 tablespoons Fischsauce (vegetarisch: Sojasauce)\n• 1 tablespoons brauner Zucker oder Honig\n• 2 tablespoons neutrales Öl\n• 4 kleine, luftige Baguettes\n• 4 tablespoons Mayonnaise\n• 1 tablespoons Sriracha\n• 0.5 Salatgurke, in Streifen\n• 1 Koriander, Bund\n• 1 frische Chili, in Ringen\n\nSTEPS\n1. Pickles: 100 milliliters Reis- oder Weißweinessig mit 3 tablespoons Zucker, 1 teaspoons Salz und 100 ml warmem Wasser verrühren, bis sich alles gelöst hat. 2 Möhren, in feinen Stiften und 150 grams Rettich oder Daikon, in feinen Stiften hineingeben und mindestens 30 Minuten ziehen lassen.\n2. Marinieren: 500 grams Schweinenacken (dünn geschnitten) oder fester Tofu (Tofu in Scheiben, vorher gut ausgedrückt) mit 2 Zitronengrasstangen, fein gehackt, 3 Knoblauchzehen, gehackt, 2 tablespoons Fischsauce (vegetarisch: Sojasauce), 1 tablespoons brauner Zucker oder Honig und der Hälfte von 2 tablespoons neutrales Öl mischen und 30 Minuten marinieren.\n3. Braten: Restliches Öl stark erhitzen und Fleisch oder Tofu portionsweise 3–4 Minuten je Seite karamellisiert braten.\n4. Brot & Mayo: 4 kleine, luftige Baguettes 3–4 Minuten im Ofen aufknüspern und längs aufschneiden. 4 tablespoons Mayonnaise mit 1 tablespoons Sriracha verrühren und die Innenseiten damit bestreichen.\n5. Belegen: Mit Fleisch oder Tofu, abgetropften Pickles, 0.5 Salatgurke, in Streifen, reichlich 1 Koriander, Bund und 1 frische Chili, in Ringen füllen.\n\nNOTES\nWichtig ist ein luftiges Baguette mit dünner Kruste. Ein schweres, dichtes Brot ist dafür zu fest. Die Pickles halten sich im Kühlschrank etwa eine Woche."],["Daal","Linsen-Dal mit Tadka\nCremiges rotes Linsendal, zum Schluss mit heißem Gewürzöl übergossen\n\nINGREDIENTS\n• 250 grams rote Linsen\n• 1 liters Wasser\n• 1 teaspoons Kurkuma\n• 1 Ingwer, gerieben (Stück, ca. 3 cm)\n• 2 Tomaten, gewürfelt\n• 1.5 teaspoons Salz\n• 3 tablespoons Ghee oder Butter/Öl\n• 1 teaspoons Kreuzkümmelsamen\n• 1 teaspoons Senfsamen (optional)\n• 1 Zwiebel, fein gewürfelt\n• 4 Knoblauchzehen, in Scheiben\n• 2 getrocknete Chilis (z. B. Árbol)\n• 1 teaspoons Garam Masala\n• 0.5 Zitrone, Saft (halbe)\n• 2 tablespoons Koriander, gehackt\n\nSTEPS\n1. Linsen kochen: 250 grams rote Linsen abspülen und mit 1 liters Wasser, 1 teaspoons Kurkuma, 1 Ingwer, gerieben (Stück, ca. 3 cm) und 2 Tomaten, gewürfelt aufkochen. Schaum abschöpfen und 20–25 Minuten köcheln lassen, bis die Linsen zerfallen. Dabei gelegentlich umrühren.\n2. Konsistenz: Mit dem Schneebesen cremig schlagen und mit 1.5 teaspoons Salz würzen. Je nach gewünschter Konsistenz Wasser nachgießen.\n3. Tadka: 3 tablespoons Ghee oder Butter/Öl in einer kleinen Pfanne stark erhitzen. 1 teaspoons Kreuzkümmelsamen und 1 teaspoons Senfsamen (optional) darin rösten, bis sie knistern. 1 Zwiebel, fein gewürfelt 5 Minuten goldbraun braten, dann 4 Knoblauchzehen, in Scheiben und 2 getrocknete Chilis (z. B. Árbol) 1 Minute mitbraten. Zum Schluss 1 teaspoons Garam Masala einrühren.\n4. Vollenden: Das heiße Tadka zischend über das Dal gießen. Mit 0.5 Zitrone, Saft (halbe) abschmecken und mit 2 tablespoons Koriander, gehackt bestreuen. Dazu Basmatireis oder Naan servieren.\n\nNOTES\nIm Schnellkochtopf: Die Linsen 6 Minuten auf hoher Stufe garen und den Druck natürlich abbauen lassen. Eine Handvoll Spinat zum Schluss unterzurühren passt gut."],["Cola Braised Beef","Cola Braised Beef\nZartes geschmortes Rindfleisch in süß-salziger Cola-Soja-Glasur\n\nINGREDIENTS\n• 1.2 kilograms Rinderschulter oder Short Ribs, in 4-cm-Stücken\n• 1 teaspoons Salz\n• 2 tablespoons neutrales Öl\n• 2 Zwiebeln, in Spalten\n• 6 Knoblauchzehen, angedrückt\n• 1 Ingwer, in Scheiben (Stück, ca. 4 cm)\n• 500 milliliters Cola (mit Zucker, nicht light)\n• 80 milliliters Sojasauce\n• 2 tablespoons Reisessig oder Apfelessig\n• 2 Sternanis\n• 2 getrocknete Chilis\n• 250 milliliters Rinderbrühe oder Wasser\n• 3 Frühlingszwiebeln, in Ringen\n• 1 tablespoons gerösteter Sesam\n\nSTEPS\n1. Anbraten: 1.2 kilograms Rinderschulter oder Short Ribs, in 4-cm-Stücken trocken tupfen, mit 1 teaspoons Salz würzen und in 2 tablespoons neutrales Öl im schweren Bräter portionsweise rundum dunkel anbraten. Herausnehmen.\n2. Aromaten: 2 Zwiebeln, in Spalten, 6 Knoblauchzehen, angedrückt und 1 Ingwer, in Scheiben (Stück, ca. 4 cm) im Bratfett 3–4 Minuten anrösten.\n3. Ablöschen: Mit 500 milliliters Cola (mit Zucker, nicht light) ablöschen und den Bratensatz lösen. 80 milliliters Sojasauce, 2 tablespoons Reisessig oder Apfelessig, 2 Sternanis, 2 getrocknete Chilis, 250 milliliters Rinderbrühe oder Wasser und das Fleisch zugeben. Das Fleisch sollte fast bedeckt sein.\n4. Schmoren: Zugedeckt bei 160 °C im Ofen oder bei kleiner Hitze auf dem Herd 2,5–3 Stunden schmoren, bis das Fleisch mit der Gabel zerfällt. Im Schnellkochtopf: 45 Minuten hohe Stufe, natürlich abdampfen lassen.\n5. Glasur einkochen: Fleisch herausnehmen, Sternanis und Ingwer entfernen. Die Sauce offen 10–15 Minuten sirupartig einkochen. Danach das Fleisch darin schwenken.\n6. Servieren: Mit 3 Frühlingszwiebeln, in Ringen und 1 tablespoons gerösteter Sesam bestreuen. Dazu passen Reis und gedämpfter Pak Choi oder Brokkoli.\n\nNOTES\nLight- oder Zero-Cola funktioniert nicht, weil nur Zucker karamellisiert. Wer es weniger süß mag, ersetzt etwa 150 ml der Cola durch Brühe. Am nächsten Tag schmeckt es noch besser, das Fett lässt sich dann gekühlt leicht abnehmen."],["Risotto","Risotto – Grundrezept\nNeutrale Risotto-Basis zum Variieren\n\nINGREDIENTS\n• 320 grams Risottoreis (Carnaroli oder Arborio)\n• 1.2 liters Gemüsebrühe\n• 2 Schalotten oder Zwiebel, fein gewürfelt\n• 2 tablespoons Olivenöl\n• 150 milliliters trockener Weißwein\n• 50 grams kalte Butter, in Würfeln\n• 70 grams Parmesan, fein gerieben\n• 1 teaspoons Salz\n• 0.5 teaspoons schwarzer Pfeffer\n\nSTEPS\n1. Brühe erhitzen: 1.2 liters Gemüsebrühe in einem Topf auf kleiner Flamme heiß halten. Kalte Brühe stoppt jedes Mal den Garprozess.\n2. Anschwitzen: 2 Schalotten oder Zwiebel, fein gewürfelt in 2 tablespoons Olivenöl bei mittlerer Hitze 3–4 Minuten glasig anschwitzen, ohne dass sie Farbe nehmen. Hier kommen Variations-Aromaten mit hinein.\n3. Reis rösten: 320 grams Risottoreis (Carnaroli oder Arborio) zugeben und 1–2 Minuten unter Rühren rösten, bis die Ränder glasig werden.\n4. Ablöschen: Mit 150 milliliters trockener Weißwein ablöschen und unter Rühren fast vollständig einkochen lassen.\n5. Kellenweise garen: Brühe kellenweise zugeben und regelmäßig rühren. Die nächste Kelle kommt erst, wenn die vorige fast aufgesogen ist. Nach etwa 17–19 Minuten ist der Reis cremig, hat aber noch Biss. Gemüse für Variationen je nach Garzeit mittendrin zugeben.\n6. Mantecare: Den Topf vom Herd ziehen, eine letzte Schlucke Brühe zugeben und 50 grams kalte Butter, in Würfeln sowie 70 grams Parmesan, fein gerieben kräftig unterrühren, bis alles glänzt. Mit 1 teaspoons Salz und 0.5 teaspoons schwarzer Pfeffer abschmecken. 2 Minuten ruhen lassen. Das Risotto soll „wellig“ vom Löffel laufen.\n\nNOTES\nVegetarisch: Klassischer Parmesan wird mit tierischem Lab hergestellt. Alternativen sind Hartkäse mit mikrobiellem Lab oder Grana-Ersatz."],["Karibischer Fischeintopf","Karibischer Fischeintopf mit Kokosmilch\nWeißer Fisch in Kokos-Limetten-Sud mit Scotch Bonnet, Thymian und Piment\n\nINGREDIENTS\n• 700 grams festes weißes Fischfilet (Kabeljau, Seelachs, Dorade), in 4-cm-Stücken\n• 2 Limetten (Saft und Abrieb)\n• 5 Knoblauchzehen, gehackt\n• 1.5 teaspoons Salz\n• 2 tablespoons Kokos- oder Pflanzenöl\n• 1 Zwiebel, in Streifen\n• 1 rote Paprikaschote, in Streifen\n• 4 Frühlingszwiebeln, in Ringen\n• 1 Ingwer, gerieben (Stück, ca. 3 cm)\n• 1 Scotch Bonnet oder Habanero (ganz oder gehackt)\n• 4 frische Thymianzweige\n• 0.5 teaspoons gemahlener Piment\n• 3 Tomaten, gewürfelt\n• 400 milliliters Kokosmilch\n• 200 milliliters Fisch- oder Gemüsebrühe\n• 1 Süßkartoffel, gewürfelt (optional)\n• 3 tablespoons Koriander, gehackt\n\nSTEPS\n1. Fisch marinieren: 700 grams festes weißes Fischfilet (Kabeljau, Seelachs, Dorade), in 4-cm-Stücken mit dem Saft einer Limette, der Hälfte von 5 Knoblauchzehen, gehackt und einem Teil von 1.5 teaspoons Salz vermengen. 15–20 Minuten marinieren.\n2. Gemüse anschwitzen: 2 tablespoons Kokos- oder Pflanzenöl erhitzen. 1 Zwiebel, in Streifen, 1 rote Paprikaschote, in Streifen und das Weiße von 4 Frühlingszwiebeln, in Ringen 5 Minuten anschwitzen. Restlichen Knoblauch, 1 Ingwer, gerieben (Stück, ca. 3 cm), 4 frische Thymianzweige und 0.5 teaspoons gemahlener Piment 1 Minute mitbraten.\n3. Sud: 3 Tomaten, gewürfelt, 400 milliliters Kokosmilch, 200 milliliters Fisch- oder Gemüsebrühe, 1 Süßkartoffel, gewürfelt (optional) und 1 Scotch Bonnet oder Habanero (ganz oder gehackt) zugeben. Die Chili ganz lassen für milde Schärfe oder hacken für volle Schärfe. 15 Minuten köcheln lassen, bis die Süßkartoffel weich ist.\n4. Fisch garen: Den Fisch samt Marinade in den Sud legen. Zugedeckt bei kleiner Hitze 6–8 Minuten ziehen lassen, nicht rühren, damit er nicht zerfällt.\n5. Abschmecken: Thymianzweige und ganze Chili entfernen. Mit restlichem Limettensaft, Abrieb und Salz abschmecken. Mit 3 tablespoons Koriander, gehackt und dem Grün der Frühlingszwiebeln bestreuen. Dazu passt Reis, klassisch Rice and Peas.\n\nNOTES\nMit einer Handvoll Garnelen, die zusammen mit dem Fisch hineinkommen, wird der Eintopf festlicher. Eine Morita aus deinem Vorrat bringt eine rauchige Note, falls keine Scotch Bonnet zur Hand ist."],["Pulled Pork / Chicken","Pulled Pork / Pulled Chicken\nRauchig gewürztes, zartes Zupffleisch mit selbstgemachter BBQ-Sauce – Ofen oder Schnellkochtopf\n\nINGREDIENTS\n• 1.5 kilograms Schweinenacken am Stück ODER Hähnchenoberschenkel ohne Knochen\n• 2 tablespoons geräuchertes Paprikapulver\n• 2 tablespoons brauner Zucker\n• 1 teaspoons Knoblauchpulver\n• 1 teaspoons Zwiebelpulver\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons Chipotle- oder Chilipulver\n• 2 teaspoons Salz\n• 1 Zwiebel, in Spalten\n• 250 milliliters Apfelsaft oder Brühe\n• 200 milliliters Ketchup\n• 3 tablespoons Apfelessig\n• 1 tablespoons Worcestershiresauce\n• 1 tablespoons Senf\n• 2 tablespoons Honig oder Ahornsirup\n\nSTEPS\n1. Rub: 2 tablespoons geräuchertes Paprikapulver, 2 tablespoons brauner Zucker, 1 teaspoons Knoblauchpulver, 1 teaspoons Zwiebelpulver, 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons Chipotle- oder Chilipulver und 2 teaspoons Salz mischen. 1.5 kilograms Schweinenacken am Stück ODER Hähnchenoberschenkel ohne Knochen rundum damit einreiben, bei Schwein gern über Nacht im Kühlschrank ziehen lassen.\n2. Garen: 1 Zwiebel, in Spalten in einen Bräter legen, das Fleisch darauf setzen und 250 milliliters Apfelsaft oder Brühe angießen. Zugedeckt bei 150 °C garen: Schweinenacken 4–5 Stunden, Hähnchen 1,5 Stunden. Im Schnellkochtopf: Schwein 70 Minuten, Hähnchen 15 Minuten auf hoher Stufe, natürlich abdampfen lassen.\n3. BBQ-Sauce: 200 milliliters Ketchup, 3 tablespoons Apfelessig, 1 tablespoons Worcestershiresauce, 1 tablespoons Senf, 2 tablespoons Honig oder Ahornsirup und eine Kelle Garflüssigkeit 10 Minuten zu einer dicken Sauce einkochen. Mit 1 TL des Rubs würzen.\n4. Zupfen: Das Fleisch mit zwei Gabeln zerzupfen, Fett und Sehnen entfernen. Mit etwas Garflüssigkeit und so viel BBQ-Sauce vermengen, wie du magst.\n5. Optional knüspern: Für Kruste das gezupfte Fleisch auf einem Blech verteilen und 5 Minuten unter den Grill schieben.\n\nNOTES\nKlassisch im Brioche-Bun mit Coleslaw und Pickles servieren. Es passt auch in Tacos oder auf Nachos. Vegetarisch: Junge Jackfruit aus der Dose oder Kräuterseitlinge mit Rub und Sauce 20 Minuten in der Pfanne schmoren."],["Eier in Senfsauce","Eier in Senfsauce\nWachsweiche Eier in cremiger Senfsauce mit Salzkartoffeln\n\nINGREDIENTS\n• 8 Eier\n• 1 kilograms festkochende Kartoffeln\n• 40 grams Butter\n• 1 Zwiebel, fein gewürfelt\n• 3 tablespoons Mehl\n• 400 milliliters Gemüsebrühe\n• 200 milliliters Milch oder Sahne\n• 3 tablespoons mittelscharfer Senf\n• 1 tablespoons körniger Senf\n• 1 teaspoons Zucker\n• 1 teaspoons Zitronensaft\n• 1 teaspoons Salz\n• 2 tablespoons Petersilie oder Schnittlauch, gehackt\n\nSTEPS\n1. Kartoffeln: 1 kilograms festkochende Kartoffeln schälen, vierteln und in Salzwasser 20 Minuten garen.\n2. Sauce: 40 grams Butter schmelzen und 1 Zwiebel, fein gewürfelt 3 Minuten glasig anschwitzen. 3 tablespoons Mehl einrühren und kurz anschwitzen. 400 milliliters Gemüsebrühe und 200 milliliters Milch oder Sahne nach und nach unterrühren und 5 Minuten köcheln lassen.\n3. Abschmecken: Herd ausschalten und 3 tablespoons mittelscharfer Senf und 1 tablespoons körniger Senf einrühren. Der Senf soll nicht mehr kochen, sonst wird er bitter. Mit 1 teaspoons Zucker, 1 teaspoons Zitronensaft und 1 teaspoons Salz abschmecken.\n4. Eier kochen: 8 Eier in kochendes Wasser geben und 7–8 Minuten wachsweich kochen, für hartes Eigelb 10 Minuten. Abschrecken, pellen und halbieren.\n5. Anrichten: Die Eier in die Sauce legen, kurz erwärmen und mit 2 tablespoons Petersilie oder Schnittlauch, gehackt bestreuen. Mit Kartoffeln servieren.\n\nNOTES\nPasst gut zu Rote-Bete-Salat oder Gurkensalat. Statt Salzkartoffeln geht auch Kartoffelpüree."],["Dumplings","Dumplings mit Kohl-Hack-Füllung\nSelbstgemachte Jiaozi mit Chinakohl-Schweinehack (oder Tofu-Pilz), gebraten oder gekocht\n\nINGREDIENTS\n• 300 grams Weizenmehl (Type 405 oder 550)\n• 160 milliliters heißes Wasser\n• 300 grams Chinakohl, fein gehackt\n• 1 teaspoons Salz (zum Entwässern)\n• 300 grams Schweinehack (veggie: zerbröselter Tofu + gehackte Shiitake)\n• 3 Frühlingszwiebeln, fein gehackt\n• 1 Ingwer, gerieben (Stück, ca. 3 cm)\n• 2 Knoblauchzehen, gerieben\n• 2 tablespoons Sojasauce\n• 1 tablespoons Shaoxing-Wein oder trockener Sherry\n• 1 tablespoons geröstetes Sesamöl\n• 0.5 teaspoons weißer Pfeffer\n• 2 tablespoons neutrales Öl zum Braten\n• 3 tablespoons Chinkiang- oder Reisessig (Dip)\n• 1 tablespoons Chiliöl (Dip)\n\nSTEPS\n1. Teig: 300 grams Weizenmehl (Type 405 oder 550) mit 160 milliliters heißes Wasser zuerst mit Stäbchen, dann mit den Händen 5 Minuten zu einem glatten Teig kneten. Abgedeckt 30 Minuten ruhen lassen.\n2. Kohl entwässern: 300 grams Chinakohl, fein gehackt mit 1 teaspoons Salz (zum Entwässern) mischen, 15 Minuten ziehen lassen und dann kräftig ausdrücken. So wird die Füllung nicht wässrig.\n3. Füllung: 300 grams Schweinehack (veggie: zerbröselter Tofu + gehackte Shiitake) mit 3 Frühlingszwiebeln, fein gehackt, 1 Ingwer, gerieben (Stück, ca. 3 cm), 2 Knoblauchzehen, gerieben, 2 tablespoons Sojasauce, 1 tablespoons Shaoxing-Wein oder trockener Sherry, 1 tablespoons geröstetes Sesamöl und 0.5 teaspoons weißer Pfeffer in eine Richtung rühren, bis die Masse zäh ist. Dann den Kohl unterheben.\n4. Formen: Den Teig zu einer Rolle formen, in ca. 30 Stücke teilen und jedes zu einem dünnen Kreis von 8 cm ausrollen. Einen TL Füllung in die Mitte setzen, zum Halbmond falten und den Rand fest zusammendrücken oder plisséeartig falten.\n5. Braten (Potstickers): 2 tablespoons neutrales Öl zum Braten in einer beschichteten Pfanne erhitzen und die Dumplings mit der flachen Seite 2 Minuten goldbraun braten. 100 ml Wasser angießen, sofort Deckel drauf und 7 Minuten dämpfen. Deckel ab und braten, bis das Wasser verdampft und die Unterseite knusprig ist.\n6. Dip: 3 tablespoons Chinkiang- oder Reisessig (Dip) mit 1 tablespoons Chiliöl (Dip) und einem Schuss Sojasauce mischen und dazu servieren.\n\nNOTES\nGekocht: 3–4 Minuten in Salzwasser garen, bis sie oben schwimmen. Fertige Teigblätter aus dem Asialaden sparen viel Zeit. Ungegarte Dumplings auf einem bemehlten Blech einfrieren und später direkt gefroren braten, dann 2–3 Minuten länger dämpfen."],["Bolognese","Bolognese (klassisch & veggie)\nLangsam geschmorter Ragù – mit Hack oder mit Sojahack/Linsen\n\nINGREDIENTS\n• 3 tablespoons Olivenöl\n• 1 Zwiebel, fein gewürfelt\n• 2 Möhren, fein gewürfelt\n• 2 Staudensellerie, fein gewürfelt (Stangen)\n• 3 Knoblauchzehen, gehackt\n• 600 grams gemischtes Hack (veggie: 120 g Sojagranulat, eingeweicht, oder 200 g rote/braune Linsen)\n• 3 tablespoons Tomatenmark\n• 200 milliliters Rot- oder Weißwein\n• 700 milliliters passierte Tomaten\n• 300 milliliters Brühe\n• 100 milliliters Milch\n• 2 Lorbeerblätter\n• 2 teaspoons Salz\n• 1 teaspoons schwarzer Pfeffer\n• 1 tablespoons Sojasauce (nur veggie, für Umami)\n\nSTEPS\n1. Soffritto: 1 Zwiebel, fein gewürfelt, 2 Möhren, fein gewürfelt und 2 Staudensellerie, fein gewürfelt (Stangen) in 3 tablespoons Olivenöl bei mittlerer Hitze 10 Minuten weich und leicht goldig anschwitzen. 3 Knoblauchzehen, gehackt 1 Minute mitbraten.\n2. Hack anbraten: Die Hitze erhöhen und 600 grams gemischtes Hack (veggie: 120 g Sojagranulat, eingeweicht, oder 200 g rote/braune Linsen) krümelig und richtig braun anbraten. Sojagranulat genauso kräftig anbraten. Linsen werden nur kurz mitgerührt.\n3. Tomatenmark & Wein: 3 tablespoons Tomatenmark 2 Minuten mitrösten. Mit 200 milliliters Rot- oder Weißwein ablöschen und fast vollständig einkochen lassen.\n4. Schmoren: 700 milliliters passierte Tomaten, 300 milliliters Brühe, 100 milliliters Milch, 2 Lorbeerblätter und bei veggie 1 tablespoons Sojasauce (nur veggie, für Umami) zugeben. Halb zugedeckt bei kleinster Hitze schmoren: mit Fleisch 2–3 Stunden, veggie 45 Minuten, mit Linsen bis sie weich sind. Bei Bedarf Flüssigkeit nachgießen.\n5. Abschmecken: Lorbeer entfernen. Mit 2 teaspoons Salz und 1 teaspoons schwarzer Pfeffer abschmecken. Mit Tagliatelle oder Pappardelle und Parmesan servieren.\n\nNOTES\nDie Milch klingt ungewöhnlich, gehört aber zum klassischen Rezept und macht das Ragù mild und rund. Mit der Bolognese aus dem Schnellkochtopf ist die Fleischversion in 30 Minuten auf hoher Stufe fertig."],["Lasagne","Lasagne (klassisch & veggie)\nGeschichtete Lasagne aus Bolognese und Béchamel – mit Fleisch- oder Veggie-Ragù\n\nINGREDIENTS\n• 1.5 liters fertige Bolognese (Rezept oben, klassisch oder veggie)\n• 60 grams Butter\n• 60 grams Mehl\n• 800 milliliters Milch\n• 1 pinch Muskatnuss\n• 1 teaspoons Salz\n• 250 grams Lasagneplatten (ohne Vorkochen)\n• 80 grams Parmesan, gerieben\n• 125 grams Mozzarella, gezupft\n\nSTEPS\n1. Béchamel: 60 grams Butter schmelzen, 60 grams Mehl einrühren und 1 Minute anschwitzen. 800 milliliters Milch nach und nach mit dem Schneebesen einrühren und 5 Minuten köcheln, bis die Sauce leicht dicklich ist. Mit 1 pinch Muskatnuss und 1 teaspoons Salz würzen.\n2. Ofen vorheizen: Den Ofen auf 180 °C Umluft (200 °C Ober-/Unterhitze) vorheizen.\n3. Schichten: Eine Auflaufform (ca. 30 × 20 cm) dünn mit Bolognese ausstreichen. Dann abwechselnd 250 grams Lasagneplatten (ohne Vorkochen), 1.5 liters fertige Bolognese (Rezept oben, klassisch oder veggie), Béchamel und etwas 80 grams Parmesan, gerieben schichten, insgesamt 4 Lagen. Die Bolognese sollte eher flüssig sein, damit die Platten garen.\n4. Abschluss: Mit einer Lage Platten abschließen, die restliche Béchamel darüber verteilen und mit 125 grams Mozzarella, gezupft und dem restlichen Parmesan bestreuen.\n5. Backen: 40–45 Minuten goldbraun backen. Wird die Oberfläche zu dunkel, mit Alufolie abdecken.\n6. Ruhen: Vor dem Anschneiden mindestens 15 Minuten ruhen lassen, sonst läuft sie auseinander.\n\nNOTES\nGemüse-Variante: Statt Ragù gegrillte Zucchini, Aubergine und Spinat mit Tomatensauce und Ricotta schichten. Lasagne lässt sich gut einfrieren, portionsweise oder ganz."],["Pasta all'Arrabbiata","Pasta all'Arrabbiata\nScharfe Tomatensauce mit Knoblauch und getrockneten Chilis – in 20 Minuten fertig\n\nINGREDIENTS\n• 400 grams Penne rigate\n• 5 tablespoons Olivenöl\n• 4 Knoblauchzehen, in dünnen Scheiben\n• 3 getrocknete Chiles de Árbol, zerbröselt (oder 1 TL Chiliflocken)\n• 800 grams geschälte Tomaten (Dose), zerdrückt\n• 1 teaspoons Salz\n• 3 tablespoons glatte Petersilie, gehackt\n• 40 grams Pecorino oder Parmesan, gerieben (optional)\n\nSTEPS\n1. Knoblauch & Chili: 5 tablespoons Olivenöl bei mittlerer Hitze erwärmen. 4 Knoblauchzehen, in dünnen Scheiben und 3 getrocknete Chiles de Árbol, zerbröselt (oder 1 TL Chiliflocken) darin 2 Minuten sanft braten, bis der Knoblauch hellgolden ist. Er darf nicht braun werden.\n2. Sauce: 800 grams geschälte Tomaten (Dose), zerdrückt zugeben, mit 1 teaspoons Salz würzen und 15 Minuten offen köcheln lassen, bis die Sauce eindickt.\n3. Pasta kochen: Inzwischen 400 grams Penne rigate in kräftig gesalzenem Wasser 1 Minute kürzer als angegeben kochen. Eine Tasse Nudelwasser aufheben.\n4. Vereinen: Die Pasta direkt in die Sauce geben und mit einem Schuss Nudelwasser 1 Minute schwenken, bis die Sauce sie glänzend umhüllt. Mit 3 tablespoons glatte Petersilie, gehackt und nach Wunsch 40 grams Pecorino oder Parmesan, gerieben (optional) servieren.\n\nNOTES\nKlassisch wird Arrabbiata ohne Käse gegessen. Er passt aber trotzdem gut dazu."],["Brokkolisuppe","Brokkolicremesuppe\nLeuchtend grüne, cremige Brokkolisuppe mit Kartoffel als Bindung\n\nINGREDIENTS\n• 1 Brokkoli (Kopf, ca. 600 g)\n• 1 mehligkochende Kartoffel\n• 1 Zwiebel, gewürfelt\n• 2 Knoblauchzehen\n• 2 tablespoons Butter oder Olivenöl\n• 900 milliliters Gemüsebrühe\n• 100 milliliters Sahne oder Crème fraîche\n• 0.5 Zitrone, Saft (halbe)\n• 1 pinch Muskatnuss\n• 1 teaspoons Salz\n\nSTEPS\n1. Vorbereiten: 1 Brokkoli (Kopf, ca. 600 g) in Röschen teilen, den Strunk schälen und würfeln. Eine Handvoll kleine Röschen als Einlage beiseitelegen. 1 mehligkochende Kartoffel schälen und würfeln.\n2. Anschwitzen: 1 Zwiebel, gewürfelt und 2 Knoblauchzehen in 2 tablespoons Butter oder Olivenöl 4 Minuten glasig anschwitzen. Strunk und Kartoffel 2 Minuten mitbraten.\n3. Kochen: 900 milliliters Gemüsebrühe angießen und 10 Minuten köcheln. Dann die Röschen zugeben und weitere 6–8 Minuten garen, bis alles weich, aber noch grün ist.\n4. Pürieren: Fein pürieren, 100 milliliters Sahne oder Crème fraîche einrühren und mit 0.5 Zitrone, Saft (halbe), 1 pinch Muskatnuss und 1 teaspoons Salz abschmecken.\n5. Einlage: Die beiseitegelegten Röschen 3 Minuten in Salzwasser blanchieren und auf die Suppe geben. Geröstete Mandeln oder Croûtons passen dazu.\n\nNOTES\nMit 50 g geriebenem Cheddar oder Blauschimmelkäse wird die Suppe kräftiger. Rühr den Käse kurz vor dem Servieren unter."],["Kürbissuppe mit Ingwer & Kokos","Kürbissuppe mit Ingwer & Kokos\nSamtige Hokkaido-Suppe mit Ingwer, Kokosmilch und gerösteten Kürbiskernen\n\nINGREDIENTS\n• 1 kilograms Hokkaido-Kürbis, entkernt und gewürfelt (mit Schale)\n• 1 Zwiebel, gewürfelt\n• 2 Knoblauchzehen\n• 1 Ingwer, gerieben (Stück, ca. 3 cm)\n• 1 Möhre, gewürfelt\n• 2 tablespoons Olivenöl\n• 1 teaspoons Currypulver oder Garam Masala\n• 800 milliliters Gemüsebrühe\n• 200 milliliters Kokosmilch (oder Sahne)\n• 2 tablespoons Orangen- oder Limettensaft\n• 1 teaspoons Salz\n• 3 tablespoons Kürbiskerne\n• 1 tablespoons Kürbiskernöl (optional)\n\nSTEPS\n1. Anschwitzen: 1 Zwiebel, gewürfelt, 2 Knoblauchzehen, 1 Ingwer, gerieben (Stück, ca. 3 cm) und 1 Möhre, gewürfelt in 2 tablespoons Olivenöl 5 Minuten anschwitzen. 1 kilograms Hokkaido-Kürbis, entkernt und gewürfelt (mit Schale) und 1 teaspoons Currypulver oder Garam Masala zugeben und 3 Minuten mitbraten.\n2. Kochen: 800 milliliters Gemüsebrühe angießen und 20 Minuten köcheln lassen, bis der Kürbis ganz weich ist.\n3. Pürieren: 200 milliliters Kokosmilch (oder Sahne) zugeben und sehr fein pürieren. Mit 2 tablespoons Orangen- oder Limettensaft und 1 teaspoons Salz abschmecken.\n4. Kerne rösten: 3 tablespoons Kürbiskerne in einer trockenen Pfanne rösten, bis sie aufpoppen, und leicht salzen. Die Suppe damit bestreuen und mit 1 tablespoons Kürbiskernöl (optional) beträufeln.\n\nNOTES\nMit einer zerbröselten Morita oder etwas Chipotle wird die Suppe rauchig-scharf. Wenn du den Kürbis vorher 25 Minuten bei 200 °C röstest, schmeckt die Suppe deutlich tiefer."],["Kartoffelsuppe","Kartoffelsuppe\nDeftige, halb pürierte Kartoffelsuppe mit Suppengrün und Majoran\n\nINGREDIENTS\n• 1 kilograms mehligkochende Kartoffeln\n• 1 Zwiebel, gewürfelt\n• 2 Möhren, gewürfelt\n• 150 grams Knollensellerie, gewürfelt\n• 1 Lauch, in Ringen (Stange)\n• 30 grams Butter\n• 1.2 liters Gemüsebrühe\n• 1 Lorbeerblatt\n• 1 teaspoons getrockneter Majoran\n• 100 milliliters Sahne oder saure Sahne\n• 1 pinch Muskatnuss\n• 1.5 teaspoons Salz\n• 2 tablespoons Petersilie, gehackt\n\nSTEPS\n1. Anschwitzen: 1 Zwiebel, gewürfelt, 2 Möhren, gewürfelt, 150 grams Knollensellerie, gewürfelt und 1 Lauch, in Ringen (Stange) in 30 grams Butter 5 Minuten anschwitzen.\n2. Kochen: 1 kilograms mehligkochende Kartoffeln schälen, würfeln und mit 1.2 liters Gemüsebrühe und 1 Lorbeerblatt zugeben. 20 Minuten köcheln lassen, bis die Kartoffeln weich sind.\n3. Halb pürieren: Lorbeer entfernen. Etwa die Hälfte der Suppe pürieren oder mit dem Stampfer grob zerdrücken, sodass sie sämig wird und noch Stücke hat.\n4. Abschmecken: 1 teaspoons getrockneter Majoran zwischen den Fingern zerreiben und einrühren. 100 milliliters Sahne oder saure Sahne unterrühren und mit 1 pinch Muskatnuss und 1.5 teaspoons Salz abschmecken. Mit 2 tablespoons Petersilie, gehackt bestreuen.\n\nNOTES\nKlassische Einlagen sind Wiener Würstchen, gebratener Speck oder vegetarisch geröstete Croûtons und Räuchertofu-Würfel."],["Linseneintopf","Linseneintopf (mit Würstchen oder Räuchertofu)\nDeftiger Tellerlinsen-Eintopf mit Wurzelgemüse und einem Schuss Essig\n\nINGREDIENTS\n• 300 grams Tellerlinsen\n• 1 Zwiebel, gewürfelt\n• 2 Möhren, gewürfelt\n• 150 grams Knollensellerie, gewürfelt\n• 1 Lauch, in Ringen (Stange)\n• 400 grams festkochende Kartoffeln, gewürfelt\n• 2 tablespoons Olivenöl oder Butter\n• 1 tablespoons Tomatenmark\n• 1.5 liters Gemüsebrühe\n• 2 Lorbeerblätter\n• 1 teaspoons getrockneter Majoran oder Thymian\n• 4 Mettenden/Wiener (veggie: Räuchertofu, gewürfelt und angebraten)\n• 2 tablespoons Apfel- oder Rotweinessig\n• 1 teaspoons Zucker\n• 1.5 teaspoons Salz\n• 2 tablespoons Petersilie, gehackt\n\nSTEPS\n1. Anschwitzen: 1 Zwiebel, gewürfelt, 2 Möhren, gewürfelt, 150 grams Knollensellerie, gewürfelt und 1 Lauch, in Ringen (Stange) in 2 tablespoons Olivenöl oder Butter 5 Minuten anschwitzen. 1 tablespoons Tomatenmark kurz mitrösten.\n2. Kochen: 300 grams Tellerlinsen abspülen und mit 400 grams festkochende Kartoffeln, gewürfelt, 1.5 liters Gemüsebrühe, 2 Lorbeerblätter und 1 teaspoons getrockneter Majoran oder Thymian zugeben. 30–35 Minuten köcheln lassen, bis die Linsen weich sind.\n3. Einlage: 4 Mettenden/Wiener (veggie: Räuchertofu, gewürfelt und angebraten) in Scheiben schneiden und 5 Minuten im Eintopf mitziehen lassen. Räuchertofu vorher separat knüsprig braten und erst beim Servieren zugeben.\n4. Abschmecken: Mit 2 tablespoons Apfel- oder Rotweinessig, 1 teaspoons Zucker und 1.5 teaspoons Salz kräftig abschmecken und mit 2 tablespoons Petersilie, gehackt bestreuen.\n\nNOTES\nDer Essig ist entscheidend, ohne ihn schmeckt der Eintopf flach. Dazu passen Spätzle oder Brot."],["Weiße Bohnen-Grünkohl-Eintopf","Weiße Bohnen-Grünkohl-Eintopf\nToskanisch angehauchter Eintopf mit Bohnen, Grünkohl und Salsiccia oder Pilzen\n\nINGREDIENTS\n• 400 grams Salsiccia, aus der Pelle gedrückt (veggie: 400 g braune Champignons, geviertelt)\n• 3 tablespoons Olivenöl\n• 1 Zwiebel, gewürfelt\n• 2 Möhren, gewürfelt\n• 4 Knoblauchzehen, gehackt\n• 1 teaspoons Fenchelsamen, zerdrückt\n• 0.5 teaspoons Chiliflocken oder 1 zerbröselte Árbol\n• 400 grams stückige Tomaten (Dose)\n• 480 grams weiße Bohnen (Dose), abgetropft\n• 1 liters Gemüsebrühe\n• 250 grams Grünkohl oder Schwarzkohl, ohne Strunk, grob gehackt\n• 1 Parmesanrinde (optional)\n• 1 teaspoons Salz\n• 0.5 Zitrone, Saft (halbe)\n\nSTEPS\n1. Anbraten: 400 grams Salsiccia, aus der Pelle gedrückt (veggie: 400 g braune Champignons, geviertelt) in 3 tablespoons Olivenöl krümelig und braun anbraten. Pilze so lange braten, bis ihre Flüssigkeit verdampft und sie gebräunt sind.\n2. Gemüse: 1 Zwiebel, gewürfelt und 2 Möhren, gewürfelt 5 Minuten mitbraten, dann 4 Knoblauchzehen, gehackt, 1 teaspoons Fenchelsamen, zerdrückt und 0.5 teaspoons Chiliflocken oder 1 zerbröselte Árbol 1 Minute.\n3. Köcheln: 400 grams stückige Tomaten (Dose), 480 grams weiße Bohnen (Dose), abgetropft, 1 liters Gemüsebrühe und 1 Parmesanrinde (optional) zugeben und 20 Minuten köcheln. Eine Kelle Bohnen zerdrücken, das bindet den Eintopf.\n4. Kohl: 250 grams Grünkohl oder Schwarzkohl, ohne Strunk, grob gehackt unterrühren und 8–10 Minuten mitgaren, bis er weich ist.\n5. Abschmecken: Parmesanrinde entfernen. Mit 1 teaspoons Salz und 0.5 Zitrone, Saft (halbe) abschmecken und mit Olivenöl und geröstetem Brot servieren.\n\nNOTES\nBei der Pilzvariante gibt ein Teelöffel Miso oder Sojasauce zusätzliche Tiefe."],["Kürbis-Kichererbsen-Eintopf","Kürbis-Kichererbsen-Eintopf\nWürziger Herbsteintopf mit Kürbis, Kichererbsen und Paprika – mit Chorizo oder Räuchertofu\n\nINGREDIENTS\n• 200 grams Chorizo, gewürfelt (veggie: Räuchertofu + 1 TL geräuchertes Paprikapulver extra)\n• 2 tablespoons Olivenöl\n• 1 Zwiebel, gewürfelt\n• 1 rote Paprikaschote, gewürfelt\n• 3 Knoblauchzehen, gehackt\n• 2 teaspoons geräuchertes Paprikapulver\n• 1 teaspoons gemahlener Kreuzkümmel\n• 600 grams Hokkaido-Kürbis, gewürfelt (mit Schale)\n• 480 grams Kichererbsen (Dose), abgetropft\n• 400 grams stückige Tomaten (Dose)\n• 800 milliliters Gemüsebrühe\n• 100 grams Blattspinat\n• 1 teaspoons Salz\n• 1 tablespoons Sherry- oder Rotweinessig\n\nSTEPS\n1. Anbraten: 200 grams Chorizo, gewürfelt (veggie: Räuchertofu + 1 TL geräuchertes Paprikapulver extra) in 2 tablespoons Olivenöl 4–5 Minuten auslassen bzw. knüsprig braten.\n2. Gemüse & Gewürze: 1 Zwiebel, gewürfelt und 1 rote Paprikaschote, gewürfelt 5 Minuten mitbraten. 3 Knoblauchzehen, gehackt, 2 teaspoons geräuchertes Paprikapulver und 1 teaspoons gemahlener Kreuzkümmel 1 Minute mitrösten.\n3. Köcheln: 600 grams Hokkaido-Kürbis, gewürfelt (mit Schale), 480 grams Kichererbsen (Dose), abgetropft, 400 grams stückige Tomaten (Dose) und 800 milliliters Gemüsebrühe zugeben und 20–25 Minuten köcheln lassen, bis der Kürbis weich ist.\n4. Abschluss: 100 grams Blattspinat unterrühren, bis er zusammenfällt. Mit 1 teaspoons Salz und 1 tablespoons Sherry- oder Rotweinessig abschmecken.\n\nNOTES\nEine eingeweichte und pürierte Guajillo oder Morita aus deinem Vorrat macht den Eintopf noch tiefer. Dazu passen ein Klecks Joghurt und Brot."],["Tortillas","Maistortillas aus Masa Harina\nWeiche Maistortillas aus weißem oder blauem nixtamalisiertem Maismehl\n\nINGREDIENTS\n• 250 grams Masa Harina (weiß oder blau)\n• 330 milliliters warmes Wasser\n• 0.5 teaspoons Salz\n\nSTEPS\n1. Teig: 250 grams Masa Harina (weiß oder blau) und 0.5 teaspoons Salz mischen und 330 milliliters warmes Wasser nach und nach unterkneten, bis ein weicher Teig entsteht. Er soll sich wie Knete anfühlen, nicht an den Händen kleben und am Rand nicht reißen, wenn du eine Kugel flach drücks
