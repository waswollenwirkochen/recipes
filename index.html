t. Bei Rissen mehr Wasser zugeben.\n2. Ruhen: Abgedeckt 20–30 Minuten ruhen lassen. Danach die Konsistenz nochmal prüfen, Masa zieht nach.\n3. Formen: Golfballgroße Kugeln formen, ergibt ca. 14–16 Stück. Zwischen zwei Stücken Gefrierbeutel in der Tortillapresse oder mit einem flachen Topfboden auf 2 mm drücken.\n4. Backen: Eine gusseiserne Pfanne oder Comal ohne Fett stark erhitzen. Tortilla 30 Sekunden backen, wenden und 45 Sekunden backen, nochmal wenden. Glückt es, bläht sie sich auf, dann leicht mit dem Finger andrücken.\n5. Warmhalten: Die fertigen Tortillas sofort in ein Küchentuch wickeln. Sie dämpfen dort nach und werden weich und biegsam.\n\nNOTES\nBlaues Masa ist etwas grober und braucht oft 20–40 ml mehr Wasser. Es schmeckt nussiger und eignet sich besonders gut für Quesadillas. Brechen die Tortillas, ist der Teig zu trocken oder die Pfanne zu kühl."],["Quesadillas","Quesadillas\nGefaltete Maistortillas mit geschmolzenem Käse und optionaler Füllung, dazu eine schnelle Salsa roja\n\nINGREDIENTS\n• 8 frische Maistortillas (oder roher Masa-Teig)\n• 250 grams Oaxaca-Käse, Mozzarella oder junger Gouda, gerieben/gezupft\n• 250 grams Füllung nach Wahl (Pilze, Bohnen, Pulled Chicken, Kartoffel-Chorizo)\n• 3 Tomaten\n• 3 Chiles de Árbol\n• 1 Knoblauchzehe\n• 0.3 Zwiebel (Viertel)\n• 0.5 teaspoons Salz\n• 2 tablespoons Koriander, gehackt\n\nSTEPS\n1. Salsa rösten: 3 Tomaten, 1 Knoblauchzehe und 0.3 Zwiebel (Viertel) in einer trockenen Pfanne rundum schwarz-fleckig rösten. 3 Chiles de Árbol nur 20 Sekunden mitrösten.\n2. Salsa mixen: Alles mit 0.5 teaspoons Salz und einem Schluck Wasser grob pürieren und 2 tablespoons Koriander, gehackt unterrühren.\n3. Belegen: 8 frische Maistortillas (oder roher Masa-Teig) auf die heiße, trockene Pfanne legen. Eine Hälfte mit 250 grams Oaxaca-Käse, Mozzarella oder junger Gouda, gerieben/gezupft und etwas 250 grams Füllung nach Wahl (Pilze, Bohnen, Pulled Chicken, Kartoffel-Chorizo) belegen und die Tortilla zusammenklappen.\n4. Backen: Je Seite 1–2 Minuten backen, bis der Käse geschmolzen ist und die Tortilla Flecken bekommt. Mit der Salsa servieren.\n\nNOTES\nEchte Quesadillas aus Mexiko-Stadt werden aus rohem Masa gemacht: Den Teig flach drücken, belegen, zuklappen und in wenig Öl backen. Die Bohnen aus dem ersten Rezept passen hervorragend als Füllung."],["Enchiladas rojas","Enchiladas rojas\nGerollte Maistortillas in roter Guajillo-Sauce – mit Hähnchen oder Bohnen-Käse-Füllung, überbacken\n\nINGREDIENTS\n• 6 Guajillo-Chilis\n• 2 Cascabel-Chilis\n• 1 Morita-Chili\n• 2 Tomaten\n• 2 Knoblauchzehen\n• 0.5 Zwiebel (halbe)\n• 0.5 teaspoons gemahlener Kreuzkümmel\n• 0.5 teaspoons getrockneter Oregano\n• 400 milliliters Gemüse- oder Hühnerbrühe\n• 1 teaspoons Salz\n• 4 tablespoons Pflanzenöl\n• 12 Maistortillas\n• 500 grams Füllung: gezupftes Hähnchen (veggie: Refried Beans + 150 g Feta/Queso fresco)\n• 150 grams geriebener Käse zum Überbacken (Oaxaca, Mozzarella, Cheddar)\n• 100 grams saure Sahne oder Crema\n• 1 rote Zwiebel, in feinen Ringen\n\nSTEPS\n1. Chilis vorbereiten: Von 6 Guajillo-Chilis, 2 Cascabel-Chilis und 1 Morita-Chili Stiele und Kerne entfernen und je Seite 20 Sekunden trocken rösten. 2 Tomaten, 2 Knoblauchzehen und 0.5 Zwiebel (halbe) in der Pfanne schwarz-fleckig rösten.\n2. Einweichen & mixen: Chilis 20 Minuten in heißem Wasser einweichen. Abgetropft mit Tomaten, Knoblauch, Zwiebel, 0.5 teaspoons gemahlener Kreuzkümmel, 0.5 teaspoons getrockneter Oregano und der Hälfte von 400 milliliters Gemüse- oder Hühnerbrühe sehr fein pürieren und durch ein Sieb streichen.\n3. Sauce braten: 1 EL von 4 tablespoons Pflanzenöl in einem Topf stark erhitzen. Die Sauce hineingießen (spritzt!) und 5 Minuten braten. Restliche Brühe zugeben und 10 Minuten zu einer cremigen Sauce köcheln. Mit 1 teaspoons Salz abschmecken.\n4. Tortillas vorbereiten: Den Ofen auf 200 °C vorheizen. 12 Maistortillas einzeln je 5 Sekunden pro Seite in restlichem heißen Öl weich frittieren. So brechen sie nicht und saugen sich nicht voll.\n5. Rollen: Jede Tortilla kurz durch die Sauce ziehen, mit 500 grams Füllung: gezupftes Hähnchen (veggie: Refried Beans + 150 g Feta/Queso fresco) füllen, aufrollen und dicht an dicht in eine Auflaufform legen.\n6. Überbacken: Restliche Sauce darübergießen, mit 150 grams geriebener Käse zum Überbacken (Oaxaca, Mozzarella, Cheddar) bestreuen und 15 Minuten backen, bis der Käse blubbert.\n7. Servieren: Mit 100 grams saure Sahne oder Crema, 1 rote Zwiebel, in feinen Ringen und Koriander servieren.\n\nNOTES\nFür mehr Schärfe 1–2 Árbol in die Sauce geben. Weitere vegetarische Füllungen: Kartoffel mit Rajas (Poblano-Streifen), gebratene Pilze oder Kürbis mit Spinat."],["Pizzateig & Sauce","No-Knead Pizzateig + Pizzasauce\nLuftiger Pizzateig ohne Kneten mit langer Gare und schnelle rohe Tomatensauce\n\nINGREDIENTS\n• 500 grams Pizzamehl Tipo 00 (oder Type 550)\n• 350 milliliters kaltes Wasser\n• 2 grams Trockenhefe (oder 4 g frische Hefe)\n• 12 grams Salz (Teig)\n• 1 tablespoons Olivenöl (Teig)\n• 400 grams geschälte Tomaten (Dose, z. B. San Marzano)\n• 1 tablespoons Olivenöl (Sauce)\n• 0.5 teaspoons Salz (Sauce)\n• 0.5 teaspoons getrockneter Oregano\n• 1 Knoblauchzehe, gerieben (optional)\n• 4 Basilikumblätter\n\nSTEPS\n1. Teig mischen: 2 grams Trockenhefe (oder 4 g frische Hefe) in 350 milliliters kaltes Wasser auflösen. Mit 500 grams Pizzamehl Tipo 00 (oder Type 550), 12 grams Salz (Teig) und 1 tablespoons Olivenöl (Teig) in einer großen Schüssel nur so lange mit dem Löffel verrühren, bis kein trockenes Mehl mehr zu sehen ist. Der Teig ist klebrig, das ist richtig.\n2. Falten: In den ersten 1,5 Stunden alle 30 Minuten mit nassen Händen 3–4-mal den Teigrand hochziehen und zur Mitte falten. Das ersetzt das Kneten.\n3. Lange Gare: Abgedeckt 24–72 Stunden im Kühlschrank gehen lassen. Alternativ 12–18 Stunden bei Zimmertemperatur. Je länger, desto aromatischer.\n4. Portionieren: 4 Stück abteilen, zu straffen Kugeln formen und abgedeckt 2–3 Stunden bei Raumtemperatur akklimatisieren lassen.\n5. Sauce: 400 grams geschälte Tomaten (Dose, z. B. San Marzano) von Hand oder kurz mit dem Stabmixer grob zerdrücken. Mit 1 tablespoons Olivenöl (Sauce), 0.5 teaspoons Salz (Sauce), 0.5 teaspoons getrockneter Oregano, 1 Knoblauchzehe, gerieben (optional) und gezupftem 4 Basilikumblätter verrühren. Nicht kochen.\n6. Backen: Den Ofen mit Pizzastein oder umgedrehtem Blech 45 Minuten auf Maximum vorheizen. Die Teigkugeln mit den Fingern von der Mitte nach außen drücken, den Rand nicht platt drücken. Dünn mit Sauce bestreichen, belegen und 6–10 Minuten backen.\n\nNOTES\nNicht mit dem Nudelholz ausrollen, das drückt die Luft aus dem Rand. Den Mozzarella vorher abtropfen lassen und in der zweiten Hälfte der Backzeit nachlegen, wenn der Ofen nur 250 °C schafft."],["Gulasch mit Knödeln","Gulasch mit Knödeln (Rind oder veggie)\nZwiebel-Paprika-Gulasch mit Rindfleisch oder Pilzen und Sojaschnetzeln, dazu Fertigknödel\n\nINGREDIENTS\n• 1 kilograms Rindergulasch aus der Wade/Schulter (veggie: 500 g Champignons + 100 g Sojaschnetzel, in Brühe eingeweicht)\n• 800 grams Zwiebeln, in Streifen\n• 3 tablespoons Butterschmalz oder Pflanzenöl\n• 2 tablespoons Tomatenmark\n• 3 tablespoons Paprikapulver edelsüß\n• 1 teaspoons Paprikapulver rosenschärf oder geräuchert\n• 3 Knoblauchzehen, gehackt\n• 1 teaspoons Kümmel, gemahlen\n• 1 teaspoons getrockneter Majoran\n• 200 milliliters Rotwein oder Brühe (zum Ablöschen)\n• 700 milliliters Rinder- oder Gemüsebrühe\n• 2 Lorbeerblätter\n• 0.5 Zitrone, Abrieb (halbe)\n• 2 teaspoons Salz\n• 1 Fertigknödel (Packung, z. B. Semmel- oder Kartoffelknödel)\n\nSTEPS\n1. Anbraten: 1 kilograms Rindergulasch aus der Wade/Schulter (veggie: 500 g Champignons + 100 g Sojaschnetzel, in Brühe eingeweicht) trocken tupfen und portionsweise in 3 tablespoons Butterschmalz oder Pflanzenöl kräftig anbraten, dann herausnehmen. Pilze und ausgedrückte Sojaschnetzel ebenso scharf bräunen.\n2. Zwiebeln: 800 grams Zwiebeln, in Streifen im Bratfett bei mittlerer Hitze 15 Minuten goldbraun schmoren. Die Zwiebelmenge macht das Gulasch später sämig.\n3. Paprika: 2 tablespoons Tomatenmark 1 Minute anrösten. Den Topf kurz vom Herd nehmen, 3 tablespoons Paprikapulver edelsüß, 1 teaspoons Paprikapulver rosenschärf oder geräuchert, 3 Knoblauchzehen, gehackt, 1 teaspoons Kümmel, gemahlen und 1 teaspoons getrockneter Majoran einrühren. Paprika verbrennt sonst und wird bitter. Sofort mit 200 milliliters Rotwein oder Brühe (zum Ablöschen) ablöschen.\n4. Schmoren: Fleisch, 700 milliliters Rinder- oder Gemüsebrühe und 2 Lorbeerblätter zugeben und zugedeckt bei kleiner Hitze 2–2,5 Stunden schmoren. Veggie nur 30 Minuten. Im Schnellkochtopf: Rind 35 Minuten hohe Stufe.\n5. Knödel: Die 1 Fertigknödel (Packung, z. B. Semmel- oder Kartoffelknödel) nach Packungsanleitung garen, meist 15–20 Minuten in siedendem Salzwasser ziehen lassen.\n6. Abschmecken: Lorbeer entfernen und offen etwas einkochen, falls die Sauce zu dünn ist. Mit 0.5 Zitrone, Abrieb (halbe) und 2 teaspoons Salz abschmecken und mit den Knödeln servieren.\n\nNOTES\nGulasch schmeckt aufgewärmt am nächsten Tag noch besser. Für die Veggie-Version passt auch Seitan in Würfeln oder ein Mix aus Pilzen und Kürbis. Dazu passt ein Gurken- oder Krautsalat."],["One Pot Mac'n'Cheese","One-Pot Mac'n'Cheese\nCremiges Mac'n'Cheese in 15 Minuten – Nudeln garen direkt in Milch\n\nINGREDIENTS\n• 400 grams Makkaroni oder Hörnchennudeln\n• 700 milliliters Milch\n• 300 milliliters Wasser\n• 30 grams Butter\n• 1 teaspoons Salz\n• 1 teaspoons Senf\n• 200 grams Cheddar, gerieben\n• 100 grams Gouda oder Emmentaler, gerieben\n• 0.5 teaspoons Paprikapulver oder Chipotle\n• 0.5 teaspoons schwarzer Pfeffer\n\nSTEPS\n1. Kochen: 400 grams Makkaroni oder Hörnchennudeln, 700 milliliters Milch, 300 milliliters Wasser, 30 grams Butter und 1 teaspoons Salz in einen Topf geben und unter Rühren aufkochen. Danach bei mittlerer Hitze 10–12 Minuten köcheln lassen und oft rühren, damit nichts ansetzt, bis die Nudeln gar sind und die Flüssigkeit sirupartig.\n2. Käse: Herd ausschalten. 1 teaspoons Senf, 200 grams Cheddar, gerieben und 100 grams Gouda oder Emmentaler, gerieben nach und nach einrühren, bis eine glatte Sauce entsteht.\n3. Abschmecken: Mit 0.5 teaspoons Paprikapulver oder Chipotle und 0.5 teaspoons schwarzer Pfeffer würzen. Ist es zu dick, einen Schuss Milch zugeben. Sofort servieren.\n\nNOTES\nKäse selbst reiben, denn fertig geriebener Käse enthält Trennmittel und kann die Sauce körnig machen."],["Mac'n'Cheese mit Parmesankruste","Mac'n'Cheese aus dem Ofen mit Parmesankruste\nÜberbackenes Mac'n'Cheese mit Käse-Béchamel und knuspriger Panko-Parmesan-Kruste\n\nINGREDIENTS\n• 400 grams Makkaroni oder Cavatappi\n• 50 grams Butter (Sauce)\n• 40 grams Mehl\n• 800 milliliters Milch\n• 1 teaspoons Senf\n• 1 pinch Muskatnuss\n• 1 teaspoons Salz\n• 250 grams kräftiger Cheddar, gerieben\n• 100 grams Gruyère oder Bergkäse, gerieben\n• 60 grams Panko oder Paniermehl\n• 60 grams Parmesan, fein gerieben\n• 30 grams Butter, geschmolzen (Kruste)\n\nSTEPS\n1. Nudeln: Den Ofen auf 200 °C vorheizen. 400 grams Makkaroni oder Cavatappi in Salzwasser 2 Minuten kürzer als angegeben kochen und abgießen. Sie garen im Ofen nach.\n2. Béchamel: 50 grams Butter (Sauce) schmelzen, 40 grams Mehl einrühren und 1 Minute anschwitzen. 800 milliliters Milch nach und nach mit dem Schneebesen einrühren und 5 Minuten köcheln, bis die Sauce dicklich ist.\n3. Käsesauce: Herd aus. 1 teaspoons Senf, 1 pinch Muskatnuss, 1 teaspoons Salz, 250 grams kräftiger Cheddar, gerieben und 100 grams Gruyère oder Bergkäse, gerieben einrühren, bis alles geschmolzen ist.\n4. Kruste: 60 grams Panko oder Paniermehl, 60 grams Parmesan, fein gerieben und 30 grams Butter, geschmolzen (Kruste) mit den Fingern vermischen.\n5. Backen: Nudeln mit der Sauce vermengen, in eine gefettete Auflaufform füllen und die Kruste gleichmäßig darauf streuen. 20–25 Minuten backen, bis die Oberfläche goldbraun und knusprig ist.\n6. Ruhen: 5 Minuten ruhen lassen, dann servieren.\n\nNOTES\nDie Sauce sollte flüssiger wirken, als du denkst, denn die Nudeln saugen im Ofen viel auf. Variationen: gebratene Pilze, Brokkoliröschen oder etwas Chipotle in die Sauce."],["Pasta al Limone","Pasta al Limone\nFrische Zitronen-Butter-Parmesan-Sauce, emulgiert mit Nudelwasser\n\nINGREDIENTS\n• 400 grams Spaghetti oder Tagliolini\n• 2 Bio-Zitronen (Abrieb und Saft)\n• 60 grams Butter\n• 80 grams Parmesan, fein gerieben\n• 0.5 teaspoons schwarzer Pfeffer\n• 2 tablespoons Basilikum oder Petersilie (optional)\n\nSTEPS\n1. Pasta kochen: 400 grams Spaghetti oder Tagliolini in leicht gesalzenem Wasser 1 Minute kürzer als angegeben kochen. 250 ml Nudelwasser aufheben.\n2. Sauce ansetzen: Inzwischen 60 grams Butter in einer großen Pfanne bei kleiner Hitze schmelzen und den Abrieb von 2 Bio-Zitronen (Abrieb und Saft) darin 1 Minute ziehen lassen.\n3. Emulgieren: 150 ml Nudelwasser und den Saft einer Zitrone in die Pfanne geben. Die Pasta dazugeben und bei mittlerer Hitze kräftig schwenken.\n4. Käse: Pfanne vom Herd ziehen, 80 grams Parmesan, fein gerieben nach und nach unterschwenken und bei Bedarf Nudelwasser nachgießen, bis eine cremige, glänzende Sauce entsteht. Mit restlichem Zitronensaft, 0.5 teaspoons schwarzer Pfeffer und 2 tablespoons Basilikum oder Petersilie (optional) abschmecken.\n\nNOTES\nDer Parmesan muss vom Herd weg eingerührt werden, sonst klumpt er. Ein Schuss Sahne macht die Sauce stabiler."],["Spaghetti aglio e olio","Spaghetti aglio, olio e peperoncino\nKlassische Knoblauch-Öl-Chili-Pasta mit emulgiertem Nudelwasser\n\nINGREDIENTS\n• 400 grams Spaghetti\n• 100 milliliters gutes Olivenöl\n• 6 Knoblauchzehen, in dünnen Scheiben\n• 2 Chiles de Árbol, zerbröselt (oder Chiliflocken)\n• 4 tablespoons glatte Petersilie, fein gehackt\n• 0.5 teaspoons Salz\n\nSTEPS\n1. Pasta kochen: 400 grams Spaghetti in gut gesalzenem Wasser 2 Minuten kürzer als angegeben kochen. 250 ml Nudelwasser aufheben.\n2. Knoblauchöl: Inzwischen 100 milliliters gutes Olivenöl mit 6 Knoblauchzehen, in dünnen Scheiben kalt in eine große Pfanne geben und bei kleiner Hitze langsam erwärmen, bis der Knoblauch hellgolden ist. Das dauert ca. 4 Minuten. Er darf nicht braun werden. 2 Chiles de Árbol, zerbröselt (oder Chiliflocken) 30 Sekunden mitziehen lassen.\n3. Emulgieren: Eine Kelle Nudelwasser in die Pfanne geben, es zischt. Die Pasta tropfnass dazugeben und 1–2 Minuten kräftig schwenken und Wasser nachgießen, bis das Öl zu einer leicht cremigen Sauce bindet.\n4. Abschluss: 4 tablespoons glatte Petersilie, fein gehackt unterschwenken und mit 0.5 teaspoons Salz abschmecken. Sofort servieren.\n\nNOTES\nWenn der Knoblauch braun wird, wird er bitter, dann lieber neu anfangen. Mit geröstetem Paniermehl (Pangrattato) obendrauf wird es noch besser."],["Carbonara","Carbonara (klassisch & veggie)\nCremige Ei-Pecorino-Sauce ohne Sahne – mit Guanciale oder knusprigen Pilzen/Räuchertofu\n\nINGREDIENTS\n• 400 grams Spaghetti oder Rigatoni\n• 150 grams Guanciale oder Pancetta, in Streifen (veggie: 250 g Kräuterseitlinge oder Räuchertofu, gewürfelt)\n• 2 tablespoons Olivenöl (nur veggie)\n• 4 Eigelb\n• 1 ganzes Ei\n• 80 grams Pecorino Romano, fein gerieben (oder halb Parmesan)\n• 1 teaspoons schwarzer Pfeffer, grob gemahlen\n• 1 pinch geräuchertes Salz oder Paprikapulver (nur veggie, optional)\n\nSTEPS\n1. Eimasse: 4 Eigelb, 1 ganzes Ei, 80 grams Pecorino Romano, fein gerieben (oder halb Parmesan) und 1 teaspoons schwarzer Pfeffer, grob gemahlen zu einer dicken Paste verrühren.\n2. Pasta kochen: 400 grams Spaghetti oder Rigatoni in mäßig gesalzenem Wasser al dente kochen, denn Pecorino und Guanciale sind salzig. 250 ml Nudelwasser aufheben.\n3. Einlage braten: 150 grams Guanciale oder Pancetta, in Streifen (veggie: 250 g Kräuterseitlinge oder Räuchertofu, gewürfelt) in einer großen kalten Pfanne bei mittlerer Hitze langsam auslassen, bis er knusprig ist. Für die Veggie-Variante Pilze oder Tofu in 2 tablespoons Olivenöl (nur veggie) scharf und knusprig braten und mit 1 pinch geräuchertes Salz oder Paprikapulver (nur veggie, optional) würzen. Pfanne vom Herd nehmen.\n4. Temperieren: 2–3 EL heißes Nudelwasser in die Eimasse rühren, damit sie gleichmäßig erwärmt wird.\n5. Vereinen: Die Pasta in die Pfanne mit dem Fett geben und 30 Sekunden abkühlen lassen. Dann die Eimasse darübergießen und kräftig schwenken, dabei schluckweise Nudelwasser zugeben, bis eine seidige Sauce entsteht. Die Pfanne bleibt dabei vom Herd, sonst stockt das Ei.\n6. Servieren: Sofort mit extra Pecorino und Pfeffer servieren.\n\nNOTES\nWird die Sauce zu dünn, kurz bei kleinster Hitze schwenken. Wenn das Ei zu stocken beginnt, sofort mit Nudelwasser gegensteuern. Pecorino Romano wird mit tierischem Lab hergestellt, vegetarisch ist ein Hartkäse mit mikrobiellem Lab."],["Pasta Teig","Selbstgemachte Pasta (Eierteig)\nKlassischer Nudelteig aus Mehl und Eiern – für Tagliatelle, Pappardelle, Lasagne oder gefüllte Pasta\n\nINGREDIENTS\n• 200 grams Mehl Tipo 00 (oder halb Hartweizengrieß)\n• 2 Eier (Größe M)\n• 1 pinch Salz\n• 1 teaspoons Olivenöl (optional)\n• 2 tablespoons Hartweizengrieß zum Bestreuen\n\nSTEPS\n1. Mulde formen: 200 grams Mehl Tipo 00 (oder halb Hartweizengrieß) auf die Arbeitsfläche häufen und eine Mulde in die Mitte drücken. 2 Eier (Größe M), 1 pinch Salz und 1 teaspoons Olivenöl (optional) hineingeben.\n2. Verrühren: Die Eier mit einer Gabel verquirlen und dabei vom Rand nach und nach Mehl einarbeiten, bis eine zähe Masse entsteht. Dann mit den Händen weiterarbeiten.\n3. Kneten: 8–10 Minuten kräftig kneten, bis der Teig glatt, seidig und elastisch ist. Ist er zu trocken und rissig, die Hände anfeuchten. Ist er klebrig, etwas Mehl zugeben.\n4. Ruhen: In Frischhaltefolie wickeln und mindestens 30 Minuten bei Raumtemperatur ruhen lassen. Das Gluten entspannt sich, und der Teig lässt sich danach viel leichter ausrollen.\n5. Ausrollen: Den Teig halbieren und mit der Nudelmaschine stufenweise dünner walzen, bis du durch die Teigplatte deine Hand schemenhaft sehen kannst (ca. 1 mm). Mit dem Nudelholz geht es auch, das braucht nur etwas Geduld.\n6. Schneiden: Die Platten leicht mit 2 tablespoons Hartweizengrieß zum Bestreuen bestreuen, locker aufrollen und in Streifen schneiden: 6–8 mm für Tagliatelle, 2 cm für Pappardelle. Die Nudeln aufschütteln und zu Nestern formen.\n7. Kochen: In reichlich kräftig gesalzenem Wasser 2–3 Minuten kochen. Frische Pasta ist viel schneller gar als getrocknete.\n\nNOTES\nDie Faustregel ist 100 g Mehl pro Ei und Person, so lässt sich die Menge leicht skalieren. Für intensiv gelbe Pasta ersetzt du ein ganzes Ei durch 2 Eigelb plus 1 EL Wasser. Frische Nudeln auf einem bemehlten Blech antrocknen lassen und einfrieren, dann gefroren direkt ins Wasser geben."],["Tortellini Variationen","Als Grundteig nimmst du 300 g Mehl (Tipo 00, gern halb Hartweizengrieß) und 3 Eier. Knete beides 10 Minuten und lass den Teig 30 Minuten in Folie ruhen. Roll ihn dann sehr dünn aus und schneide 6–7 cm große Quadrate. Gib je ½ TL Füllung darauf, falte zum Dreieck und leg die Ecken um den Finger zusammen. Gekocht werden die Tortellini 3–4 Minuten in Salzwasser. Jede der folgenden Füllungen reicht für diese Teigmenge.\n\nRicotta-Spinat (Klassiker)\nDünste 250 g Blattspinat zusammen, drück ihn gut aus und hack ihn fein. Misch ihn mit 250 g abgetropftem Ricotta, 50 g Parmesan, 1 Eigelb, Muskat, Salz und Zitronenabrieb. Dazu passen Salbeibutter oder Tomatensauce.\n\nKürbis-Amaretti (Mantua-Art): \nBack 500 g Hokkaido bei 200 °C 30 Minuten weich und zerdrück ihn. Rühr 50 g Parmesan, 3 zerbröselte Amaretti, 1 TL Senf, Muskat und Salz unter. Die Füllung muss fest sein. Ist sie zu feucht, trockne sie in der Pfanne ab. Dazu passen braune Butter und Salbei.\n\nPilz-Thymian: \nBrate 400 g gemischte Pilze fein gehackt mit 1 Schalotte, 1 Knoblauchzehe und Thymian an, bis alle Flüssigkeit verdampft ist. Lösch mit einem Schuss Weißwein ab und lass ihn einkochen. Rühr dann 100 g Ricotta oder Mascarpone und 30 g Parmesan unter. Dazu passt eine Sahne- oder Buttersauce mit Petersilie.\n\nZitronen-Ricotta-Minze: \nMisch 300 g Ricotta mit dem Abrieb einer Zitrone, 1 Handvoll gehackter Minze, 40 g Pecorino, 1 Eigelb, Salz und Pfeffer. Die Füllung ist frisch und leicht. Dazu passen Butter, Erbsen und Zitronensaft.\n\nRote Bete-Ziegenkäse: \nReib 2 gegarte Rote Bete fein und drück sie in einem Tuch aus. Misch sie mit 150 g Ziegenfrischkäse, 30 g Parmesan, Thymian und Salz. Die Tortellini werden schön pink. Dazu passen braune Butter und gehackte Walnüsse.\n\nKartoffel-Lauch-Käse: \nZerdrück 300 g gekochte mehlige Kartoffeln. Misch sie mit einer in Butter weich gedünsteten Lauchstange und 80 g geriebenem Bergkäse. Würz mit Muskat und Salz. Dazu passen geröstete Zwiebeln.\n\nFleisch (Bologneser Art): \nBrate 150 g Schweinehack, 50 g Mortadella und 50 g Prosciutto fein gehackt kurz an und wolf oder hack alles sehr fein. Misch es mit 80 g Parmesan, 1 Ei und Muskat. Das ist die klassische Füllung für Tortellini in Brodo, also in kräftiger Brühe serviert.\n\nKräuter-Nuss: \nMisch 200 g Ricotta mit 50 g gerösteten, fein gehackten Walnüssen, 1 großen Bund gemischten Kräutern (Petersilie, Basilikum, Majoran), 40 g Parmesan und einer kleinen geriebenen Knoblauchzehe. Dazu passt eine Walnusssauce (Salsa di noci) oder einfach Butter."],["Baba Ganoush","Baba Ganoush\nRauchige Auberginencreme mit Tahin, Zitrone und Knoblauch\n\nINGREDIENTS\n• 2 große Auberginen\n• 3 tablespoons Tahin\n• 1 Zitrone, Saft\n• 1 Knoblauchzehe, gerieben\n• 0.5 teaspoons Salz\n• 0.3 teaspoons gemahlener Kreuzkümmel\n• 2 tablespoons Olivenöl\n• 1 tablespoons Petersilie, gehackt\n• 2 tablespoons Granatapfelkerne oder Paprikapulver (Topping)\n\nSTEPS\n1. Auberginen rösten: 2 große Auberginen mehrmals einstechen und direkt über der Gasflamme, auf dem Grill oder unter dem Backofengrill rundum rösten, bis die Haut schwarz ist und sie komplett zusammenfallen.\n2. Abtropfen: Etwas abkühlen lassen, längs aufschneiden und das Fruchtfleisch herauslöffeln. 10 Minuten in einem Sieb abtropfen lassen, damit es nicht wässrig wird.\n3. Mischen: Das Fruchtfleisch mit einer Gabel grob zerdrücken. 3 tablespoons Tahin, 1 Zitrone, Saft, 1 Knoblauchzehe, gerieben, 0.5 teaspoons Salz und 0.3 teaspoons gemahlener Kreuzkümmel unterrühren und abschmecken.\n4. Anrichten: In eine Schale streichen, mit 2 tablespoons Olivenöl beträufeln und mit 1 tablespoons Petersilie, gehackt und 2 tablespoons Granatapfelkerne oder Paprikapulver (Topping) bestreuen. Mit Fladenbrot servieren.\n\nNOTES\nIm Ofen ohne Grillfunktion: Halbieren und mit der Schnittseite nach unten bei 230 °C ca. 40 Minuten rösten. Für mehr Rauch ein wenig geräuchertes Paprikapulver einrühren."],["Frischkäse Artischocken Dip","Frischkäse-Artischocken-Dip\nWarmer, überbackener Dip mit Artischocken, Spinat und Parmesan\n\nINGREDIENTS\n• 280 grams Artischockenherzen (Glas/Dose), abgetropft\n• 200 grams Frischkäse\n• 100 grams saure Sahne oder Schmand\n• 2 tablespoons Mayonnaise\n• 100 grams Blattspinat (frisch oder TK, ausgedrückt)\n• 2 Knoblauchzehen, gerieben\n• 60 grams Parmesan, gerieben\n• 80 grams Mozzarella, gerieben\n• 1 tablespoons Zitronensaft\n• 0.3 teaspoons Chiliflocken\n• 0.5 teaspoons Salz und Pfeffer\n\nSTEPS\n1. Vorbereiten: Den Ofen auf 200 °C vorheizen. 280 grams Artischockenherzen (Glas/Dose), abgetropft grob hacken. 100 grams Blattspinat (frisch oder TK, ausgedrückt) hacken bzw. TK-Spinat aufgetaut gut ausdrücken.\n2. Mischen: 200 grams Frischkäse, 100 grams saure Sahne oder Schmand, 2 tablespoons Mayonnaise, 2 Knoblauchzehen, gerieben, 1 tablespoons Zitronensaft, 0.3 teaspoons Chiliflocken, 0.5 teaspoons Salz und Pfeffer, zwei Drittel von 60 grams Parmesan, gerieben und die Hälfte von 80 grams Mozzarella, gerieben glatt verrühren. Artischocken und Spinat unterheben.\n3. Überbacken: In eine kleine ofenfeste Form füllen, mit restlichem Käse bestreuen und 20 Minuten backen, bis er blubbert und goldbraun ist.\n4. Servieren: Warm mit Baguette, Tortillachips oder Gemüsesticks servieren.\n\nNOTES\nKalt-Variante: Alles ohne Mozzarella pürieren oder fein hacken und als Aufstrich servieren."],["Whipped Ricotta","Whipped Ricotta\nLuftig aufgeschlagener Ricotta mit Zitrone und Olivenöl – herzhaft oder süß getoppt\n\nINGREDIENTS\n• 250 grams Ricotta, gut abgetropft\n• 50 grams Frischkäse oder Mascarpone\n• 3 tablespoons Olivenöl\n• 1 Zitrone, Abrieb\n• 0.5 teaspoons Salz\n• 1 tablespoons Honig (Topping)\n• 0.3 teaspoons Chiliflocken oder schwarzer Pfeffer (Topping)\n• 1 tablespoons frischer Thymian oder Basilikum (Topping)\n\nSTEPS\n1. Aufschlagen: 250 grams Ricotta, gut abgetropft, 50 grams Frischkäse oder Mascarpone, 2 EL von 3 tablespoons Olivenöl, 1 Zitrone, Abrieb und 0.5 teaspoons Salz in der Küchenmaschine oder mit dem Handrührer 2–3 Minuten aufschlagen, bis die Masse ganz glatt und luftig ist.\n2. Anrichten: In eine flache Schale streichen und mit dem Löffelrücken Mulden hineinziehen.\n3. Toppen: Mit restlichem Öl, 1 tablespoons Honig (Topping), 0.3 teaspoons Chiliflocken oder schwarzer Pfeffer (Topping) und 1 tablespoons frischer Thymian oder Basilikum (Topping) toppen. Mit geröstetem Brot servieren.\n\nNOTES\nWeitere Toppings: geröstete Tomaten, gebratene Pilze, Pistazien mit Honig, Feigen oder Pfirsiche. Süß mit Puderzucker, Vanille und Beeren statt Salz und Chili."],["Confit","Knoblauch ( & Tomaten) vollständig mit Olivenöl bedecken + Gewürze, bei mittlerer Hitze 1-2h abgedeckt in den Ofen"],["Naan","Naan aus der Pfanne\nWeiches, blasiges Joghurt-Naan, in der heißen Pfanne gebacken und mit Knoblauchbutter bestrichen\n\nINGREDIENTS\n• 400 grams Weizenmehl (Type 550)\n• 7 grams Trockenhefe\n• 1 teaspoons Zucker\n• 1 teaspoons Salz\n• 150 grams Naturjoghurt\n• 120 milliliters lauwarmes Wasser\n• 2 tablespoons Olivenöl oder geschmolzenes Ghee\n• 40 grams Butter, geschmolzen\n• 2 Knoblauchzehen, fein gehackt\n• 2 tablespoons Koriander, gehackt\n\nSTEPS\n1. Teig: 400 grams Weizenmehl (Type 550), 7 grams Trockenhefe, 1 teaspoons Zucker und 1 teaspoons Salz mischen. 150 grams Naturjoghurt, 120 milliliters lauwarmes Wasser und 2 tablespoons Olivenöl oder geschmolzenes Ghee zugeben und 5–7 Minuten zu einem weichen, leicht klebrigen Teig kneten.\n2. Gehen lassen: Abgedeckt an einem warmen Ort 1–1,5 Stunden gehen lassen, bis sich der Teig verdoppelt hat.\n3. Knoblauchbutter: 40 grams Butter, geschmolzen mit 2 Knoblauchzehen, fein gehackt und 2 tablespoons Koriander, gehackt verrühren.\n4. Formen: Den Teig in 6 Portionen teilen und jede zu einem ca. 5 mm dicken Oval ausrollen oder mit den Händen ziehen.\n5. Backen: Eine gusseiserne Pfanne ohne Fett sehr stark erhitzen. Das Naan einlegen und 1–2 Minuten backen, bis sich Blasen bilden und die Unterseite fleckig ist. Wenden und 1 Minute weiterbacken. Es darf ruhig ein paar schwarze Stellen bekommen.\n6. Bestreichen: Sofort mit der Knoblauchbutter bestreichen und in ein Tuch wickeln, damit es weich bleibt.\n\nNOTES\nFür Käse-Naan: Den Teig mit geriebenem Käse füllen, zusammenklappen und erneut flach ausrollen. Naan passt hervorragend zum Dal, zu Baba Ganoush und zum Whipped Ricotta."],["Coleslaw","Coleslaw\nKnackiger Krautsalat mit Weiß- und Rotkohl, Möhre und cremigem Dressing\n\nINGREDIENTS\n• 500 grams Weißkohl, fein gehobelt\n• 200 grams Rotkohl, fein gehobelt\n• 2 Möhren, grob geraspelt\n• 1 teaspoons Salz (zum Kneten)\n• 4 tablespoons Mayonnaise\n• 3 tablespoons Naturjoghurt oder saure Sahne\n• 2 tablespoons Apfelessig\n• 1 teaspoons Senf\n• 1 tablespoons Zucker oder Honig\n• 0.5 teaspoons Selleriesamen oder Kümmel (optional)\n• 0.5 teaspoons schwarzer Pfeffer\n• 2 Frühlingszwiebeln, in Ringen\n\nSTEPS\n1. Kohl salzen: 500 grams Weißkohl, fein gehobelt und 200 grams Rotkohl, fein gehobelt mit 1 teaspoons Salz (zum Kneten) kräftig mit den Händen durchkneten und 20 Minuten ziehen lassen. Danach gut ausdrücken, damit das Dressing nicht verwässert.\n2. Dressing: 4 tablespoons Mayonnaise, 3 tablespoons Naturjoghurt oder saure Sahne, 2 tablespoons Apfelessig, 1 teaspoons Senf, 1 tablespoons Zucker oder Honig, 0.5 teaspoons Selleriesamen oder Kümmel (optional) und 0.5 teaspoons schwarzer Pfeffer verrühren.\n3. Mischen: Kohl, 2 Möhren, grob geraspelt und 2 Frühlingszwiebeln, in Ringen mit dem Dressing vermengen. Abschmecken, meist braucht es kein Salz mehr.\n4. Ziehen lassen: Mindestens 30 Minuten im Kühlschrank durchziehen lassen.\n\nNOTES\nPasst perfekt zu Pulled Pork oder Pulled Chicken. Etwas Apfel in Stiften oder Jalapeño-Ringe machen den Coleslaw spannender."],["Honig Senf Dressing","Honig-Senf-Dressing: 2 EL mittelscharfer Senf, 1 EL körniger Senf, 2 EL Honig, 2 EL Apfelessig, 5 EL Olivenöl, Salz, Pfeffer. Passt zu Blattsalat, Feldsalat und gerösteten Wurzeln."],["Vinaigrette","Vinaigrette (klassisch französisch): 1 TL Dijon-Senf, 2 EL Weißwein- oder Rotweinessig, 1 sehr fein gehackte Schalotte, ½ TL Salz, Pfeffer, 6 EL Olivenöl. Lass Schalotte, Essig und Salz zuerst 5 Minuten ziehen, das nimmt der Schalotte die Schärfe. Dann Senf und Öl unterschlagen. Das Grundverhältnis ist 1 Teil Säure zu 3 Teilen Öl."],["Joghurt Dressing","Joghurt-Dressing: 150 g Naturjoghurt, 1 EL Olivenöl, 1 EL Zitronensaft, ½ geriebene Knoblauchzehe, 1 TL Honig, 2 EL gehackte Kräuter (Dill, Schnittlauch oder Minze), Salz, Pfeffer. Ist es zu dick, mit etwas Wasser oder Milch verdünnen."],["Asian Salad Dressing","Asian Salad Dressing: 3 EL Sojasauce, 2 EL Reisessig, 1 EL geröstetes Sesamöl, 2 EL neutrales Öl, 1 EL Honig oder Ahornsirup, 1 TL geriebener Ingwer, ½ geriebene Knoblauchzehe, Saft einer halben Limette und 1 TL gerösteter Sesam. Für die cremige Version kommt 1 EL Erdnussbutter oder Tahin dazu. Passt zu Kohl, Gurke, Nudelsalat oder Soba."],["Dönersauce, Knoblauch","Knoblauchsauce: 200 g griechischer Joghurt, 2 EL Mayonnaise, 2–3 sehr fein geriebene Knoblauchzehen, 1 TL Zitronensaft, ½ TL Salz, 1 TL getrocknete Minze oder Dill, eine Prise Zucker. Lass sie mindestens 30 Minuten ziehen, dann entfaltet sich der Knoblauch."],["Dönersauce, scharf","Scharfe Sauce: 3 EL Tomatenmark, 2 EL Ajvar (oder Paprikamark), 1 EL Olivenöl, 2–3 EL Wasser, 1 TL Pul Biber oder Chiliflocken, ½ TL Paprikapulver, ½ TL Kreuzkümmel, eine Prise Zucker, Salz und Zitronensaft. Statt Chiliflocken kannst du 1–2 eingeweichte und pürierte Árbol aus deinem Vorrat nehmen, das gibt eine klarere Schärfe."],["Waffeln","Bananenwaffeln\nSaftige, natürlich gesüßte Waffeln mit reifen Bananen und Zimt\n\nINGREDIENTS\n• 2 sehr reife Bananen\n• 2 Eier\n• 200 milliliters Milch\n• 60 grams Butter, geschmolzen (oder neutrales Öl)\n• 200 grams Weizenmehl (oder halb Dinkelvollkorn)\n• 2 teaspoons Backpulver\n• 1 teaspoons Zimt\n• 1 pinch Salz\n• 1 teaspoons Vanilleextrakt\n• 1 tablespoons Zucker oder Ahornsirup (optional)\n\nSTEPS\n1. Bananen zerdrücken: 2 sehr reife Bananen mit einer Gabel zu einem glatten Mus zerdrücken.\n2. Flüssige Zutaten: 2 Eier, 200 milliliters Milch, 60 grams Butter, geschmolzen (oder neutrales Öl), 1 teaspoons Vanilleextrakt und 1 tablespoons Zucker oder Ahornsirup (optional) unter das Bananenmus rühren.\n3. Teig: 200 grams Weizenmehl (oder halb Dinkelvollkorn), 2 teaspoons Backpulver, 1 teaspoons Zimt und 1 pinch Salz mischen und nur kurz unter die feuchte Masse rühren, bis kein trockenes Mehl mehr zu sehen ist. 5 Minuten quellen lassen.\n4. Backen: Das Waffeleisen vorheizen und leicht einfetten. Pro Waffel ca. 3 EL Teig einfüllen und 3–4 Minuten goldbraun backen. Der Bananenzucker lässt sie schneller bräunen, daher eher mittlere Stufe wählen.\n5. Servieren: Mit Bananenscheiben, Ahornsirup, Joghurt oder Erdnussbutter servieren.\n\nNOTES\nWaffeln auf einem Gitter auskühlen lassen, nicht stapeln, sonst werden sie weich. Übrige Waffeln lassen sich einfrieren und im Toaster aufknuspern."],["Pancakes","Fluffige Pancakes\nDicke, luftige amerikanische Pancakes mit Buttermilch\n\nINGREDIENTS\n• 250 grams Weizenmehl\n• 2 tablespoons Zucker\n• 2 teaspoons Backpulver\n• 0.5 teaspoons Natron\n• 0.5 teaspoons Salz\n• 350 milliliters Buttermilch (oder Milch + 1 EL Zitronensaft)\n• 2 Eier\n• 40 grams Butter, geschmolzen\n• 1 teaspoons Vanilleextrakt\n• 1 tablespoons Butter oder Öl zum Ausbacken\n\nSTEPS\n1. Trockene Zutaten: 250 grams Weizenmehl, 2 tablespoons Zucker, 2 teaspoons Backpulver, 0.5 teaspoons Natron und 0.5 teaspoons Salz in einer Schüssel mischen.\n2. Feuchte Zutaten: 350 milliliters Buttermilch (oder Milch + 1 EL Zitronensaft), 2 Eier, 40 grams Butter, geschmolzen und 1 teaspoons Vanilleextrakt in einer zweiten Schüssel verquirlen.\n3. Teig: Die feuchten Zutaten zu den trockenen geben und nur kurz mit einer Gabel verrühren. Kleine Klümpchen sind gewollt, überrührter Teig wird zäh. 10 Minuten ruhen lassen.\n4. Ausbacken: Eine beschichtete Pfanne bei mittlerer Hitze erhitzen und dünn mit 1 tablespoons Butter oder Öl zum Ausbacken auspinseln. Pro Pancake ca. 3 EL Teig hineingeben. Wenden, wenn sich an der Oberfläche Bläschen bilden und die Ränder matt werden, nach etwa 2 Minuten. Dann 1 Minute weiterbacken.\n5. Servieren: Im Ofen bei 80 °C warm halten und mit Ahornsirup, Butter, Beeren oder Banane servieren.\n\nNOTES\nDer erste Pancake misslingt oft, weil die Pfanne noch nicht die richtige Temperatur hat. Heidelbeeren oder Schokostückchen erst in der Pfanne auf den Teig streuen, nicht in den Teig rühren."],["Erdnusssauce","Asiatische Erdnusssauce\nCremige Erdnusssauce mit Kokosmilch, Limette und Chili – als Dip, Dressing oder Nudelsauce\n\nINGREDIENTS\n• 4 tablespoons Erdnussbutter (cremig oder crunchy, ungezuckert)\n• 150 milliliters Kokosmilch\n• 2 tablespoons Sojasauce\n• 1 Limette, Saft\n• 1 tablespoons Honig, Ahornsirup oder brauner Zucker\n• 1 Knoblauchzehe, gerieben\n• 1 teaspoons Ingwer, gerieben\n• 1 teaspoons Sriracha, Chiliöl oder rote Currypaste\n• 1 teaspoons geröstetes Sesamöl\n• 2 tablespoons geröstete Erdnüsse, gehackt (Topping)\n\nSTEPS\n1. Erwärmen: 4 tablespoons Erdnussbutter (cremig oder crunchy, ungezuckert) und 150 milliliters Kokosmilch in einem kleinen Topf bei niedriger Hitze glatt rühren, bis sich alles verbindet.\n2. Würzen: 2 tablespoons Sojasauce, 1 Limette, Saft, 1 tablespoons Honig, Ahornsirup oder brauner Zucker, 1 Knoblauchzehe, gerieben, 1 teaspoons Ingwer, gerieben, 1 teaspoons Sriracha, Chiliöl oder rote Currypaste und 1 teaspoons geröstetes Sesamöl einrühren und 1–2 Minuten leicht köcheln lassen.\n3. Konsistenz: Mit Wasser auf die gewünschte Dicke verdünnen: dick für Dips, flüssiger für Nudeln oder Salat. Abschmecken, sie soll süß, salzig, sauer und scharf zugleich sein.\n4. Servieren: Mit 2 tablespoons geröstete Erdnüsse, gehackt (Topping) bestreuen. Warm oder kalt servieren.\n\nNOTES\nSchnelle Version ohne Kochen: Alles mit 3–4 EL warmem Wasser statt Kokosmilch im Glas verrühren. Passt zu Sommerrollen, Satay, Reisnudelsalat, Bowls und gebratenem Tofu. Hält sich im Kühlschrank etwa 5 Tage, beim Kühlen dickt sie stark an."],["Misosuppe","Misosuppe\nKlassische Misosuppe mit Dashi, Tofu, Wakame und Frühlingszwiebeln\n\nINGREDIENTS\n• 1 liters Wasser\n• 2 teaspoons Dashi-Pulver (je nach Packungsangabe)\n• 4 tablespoons Miso-Paste (weiß/Shiro für mild, rot/Aka für kräftig)\n• 200 grams Seidentofu oder fester Tofu, in kleinen Würfeln\n• 2 tablespoons getrocknete Wakame-Algen\n• 2 Frühlingszwiebeln, in feinen Ringen\n• 100 grams Shiitake oder Enoki, in Scheiben (optional)\n\nSTEPS\n1. Wakame einweichen: 2 tablespoons getrocknete Wakame-Algen in kaltem Wasser 5 Minuten einweichen, dann abgießen. Sie quellen stark auf.\n2. Dashi: 1 liters Wasser aufkochen und 2 teaspoons Dashi-Pulver (je nach Packungsangabe) einrühren. Die Hitze reduzieren. Pilze nach Wunsch 2–3 Minuten darin garen.\n3. Tofu: 200 grams Seidentofu oder fester Tofu, in kleinen Würfeln und die Wakame zugeben und 1–2 Minuten erwärmen.\n4. Miso auflösen: Den Topf vom Herd nehmen. 4 tablespoons Miso-Paste (weiß/Shiro für mild, rot/Aka für kräftig) in einer Kelle mit etwas Brühe glatt rühren und dann in die Suppe geben. Ab jetzt nicht mehr kochen, sonst gehen Aroma und die lebenden Kulturen verloren.\n5. Servieren: Abschmecken und bei Bedarf mehr Miso einrühren. Mit 2 Frühlingszwiebeln, in feinen Ringen bestreuen und sofort servieren.\n\nNOTES\nDie Misomenge hängt von der Sorte ab, starte mit weniger und rühr nach. Klassisches Dashi enthält Bonito-Fischflocken. Wenn ihr vegetarisch kochen wollt, gibt es Kombu-Shiitake-Dashi-Pulver. Mit Udon- oder Sobanudeln wird die Suppe zu einer Mahlzeit."],["Gefüllter Kürbis & Zucchini","Gefüllter Kürbis / Zucchini mit Hack-Feta\nIm Ofen gebackener Hokkaido oder Zucchini mit würziger Hack-Feta-Füllung (auch veggie)\n\nINGREDIENTS\n• 2 kleine Hokkaido-Kürbisse ODER 4 große Zucchini\n• 3 tablespoons Olivenöl\n• 400 grams Rinder- oder Lammhack (veggie: 100 g Sojagranulat eingeweicht oder 200 g gekochte Linsen)\n• 1 Zwiebel, fein gewürfelt\n• 2 Knoblauchzehen, gehackt\n• 1 tablespoons Tomatenmark\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons Paprikapulver geräuchert oder Pul Biber\n• 1 teaspoons getrockneter Oregano\n• 200 grams Feta, zerbröselt\n• 150 grams gekochter Reis oder Bulgur\n• 3 tablespoons Petersilie oder Minze, gehackt\n• 1 teaspoons Salz\n• 150 grams Naturjoghurt (zum Servieren)\n\nSTEPS\n1. Vorbereiten: Den Ofen auf 200 °C vorheizen. Kürbisse halbieren und entkernen. Zucchini längs halbieren und das Innere bis auf 1 cm Rand auskratzen, das Innere fein hacken und für die Füllung aufheben. Mit 1 EL von 3 tablespoons Olivenöl einpinseln und salzen.\n2. Vorbacken: Mit der Schnittfläche nach oben vorbacken: Kürbis 25 Minuten, Zucchini 10 Minuten.\n3. Füllung braten: 400 grams Rinder- oder Lammhack (veggie: 100 g Sojagranulat eingeweicht oder 200 g gekochte Linsen) im restlichen Öl krümelig anbraten. 1 Zwiebel, fein gewürfelt, 2 Knoblauchzehen, gehackt und das gehackte Zucchini-Innere 5 Minuten mitbraten. 1 tablespoons Tomatenmark, 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons Paprikapulver geräuchert oder Pul Biber und 1 teaspoons getrockneter Oregano 1 Minute mitrösten.\n4. Mischen: Vom Herd nehmen und 150 grams gekochter Reis oder Bulgur, zwei Drittel von 200 grams Feta, zerbröselt, 3 tablespoons Petersilie oder Minze, gehackt und 1 teaspoons Salz unterrühren.\n5. Füllen & backen: Die Füllung in die vorgebackenen Hälften geben, mit restlichem Feta bestreuen und weitere 20 Minuten backen, bis der Kürbis weich und der Feta leicht gebräunt ist.\n6. Servieren: Mit 150 grams Naturjoghurt (zum Servieren) und frischen Kräutern servieren.\n\nNOTES\nDen Joghurt mit etwas Knoblauch und Zitrone verrühren, das passt sehr gut dazu. Statt Reis kannst du auch Couscous oder Quinoa nehmen."],["Gnocchi Auflauf","Gnocchi-Auflauf\nGnocchi in Tomaten-Mozzarella-Sauce mit Spinat, überbacken – ohne Vorkochen\n\nINGREDIENTS\n• 800 grams Gnocchi (Kühlregal)\n• 2 tablespoons Olivenöl\n• 1 Zwiebel, gewürfelt\n• 3 Knoblauchzehen, gehackt\n• 700 milliliters passierte oder stückige Tomaten\n• 100 milliliters Sahne oder Crème fraîche\n• 1 teaspoons getrockneter Oregano oder italienische Kräuter\n• 1 teaspoons Salz\n• 0.3 teaspoons Chiliflocken\n• 150 grams Blattspinat\n• 250 grams Mozzarella, in Stücken\n• 50 grams Parmesan, gerieben\n• 1 tablespoons Basilikum\n\nSTEPS\n1. Sauce: Den Ofen auf 200 °C vorheizen. 1 Zwiebel, gewürfelt und 3 Knoblauchzehen, gehackt in 2 tablespoons Olivenöl 4 Minuten anschwitzen. 700 milliliters passierte oder stückige Tomaten, 100 milliliters Sahne oder Crème fraîche, 1 teaspoons getrockneter Oregano oder italienische Kräuter, 1 teaspoons Salz und 0.3 teaspoons Chiliflocken zugeben und 5 Minuten köcheln lassen.\n2. Spinat: 150 grams Blattspinat in der Sauce zusammenfallen lassen.\n3. Mischen: Die rohen 800 grams Gnocchi (Kühlregal) in eine Auflaufform geben, mit der Sauce mischen. Die Sauce sollte die Gnocchi gut bedecken.\n4. Überbacken: 250 grams Mozzarella, in Stücken darauf verteilen, mit 50 grams Parmesan, gerieben bestreuen und 20–25 Minuten backen, bis der Käse goldbraun blubbert und die Gnocchi weich sind.\n5. Servieren: Mit 1 tablespoons Basilikum bestreuen und servieren.\n\nNOTES\nVariationen: gebratene Pilze, Salsiccia, Zucchiniwürfel oder Ofenkürbis unterheben. Für mehr Knusprigkeit die Gnocchi vorher in der Pfanne anbraten."],["Fischtacos","Fischtacos mit Chipotle-Crema\nGewürzter weißer Fisch in Maistortillas mit Krautsalat, Chipotle-Crema und Limette\n\nINGREDIENTS\n• 600 grams festes weißes Fischfilet (Kabeljau, Seelachs, Dorade)\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver\n• 0.5 teaspoons Knoblauchpulver\n• 1 teaspoons Salz\n• 2 Limetten\n• 2 tablespoons neutrales Öl\n• 200 grams Weiß- oder Rotkohl, fein gehobelt\n• 150 grams saure Sahne oder griechischer Joghurt\n• 2 tablespoons Mayonnaise\n• 1 Morita, eingeweicht und gehackt (oder Chipotle in Adobo)\n• 12 Maistortillas\n• 1 Avocado, in Scheiben\n• 4 tablespoons Koriander und eingelegte rote Zwiebeln\n\nSTEPS\n1. Crema: 150 grams saure Sahne oder griechischer Joghurt, 2 tablespoons Mayonnaise, 1 Morita, eingeweicht und gehackt (oder Chipotle in Adobo), den Saft einer halben Limette und eine Prise Salz verrühren. Bei Bedarf mit etwas Wasser verdünnen, sodass sie sich träufeln lässt.\n2. Kraut: 200 grams Weiß- oder Rotkohl, fein gehobelt mit dem Saft einer halben Limette und einer Prise Salz durchkneten und ziehen lassen.\n3. Fisch würzen: 600 grams festes weißes Fischfilet (Kabeljau, Seelachs, Dorade) trocken tupfen. 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver, 0.5 teaspoons Knoblauchpulver und 1 teaspoons Salz mischen und den Fisch rundum damit einreiben.\n4. Braten: 2 tablespoons neutrales Öl in einer Pfanne stark erhitzen. Den Fisch 3–4 Minuten pro Seite braten, bis er gar ist und sich in Flocken teilen lässt. Mit Limettensaft beträufeln und grob zerpflücken.\n5. Tortillas: 12 Maistortillas in einer trockenen Pfanne kurz erwärmen und in ein Tuch wickeln.\n6. Belegen: Tortillas mit Kraut, Fisch, 1 Avocado, in Scheiben, Crema und 4 tablespoons Koriander und eingelegte rote Zwiebeln belegen. Mit Limettenspalten servieren.\n\nNOTES\nBaja-Style: Den Fisch in Streifen schneiden, durch einen Bierteig aus 150 g Mehl, 200 ml Bier und Salz ziehen und frittieren. Die Salsa roja aus dem Quesadilla-Rezept passt auch hervorragend dazu."],["Philly Cheese Steak Sandwich","Philly Cheese Steak Sandwich\nHauchdünnes Rindfleisch mit gebratenen Zwiebeln, Paprika und geschmolzenem Käse im Sandwichbrötchen\n\nINGREDIENTS\n• 600 grams Rib-Eye oder Hüftsteak (veggie: 500 g Kräuterseitlinge oder Champignons in Scheiben)\n• 3 tablespoons neutrales Öl\n• 2 Zwiebeln, in dünnen Streifen\n• 1 grüne Paprikaschote, in Streifen\n• 1 teaspoons Salz\n• 0.5 teaspoons schwarzer Pfeffer\n• 1 tablespoons Worcestershiresauce\n• 8 Provolone, Cheddar oder Gouda in Scheiben\n• 4 längliche Sandwichbrötchen (Hoagie oder Baguette)\n• 20 grams Butter\n• 2 tablespoons Mayonnaise (optional)\n\nSTEPS\n1. Fleisch schneiden: 600 grams Rib-Eye oder Hüftsteak (veggie: 500 g Kräuterseitlinge oder Champignons in Scheiben) 30 Minuten anfrieren und dann quer zur Faser hauchdünn schneiden, so dünn wie möglich.\n2. Gemüse: 1 EL von 3 tablespoons neutrales Öl in einer großen Pfanne erhitzen. 2 Zwiebeln, in dünnen Streifen und 1 grüne Paprikaschote, in Streifen 8–10 Minuten weich und leicht gebräunt braten. Herausnehmen.\n3. Fleisch braten: Restliches Öl stark erhitzen und das Fleisch portionsweise 1–2 Minuten scharf anbraten. Dabei mit dem Pfannenwender zerteilen. Pilze bei hoher Hitze braten, bis sie gebräunt sind. Mit 1 teaspoons Salz, 0.5 teaspoons schwarzer Pfeffer und 1 tablespoons Worcestershiresauce würzen.\n4. Käse schmelzen: Gemüse zurück in die Pfanne geben, alles mischen und in 4 Portionen teilen. Je 2 Scheiben 8 Provolone, Cheddar oder Gouda in Scheiben darauflegen, Hitze herunterdrehen und mit einem Deckel 1 Minute schmelzen lassen.\n5. Brot: 4 längliche Sandwichbrötchen (Hoagie oder Baguette) längs aufschneiden, innen mit 20 grams Butter bestreichen und kurz in der Pfanne oder im Ofen anrösten. Nach Wunsch mit 2 tablespoons Mayonnaise (optional) bestreichen.\n6. Füllen: Mit dem Pfannenwender je eine Portion samt geschmolzenem Käse in ein Brötchen schieben und sofort servieren.\n\nNOTES\nIn Philadelphia wird oft Cheez Whiz statt Käsescheiben genommen. Eine schnelle Käsesauce aus 100 ml Milch und 100 g Cheddar, in einem kleinen Topf geschmolzen, kommt dem nahe. Eingelegte Jalapeños oder Peperoni passen auch gut dazu."],["Birria de Res","Birria de Res (+ Quesabirria-Tacos)\nIn würzigem Chilisud geschmortes Rindfleisch mit Consommé – für knusprige Quesabirria-Tacos zum Dippen\n\nINGREDIENTS\n• 1.5 kilograms Rinderschulter, -nacken oder Short Ribs (gern gemischt), in großen Stücken\n• 2 teaspoons Salz\n• 8 Guajillo-Chilis\n• 3 Cascabel-Chilis\n• 2 Morita-Chilis\n• 3 Chiles de Árbol (nach Schärfewunsch)\n• 2 Tomaten\n• 1 Zwiebel, halbiert\n• 6 Knoblauchzehen\n• 3 tablespoons Apfelessig\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons getrockneter Oregano (mexikanisch)\n• 1 Zimtstange (oder ½ TL gemahlen)\n• 3 Gewürznelken\n• 3 Lorbeerblätter\n• 1.5 liters Rinderbrühe oder Wasser\n• 18 Maistortillas\n• 300 grams Oaxaca-Käse oder Mozzarella, gezupft\n• 6 tablespoons weiße Zwiebel, fein gewürfelt, und Koriander (Topping)\n• 2 Limetten (Spalten)\n\nSTEPS\n1. Fleisch anbraten: 1.5 kilograms Rinderschulter, -nacken oder Short Ribs (gern gemischt), in großen Stücken mit 2 teaspoons Salz würzen und in einem schweren Topf portionsweise rundum kräftig braun anbraten.\n2. Chilis vorbereiten: Von 8 Guajillo-Chilis, 3 Cascabel-Chilis, 2 Morita-Chilis und 3 Chiles de Árbol (nach Schärfewunsch) Stiele und Kerne entfernen und je Seite 20 Sekunden trocken rösten. 2 Tomaten, 1 Zwiebel, halbiert und 6 Knoblauchzehen in der Pfanne schwarz-fleckig rösten. Chilis 20 Minuten in heißem Wasser einweichen.\n3. Adobo mixen: Chilis, Tomaten, Zwiebel und Knoblauch mit 3 tablespoons Apfelessig, 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons getrockneter Oregano (mexikanisch), 3 Gewürznelken, dem Zimt und 300 ml von 1.5 liters Rinderbrühe oder Wasser sehr fein pürieren. Durch ein Sieb streichen.\n4. Schmoren: Adobo, restliche Brühe und 3 Lorbeerblätter zum Fleisch geben. Zugedeckt bei kleiner Hitze 3 Stunden schmoren, bis das Fleisch zerfällt. Im Schnellkochtopf: 60 Minuten hohe Stufe, natürlich abdampfen lassen.\n5. Zupfen & Consommé: Fleisch herausnehmen und zerzupfen. Das rote Fett von der Sauce abschöpfen und beiseitestellen. Die Sauce ist das Consommé: Mit Salz und Limette abschmecken und heiß halten.\n6. Quesabirria: 18 Maistortillas kurz durch das abgeschöpfte rote Fett ziehen und in eine heiße Pfanne legen. Mit 300 grams Oaxaca-Käse oder Mozzarella, gezupft und Fleisch belegen, zuklappen und je Seite 2–3 Minuten knusprig braten.\n7. Servieren: Mit einer Tasse Consommé zum Dippen servieren, bestreut mit 6 tablespoons weiße Zwiebel, fein gewürfelt, und Koriander (Topping) und mit 2 Limetten (Spalten).\n\nNOTES\nAm nächsten Tag schmeckt Birria noch besser. Gekühlt lässt sich das Fett leicht abnehmen. Veggie: Austernpilze oder Kräuterseitlinge in Streifen mit dem gleichen Adobo 30 Minuten schmoren. Junge Jackfruit funktioniert ebenfalls."],["Nopales a la Mexicana","Nopales a la Mexicana\nGebratene Kaktusblätter mit Tomate, Zwiebel und Chili – als Taco-Füllung oder Beilage\n\nINGREDIENTS\n• 500 grams Nopales (frisch, entstachelt, oder aus dem Glas)\n• 2 tablespoons Pflanzenöl\n• 1 weiße Zwiebel, gewürfelt\n• 2 Knoblauchzehen, gehackt\n• 1 Jalapeño oder Serrano, gehackt (oder 1 zerbröselte Árbol)\n• 2 Tomaten, gewürfelt\n• 0.5 teaspoons Salz\n• 0.5 teaspoons getrockneter Oregano\n• 2 tablespoons Koriander, gehackt\n• 60 grams Queso fresco oder Feta, zerbröselt (optional)\n\nSTEPS\n1. Nopales vorbereiten: Frische 500 grams Nopales (frisch, entstachelt, oder aus dem Glas): Mit einem Messer restliche Stachelansätze abschaben, den Rand rundherum abschneiden und in 1-cm-Streifen oder Würfel schneiden. Nopales aus dem Glas nur gründlich abspülen.\n2. Schleim ausbraten: Frische Nopales in einer Pfanne mit 1 EL 2 tablespoons Pflanzenöl bei mittlerer Hitze ohne Deckel 10–12 Minuten braten. Anfangs treten Schleimfäden aus, die beim Weiterbraten verdampfen. Sie sind fertig, wenn sie olivgrün und nicht mehr schleimig sind.\n3. Aromaten: Restliches Öl zugeben. 1 weiße Zwiebel, gewürfelt, 2 Knoblauchzehen, gehackt und 1 Jalapeño oder Serrano, gehackt (oder 1 zerbröselte Árbol) 3–4 Minuten mitbraten.\n4. Tomaten: 2 Tomaten, gewürfelt, 0.5 teaspoons Salz und 0.5 teaspoons getrockneter Oregano zugeben und 3–4 Minuten braten, bis die Tomaten zerfallen.\n5. Servieren: Mit 2 tablespoons Koriander, gehackt und 60 grams Queso fresco oder Feta, zerbröselt (optional) bestreuen. In warmen Tortillas, zu Rührei oder als Beilage servieren.\n\nNOTES\nNopales schmecken frisch-säuerlich, ein wenig wie grüne Bohnen mit Zitrone. Zum Frühstück passen sie hervorragend in Rührei (Huevos con Nopales). Kalt mit Tomate, Zwiebel, Koriander und Limette angemacht werden sie zur Ensalada de Nopales."],["Tinga Füllung","Tinga (Hähnchen oder Pilz)\nGezupftes Hähnchen oder Pilze in rauchiger Tomaten-Chipotle-Sauce mit geschmorten Zwiebeln\n\nINGREDIENTS\n• 600 grams Hähnchenoberschenkel ohne Knochen (veggie: 500 g Austernpilze/Kräuterseitlinge, gezupft, oder Jackfruit)\n• 2 tablespoons Pflanzenöl\n• 2 Zwiebeln, in dünnen Streifen\n• 3 Knoblauchzehen\n• 2 Morita-Chilis (oder 2 Chipotle in Adobo)\n• 4 Tomaten (oder 400 g Dosentomaten)\n• 150 milliliters Brühe\n• 1 teaspoons getrockneter Oregano\n• 1 Lorbeerblatt\n• 1 teaspoons Salz\n\nSTEPS\n1. Hähnchen garen: 600 grams Hähnchenoberschenkel ohne Knochen (veggie: 500 g Austernpilze/Kräuterseitlinge, gezupft, oder Jackfruit) in leicht gesalzenem Wasser 20 Minuten pochieren und zerzupfen. Pilze direkt in 1 EL Öl scharf anbraten, bis sie gebräunt sind.\n2. Sauce: 2 Morita-Chilis (oder 2 Chipotle in Adobo) 15 Minuten in heißem Wasser einweichen. Mit 4 Tomaten (oder 400 g Dosentomaten), 3 Knoblauchzehen, 150 milliliters Brühe und 1 teaspoons getrockneter Oregano glatt pürieren.\n3. Zwiebeln: 2 Zwiebeln, in dünnen Streifen in 2 tablespoons Pflanzenöl 8–10 Minuten weich und leicht gebräunt braten.\n4. Köcheln: Sauce und 1 Lorbeerblatt zu den Zwiebeln geben und 10 Minuten einkochen. Fleisch oder Pilze unterheben und weitere 5 Minuten köcheln, bis die Sauce dick ist. Mit 1 teaspoons Salz abschmecken.\n\nNOTES\nKlassisch auf Tostadas mit Bohnenmus, saurer Sahne, Avocado und Queso fresco. Funktioniert auch gut in Tacos oder Burritos."],["Süßkartoffel-Black Beans-Füllung (Burrito)","Süßkartoffel-Schwarze-Bohnen-Füllung\nGeröstete Süßkartoffel mit schwarzen Bohnen, Mais und Chili-Limette – vegetarische Burrito- und Taco-Füllung\n\nINGREDIENTS\n• 600 grams Süßkartoffeln, in 1,5-cm-Würfeln\n• 3 tablespoons Olivenöl\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver\n• 1 teaspoons Salz\n• 1 rote Zwiebel, gewürfelt\n• 2 Knoblauchzehen, gehackt\n• 480 grams schwarze Bohnen (Dose), abgetropft\n• 140 grams Mais (Dose), abgetropft\n• 1 Limette, Saft\n• 3 tablespoons Koriander, gehackt\n\nSTEPS\n1. Süßkartoffeln rösten: Den Ofen auf 220 °C vorheizen. 600 grams Süßkartoffeln, in 1,5-cm-Würfeln mit 2 EL von 3 tablespoons Olivenöl, 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons geräuchertes Paprikapulver oder Chipotle-Pulver und der Hälfte von 1 teaspoons Salz mischen. Auf einem Blech verteilen und 25 Minuten rösten, bis sie weich und an den Rändern karamellisiert sind. Einmal wenden.\n2. Bohnen: In einer Pfanne 1 rote Zwiebel, gewürfelt im restlichen Öl 4 Minuten anschwitzen. 2 Knoblauchzehen, gehackt kurz mitbraten, dann 480 grams schwarze Bohnen (Dose), abgetropft und 140 grams Mais (Dose), abgetropft 5 Minuten erwärmen. Einen Teil der Bohnen leicht zerdrücken, das hält die Füllung im Burrito zusammen.\n3. Mischen: Die gerösteten Süßkartoffeln unterheben und mit 1 Limette, Saft, restlichem Salz und 3 tablespoons Koriander, gehackt abschmecken.\n\nNOTES\nBurrito-Aufbau: Weizentortilla, Reis, Füllung, Käse, Salsa, saure Sahne und Avocado. Fest einrollen und in der Pfanne mit der Naht nach unten anrösten. Mit Feta oder Queso fresco und der Chipotle-Crema von den Fischtacos besonders gut."],["Papas con Chorizo","Papas con Chorizo\nKnusprige Kartoffelwürfel mit würziger, selbstgemachter mexikanischer Chorizo – Taco-, Burrito- und Quesadilla-Füllung\n\nINGREDIENTS\n• 3 Guajillo-Chilis\n• 2 Chiles de Árbol\n• 3 tablespoons Apfelessig\n• 3 Knoblauchzehen\n• 1 teaspoons geräuchertes Paprikapulver\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons getrockneter Oregano\n• 0.3 teaspoons Zimt\n• 1.5 teaspoons Salz\n• 400 grams Schweinehack (veggie: 100 g Sojagranulat, in Brühe eingeweicht und ausgedrückt)\n• 600 grams festkochende Kartoffeln, in 1-cm-Würfeln\n• 3 tablespoons Pflanzenöl\n• 1 weiße Zwiebel, gewürfelt\n• 2 tablespoons Koriander, gehackt\n\nSTEPS\n1. Chilipaste: Von 3 Guajillo-Chilis und 2 Chiles de Árbol Stiele und Kerne entfernen, kurz trocken rösten und 15 Minuten in heißem Wasser einweichen. Mit 3 tablespoons Apfelessig, 3 Knoblauchzehen, 1 teaspoons geräuchertes Paprikapulver, 1 teaspoons gemahlener Kreuzkümmel, 1 teaspoons getrockneter Oregano, 0.3 teaspoons Zimt, 1.5 teaspoons Salz und 2–3 EL Einweichwasser zu einer dicken Paste pürieren.\n2. Chorizo mischen: 400 grams Schweinehack (veggie: 100 g Sojagranulat, in Brühe eingeweicht und ausgedrückt) mit der Chilipaste gründlich verkneten. Wenn Zeit ist, 1 Stunde oder über Nacht im Kühlschrank ziehen lassen.\n3. Kartoffeln vorgaren: 600 grams festkochende Kartoffeln, in 1-cm-Würfeln in Salzwasser 5–6 Minuten vorgaren, bis sie gerade eben weich sind. Gut abtropfen und ausdampfen lassen.\n4. Chorizo braten: 1 EL von 3 tablespoons Pflanzenöl in einer großen Pfanne erhitzen. Die Chorizo-Masse krümelig braten, bis sie gebräunt ist und rotes Fett austritt. Herausnehmen und das Fett in der Pfanne lassen.\n5. Kartoffeln braten: Restliches Öl zugeben. Kartoffeln und 1 weiße Zwiebel, gewürfelt darin 10–12 Minuten braten, bis sie rundum knusprig und rot gefärbt sind. Nicht zu oft wenden.\n6. Vereinen: Chorizo zurück in die Pfanne geben, alles mischen und 2 Minuten zusammen braten. Abschmecken und mit 2 tablespoons Koriander, gehackt bestreuen.\n\nNOTES\nMit spanischer luftgetrockneter Chorizo geht es auch: 200 g fein würfeln und auslassen, die Chilipaste dann direkt zu den Kartoffeln geben. Klassisch in Tacos mit Salsa verde, in Quesadillas oder zum Frühstück mit Spiegelei. Die rohe Chorizo-Masse lässt sich gut einfrieren."],["Weed Butter","Decarboxylieren\nhttps://www.youtube.com/watch?v=Ltt8mzBFExw&t=211s\n\nButter machen\nhttps://www.youtube.com/watch?v=z665jS_Aygk&t=485s"],["Vanillesauce","Vanillesauce\nEchte Vanillesauce mit Eigelb und Vanilleschote – mit etwas Stärke abgesichert gegen Gerinnen\n\nINGREDIENTS\n• 400 milliliters Milch\n• 100 milliliters Sahne\n• 1 Vanilleschote (oder 1 TL Vanilleextrakt)\n• 4 Eigelb\n• 60 grams Zucker\n• 1 teaspoons Speisestärke\n• 1 pinch Salz\n\nSTEPS\n1. Vanillemilch: 1 Vanilleschote (oder 1 TL Vanilleextrakt) längs aufschneiden und das Mark auskratzen. Mark und Schote mit 400 milliliters Milch und 100 milliliters Sahne aufkochen, vom Herd nehmen und 10 Minuten ziehen lassen. Die Schote danach entfernen.\n2. Eigelbmasse: 4 Eigelb, 60 grams Zucker, 1 teaspoons Speisestärke und 1 pinch Salz in einer Schüssel hell und cremig verrühren.\n3. Temperieren: Die heiße Milch langsam unter ständigem Rühren in die Eigelbmasse gießen. Dann alles zurück in den Topf geben.\n4. Zur Rose abziehen: Bei kleiner bis mittlerer Hitze mit einem Holzlöffel oder Spatel ständig rühren, bis die Sauce leicht eindickt. Das dauert ca. 5 Minuten. Sie ist fertig, wenn sie den Löffelrücken überzieht und eine Linie, die du mit dem Finger hindurchziehst, stehen bleibt. Nicht kochen lassen.\n5. Absieben: Sofort durch ein feines Sieb in eine kalte Schüssel gießen. Warm oder kalt servieren.\n\nNOTES\nFalls die Sauce doch leicht gerinnt, kurz mit dem Stabmixer durchmixen, dann wird sie meist wieder glatt. Beim Abkühlen Frischhaltefolie direkt auf die Oberfläche legen, damit sich keine Haut bildet. Passt zu Apfelstrudel, Kaiserschmarrn, Rote Grütze und Dampfnudeln."],["Gravy","Gravy (Rind oder veggie)\nKräftige braune Bratensauce auf Mehlschwitze-Basis – mit Rinder- oder Pilzbrühe\n\nINGREDIENTS\n• 40 grams Butter\n• 1 Schalotte, sehr fein gewürfelt\n• 1 Knoblauchzehe, gerieben\n• 3 tablespoons Mehl\n• 500 milliliters kräftige Rinderbrühe (veggie: Pilzbrühe, gern mit eingeweichten Steinpilzen)\n• 1 tablespoons Sojasauce\n• 1 teaspoons Worcestershiresauce\n• 1 teaspoons Tomatenmark\n• 2 frischer Thymian (Zweige)\n• 0.5 teaspoons schwarzer Pfeffer\n• 0.5 teaspoons Salz\n\nSTEPS\n1. Aromaten: 40 grams Butter in einem Topf schmelzen. 1 Schalotte, sehr fein gewürfelt 2–3 Minuten glasig anschwitzen, 1 Knoblauchzehe, gerieben und 1 teaspoons Tomatenmark 30 Sekunden mitrösten.\n2. Roux bräunen: 3 tablespoons Mehl einstreuen und unter ständigem Rühren 3–4 Minuten rösten, bis die Mehlschwitze nussbraun ist. Hier kommt die Farbe und Tiefe her.\n3. Aufgießen: 500 milliliters kräftige Rinderbrühe (veggie: Pilzbrühe, gern mit eingeweichten Steinpilzen) nach und nach mit dem Schneebesen einrühren, damit keine Klumpen entstehen. 1 tablespoons Sojasauce, 1 teaspoons Worcestershiresauce und 2 frischer Thymian (Zweige) zugeben.\n4. Einkochen: 8–10 Minuten sanft köcheln lassen, bis die Sauce eine sämige, löffelfeste Konsistenz hat. Den Thymian entfernen und mit 0.5 teaspoons schwarzer Pfeffer und 0.5 teaspoons Salz abschmecken.\n\nNOTES\nWenn du gerade einen Braten gemacht hast, ersetze die Butter durch das Bratfett und löse den Bratensatz mit der Brühe. Für Poutine sollte die Gravy eher dick sein, damit die Pommes nicht durchweichen. Die Veggie-Version wird mit 1 TL Miso oder einem Schuss Rotwein kräftiger."],["Poutine","Poutine\nKanadischer Klassiker: knusprige, doppelt gebackene Pommes mit Käsestücken und heißer Gravy\n\nINGREDIENTS\n• 1.2 kilograms mehligkochende Kartoffeln\n• 1.5 liters Frittieröl (oder 3 EL Öl für den Ofen)\n• 1 teaspoons Salz\n• 250 grams Käse (fester Mozzarella, Halloumi oder junger Gouda, siehe oben), in Zimmertemperatur\n• 500 milliliters heiße Gravy (Rezept oben)\n• 2 tablespoons Schnittlauch oder Frühlingszwiebeln (optional)\n\nSTEPS\n1. Pommes schneiden: 1.2 kilograms mehligkochende Kartoffeln schälen und in 1 cm dicke Stifte schneiden. 30 Minuten in kaltes Wasser legen, damit Stärke austritt. Danach sehr gründlich trocken tupfen.\n2. Vorfrittieren: 1.5 liters Frittieröl (oder 3 EL Öl für den Ofen) auf 150 °C erhitzen. Die Pommes portionsweise 5–6 Minuten frittieren, bis sie gar, aber noch hell sind. Auf einem Gitter abkühlen lassen.\n3. Knusprig frittieren: Das Öl auf 180 °C erhitzen und die Pommes portionsweise 2–3 Minuten goldbraun und knusprig frittieren. Abtropfen lassen und sofort mit 1 teaspoons Salz würzen.\n4. Anrichten: Die heißen Pommes in Schalen verteilen, 250 grams Käse (fester Mozzarella, Halloumi oder junger Gouda, siehe oben), in Zimmertemperatur in Stücken darüberstreuen und mit der kochend heißen 500 milliliters heiße Gravy (Rezept oben) übergießen. Der Käse soll dabei nur halb schmelzen.\n5. Servieren: Nach Wunsch mit 2 tablespoons Schnittlauch oder Frühlingszwiebeln (optional) bestreuen und sofort essen, bevor die Pommes weich werden.\n\nNOTES\nIm Ofen: Die gew\\u00e4sserten und getrockneten Pommes mit 3 EL \\u00d6l und 1 EL Speisest\\u00e4rke mischen und bei 220 \\u00b0C Umluft 30\\u201335 Minuten backen, dabei einmal wenden. Mit TK-Pommes geht es auch schnell. In Kanada gibt es Varianten mit Pulled Pork oder gebratenen Pilzen obendrauf."],["Hollandaise","Hollandaise mit dem Stabmixer\nNarrensichere Sauce Hollandaise in 3 Minuten – ohne Wasserbad, mit heißer Butter im Mixbecher\n\nINGREDIENTS\n• 3 Eigelb (Zimmertemperatur)\n• 1 tablespoons Zitronensaft\n• 1 tablespoons Wasser\n• 0.5 teaspoons Dijon-Senf (optional, stabilisiert zusätzlich)\n• 0.5 teaspoons Salz\n• 175 grams Butter\n• 1 pinch Cayennepfeffer oder weißer Pfeffer\n\nSTEPS\n1. Basis in den Becher: 3 Eigelb (Zimmertemperatur), 1 tablespoons Zitronensaft, 1 tablespoons Wasser, 0.5 teaspoons Dijon-Senf (optional, stabilisiert zusätzlich) und 0.5 teaspoons Salz in einen hohen, schmalen Mixbecher geben, in den der Stabmixer gerade so hineinpasst.\n2. Butter erhitzen: 175 grams Butter in einem kleinen Topf schmelzen und erhitzen, bis sie richtig heiß ist und leicht schäumt, ca. 90–100 °C. Die Hitze der Butter gart das Eigelb. Nicht bräunen lassen.\n3. Mixen: Den Stabmixer auf den Boden des Bechers stellen und einschalten. Die heiße Butter in einem ganz dünnen Strahl einlaufen lassen. Sobald die Sauce zu emulgieren beginnt, den Mixer langsam nach oben ziehen. Die milchige Molke am Topfboden zurückhalten.\n4. Abschmecken: Mit 1 pinch Cayennepfeffer oder weißer Pfeffer, Salz und Zitronensaft abschmecken. Ist sie zu dick, mit 1 TL warmem Wasser verdünnen.\n\nNOTES\nDie Hollandaise wird warm gehalten, indem du den Becher in warmes Wasser (nicht heiß) stellst, so hält sie ca. 30 Minuten. Rettung, wenn sie gerinnt: 1 frisches Eigelb in einen neuen Becher geben und die geronnene Sauce langsam einmixen. Mit Estragon und Schalottenreduktion wird daraus Béarnaise. Passt zu Spargel, Eggs Benedict und Fisch."],["Katsu Sando","Katsu Sando\nJapanisches Sandwich mit knusprigem Panko-Schnitzel (oder Tofu), Tonkatsu-Sauce und Weißkohl im weichen Toast\n\nINGREDIENTS\n• 2 Schweinelachs-Steaks, ca. 2 cm dick (veggie: fester Tofu, 2 Scheiben à 2 cm, gut ausgedrückt)\n• 0.5 teaspoons Salz und Pfeffer\n• 3 tablespoons Mehl\n• 1 Ei, verquirlt\n• 60 grams Panko\n• 300 milliliters neutrales Öl zum Ausbacken\n• 3 tablespoons Ketchup\n• 2 tablespoons Worcestershiresauce\n• 1 teaspoons Sojasauce\n• 1 teaspoons Zucker oder Honig\n• 4 Scheiben weiches Toastbrot (gern Milchbrot/Shokupan)\n• 2 tablespoons Mayonnaise (gern Kewpie)\n• 1 teaspoons Senf\n• 80 grams Weißkohl, hauchdünn gehobelt\n\nSTEPS\n1. Tonkatsu-Sauce: 3 tablespoons Ketchup, 2 tablespoons Worcestershiresauce, 1 teaspoons Sojasauce und 1 teaspoons Zucker oder Honig verrühren.\n2. Vorbereiten: Den Fettrand von 2 Schweinelachs-Steaks, ca. 2 cm dick (veggie: fester Tofu, 2 Scheiben à 2 cm, gut ausgedrückt) mehrmals einschneiden, damit sich das Fleisch nicht wölbt. Leicht flach klopfen, aber nicht zu dünn, es soll saftig bleiben. Mit 0.5 teaspoons Salz und Pfeffer würzen. Tofu nur trocken tupfen und würzen.\n3. Panieren: Nacheinander in 3 tablespoons Mehl, 1 Ei, verquirlt und 60 grams Panko wälzen. Das Panko fest andrücken.\n4. Ausbacken: 300 milliliters neutrales Öl zum Ausbacken in einer Pfanne auf 170 °C erhitzen, ca. 1,5 cm hoch. Die Schnitzel je Seite 3–4 Minuten goldbraun ausbacken, bis sie durchgegart sind. Auf einem Gitter 3 Minuten ruhen lassen.\n5. Brot: 2 tablespoons Mayonnaise (gern Kewpie) mit 1 teaspoons Senf verrühren und auf eine Seite jeder Brotscheibe streichen. Nach Wunsch die Rinde abschneiden.\n6. Zusammensetzen: Eine Brotscheibe mit 80 grams Weißkohl, hauchdünn gehobelt belegen. Das Schnitzel dick mit Tonkatsu-Sauce bestreichen, darauflegen und mit der zweiten Scheibe zudecken. Leicht andrücken und halbieren.\n\nNOTES\nDas Brot wird traditionell nicht getoastet, der Kontrast zwischen weichem Brot und knusprigem Schnitzel ist der Clou. Das Sandwich vor dem Halbieren 2 Minuten in Frischhaltefolie wickeln, dann lässt es sich sauber schneiden. Hähnchenbrust funktioniert auch (Chicken Katsu)."],["Huevos Rancheros","Huevos Rancheros\nSpiegeleier auf knusprigen Maistortillas mit warmer Salsa Ranchera, Bohnen und Avocado\n\nINGREDIENTS\n• 4 Tomaten\n• 0.5 weiße Zwiebel (halbe)\n• 2 Knoblauchzehen\n• 2 Chiles de Árbol oder 1 Jalapeño\n• 3 tablespoons Pflanzenöl\n• 0.5 teaspoons Salz\n• 4 Maistortillas\n• 4 Eier\n• 200 grams Refried Beans (warm)\n• 1 Avocado, in Scheiben\n• 50 grams Queso fresco oder Feta, zerbröselt\n• 2 tablespoons Koriander, gehackt\n\nSTEPS\n1. Salsa rösten: 4 Tomaten, 0.5 weiße Zwiebel (halbe) und 2 Knoblauchzehen in einer trockenen Pfanne rundum schwarz-fleckig rösten. 2 Chiles de Árbol oder 1 Jalapeño nur kurz mitrösten.\n2. Salsa kochen: Alles grob pürieren. 1 EL von 3 tablespoons Pflanzenöl in einem Topf erhitzen, die Salsa hineingießen und 5–8 Minuten einkochen. Mit 0.5 teaspoons Salz abschmecken und warm halten.\n3. Tortillas: 4 Maistortillas in etwas Öl je Seite 30 Sekunden anbraten, bis sie leicht knusprig, aber noch biegsam sind. Auf Teller legen und mit 200 grams Refried Beans (warm) bestreichen.\n4. Spiegeleier: Im restlichen Öl 4 Eier als Spiegeleier mit flüssigem Eigelb braten und auf die Tortillas setzen.\n5. Servieren: Großzügig mit der warmen Salsa übergießen und mit 1 Avocado, in Scheiben, 50 grams Queso fresco oder Feta, zerbröselt und 2 tablespoons Koriander, gehackt toppen.\n\nNOTES\nDivorciados-Variante: Ein Ei mit roter Salsa und eins mit grüner Salsa (Tomatillo) servieren, getrennt durch einen Streifen Bohnen. Auch Nopales passen sehr gut dazu."],["Carne Asada","Carne Asada\nZitrus-Knoblauch-marinierter, scharf gegrillter Flank Steak für Tacos – mit Pilz-Alternative\n\nINGREDIENTS\n• 800 grams Flank Steak, Skirt Steak oder Bavette (veggie: 600 g Portobello oder Kräuterseitlinge, längs halbiert)\n• 1 Orange, Saft\n• 2 Limetten, Saft\n• 4 Knoblauchzehen, gehackt\n• 1 Guajillo, eingeweicht und gehackt, oder 1 Jalapeño\n• 4 tablespoons Koriander, gehackt (mit Stängeln)\n• 2 tablespoons Sojasauce\n• 3 tablespoons Olivenöl\n• 1 teaspoons gemahlener Kreuzkümmel\n• 1 teaspoons Salz\n• 12 Maistortillas\n• 6 tablespoons weiße Zwiebel, fein gewürfelt, und Koriander (Topping)\n• 4 tablespoons Salsa und Limettenspalten\n\nSTEPS\n1. Marinade: 1 Orange, Saft, 2 Limetten, Saft, 4 Knoblauchzehen, gehackt, 1 Guajillo, eingeweicht und gehackt, oder 1 Jalapeño, 4 tablespoons Koriander, gehackt (mit Stängeln), 2 tablespoons Sojasauce, 3 tablespoons Olivenöl, 1 teaspoons gemahlener Kreuzkümmel und 1 teaspoons Salz verrühren.\n2. Marinieren: 800 grams Flank Steak, Skirt Steak oder Bavette (veggie: 600 g Portobello oder Kräuterseitlinge, längs halbiert) in der Marinade wenden und abgedeckt im Kühlschrank 2–8 Stunden marinieren. Nicht länger, sonst macht die Zitrusäure das Fleisch mehlig. Pilze reichen 30 Minuten.\n3. Grillen: Fleisch aus der Marinade nehmen und trocken tupfen. Grill oder gusseiserne Pfanne sehr stark erhitzen und das Steak je Seite 4–5 Minuten scharf anbraten, bis es außen dunkel und innen medium ist. Pilze je Seite 3–4 Minuten.\n4. Ruhen: Das Fleisch 5–10 Minuten auf einem Brett ruhen lassen.\n5. Schneiden: Quer zur Faser in dünne Streifen schneiden und dann grob hacken. Das ist bei Flank und Skirt entscheidend für die Zartheit.\n6. Servieren: In warmen 12 Maistortillas mit 6 tablespoons weiße Zwiebel, fein gewürfelt, und Koriander (Topping) und 4 tablespoons Salsa und Limettenspalten servieren.\n\nNOTES\nGute Beilagen sind gegrillte Frühlingszwiebeln (Cebollitas), Guacamole und Bohnen. Reste eignen sich für Burritos, Quesadillas oder einen Salat. Mit Pommes, Käse und Guacamole wird daraus Carne Asada Fries."],["Chilaquiles rojos","Chilaquiles rojos\nKnusprige Tortillachips in roter Guajillo-Sauce mit Spiegelei, Crema und Käse\n\nINGREDIENTS\n• 8 Maistortillas vom Vortag\n• 200 milliliters Pflanzenöl zum Frittieren\n• 4 Guajillo-Chilis\n• 2 Chiles de Árbol\n• 2 Tomaten\n• 0.3 weiße Zwiebel (Viertel)\n• 2 Knoblauchzehen\n• 250 milliliters Gemüsebrühe\n• 0.5 teaspoons Salz\n• 2 Eier\n• 3 tablespoons saure Sahne oder Crema\n• 50 grams Queso fresco oder Feta, zerbröselt\n• 4 tablespoons rote Zwiebel in Ringen, Koriander, Avocado (Topping)\n\nSTEPS\n1. Chips: 8 Maistortillas vom Vortag in Achtel schneiden. In 200 milliliters Pflanzenöl zum Frittieren portionsweise 2–3 Minuten goldbraun und knusprig frittieren, auf Küchenpapier abtropfen lassen und leicht salzen. Alternativ mit etwas Öl bestrichen bei 200 °C 10 Minuten im Ofen backen.\n2. Sauce: Von 4 Guajillo-Chilis und 2 Chiles de Árbol Stiele und Kerne entfernen, kurz rösten und 15 Minuten einweichen. 2 Tomaten, 0.3 weiße Zwiebel (Viertel) und 2 Knoblauchzehen in der Pfanne schwarz-fleckig rösten. Alles mit 250 milliliters Gemüsebrühe glatt pürieren.\n3. Sauce einkochen: 1 EL Öl in einer großen Pfanne erhitzen, die Sauce hineingießen und 5 Minuten köcheln lassen. Mit 0.5 teaspoons Salz abschmecken.\n4. Spiegeleier: Nebenbei 2 Eier als Spiegeleier braten.\n5. Schwenken: Die Chips in die Sauce geben und 30–60 Sekunden schwenken, bis sie überzogen, aber noch etwas knusprig sind. Sofort auf Teller verteilen.\n6. Toppen: Spiegeleier daraufsetzen und mit 3 tablespoons saure Sahne oder Crema, 50 grams Queso fresco oder Feta, zerbröselt und 4 tablespoons rote Zwiebel in Ringen, Koriander, Avocado (Topping) toppen. Sofort essen.\n\nNOTES\nMit Refried Beans als Beilage wird ein vollwertiges Frühstück daraus. Statt Spiegelei passen auch Rührei oder Tinga."],["French Toast","French Toast\nGoldbraun gebratenes Brioche in Zimt-Vanille-Eiermilch – außen knusprig, innen cremig\n\nINGREDIENTS\n• 4 dicke Scheiben Brioche oder Toastbrot vom Vortag (2 cm)\n• 2 Eier\n• 150 milliliters Milch\n• 1 tablespoons Zucker\n• 0.5 teaspoons Zimt\n• 1 teaspoons Vanilleextrakt\n• 1 pinch Salz\n• 20 grams Butter\n• 4 tablespoons Ahornsirup, Beeren, Puderzucker (Topping)\n\nSTEPS\n1. Eiermilch: 2 Eier, 150 milliliters Milch, 1 tablespoons Zucker, 0.5 teaspoons Zimt, 1 teaspoons Vanilleextrakt und 1 pinch Salz in einer flachen Form gut verquirlen.\n2. Einweichen: 4 dicke Scheiben Brioche oder Toastbrot vom Vortag (2 cm) je Seite 15–20 Sekunden in die Eiermilch legen. Das Brot soll sich vollsaugen, aber nicht zerfallen.\n3. Braten: 20 grams Butter in einer Pfanne bei mittlerer Hitze aufschäumen lassen. Die Scheiben je Seite 2–3 Minuten goldbraun braten. Bei zu hoher Hitze bleibt das Innere roh.\n4. Servieren: Sofort mit 4 tablespoons Ahornsirup, Beeren, Puderzucker (Topping) servieren.\n\nNOTES\nJe trockener das Brot, desto besser saugt es sich voll, ohne matschig zu werden. Herzhafte Variante: Zucker und Zimt weglassen, Pfeffer und Parmesan in die Eiermilch geben und mit Spiegelei servieren."],["Palak Paneer","Palak Paneer\nCremiges Spinat-Curry mit angebratenem Paneer, Ingwer und Garam Masala\n\nINGREDIENTS\n• 500 grams frischer Blattspinat (oder 450 g TK)\n• 250 grams Paneer, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu)\n• 3 tablespoons Ghee oder Pflanzenöl\n• 1 teaspoons Kreuzkümmelsamen\n• 1 Zwiebel, fein gewürfelt\n• 3 Knoblauchzehen, gerieben\n• 1 Ingwer, gerieben (Stück, ca. 3 cm)\n• 1 grüne Chili, gehackt\n• 1 Tomate, gewürfelt\n• 1 teaspoons gemahlener Koriander\n• 0.5 teaspoons Kurkuma\n• 1 teaspoons Garam Masala\n• 80 milliliters Sahne\n• 1 teaspoons Salz\n• 1 tablespoons Zitronensaft\n\nSTEPS\n1. Spinat blanchieren: 500 grams frischer Blattspinat (oder 450 g TK) 1 Minute in kochendem Wasser blanchieren und sofort in Eiswasser abschrecken. Gut ausdrücken und mit 3–4 EL Wasser fein pürieren. TK-Spinat nur auftauen und pürieren.\n2. Paneer braten: 250 grams Paneer, in 2-cm-Würfeln (Alternative: Halloumi oder fester Tofu) in 1 EL von 3 tablespoons Ghee oder Pflanzenöl rundum goldbraun anbraten und herausnehmen. Wer mag, legt ihn danach 10 Minuten in warmes Salzwasser, dann bleibt er weich.\n3. Masala: Restliches Fett erhitzen und 1 teaspoons Kreuzkümmelsamen 30 Sekunden rösten. 1 Zwiebel, fein gewürfelt 6–8 Minuten goldbraun braten. 3 Knoblauchzehen, gerieben, 1 Ingwer, gerieben (Stück, ca. 3 cm) und 1 grüne Chili, gehackt 1 Minute mitbraten. 1 Tomate, gewürfelt, 1 teaspoons gemahlener Koriander und 0.5 teaspoons Kurkuma zugeben und 3–4 Minuten einkochen, bis die Tomate zerfällt.\n4. Spinat: Das Spinatpüree unterrühren und 3–4 Minuten köcheln lassen. Nicht länger, sonst wird der Spinat graugrün.\n5. Vollenden: 80 milliliters Sahne, 1 teaspoons Garam Masala und den Paneer unterrühren und 2 Minuten erwärmen. Mit 1 teaspoons Salz und 1 tablespoons Zitronensaft abschmecken. Mit Naan oder Basmatireis servieren.\n\nNOTES\nGetrocknete Bockshornkleeblätter (Kasuri Methi) zwischen den Fingern zerrieben am Ende geben den typischen Restaurant-Geschmack. Statt Sahne geht auch Cashewcreme oder Kokosmilch."],["Dan Dan Noodles","Dan Dan Noodles\nSichuan-Nudeln mit nussig-scharfer Sesamsauce, knusprigem Hack (oder Shiitake-Tofu) und Pak Choi\n\nINGREDIENTS\n• 250 grams Weizennudeln (z. B. Ramen, Mie oder Udon)\n• 200 grams Schweinehack (veggie: 150 g Shiitake + 100 g Räuchertofu, fein gehackt)\n• 1 tablespoons neutrales Öl\n• 1 tablespoons Shaoxing-Wein oder trockener Sherry\n• 1 tablespoons Sojasauce (fürs Topping)\n• 2 tablespoons Tahin oder chinesische Sesampaste\n• 2 tablespoons Sojasauce (für die Sauce)\n• 1 tablespoons Chinkiang-Essig (schwarzer Reisessig)\n• 2 tablespoons Chiliöl mit Bodensatz\n• 0.5 teaspoons Sichuanpfeffer, geröstet und gemahlen\n• 1 teaspoons Zucker\n• 1 Knoblauchzehe, gerieben\n• 2 Pak Choi, halbiert\n• 3 tablespoons Frühlingszwiebeln und geröstete Erdnüsse (Topping)\n\nSTEPS\n1. Topping: 200 grams Schweinehack (veggie: 150 g Shiitake + 100 g Räuchertofu, fein gehackt) in 1 tablespoons neutrales Öl bei hoher Hitze krümelig und richtig knusprig braten, bis keine Feuchtigkeit mehr da ist. Mit 1 tablespoons Shaoxing-Wein oder trockener Sherry und 1 tablespoons Sojasauce (fürs Topping) ablöschen und einkochen lassen, bis es trocken ist.\n2. Sauce: 2 tablespoons Tahin oder chinesische Sesampaste, 2 tablespoons Sojasauce (für die Sauce), 1 tablespoons Chinkiang-Essig (schwarzer Reisessig), 2 tablespoons Chiliöl mit Bodensatz, 0.5 teaspoons Sichuanpfeffer, geröstet und gemahlen, 1 teaspoons Zucker und 1 Knoblauchzehe, gerieben mit 3–4 EL heißem Nudelwasser glatt rühren und auf zwei Schüsseln verteilen.\n3. Nudeln & Pak Choi: 250 grams Weizennudeln (z. B. Ramen, Mie oder Udon) nach Packungsanleitung kochen. 2 Pak Choi, halbiert in der letzten Minute mitkochen.\n4. Anrichten: Nudeln und Pak Choi in die Schüsseln auf die Sauce geben, das Topping darauf verteilen und mit 3 tablespoons Frühlingszwiebeln und geröstete Erdnüsse (Topping) bestreuen. Vor dem Essen alles kräftig durchmischen.\n\nNOTES\nMit Ya Cai (eingelegtem Senfgemüse aus dem Asialaden) zum Topping wird es authentischer. Für eine Suppen-Variante 200 ml heiße Brühe zur Sauce in die Schüssel geben."],["Tacos al Pastor","Tacos al Pastor\nIn Guajillo-Achiote-Ananas-Marinade eingelegtes Schweinefleisch (oder Kräuterseitlinge), knusprig gebraten mit Ananas\n\nINGREDIENTS\n• 800 grams Schweinenacken, in 5 mm dünnen Scheiben (veggie: 600 g Kräuterseitlinge in Scheiben oder Seitan)\n• 4 Guajillo-Chilis\n• 2 Chiles de Árbol\n• 50 grams Achiote-Paste (oder 1 EL Paprikapulver edelsüß + 1 TL geräuchert)\n• 120 milliliters Ananassaft\n• 3 tablespoons Apfelessig\n• 4 Knoblauchzehen\n• 1 teaspoons getrockneter Oregano\n• 1 teaspoons gemahlener Kreuzkümmel\n• 2 Gewürznelken\n• 1.5 teaspoons Salz\n• 0.5 frische Ananas, in Scheiben\n• 2 tablespoons Pflanzenöl\n• 16 Maistortillas\n• 6 tablespoons weiße Zwiebel, fein gewürfelt, Koriander, Limetten\n\nSTEPS\n1. Chilis einweichen: Von 4 Guajillo-Chilis und 2 Chiles de Árbol Stiele und Kerne entfernen, kurz rösten und 15 Minuten in heißem Wasser einweichen.\n2. Marinade: Chilis mit 50 grams Achiote-Paste (oder 1 EL Paprikapulver edelsüß + 1 TL geräuchert), 120 milliliters Ananassaft, 3 tablespoons Apfelessig, 4 Knoblauchzehen, 1 teaspoons getrockneter Oregano, 1 teaspoons gemahlener Kreuzkümmel, 2 Gewürznelken und 1.5 teaspoons Salz sehr glatt pürieren.\n3. Marinieren: 800 grams Schweinenacken, in 5 mm dünnen Scheiben (veggie: 600 g Kräuterseitlinge in Scheiben oder Seitan) mit der Marinade vermengen und mindestens 4 Stunden, besser über Nacht, im Kühlschrank marinieren. Pilze reichen 1 Stunde.\n4. Ananas: 0.5 frische Ananas, in Scheiben in einer sehr heißen Pfanne oder auf dem Grill je Seite 2 Minuten karamellisieren und in kleine Würfel schneiden.\n5. Braten: 2 tablespoons Pflanzenöl in einer gusseisernen Pfanne sehr stark erhitzen. Das Fleisch portionsweise und ohne zu überfüllen je Seite 2–3 Minuten braten, bis die Ränder dunkel und knusprig sind. Dann klein schneiden.\n6. Servieren: In warmen 16 Maistortillas mit Ananaswürfeln und 6 tablespoons weiße Zwiebel, fein gewürfelt, Koriander, Limetten servieren. Dazu eine Salsa verde oder roja.\n\nNOTES\nOfen-Trompo: Die marinierten Scheiben auf einem Spieß oder in einer Kastenform stapeln, mit einer halben Ananas als Basis. Bei 180 °C ca. 1,5 Stunden garen, dann in dünnen Scheiben abschneiden und in der Pfanne knusprig nachbraten."],["Kartoffelgratin","Kartoffelgratin\nCremiger Gratin aus dünnen Kartoffelscheiben in Knoblauch-Sahne, goldbraun überbacken\n\nINGREDIENTS\n• 1 kilograms festkochende Kartoffeln\n• 300 milliliters Sahne\n• 200 milliliters Milch\n• 2 Knoblauchzehen, angedrückt\n• 2 Thymianzweige\n• 1.5 teaspoons Salz\n• 1 pinch Muskatnuss\n• 0.5 teaspoons schwarzer Pfeffer\n• 15 grams Butter (für die Form)\n• 80 grams Gruyère oder Bergkäse, gerieben (optional)\n\nSTEPS\n1. Vorbereiten: Den Ofen auf 180 °C Ober-/Unterhitze vorheizen. 1 kilograms festkochende Kartoffeln schälen und mit dem Hobel in 2–3 mm dünne Scheiben schneiden. Nicht waschen, die Stärke bindet die Sauce.\n2. Vorkochen: 300 milliliters Sahne, 200 milliliters Milch, 2 Knoblauchzehen, angedrückt, 2 Thymianzweige, 1.5 teaspoons Salz, 1 pinch Muskatnuss und 0.5 teaspoons schwarzer Pfeffer in einem breiten Topf aufkochen. Die Kartoffeln zugeben und unter vorsichtigem Rühren 8–10 Minuten sanft köcheln, bis die Flüssigkeit leicht eindickt.\n3. Einschichten: Eine Auflaufform mit 15 grams Butter (für die Form) und einer halbierten Knoblauchzehe ausreiben. Knoblauch und Thymian entfernen, die Kartoffeln samt Sahne in die Form geben und glatt streichen.\n4. Backen: Mit 80 grams Gruyère oder Bergkäse, gerieben (optional) bestreuen und 40–45 Minuten backen, bis die Oberfläche goldbraun ist und ein Messer mühelos durch die Kartoffeln gleitet.\n5. Ruhen: 10 Minuten ruhen lassen, dann bindet die Sauce nach.\n\nNOTES\nKlassischer Gratin dauphinois kommt ohne Käse aus. Die Variante mit Käse heißt eher Gratin savoyard. Passt als Beilage zu Braten oder mit Salat als vegetarisches Hauptgericht."],["Käsespätzle","Käsespätzle\nSelbstgemachte Spätzle, geschichtet mit Bergkäse und Emmentaler, getoppt mit Röstzwiebeln\n\nINGREDIENTS\n• 400 grams Weizenmehl (Type 405) oder Spätzlemehl\n• 4 Eier\n• 150 milliliters Wasser oder Milch\n• 1 teaspoons Salz (Teig)\n• 1 pinch Muskatnuss\n• 3 Zwiebeln, in dünnen Ringen\n• 50 grams Butter\n• 150 grams Bergkäse, gerieben\n• 150 grams Emmentaler, gerieben\n• 0.5 teaspoons schwarzer Pfeffer\n• 2 tablespoons Schnittlauch, in Röllchen\n\nSTEPS\n1. Teig schlagen: 400 grams Weizenmehl (Type 405) oder Spätzlemehl, 4 Eier, 150 milliliters Wasser oder Milch, 1 teaspoons Salz (Teig) und 1 pinch Muskatnuss mit einem Kochlöffel kräftig schlagen, bis der Teig Blasen wirft und zähflüssig vom Löffel reißt. 15 Minuten ruhen lassen.\n2. Röstzwiebeln: 3 Zwiebeln, in dünnen Ringen in der Hälfte von 50 grams Butter bei mittlerer Hitze 15–20 Minuten goldbraun und süßlich braten.\n3. Spätzle kochen: Den Ofen auf 100 °C stellen. Den Teig portionsweise mit Spätzlehobel oder -presse in siedendes Salzwasser drücken. Sobald die Spätzle oben schwimmen, mit der Schaumkelle abheben und gut abtropfen lassen.\n4. Schichten: In einer ofenfesten Form abwechselnd heiße Spätzle, eine Mischung aus 150 grams Bergkäse, gerieben und 150 grams Emmentaler, gerieben sowie etwas 0.5 teaspoons schwarzer Pfeffer schichten. Die Form zwischen den Portionen im Ofen warm halten, damit der Käse schmilzt.\n5. Vollenden: Die restliche Butter in Flöckchen darauf verteilen, kurz unter dem Grill gratinieren ode
